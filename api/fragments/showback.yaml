# AgentOS API — OpenAPI 3.1 fragment for showback/chargeback reports (wave-8).
#
# Merge target: api/openapi.yaml. Paths WITHOUT the /api/v1 prefix.
#
# Contract notes:
#   * Aggregates metered usage per agent over [from, to). Range max 92 days.
#   * group_by=team falls back to agent grouping when runs carry no team
#     attribution — the limitation is surfaced in `notes`, never silent.
#   * RBAC: billing read tier (OWNER/ADMIN).
paths:
  /showback:
    get:
      operationId: getShowbackReport
      summary: Per-agent usage/cost rollup for a period
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: group_by
          in: query
          schema: { type: string, enum: [agent, team], default: agent }
      responses:
        "200":
          description: Report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShowbackReport" }
        "400": { $ref: "#/components/responses/ShowbackBadRequest" }
        "401": { $ref: "#/components/responses/ShowbackUnauthorized" }
        "403": { $ref: "#/components/responses/ShowbackForbidden" }
components:
  responses:
    ShowbackBadRequest:
      description: Invalid range or group_by.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ShowbackError" }
    ShowbackUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ShowbackError" }
    ShowbackForbidden:
      description: Not permitted (billing read tier).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ShowbackError" }
  schemas:
    ShowbackError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    ShowbackRow:
      type: object
      properties:
        scope_ref: { type: string, description: Agent id. }
        runs: { type: integer }
        tool_calls: { type: integer }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_cents: { type: number }
    ShowbackReport:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string, enum: [agent, team] }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ShowbackRow" }
        notes:
          type: array
          items: { type: string }
          description: Honest limitations of this report (team fallback etc.).
