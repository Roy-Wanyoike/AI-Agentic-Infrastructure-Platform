paths:
  /schedules:
    get:
      operationId: listSchedules
      summary: List schedules of the caller's organization (oldest first)
      description: Requires `schedules.read`. Unpaginated.
      tags:
      - Schedules
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Schedules for the caller's tenant (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSchedulesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-required-permission: schedules.read
  /schedules/create:
    post:
      operationId: createSchedule
      summary: Create a schedule (kind once | recurring | cron)
      description: "Requires `schedules.write`. Validation rules:\n  * `kind=once` requires `run_at` (RFC3339).\n\
        \  * `kind=recurring` requires `interval_seconds >= 60`.\n  * `kind=cron` requires a valid 5-field\
        \ `cron_expr`\n    (minute hour day-of-month month day-of-week; supports\n    `*`, numbers, ranges\
        \ `a-b`, lists `a,b,c`, steps `*/n`)\n    and an IANA `timezone` (e.g. `UTC`, `Europe/Berlin`).\n\
        `next_run_at` is computed server-side; timezone defaults to `UTC` for\nonce/recurring when omitted.\n"
      tags:
      - Schedules
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreateRequest'
            example:
              agent_id: 3f6c2b62-2b57-4f8e-9e4e-2f4d3b6c9a10
              input: daily digest
              kind: cron
              cron_expr: 30 9 * * 1-5
              timezone: Europe/Berlin
      responses:
        '201':
          description: Schedule created (status `active`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_REQUEST
                  message: invalid request body
        '422':
          description: Validation failure (kind rules, cron expression, timezone, run_at).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: interval_seconds must be >= 60 for recurring schedules
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-required-permission: schedules.write
  /schedules/{id}:
    get:
      operationId: getSchedule
      summary: Get one schedule
      description: Requires `schedules.read`. Foreign-tenant ids surface as 404.
      tags:
      - Schedules
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: id
        in: path
        required: true
        description: Schedule identifier (UUID).
        schema:
          type: string
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Schedule not found (or belongs to another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SCHEDULE_NOT_FOUND
                  message: schedule not found
      x-required-permission: schedules.read
    delete:
      operationId: deleteSchedule
      summary: Delete a schedule
      description: 'Requires `schedules.write`. Deleting an unknown or foreign id returns

        404. The worker stops firing deleted schedules on its next poll.

        '
      tags:
      - Schedules
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteScheduleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Schedule not found (or belongs to another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SCHEDULE_NOT_FOUND
                  message: schedule not found
      x-required-permission: schedules.write
  /schedules/{id}/pause:
    post:
      operationId: pauseSchedule
      summary: Pause a schedule (active -> paused)
      description: 'Requires `schedules.write`. Paused schedules never fire; `next_run_at`

        is preserved so resume continues the cadence (an overdue schedule

        fires once on the next worker poll).

        '
      tags:
      - Schedules
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Paused (returns the updated schedule).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '409':
          description: Schedule is not active (paused/completed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_STATE
                  message: schedule is not active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Schedule not found (or belongs to another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SCHEDULE_NOT_FOUND
                  message: schedule not found
      x-required-permission: schedules.write
  /schedules/{id}/resume:
    post:
      operationId: resumeSchedule
      summary: Resume a paused schedule (paused -> active)
      description: Requires `schedules.write`.
      tags:
      - Schedules
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resumed (returns the updated schedule).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '409':
          description: Schedule is not paused (active/completed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_STATE
                  message: schedule is not paused
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Schedule not found (or belongs to another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SCHEDULE_NOT_FOUND
                  message: schedule not found
      x-required-permission: schedules.write
components:
  schemas:
    Schedule:
      type: object
      description: One tenant-scoped trigger definition.
      required:
      - id
      - agent_id
      - kind
      - status
      - timezone
      - created_at
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          description: Agent that runs on every firing.
        input:
          type: string
          description: Input payload passed to the created run.
        kind:
          type: string
          enum:
          - once
          - recurring
          - cron
        run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Absolute fire time (kind=once only; RFC3339 UTC).
        interval_seconds:
          type: integer
          description: Recurrence interval (kind=recurring, >= 60; 0 otherwise).
        cron_expr:
          type: string
          description: 5-field cron expression (kind=cron; empty otherwise).
        timezone:
          type: string
          description: IANA timezone the cron expression is evaluated in (default UTC).
        status:
          type: string
          enum:
          - active
          - paused
          - completed
          description: completed is the terminal state of a fired once schedule.
        next_run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Next pending fire instant (null when none pending).
        last_run_id:
          type: string
          description: Run created by the most recent firing (empty before first fire).
        last_fired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Catch-up bookkeeping instant of the last claimed firing.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScheduleCreateRequest:
      type: object
      required:
      - agent_id
      - kind
      properties:
        agent_id:
          type: string
        input:
          type: string
          default: ''
        kind:
          type: string
          enum:
          - once
          - recurring
          - cron
        run_at:
          type: string
          format: date-time
          description: Required for kind=once (RFC3339).
        interval_seconds:
          type: integer
          minimum: 60
          description: Required for kind=recurring.
        cron_expr:
          type: string
          description: Required for kind=cron (5 fields).
        timezone:
          type: string
          description: IANA name; required for kind=cron, defaults to UTC.
    ListSchedulesResponse:
      type: object
      required:
      - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
    ScheduleResponse:
      type: object
      required:
      - schedule
      properties:
        schedule:
          $ref: '#/components/schemas/Schedule'
    DeleteScheduleResponse:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
