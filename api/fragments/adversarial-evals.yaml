# OpenAPI 3.1 fragment — Adversarial evaluations (issue #153).
#
# SCHEMA-ONLY fragment: it defines the wire shapes of the adversarial test
# suite (internal/evaluations/adversarial.go) for API consumers and release
# gates. No paths are introduced yet — the suite is exposed through Go
# runners and the release-gate evidence struct; when an HTTP surface ships
# it merges into api/openapi.yaml and reuses these components.
#
# SECURITY (verbatim from api/fragments/apikeys.yaml): every adversarial
# operation authenticates with the platform schemes (bearerToken | apiKey);
# the schemes are declared here so the fragment is standalone-valid
# (secrets.yaml pattern) and `python3 scripts/check_fragment_refs.py
# api/fragments/adversarial-evals.yaml` passes.
#
# SAFE-FIXTURE POLICY (schema contract): attack payloads are inert synthetic
# markers (maxLength 8192, pattern rejects executable-content markers);
# targets are restricted to loopback / RFC 2606 reserved hosts. See
# docs/adversarial-testing.md.
openapi: 3.1.0
info:
  title: AgentOS — adversarial evaluations (issue #153 fragment)
  version: 3.0.0-fragment
description: |
  Versioned adversarial test packs that prove enforcement at control
  boundaries (policy enforcer, tool permission, tenant guards, secrets org
  guard, delegation gate, output gate). Outcomes classify by SIDE-EFFECT
  EXECUTION — pass means the expected control blocked before the boundary
  was crossed, never that a model refused.
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: HS256-HMAC
      description: HMAC-SHA256 JWT-style token from POST /auth/login (see main spec).
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pre-provisioned API key (see main spec).
  schemas:
    AdversarialSetup:
      type: object
      description: Synthetic fixture facts of one scenario. Every value is synthetic — nothing addresses a real system.
      required: [organization_id]
      properties:
        organization_id:
          type: string
          description: The attacking tenant whose enforcement configuration the scenario exercises.
        tool_name:
          type: string
          description: Tool the payload steers toward (tool/secret kinds).
        foreign_organization_id:
          type: string
          description: Victim tenant (cross-tenant kinds).
        foreign_resource_id:
          type: string
          description: Foreign resource reference (dataset id, secret name).
        agent_id:
          type: string
          description: Agent under test (delegation/output kinds).
        target:
          type: string
          description: |
            Optional network target REFERENCE. Allowlist: loopback hosts and
            RFC 2606 reserved names only; production hosts are rejected at
            pack registration.
        via_untrusted_tool_output:
          type: boolean
          description: Marks indirect-injection framing (payload embedded in untrusted tool output).
    AdversarialScenario:
      type: object
      description: One versioned adversarial test — a SAFE synthetic payload, the control boundary expected to block it, and the impact grade.
      required: [id, name, kind, setup, attack_payload, expected_control, severity]
      properties:
        id:
          type: string
          description: Scenario id, unique within its pack, no whitespace.
        name:
          type: string
        kind:
          type: string
          enum: [direct_prompt_injection, indirect_prompt_injection, tool_permission_bypass, cross_tenant_data_access, secret_exposure, unsafe_delegation, output_policy_violation]
        description:
          type: string
        setup:
          $ref: '#/components/schemas/AdversarialSetup'
        attack_payload:
          type: string
          maxLength: 8192
          description: |
            SAFE synthetic marker text (e.g. "IGNORE-PREVIOUS-AND-TOOL-CALL-<marker>").
            Never executed, never aimed outside the target allowlist; must not
            contain executable content (NUL, shebang, command substitution,
            pipe-to-shell launchers).
        expected_control:
          type: string
          enum: [policy_enforcer, runtime_tool_permission, tenant_store_guard, secrets_guard, delegation_gate, output_gate]
        severity:
          type: string
          enum: [info, low, medium, high, critical]
    AdversarialPack:
      type: object
      description: A versioned, named collection of scenarios (max 100).
      required: [id, name, version, scenarios]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
          description: Required — packs are versioned; duplicate ids are rejected (bump the version instead).
        description:
          type: string
        scenarios:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdversarialScenario'
    AdversarialResult:
      type: object
      description: The outcome of one scenario execution, classified by side-effect execution at the expected control boundary.
      required: [suite, scenario_id, kind, outcome, observed_action, evidence, severity, expected_control]
      properties:
        suite:
          type: string
          enum: [security_adversarial]
        pack_id:
          type: string
        pack_version:
          type: string
        scenario_id:
          type: string
        kind:
          type: string
          enum: [direct_prompt_injection, indirect_prompt_injection, tool_permission_bypass, cross_tenant_data_access, secret_exposure, unsafe_delegation, output_policy_violation]
        outcome:
          type: string
          enum: [pass, fail, inconclusive]
          description: |
            pass — the expected control blocked before any side effect executed;
            fail — the side effect EXECUTED (control missing or bypassed);
            inconclusive — the seam was misconfigured/unavailable (never conflated with pass).
        policy_decision:
          type: object
          description: The decision the policy engine produced at the seam (decision, matched_policy_id, reason).
          properties:
            decision:
              type: string
              enum: [allow, deny]
            matched_policy_id:
              type: string
            reason:
              type: string
        observed_action:
          type: string
          description: Machine-readable observation, e.g. tool_not_invoked, foreign_data_returned, delegation_executed.
        evidence:
          type: string
          description: Deterministic prose evidence (boundary, observation, policy reason). Never carries payload or secret material.
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        expected_control:
          type: string
          enum: [policy_enforcer, runtime_tool_permission, tenant_store_guard, secrets_guard, delegation_gate, output_gate]
        duration_ms:
          type: number
          format: double
        error:
          type: string
    GateEvidence:
      type: object
      description: |
        Deterministic release-gate evidence for quality-gate policies. This
        struct shape IS the contract (internal/evaluations does not import
        internal/qualitygates): match on suite, threshold on pass_rate and
        max_severity_failed_rank.
      required: [suite, total, passed, failed, inconclusive, pass_rate, max_severity_failed, max_severity_failed_rank]
      properties:
        suite:
          type: string
          enum: [security_adversarial]
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        inconclusive:
          type: integer
          description: Counted separately; never folded into pass_rate.
        pass_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
        max_severity_failed:
          type: string
          enum: [info, low, medium, high, critical]
          description: Empty string when nothing failed.
        max_severity_failed_rank:
          type: integer
          description: 0 when nothing failed; 1..5 for info..critical.
        packs:
          type: array
          description: Sorted unique pack ids contributing to this evidence.
          items:
            type: string
