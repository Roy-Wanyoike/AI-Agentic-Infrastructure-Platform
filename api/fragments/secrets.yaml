# AgentOS API — OpenAPI 3.1 fragment for org-scoped secrets management with
# encryption at rest (issue #25, wave-5 track 5-d).
#
# Merge target: api/openapi.yaml (orchestrator-owned; this fragment does not
# modify it). Paths are written WITHOUT the /api/v1 prefix, matching the
# existing spec (routes mount on apiMux and are served under both /v1 and
# /api/v1).
#
# Standalone-valid: every local $ref resolves inside this fragment and the
# security scheme names used by `security:` are declared in this fragment's
# own components.securitySchemes (api/fragments/canary.yaml pattern), so
# `python3 scripts/check_fragment_refs.py api/fragments/secrets.yaml` passes.
# Components carry the track-unique `Sec*` prefix to avoid collisions.
#
# Conventions reused from the base spec:
#   * security: bearerToken | apiKey (mirrors base components.securitySchemes)
#   * x-required-permission documents the RBAC permission per operation.
#     No new permission enum was introduced — the strictest EXISTING grants
#     whose role matrices match the contract are reused:
#       - writes (create/delete)    -> agents.write        (OWNER/ADMIN)
#       - list (metadata only)      -> runs.execute        (MEMBER+: OWNER/ADMIN/MEMBER; viewers never see secret names)
#       - reveal (value once)       -> organization.manage (OWNER)
#   * structured error model {"error":{"code","message"}}
#
# SECURITY (value handling): the plaintext `value` appears in exactly two
# places — the create request body and the one-time reveal response. It is
# never part of any list/metadata schema, never logged, and never written to
# audit metadata. Secret values are stored AES-256-GCM encrypted (envelope
# v1:<key_version>:<base64(nonce)>:<base64(ciphertext)>), so every metadata
# view also exposes the key_version for rotation visibility.
openapi: 3.1.0
info:
  title: AgentOS — secrets management (wave-5 track 5-d fragment)
  version: 3.0.0-fragment
description: |
  Standalone fragment for the encrypted secrets operations added by issue #25.
  Secrets are org-scoped key/value pairs (name -> plaintext value) where the
  value is sealed with AES-256-GCM under a master key before it ever reaches
  storage; each row carries a per-secret random nonce and the key_version that
  encrypted it (versioned v1 envelope for rotation). List responses are
  metadata-only BY CONSTRUCTION — there is no endpoint that returns more than
  one value, and reveal returns exactly one value to OWNER-role callers with an
  audit trail entry. Deleting is a soft delete: the tombstoned name can be
  recreated fresh, but resolves as 404 until then.
paths:
  /secrets:
    post:
      operationId: createSecret
      summary: Create one org-scoped secret (value sealed server-side)
      description: |
        Write operation (agents.write, OWNER/ADMIN). Body carries the secret
        `name` and plaintext `value`; the value is sealed with AES-256-GCM
        under the current master-key version before storage and is never
        echoed back, logged, or persisted in plaintext. Names must match
        `[A-Za-z0-9][A-Za-z0-9._-]{0,254}` (URL-path safe, env-var friendly);
        values are capped at 64 KiB. Duplicate (org, name) among live secrets
        is a 409. The tenant is derived from the auth claims — any
        client-supplied organization id is ignored.
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecCreateRequest'
      responses:
        '201':
          description: Secret created (metadata only — the value is never echoed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '409':
          description: A live secret with the same name already exists in the caller's organization (error.code SECRET_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '422':
          description: |
            Validation error: missing org/name/value, invalid name charset, or
            value above the 64 KiB limit (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure (also covers key-material failures; details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
    get:
      operationId: listSecrets
      summary: List secret metadata for the caller's organization (never values)
      description: |
        Read operation (runs.execute, MEMBER+ — viewers are excluded because
        even secret NAMES are sensitive). Returns metadata only: name, the
        key_version that encrypted each value, created_by and timestamps. The
        response schema has no value field and the server never includes the
        plaintext in list responses. Results are ordered by name ASC.
      x-required-permission: runs.execute
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Metadata list (possibly empty; values are structurally absent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecListResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
  /secrets/{name}:
    delete:
      operationId: deleteSecret
      summary: Soft-delete one secret (tombstone; name becomes reusable)
      description: |
        Write operation (agents.write, OWNER/ADMIN). Sets the deleted_at
        tombstone; every subsequent read/resolve behaves as 404 and the name
        can be recreated fresh. Foreign or unknown names surface as 404
        (no existence leak across tenants). Deletion is audit-logged.
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/SecName'
      responses:
        '200':
          description: Secret tombstoned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecDeleteResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '404':
          description: Secret not found within the caller's organization (error.code SECRET_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
  /secrets/{name}/reveal:
    post:
      operationId: revealSecret
      summary: Return the plaintext value once (OWNER only, audit-logged)
      description: |
        OWNER-only operation (organization.manage). Decrypts the sealed value
        and returns it exactly once inside the secret object; this is the only
        response in the whole API that carries a plaintext secret. Every call
        writes a `secret.revealed` audit entry (the value itself is never part
        of the audit metadata). Foreign/unknown/tombstoned names are 404.
      x-required-permission: organization.manage
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/SecName'
      responses:
        '200':
          description: The decrypted value (single-use response; never cached or logged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecRevealResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          description: Authenticated but not an OWNER (organization.manage is OWNER-only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '404':
          description: Secret not found within the caller's organization (error.code SECRET_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure (e.g. decryption failed under the configured master key; details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: HS256-HMAC
      description: HMAC-SHA256 JWT-style token from POST /auth/login (see main spec).
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pre-provisioned API key (see main spec).
  parameters:
    SecName:
      name: name
      in: path
      required: true
      description: |
        Secret name (unique per organization among live secrets). Must match
        `[A-Za-z0-9][A-Za-z0-9._-]{0,254}`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$'
      example: OPENAI_API_KEY
  responses:
    SecUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecErrorEnvelope'
    SecForbidden:
      description: Authenticated but lacking the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecErrorEnvelope'
  schemas:
    SecCreateRequest:
      type: object
      description: Create payload. The plaintext value is consumed at seal time and never echoed, logged, or listed afterwards.
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$'
          description: Secret name, unique per organization among live secrets.
          examples:
          - OPENAI_API_KEY
        value:
          type: string
          maxLength: 65536
          description: Plaintext secret value (sealed with AES-256-GCM before storage; max 64 KiB).
      required:
      - name
      - value
    SecMetadata:
      type: object
      description: |
        Value-free metadata projection. This is the ONLY shape list endpoints
        return; the plaintext value is structurally absent (no `value`
        property exists on this schema).
      properties:
        name:
          type: string
        key_version:
          type: integer
          description: Master-key version that encrypted the value (v1 envelope; bump on rotation).
          examples:
          - 1
        created_by:
          type: string
          description: User id of the original creator (preserved across value updates).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - name
      - key_version
      - created_by
      - created_at
      - updated_at
    SecRevealMetadata:
      type: object
      description: Metadata extended with the decrypted `value` — returned ONLY by the reveal operation, once per call.
      properties:
        name:
          type: string
        key_version:
          type: integer
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        value:
          type: string
          description: The plaintext secret value. Appears exactly here and exactly once.
      required:
      - name
      - key_version
      - created_by
      - created_at
      - updated_at
      - value
    SecResponse:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/SecMetadata'
      required:
      - secret
    SecListResponse:
      type: object
      properties:
        secrets:
          type: array
          description: Metadata-only views ordered by name ASC; empty when the organization has no live secrets.
          items:
            $ref: '#/components/schemas/SecMetadata'
      required:
      - secrets
    SecRevealResponse:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/SecRevealMetadata'
      required:
      - secret
    SecDeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Always true on success.
      required:
      - deleted
    SecErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of SECRET_NOT_FOUND, SECRET_ALREADY_EXISTS, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - SECRET_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
