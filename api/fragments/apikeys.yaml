# AgentOS API — OpenAPI 3.1 fragment for the API keys management surface
# (issue #48, wave 6-d).
#
# Merge target: api/openapi.yaml (orchestrator-owned; this fragment does not
# modify it). Paths are written WITHOUT the /api/v1 prefix, matching the
# existing spec (routes mount on apiMux and are served under both /v1 and
# /api/v1).
#
# Standalone-valid: every local $ref resolves inside this fragment and the
# security scheme names used by `security:` are declared in this fragment's
# own components.securitySchemes (api/fragments/secrets.yaml pattern), so
# `python3 scripts/check_fragment_refs.py api/fragments/apikeys.yaml` passes.
# Components carry the track-unique `ApiKey` prefix to avoid collisions.
#
# Conventions reused from the base spec:
#   * security: bearerToken | apiKey (mirrors base components.securitySchemes)
#   * x-required-permission documents the RBAC permission per operation.
#     No new permission enum was introduced — the strictest EXISTING grants
#     whose role matrices match the contract are reused (secrets track
#     semantics, cmd/api/secrets.go):
#       - mint/revoke (writes) -> agents.write (OWNER/ADMIN)
#       - list (metadata only) -> runs.execute (MEMBER+: OWNER/ADMIN/MEMBER;
#         viewers never enumerate credentials)
#   * structured error model {"error":{"code","message"}}
#
# SECURITY (credential handling): the plaintext key `value` appears in exactly
# one wire place — the POST /api-keys response, returned EXACTLY ONCE as the
# top-level sibling of the metadata object (POST /scim/tokens shape). It is
# never part of any list/metadata schema, never logged, and never written to
# audit metadata. Only the SHA-256 hash is persisted; every stored key
# authenticates through auth.RequireAuthOrAPIKey (X-API-Key header or
# ?api_key= query) and authenticates as OWNER.
openapi: 3.1.0
info:
  title: AgentOS — API keys management (issue #48 fragment)
  version: 3.0.0-fragment
description: |
  Standalone fragment for the API keys operations added by issue #48. API
  keys are org-scoped machine credentials minted by OWNER/ADMIN users: the
  service generates an `ak_…` secret, persists only its SHA-256 hash, and
  returns the plaintext exactly once at creation — it can never be retrieved
  again. Listing is metadata-only BY CONSTRUCTION (id, name, display prefix,
  creator, timestamps, revoked flag; no value, no full hash). Revocation is
  org-guarded and idempotent: re-revoking an already-revoked key stays 200,
  while unknown/foreign ids surface as 404 with no existence leak across
  tenants. Minting and revoking write `api_key.created` / `api_key.revoked`
  audit trail entries (never carrying key material). A minted key
  authenticates immediately against every RequireAuthOrAPIKey-protected
  endpoint as an OWNER identity of its organization.
paths:
  /api-keys:
    post:
      operationId: createApiKey
      summary: Mint a new API key for the caller's organization (value returned exactly once)
      description: |
        Write operation (agents.write, OWNER/ADMIN). Body carries the key
        `name`; the server generates the secret (`ak_` + 32 random bytes),
        persists only its SHA-256 hash, and returns the plaintext `value`
        EXACTLY ONCE as the top-level sibling of the metadata object — this
        is the only response in the whole API that carries the key. The
        plaintext cannot be retrieved again afterwards. The key
        authenticates immediately (X-API-Key header) as an OWNER identity
        of the caller's organization. The tenant is derived from the auth
        claims — any client-supplied organization id is ignored. Minting is
        audit-logged (`api_key.created`, no key material in metadata).
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: |
            Key minted. The metadata object never contains the value or the
            hash; `value` (the plaintext credential) is returned exactly once
            and must be stored by the client now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
        '401':
          $ref: '#/components/responses/ApiKeyUnauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '422':
          description: |
            Validation error: missing or blank key name (error.code
            VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
    get:
      operationId: listApiKeys
      summary: List API key metadata for the caller's organization (never values or hashes)
      description: |
        Read operation (runs.execute, MEMBER+ — viewers are excluded because
        credential inventories are sensitive). Returns metadata only: id,
        name, the display `prefix` (`ak_` + the first 8 secret characters,
        kept for identification; the server only ever matches the SHA-256
        hash of the FULL value, so the prefix authenticates nothing),
        created_by, created_at and the revoked flag. The response schema has
        no value field and no full hash, and the server never includes them.
        Results are ordered newest first. Revoked keys remain listed with
        "revoked": true. Note: the api_keys table also tracks last_used_at
        and the revocation timestamp, but the service model does not project
        them yet — they are therefore absent from this contract until the
        service exposes them (deliberate omission, not an accident).
      x-required-permission: runs.execute
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Metadata list (possibly empty; values and hashes are structurally absent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/ApiKeyUnauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke one API key (immediate; idempotent on already-revoked keys)
      description: |
        Write operation (agents.write, OWNER/ADMIN). Revocation is immediate:
        the key stops authenticating on the very next request (it is resolved
        by hash and rejected once revoked). Re-revoking an already-revoked
        key is idempotent and stays 200; unknown or foreign-organization ids
        surface as 404 with no existence leak across tenants. Revocation is
        audit-logged (`api_key.revoked`).
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/ApiKeysID'
      responses:
        '200':
          description: Key revoked (or already revoked — idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyRevokeResponse'
        '401':
          $ref: '#/components/responses/ApiKeyUnauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '404':
          description: Key not found within the caller's organization (error.code API_KEY_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: HS256-HMAC
      description: HMAC-SHA256 JWT-style token from POST /auth/login (see main spec).
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pre-provisioned API key (see main spec).
  parameters:
    ApiKeysID:
      name: id
      in: path
      required: true
      description: API key id (UUID, as returned by the mint operation).
      schema:
        type: string
        minLength: 1
      example: 3f6c1a5e-8e2b-4c1d-9a7b-2f0d5e6a1b2c
  responses:
    ApiKeyUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiKeyErrorEnvelope'
    ApiKeyForbidden:
      description: Authenticated but lacking the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiKeyErrorEnvelope'
  schemas:
    ApiKeyCreateRequest:
      type: object
      description: Mint payload. Only the display name is supplied; the secret itself is generated server-side.
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable key name (e.g. "ci-deploy", "worker-poll").
          examples:
          - ci-deploy
      required:
      - name
    ApiKeyMetadata:
      type: object
      description: |
        Credential-free metadata projection. This is the ONLY shape list
        endpoints return; the plaintext value and the persisted SHA-256 hash
        are structurally absent (no `value` and no `hash` property exists on
        this schema).
      properties:
        id:
          type: string
          description: Key id used for revocation.
        name:
          type: string
        prefix:
          type: string
          description: |
            Display prefix ("ak_" + the first 8 secret characters) for
            identification in dashboards; authenticates nothing by itself.
          examples:
          - ak_1a2b3c4d
        created_by:
          type: string
          description: User id of the minting principal.
        created_at:
          type: string
          format: date-time
        revoked:
          type: boolean
          description: True once the key has been revoked (revoked keys never authenticate again).
      required:
      - id
      - name
      - prefix
      - created_by
      - created_at
      - revoked
    ApiKeyCreatedResponse:
      type: object
      description: |
        Mint response. `api_key` is metadata-only; `value` is the plaintext
        credential and appears EXACTLY HERE and EXACTLY ONCE — the service
        stores only the hash and can never return the value again.
      properties:
        api_key:
          $ref: '#/components/schemas/ApiKeyMetadata'
        value:
          type: string
          pattern: '^ak_[0-9a-f]{64}$'
          description: The plaintext API key. Appears exactly here and exactly once.
      required:
      - api_key
      - value
    ApiKeyListResponse:
      type: object
      properties:
        api_keys:
          type: array
          description: Metadata-only views ordered newest first; empty when the organization has no keys.
          items:
            $ref: '#/components/schemas/ApiKeyMetadata'
      required:
      - api_keys
    ApiKeyRevokeResponse:
      type: object
      properties:
        revoked:
          type: boolean
          description: Always true on success (including idempotent re-revocation).
      required:
      - revoked
    ApiKeyErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of API_KEY_NOT_FOUND, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - API_KEY_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
