# AgentOS API — OpenAPI 3.1 fragment for the A2A (Agent-to-Agent) protocol
# surface (issue #136).
#
# Merge target: api/openapi.yaml (orchestrator-owned; this fragment does not
# modify it). Paths are written WITHOUT the /api/v1 prefix, matching the
# existing spec (routes mount on apiMux and are served under both /v1 and
# /api/v1).
#
# Standalone-valid: every local $ref resolves inside this fragment (A2A*
# schema prefix is track-unique; operationIds are a2a-only).
#
# Contract notes:
#   * Agent Card registry: org-scoped publications of EXISTING org agents.
#     The registry row (snake_case) is the management surface; the canonical
#     discovery card (GET /a2a/agents/{id}/card) renders the A2A Agent Card
#     with the camelCase wire vocabulary a generic A2A client consumes
#     (name/description/version/provider/url/capabilities/skills/
#     authentication/preferredTransport) — platform internals (ids,
#     org scope, timestamps) are deliberately excluded.
#   * auth_scheme is a SCHEME NAME ("bearer", "oauth2", "none"); no
#     credential material exists on a card or in this API.
#   * Cross-tenant or unknown ids are the SAME 404 (no existence leak).
#   * Inbound messages create a platform run for the card's agent and return
#     {run_id, task_id, status:"submitted"}; the message payload is never
#     audited (only ids + byte counts).
#   * Outbound delegations resolve a card (registered card_id or live
#     card_url), evaluate the org's DelegationGate policy hook, then POST the
#     message envelope to the card endpoint. A gate denial is the
#     policy-style 403 delegation_denied verdict; a completed call is the
#     outcome payload (status submitted on 2xx, failed otherwise).
#   * RBAC: writes agents.write (OWNER/ADMIN), registry reads connectors.read
#     (MEMBER+), the discovery card agents.read (all roles — discovery
#     surface), invocation surfaces runs.execute (OWNER/ADMIN/MEMBER).
paths:
  /a2a/agents:
    post:
      operationId: createA2AAgentCard
      summary: Publish an org agent as an A2A Agent Card
      description: |
        Validates and publishes one org-scoped Agent Card. The card MUST link
        an agent that exists in the caller's organization (client-supplied
        org ids are ignored — scope comes from the auth claims). Audited
        (a2a.card_published).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.write (OWNER/ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2ACardInput'
      responses:
        '201':
          description: Card published (registry row).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ACardEnvelope'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
        '401':
          $ref: '#/components/responses/A2AUnauthorized'
        '403':
          $ref: '#/components/responses/A2AForbidden'
        '422':
          description: Validation error (missing name/version, unknown or cross-org agent, bad endpoint_url).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
    get:
      operationId: listA2AAgentCards
      summary: List the caller org's Agent Cards
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: connectors.read (MEMBER+)
      responses:
        '200':
          description: Registry rows of exactly one organization (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ACardListEnvelope'
        '401':
          $ref: '#/components/responses/A2AUnauthorized'
        '403':
          $ref: '#/components/responses/A2AForbidden'
  /a2a/agents/{id}:
    get:
      operationId: getA2AAgentCard
      summary: Get one Agent Card (registry row)
      description: Unknown and foreign-tenant ids are the same 404 (no existence leak).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: connectors.read (MEMBER+)
      parameters:
        - $ref: '#/components/parameters/A2ACardID'
      responses:
        '200':
          description: The registry row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ACardEnvelope'
        '401':
          $ref: '#/components/responses/A2AUnauthorized'
        '404':
          description: Unknown or foreign id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
    patch:
      operationId: patchA2AAgentCard
      summary: Update an Agent Card (partial semantics)
      description: |
        Nil fields keep the stored value; provided fields replace it. A
        changed agent link is re-validated against the same org. Audited
        (a2a.card_updated).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.write (OWNER/ADMIN)
      parameters:
        - $ref: '#/components/parameters/A2ACardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2ACardPatch'
      responses:
        '200':
          description: Updated registry row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ACardEnvelope'
        '401':
          $ref: '#/components/responses/A2AUnauthorized'
        '403':
          $ref: '#/components/responses/A2AForbidden'
        '404':
          description: Unknown or foreign id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
        '422':
          description: The patched state fails validation (e.g. empty name, unknown agent re-link).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
    delete:
      operationId: deleteA2AAgentCard
      summary: Delete an Agent Card
      description: Hard-deletes the card; the discovery surface stops answering. Audited (a2a.card_deleted).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.write (OWNER/ADMIN)
      parameters:
        - $ref: '#/components/parameters/A2ACardID'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ADeletedEnvelope'
        '401':
          $ref: '#/components/responses/A2AUnauthorized'
        '403':
          $ref: '#/components/responses/A2AForbidden'
        '404':
          description: Unknown or foreign id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
  /a2a/agents/{id}/card:
    get:
      operationId: getA2ACanonicalAgentCard
      summary: Discover the canonical A2A Agent Card
      description: |
        The A2A discovery surface: renders the canonical Agent Card JSON
        (camelCase wire vocabulary, no platform internals) consumable by a
        generic A2A client. Available to every authenticated member of the
        org (VIEWER included).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.read (all roles)
      parameters:
        - $ref: '#/components/parameters/A2ACardID'
      responses:
        '200':
          description: The canonical Agent Card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ACanonicalCard'
        '401':
          $ref: '#/components/responses/A2AUnauthorized'
        '404':
          description: Unknown or foreign id (no existence leak)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
  /a2a/agents/{id}/message:
    post:
      operationId: sendA2AAgentMessage
      summary: Receive an inbound A2A message for one card
      description: |
        Inbound A2A-style message: validates the card, resolves the card's
        target agent, creates a platform run (run persisted via the runs
        service, task enqueued as "agent.run") and returns the ids with
        status "submitted". The message payload is NEVER audited — only ids
        and byte counts (a2a.message_received).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: runs.execute (OWNER/ADMIN/MEMBER)
      parameters:
        - $ref: '#/components/parameters/A2ACardID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2AMessageRequest'
      responses:
        '202':
          description: Message accepted and routed to the card's agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AMessageResult'
        '401':
          $ref: '#/components/responses/A2AUnauthorized'
        '403':
          $ref: '#/components/responses/A2AForbidden'
        '404':
          description: Unknown or foreign card (no existence leak)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
        '422':
          description: Empty message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
        '503':
          description: No run sink wired (degraded deployment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
  /a2a/delegate:
    post:
      operationId: delegateA2AMessage
      summary: Delegate a message to a remote A2A agent (governed)
      description: |
        Outbound delegation: resolves the target card (registered card_id —
        org-scoped — or a live card_url fetch), evaluates the wired
        DelegationGate policy hook, then POSTs the message envelope to the
        card endpoint with a bounded timeout. A gate denial never touches the
        wire and returns the policy-style 403 delegation_denied verdict
        (audited a2a.delegation_denied); a completed call returns the outcome
        (status "submitted" on 2xx, "failed" otherwise; audited
        a2a.delegated). Message payloads are never logged.
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: runs.execute (OWNER/ADMIN/MEMBER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2ADelegateRequest'
      responses:
        '200':
          description: Delegation executed (the remote answered; outcome is the payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ADelegateResult'
        '401':
          $ref: '#/components/responses/A2AUnauthorized'
        '403':
          description: Policy denial (no wire call was made).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ADelegationDenied'
        '404':
          description: Unknown or foreign card_id (no existence leak)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
        '422':
          description: Validation error (missing message/target, unfetchable or invalid card_url).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
        '502':
          description: The target endpoint was unreachable (transport error, timeout).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2AError'
components:
  # own components.securitySchemes (api/fragments/mcp-registry.yaml pattern)
  # so this fragment validates standalone; the merge target already declares
  # the identical pair and deduplicates on merge.
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: HS256-HMAC
      description: HMAC-SHA256 JWT-style token from POST /auth/login (see main spec).
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pre-provisioned API key (see main spec).
  parameters:
    A2ACardID:
      name: id
      in: path
      required: true
      description: Agent Card id (UUID, as returned at publication).
      schema:
        type: string
  responses:
    A2AUnauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/A2AError'
    A2AForbidden:
      description: Authenticated principal lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/A2AError'
  schemas:
    A2AError:
      type: object
      description: Structured error envelope (mirrors the base spec error model).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: >
                Machine-readable code, e.g. AGENT_CARD_NOT_FOUND,
                VALIDATION_ERROR, CARD_FETCH_FAILED, RUN_SINK_UNAVAILABLE,
                DELEGATION_UNREACHABLE, INVALID_REQUEST.
            message:
              type: string
    A2ACapabilities:
      type: object
      description: A2A capabilities block (flags serialize explicitly — absent vs false is not ambiguous).
      properties:
        streaming:
          type: boolean
        push_notifications:
          type: boolean
          description: snake_case on the registry row; the canonical card renders pushNotifications.
        state_transition_history:
          type: boolean
          description: snake_case on the registry row; the canonical card renders stateTransitionHistory.
    A2ASkill:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
    A2ACardInput:
      type: object
      required: [agent_id, name, version]
      properties:
        agent_id:
          type: string
          description: An agent that exists in the caller's organization.
        name:
          type: string
          maxLength: 255
        description:
          type: string
        version:
          type: string
        provider:
          type: object
          properties:
            organization:
              type: string
            url:
              type: string
        endpoint_url:
          type: string
          format: uri
          description: Where A2A message envelopes are POSTed (http/https); optional at publish time, required for delegation.
        capabilities:
          $ref: '#/components/schemas/A2ACapabilities'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/A2ASkill'
        auth_scheme:
          type: string
          description: SCHEME NAME the endpoint expects ("bearer", "oauth2", "none"); defaults to "none". Never a credential value.
        preferred_transport:
          type: string
          enum: [JSONRPC, GRPC, HTTP+JSON]
          default: JSONRPC
    A2ACardPatch:
      type: object
      description: Partial update — omitted fields keep the stored value; skills are replaced when present.
      properties:
        agent_id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        provider:
          type: object
          properties:
            organization:
              type: string
            url:
              type: string
        endpoint_url:
          type: string
        capabilities:
          $ref: '#/components/schemas/A2ACapabilities'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/A2ASkill'
        auth_scheme:
          type: string
        preferred_transport:
          type: string
    A2ACard:
      type: object
      description: The registry row (explicit field allowlist; auth_scheme is a scheme NAME).
      properties:
        id:
          type: string
        organization_id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        provider:
          type: object
          properties:
            organization:
              type: string
            url:
              type: string
        endpoint_url:
          type: string
        capabilities:
          $ref: '#/components/schemas/A2ACapabilities'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/A2ASkill'
        auth_scheme:
          type: string
        preferred_transport:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    A2ACardEnvelope:
      type: object
      required: [agent_card]
      properties:
        agent_card:
          $ref: '#/components/schemas/A2ACard'
    A2ACardListEnvelope:
      type: object
      required: [agent_cards]
      properties:
        agent_cards:
          type: array
          items:
            $ref: '#/components/schemas/A2ACard'
    A2ADeletedEnvelope:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string
    A2ACanonicalCard:
      type: object
      description: >
        The canonical A2A Agent Card — the wire contract of the discovery
        surface (camelCase; platform internals excluded).
      required: [name, version, url, capabilities, skills]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        provider:
          type: object
          properties:
            organization:
              type: string
            url:
              type: string
        url:
          type: string
          description: The endpoint message envelopes are POSTed to.
        capabilities:
          type: object
          properties:
            streaming:
              type: boolean
            pushNotifications:
              type: boolean
            stateTransitionHistory:
              type: boolean
        skills:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              tags:
                type: array
                items:
                  type: string
        authentication:
          type: object
          description: Present when the card declares an auth scheme.
          properties:
            schemes:
              type: array
              items:
                type: string
        preferredTransport:
          type: string
          enum: [JSONRPC, GRPC, HTTP+JSON]
    A2AMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The inbound message text (routed to the card's agent as the run input; never logged).
    A2AMessageResult:
      type: object
      required: [status]
      properties:
        card_id:
          type: string
        agent_id:
          type: string
        run_id:
          type: string
        task_id:
          type: string
        status:
          type: string
          enum: [submitted]
    A2ADelegateRequest:
      type: object
      required: [message]
      description: Exactly one of card_id / card_url; card_id wins when both are present.
      properties:
        card_id:
          type: string
          description: A REGISTERED card of the caller's org (org-scoped 404 otherwise).
        card_url:
          type: string
          format: uri
          description: Fetch the card live from a well-known URL (GET, bounded by the delegation timeout).
        message:
          type: string
          description: The message text; POSTed as an A2A envelope {role, parts, kind} to the card endpoint. Never logged.
    A2ADelegateResult:
      type: object
      required: [status, http_status, latency_ms]
      properties:
        status:
          type: string
          enum: [submitted, failed]
          description: submitted on a 2xx remote answer, failed otherwise (the call completed; the delegation did not).
        http_status:
          type: integer
        latency_ms:
          type: integer
          format: int64
        card_id:
          type: string
          description: Empty for URL-resolved (unregistered) cards.
        endpoint:
          type: string
        verdict:
          type: string
          description: >
            Recorded gate verdict: "allowed_no_gate" (no gate wired — the
            documented default), "allowed", or the gate's own decision string.
    A2ADelegationDenied:
      type: object
      description: Policy-style refusal (HTTP 403) — the gate denied BEFORE any wire call.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [delegation_denied]
            message:
              type: string
        verdict:
          type: object
          properties:
            decision:
              type: string
              enum: [delegation_denied]
            reason:
              type: string
              description: Operator-facing policy explanation (never a payload).
