# AgentOS API — OpenAPI 3.1 fragment for the knowledge graph memory surface
# (issues #130/#131: dynamic knowledge graph memory + ontology-first
# construction).
#
# Merge target: api/openapi.yaml (orchestrator-owned; this fragment does not
# modify it). SCHEMA-ONLY: no paths are defined yet — the episode/ontology
# read+write endpoints land with their owning API track and will reference
# these components. Schemas carry track-neutral names (ActivityEpisode,
# Ontology, EntityType, EdgeType, ExtractionResult); a collision on merge
# requires a Graph prefix on the conflicting MAIN-spec side only, never here.
#
# Standalone-valid: every local $ref resolves inside this fragment and the
# security scheme names used by `security:` are declared in this fragment's
# own components.securitySchemes (api/fragments/apikeys.yaml pattern), so
# `python3 scripts/check_fragment_refs.py api/fragments/knowledge-graph.yaml`
# passes.
#
# Conventions reused from the base spec:
#   * security: bearerToken | apiKey (mirrors base components.securitySchemes)
#   * structured error model {"error":{"code","message"}}
#
# SECURITY (verbatim from api/fragments/apikeys.yaml — same auth posture as
# every knowledge surface; when paths are added they MUST carry
# `security: [bearerToken: [], apiKey: []]` per operation):
openapi: 3.1.0
info:
  title: AgentOS — knowledge graph memory schemas (issues #130/#131 fragment)
  version: 3.0.0-fragment
description: |
  Standalone schema fragment for the dynamic knowledge graph memory (issue
  #130: agent activity episodes — tool_call / reasoning / decision /
  observation, timestamped with temporal half-life decay) and ontology-first
  knowledge construction (issue #131: org-scoped ontologies with typed
  entity/edge types and schema-validated extraction). Episodes are ORG-SCOPED
  memory: every record carries organization_id and every future read path
  filters on it (tenant isolation by construction, mirroring the
  knowledge_documents surface).
paths: {}
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: HS256-HMAC
      description: HMAC-SHA256 JWT-style token from POST /auth/login (see main spec).
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pre-provisioned API key (see main spec).
  schemas:
    ActivityEpisode:
      type: object
      description: |
        One agent activity captured from a run (issue #130). Episodes are the
        temporal layer of the knowledge graph: persisted timestamped with
        episode content chunked like documents and embedded via the knowledge
        embedder; retrieval weights raw relevance by exponential half-life
        decay (24h default). action_type is one of tool_call | reasoning |
        decision | observation.
      required: [agent_id, run_id, action_type, content, timestamp]
      properties:
        agent_id:
          type: string
          description: Agent that produced the activity (authoritative from the recorder).
        run_id:
          type: string
          description: Run the activity belongs to (authoritative from the recorder).
        organization_id:
          type: string
          description: Owning organization (tenant guard; stamped server-side).
        action_type:
          type: string
          enum: [tool_call, reasoning, decision, observation]
        content:
          type: string
          minLength: 1
          description: Activity payload; chunked at ~800 runes on boundaries at ingest.
        entities:
          type: array
          description: Entity surface forms mentioned by the activity (graph seeds).
          items:
            type: string
        timestamp:
          type: string
          format: date-time
          description: |
            When the activity happened (NOT insert time). Zero timestamps are
            stamped with the ingest time by the episode ingestor.
    AttributeDef:
      type: object
      description: One typed attribute of an entity or edge type. Name is snake_case; reserved names (uuid, name, created_at) cannot be redefined with another type.
      required: [name, type]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        type:
          type: string
          enum: [string, number, integer, boolean, datetime]
        required:
          type: boolean
          default: false
        description:
          type: string
    EntityType:
      type: object
      description: |
        One node type of the knowledge graph. Name is PascalCase. fallback
        marks the guaranteed types (Person, Organization) present in every
        generated ontology. cues are lowercase trigger words the
        deterministic extractor matches against a candidate's context.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Z][A-Za-z0-9]*$'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDef'
        fallback:
          type: boolean
          description: True for the guaranteed fallback types (Person, Organization).
        cues:
          type: array
          items:
            type: string
    EdgeType:
      type: object
      description: One relationship type; UPPER_SNAKE_CASE name, endpoints referencing declared entity types. The (name, source_type, target_type) triple is the edge identity.
      required: [name, source_type, target_type]
      properties:
        name:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        source_type:
          type: string
        target_type:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDef'
    Ontology:
      type: object
      description: |
        Org-scoped schema of one knowledge graph (issue #131). Generated via
        the LLMGateway seam or the deterministic RuleBasedGenerator;
        validation errors are typed (ErrOntologyValidation) and carry field
        paths — schema violations are never silently fixed.
      required: [entity_types]
      properties:
        id:
          type: string
        organization_id:
          type: string
          description: Owning organization (tenant guard).
        entity_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EntityType'
        edge_types:
          type: array
          items:
            $ref: '#/components/schemas/EdgeType'
        attribute_defs:
          type: array
          description: Shared attribute library (canonical reserved attributes ship by default).
          items:
            $ref: '#/components/schemas/AttributeDef'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExtractionResult:
      type: object
      description: |
        Outcome of one schema-driven extraction query. Entities are typed
        against the ontology; edges connect co-occurring typed entities
        through declared edge types only; every schema violation (unknown
        type filter, undeclared or mistyped attribute value) is collected in
        rejected — type errors are NEVER silent.
      required: [entities]
      properties:
        entities:
          type: array
          items:
            type: object
            required: [type, name]
            properties:
              type:
                type: string
                description: Declared EntityType name.
              name:
                type: string
                description: Surface form of the entity mention.
              attributes:
                type: object
                additionalProperties: true
                description: Validated attribute values keyed by declared attribute name.
              position:
                type: integer
                description: Token offset of the first mention (deterministic ordering).
        edges:
          type: array
          items:
            type: object
            required: [type, source, target]
            properties:
              type:
                type: string
                description: Declared EdgeType name.
              source:
                type: string
              target:
                type: string
        rejected:
          type: array
          description: Collected schema violations (never silent).
          items:
            type: object
            required: [surface, reason]
            properties:
              surface:
                type: string
                description: The offending candidate, value or filter.
              type:
                type: string
                description: Entity type the violation relates to, when known.
              reason:
                type: string
