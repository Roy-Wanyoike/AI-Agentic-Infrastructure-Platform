  /api-keys:
    post:
      operationId: createApiKey
      summary: Mint a new API key for the caller's organization (value returned exactly once)
      description: |
        Write operation (agents.write, OWNER/ADMIN). Body carries the key
        `name`; the server generates the secret (`ak_` + 32 random bytes),
        persists only its SHA-256 hash, and returns the plaintext `value`
        EXACTLY ONCE as the top-level sibling of the metadata object — this
        is the only response in the whole API that carries the key. The
        plaintext cannot be retrieved again afterwards. The key
        authenticates immediately (X-API-Key header) as an OWNER identity
        of the caller's organization. The tenant is derived from the auth
        claims — any client-supplied organization id is ignored. Minting is
        audit-logged (`api_key.created`, no key material in metadata).
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: |
            Key minted. The metadata object never contains the value or the
            hash; `value` (the plaintext credential) is returned exactly once
            and must be stored by the client now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
        '401':
          $ref: '#/components/responses/ApiKeyUnauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '422':
          description: |
            Validation error: missing or blank key name (error.code
            VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
    get:
      operationId: listApiKeys
      summary: List API key metadata for the caller's organization (never values or hashes)
      description: |
        Read operation (runs.execute, MEMBER+ — viewers are excluded because
        credential inventories are sensitive). Returns metadata only: id,
        name, the display `prefix` (`ak_` + the first 8 secret characters,
        kept for identification; the server only ever matches the SHA-256
        hash of the FULL value, so the prefix authenticates nothing),
        created_by, created_at and the revoked flag. The response schema has
        no value field and no full hash, and the server never includes them.
        Results are ordered newest first. Revoked keys remain listed with
        "revoked": true. Note: the api_keys table also tracks last_used_at
        and the revocation timestamp, but the service model does not project
        them yet — they are therefore absent from this contract until the
        service exposes them (deliberate omission, not an accident).
      x-required-permission: runs.execute
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Metadata list (possibly empty; values and hashes are structurally absent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/ApiKeyUnauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke one API key (immediate; idempotent on already-revoked keys)
      description: |
        Write operation (agents.write, OWNER/ADMIN). Revocation is immediate:
        the key stops authenticating on the very next request (it is resolved
        by hash and rejected once revoked). Re-revoking an already-revoked
        key is idempotent and stays 200; unknown or foreign-organization ids
        surface as 404 with no existence leak across tenants. Revocation is
        audit-logged (`api_key.revoked`).
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/ApiKeysID'
      responses:
        '200':
          description: Key revoked (or already revoked — idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyRevokeResponse'
        '401':
          $ref: '#/components/responses/ApiKeyUnauthorized'
        '403':
          $ref: '#/components/responses/ApiKeyForbidden'
        '404':
          description: Key not found within the caller's organization (error.code API_KEY_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyErrorEnvelope'

  /secrets:
    post:
      operationId: createSecret
      summary: Create one org-scoped secret (value sealed server-side)
      description: 'Write operation (agents.write, OWNER/ADMIN). Body carries the secret

        `name` and plaintext `value`; the value is sealed with AES-256-GCM

        under the current master-key version before storage and is never

        echoed back, logged, or persisted in plaintext. Names must match

        `[A-Za-z0-9][A-Za-z0-9._-]{0,254}` (URL-path safe, env-var friendly);

        values are capped at 64 KiB. Duplicate (org, name) among live secrets

        is a 409. The tenant is derived from the auth claims — any

        client-supplied organization id is ignored.

        '
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecCreateRequest'
      responses:
        '201':
          description: Secret created (metadata only — the value is never echoed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '409':
          description: A live secret with the same name already exists in the caller's organization (error.code SECRET_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '422':
          description: 'Validation error: missing org/name/value, invalid name charset, or

            value above the 64 KiB limit (error.code VALIDATION_ERROR).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure (also covers key-material failures; details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
    get:
      operationId: listSecrets
      summary: List secret metadata for the caller's organization (never values)
      description: 'Read operation (runs.execute, MEMBER+ — viewers are excluded because

        even secret NAMES are sensitive). Returns metadata only: name, the

        key_version that encrypted each value, created_by and timestamps. The

        response schema has no value field and the server never includes the

        plaintext in list responses. Results are ordered by name ASC.

        '
      x-required-permission: runs.execute
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Metadata list (possibly empty; values are structurally absent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecListResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
  /secrets/{name}:
    delete:
      operationId: deleteSecret
      summary: Soft-delete one secret (tombstone; name becomes reusable)
      description: 'Write operation (agents.write, OWNER/ADMIN). Sets the deleted_at

        tombstone; every subsequent read/resolve behaves as 404 and the name

        can be recreated fresh. Foreign or unknown names surface as 404

        (no existence leak across tenants). Deletion is audit-logged.

        '
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/SecName'
      responses:
        '200':
          description: Secret tombstoned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecDeleteResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '404':
          description: Secret not found within the caller's organization (error.code SECRET_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
  /secrets/{name}/reveal:
    post:
      operationId: revealSecret
      summary: Return the plaintext value once (OWNER only, audit-logged)
      description: 'OWNER-only operation (organization.manage). Decrypts the sealed value

        and returns it exactly once inside the secret object; this is the only

        response in the whole API that carries a plaintext secret. Every call

        writes a `secret.revealed` audit entry (the value itself is never part

        of the audit metadata). Foreign/unknown/tombstoned names are 404.

        '
      x-required-permission: organization.manage
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/SecName'
      responses:
        '200':
          description: The decrypted value (single-use response; never cached or logged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecRevealResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          description: Authenticated but not an OWNER (organization.manage is OWNER-only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '404':
          description: Secret not found within the caller's organization (error.code SECRET_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure (e.g. decryption failed under the configured master key; details are never
            surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
  /tools:
    get:
      operationId: listRegisteredTools
      summary: List the runtime's registered tools (name, description, input schema)
      description: 'Read-only catalog of the agent tool registry: the built-in tools plus

        anything else registered by the serving process. Tool registrations

        are runtime surface (not tenant data), so the response carries no

        organization fields; access is still authenticated and RBAC-gated.

        '
      x-required-permission: agents.read
      security:
      - bearerToken: []
      - apiKey: []
      tags:
      - Tools
      responses:
        '200':
          description: The registered tools, sorted by name; empty when none are registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolErrorEnvelope'
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: List the caller organization's audit trail (newest first, keyset-paginated)
      description: 'The append-only audit trail of the caller''s organization, newest

        first. The tenant is taken from the auth claims only — client-supplied

        organization ids are never trusted. Pagination is keyset-based on

        (created_at, id): pass the returned next_cursor back as the cursor

        query parameter; appends between pages can neither duplicate nor skip

        rows. next_cursor is the empty string when the trail is exhausted.

        '
      x-required-permission: audit.read
      security:
      - bearerToken: []
      - apiKey: []
      tags:
      - Audit
      parameters:
      - name: limit
        in: query
        required: false
        description: 'Page size (1-200; defaults to 50). Values above 200 are clamped

          server-side instead of erroring.

          '
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        required: false
        description: Opaque continuation token from a previous page's next_cursor.
        schema:
          type: string
      responses:
        '200':
          description: One page of the tenant's audit trail (empty array when nothing is recorded yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventsResponse'
        '400':
          description: Invalid query (non-integer/zero limit, or malformed cursor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected server failure (e.g. store unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditErrorEnvelope'
  /marketplace/listings:
    post:
      operationId: publishMarketplaceListing
      summary: Publish an agent as a marketplace listing
      description: 'Creates a listing from an existing agent in the caller''s organization,

        snapshotting the agent''s current configuration (config only — never

        secrets). Requires OWNER/ADMIN of the publishing organization.

        '
      security:
      - bearerToken: []
      - apiKey: []
      x-required-permission: agents.write (OWNER/ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MktPublishRequest'
      responses:
        '201':
          description: Listing created (status published)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktListingEnvelope'
        '401':
          $ref: '#/components/responses/MktUnauthorized'
        '403':
          $ref: '#/components/responses/MktForbidden'
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
        '422':
          description: Validation error (unknown agent, empty name, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
    get:
      operationId: browseMarketplaceListings
      summary: Browse / search published listings
      description: 'Global read across organizations. Supports text search over name and

        description (`q`), tag filtering (`tag`, repeatable) and keyset

        pagination (`limit` + `cursor` from `next_cursor`).

        '
      security:
      - bearerToken: []
      - apiKey: []
      x-required-permission: authenticated
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Text match over listing name and description.
      - name: tag
        in: query
        schema:
          type: string
        description: Filter by tag (repeatable; OR semantics).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
        description: Keyset cursor from a previous response's next_cursor.
      responses:
        '200':
          description: Paginated listings page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktListingPage'
        '401':
          $ref: '#/components/responses/MktUnauthorized'
  /marketplace/listings/{slug}:
    get:
      operationId: getMarketplaceListing
      summary: Get a single listing by slug
      security:
      - bearerToken: []
      - apiKey: []
      x-required-permission: authenticated
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktListingEnvelope'
        '404':
          $ref: '#/components/responses/MktNotFound'
    delete:
      operationId: unlistMarketplaceListing
      summary: Unlist a listing (publisher org OWNER/ADMIN only)
      security:
      - bearerToken: []
      - apiKey: []
      x-required-permission: agents.write (publisher OWNER/ADMIN)
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Listing unlisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktListingEnvelope'
        '403':
          $ref: '#/components/responses/MktForbidden'
        '404':
          $ref: '#/components/responses/MktNotFound'
  /marketplace/listings/{slug}/install:
    post:
      operationId: installMarketplaceListing
      summary: Install a listing as a new agent in the caller's organization
      description: 'Creates a NEW agent in the caller''s organization from the listing''s

        version snapshot. Name collisions get a deterministic `-2`/`-3`/...

        suffix. Increments the listing''s download counter and writes an

        audit entry.

        '
      security:
      - bearerToken: []
      - apiKey: []
      x-required-permission: agents.write
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Agent created from the snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktInstallResponse'
        '404':
          $ref: '#/components/responses/MktNotFound'
        '422':
          description: Snapshot no longer installable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktError'
  /connectors:
    post:
      operationId: createConnector
      summary: Register one org-scoped external integration
      description: 'Write operation (connectors.write, OWNER/ADMIN). The body carries the

        connector name (unique per organization), type (webhook|http),

        base_url (absolute http(s) URL), config (auth_style plus optional

        header templates and api-key/basic parameters) and an optional

        secret_ref NAME referencing a secret in the secrets store. Secret

        values are never accepted by this endpoint. Status defaults to

        active. Duplicate (org, name) is a 409. The tenant is derived from

        the auth claims — any client-supplied organization id is ignored.

        '
      x-required-permission: connectors.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConCreateRequest'
      responses:
        '201':
          description: Connector registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
        '401':
          $ref: '#/components/responses/ConUnauthorized'
        '403':
          $ref: '#/components/responses/ConForbidden'
        '409':
          description: A connector with the same name already exists in the caller's organization (error.code CONNECTOR_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
        '422':
          description: 'Validation error: missing name/base_url, name over 255 chars, type

            not webhook|http, base_url not an absolute http(s) URL, status not

            active|disabled, auth_style not one of none|bearer|basic|

            api_key_header, or a header template containing CR/LF

            (error.code VALIDATION_ERROR).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
    get:
      operationId: listConnectors
      summary: List connectors for the caller's organization
      description: 'Read operation (connectors.read, MEMBER+ — viewers are excluded

        because connector listings expose integration topology). Returns all

        connectors of the caller''s organization ordered by name ASC; each

        entry is the value-free projection (config templates + secret_ref

        name only, never secret values).

        '
      x-required-permission: connectors.read
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Connector list (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConListResponse'
        '401':
          $ref: '#/components/responses/ConUnauthorized'
        '403':
          $ref: '#/components/responses/ConForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
  /connectors/{id}:
    get:
      operationId: getConnector
      summary: Fetch one connector
      description: 'Read operation (connectors.read, MEMBER+). Returns the value-free

        projection of one connector including the recorded health-check

        bookkeeping (last_check_at / last_check_status, null/"" when never

        probed). Foreign or unknown ids surface as 404 (no existence leak

        across tenants).

        '
      x-required-permission: connectors.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/ConId'
      responses:
        '200':
          description: Connector projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConResponse'
        '401':
          $ref: '#/components/responses/ConUnauthorized'
        '403':
          $ref: '#/components/responses/ConForbidden'
        '404':
          description: Connector not found within the caller's organization (error.code CONNECTOR_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
    delete:
      operationId: deleteConnector
      summary: Hard-delete one connector
      description: 'Write operation (connectors.write, OWNER/ADMIN). Removes the registry

        entry (connectors are hard-deleted; the unique (org, name) constraint

        frees the name immediately). Foreign or unknown ids are 404.

        Deletion is audit-logged.

        '
      x-required-permission: connectors.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/ConId'
      responses:
        '200':
          description: Connector deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConDeleteResponse'
        '401':
          $ref: '#/components/responses/ConUnauthorized'
        '403':
          $ref: '#/components/responses/ConForbidden'
        '404':
          description: Connector not found within the caller's organization (error.code CONNECTOR_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
  /connectors/{id}/test:
    post:
      operationId: testConnector
      summary: Run the live health check for one connector
      description: 'Write operation (connectors.write, OWNER/ADMIN — the probe triggers

        outbound network activity and mutates connector state). Performs a

        GET to the connector''s base_url with the configured auth style

        applied (the secret is resolved server-side through the secrets

        store and injected into the outgoing request only — it never appears

        here), bounded by a 5s timeout. Classifies the outcome as ok

        (2xx-3xx) or error (non-2xx, network failure, timeout, unresolvable

        secret), records last_check_at / last_check_status on the connector

        and returns the probe result. Disabled connectors remain probeable —

        the check exists precisely to inform the enable/disable decision.

        '
      x-required-permission: connectors.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/ConId'
      responses:
        '200':
          description: Probe outcome (never includes secret values).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConTestResponse'
        '401':
          $ref: '#/components/responses/ConUnauthorized'
        '403':
          $ref: '#/components/responses/ConForbidden'
        '404':
          description: Connector not found within the caller's organization (error.code CONNECTOR_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
        '500':
          description: Unexpected server failure (e.g. persistence of the probe outcome failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConErrorEnvelope'
  /auth/sso/{org_slug}/login:
    get:
      operationId: beginSsoLogin
      summary: Start the OIDC login flow (302 to the IdP authorize URL)
      description: 'Resolves the organization by its URL slug, validates the stored

        sso_config against the live discovery document and returns a 302

        redirect to the IdP authorization endpoint carrying client_id,

        redirect_uri (the derived callback

        `<scheme>://<host>/auth/sso/callback`, overridable by a config-pinned

        redirect_uri), state, nonce and scopes. Unknown slugs and

        unconfigured organizations both answer 404. No authentication header

        applies: this endpoint exists to start a browser login.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/SsoOrgSlug'
      responses:
        '302':
          description: Redirect to the IdP authorization endpoint (Location header).
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
        '404':
          description: 'No organization matches the slug (ORG_NOT_FOUND) or the

            organization has no sso_config (SSO_NOT_CONFIGURED).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoError'
        '502':
          description: 'The identity provider is unreachable or its discovery document is

            invalid (SSO_UPSTREAM_ERROR). The upstream URL is never echoed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoError'
  /auth/sso/callback:
    get:
      operationId: completeSsoLogin
      summary: Complete the OIDC login flow (returns the platform session token)
      description: 'The IdP redirects here with `code` and `state`. The single-use state

        is consumed (replays and 10-minute-expired states are 401), the code

        is exchanged (client_secret_post; inline secret or

        client_secret_ref resolved from the platform secrets store), the

        RS256 ID token is verified end-to-end and the local identity is

        JIT-provisioned or linked by the email claim. Returns the platform''s

        existing HMAC session token — the same format as POST /auth/login —

        plus a credential-free user view. Disabled accounts (SCIM

        active=false) are refused with 403 ACCOUNT_DISABLED.

        '
      security: []
      parameters:
      - name: code
        in: query
        required: true
        description: Authorization code issued by the IdP.
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: Opaque single-use state issued by beginSsoLogin.
        schema:
          type: string
      responses:
        '200':
          description: Login completed; the identity is provisioned/linked.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoLoginResponse'
        '400':
          description: Missing code or state (SSO_INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoError'
        '401':
          description: 'Unknown/expired/replayed state (SSO_STATE_INVALID) or a failed

            identity-provider exchange / ID-token validation

            (SSO_LOGIN_FAILED).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoError'
        '403':
          description: Account deprovisioned (ACCOUNT_DISABLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoError'
        '409':
          description: 'The email belongs to another organization

            (SSO_EMAIL_FOREIGN_ORG) or the account is linked to a different

            IdP subject (SSO_SUBJECT_MISMATCH — potential account takeover).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoError'
        '502':
          description: Identity provider unreachable or misconfigured (SSO_UPSTREAM_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoError'
  /scim/tokens:
    post:
      operationId: createScimToken
      summary: Mint a SCIM bearer credential (plaintext shown exactly once)
      description: 'OWNER-only (organization.manage). Creates one org-scoped SCIM bearer

        credential of the form `scim_<64 hex>`. Only the SHA-256 hex hash is

        persisted (UNIQUE, the api_keys.key_hash trust model); the plaintext

        is returned exactly once in `secret` and never stored or logged. The

        response metadata never echoes the hash.

        '
      x-required-permission: organization.manage
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '201':
          description: Credential minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimTokenCreated'
        '401':
          $ref: '#/components/schemas/SsoUnauthorized'
        '403':
          description: Caller is not an OWNER (organization.manage).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoError'
  /scim/v2/Users:
    get:
      operationId: listScimUsers
      summary: List (SCIM 2.0 ListResponse) with optional userName-eq filter
      description: 'Returns the tenant''s identities as a standard SCIM 2.0 ListResponse

        (urn:ietf:params:scim:api:messages:2.0:ListResponse) with

        totalResults/startIndex/itemsPerPage and an always-present `Resources`

        array (never null). The only supported filter is

        `userName eq "<email>"` (RFC 7644 §3.4.2.2, case-insensitive, exact);

        any other filter is 400 and NEVER degrades into a full listing.

        Authentication is the dedicated scim_ bearer credential ONLY.

        '
      security:
      - scimBearer: []
      parameters:
      - name: filter
        in: query
        required: false
        description: Supported form — userName eq "user@example.com"
        schema:
          type: string
      responses:
        '200':
          description: The tenant's users (possibly an empty Resources array).
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimListResponse'
        '400':
          description: Unsupported filter (ScimError, RFC 7644 §3.12 envelope).
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '401':
          description: 'Missing/unknown/revoked scim_ bearer credential (indistinguishable

            on purpose).

            '
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
    post:
      operationId: createScimUser
      summary: JIT-provision one identity (SCIM 2.0 create)
      description: 'Creates the identity from a SCIM 2.0 core-user document. userName is

        the login email (validated, lowercased) and `active` defaults to

        true. The user is created passwordless (invite-pending) and pinned to

        MEMBER — directory sync never mints privilege. Extra attributes

        (name, displayName, externalId, emails, password) are accepted and

        ignored by design. Duplicate emails conflict with 409 regardless of

        tenant (users.email is globally UNIQUE).

        '
      security:
      - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUserRequest'
      responses:
        '201':
          description: Identity provisioned; Location carries the resource URL.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '400':
          description: Malformed body or invalid userName.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '401':
          description: Missing/unknown/revoked scim_ bearer credential.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '409':
          description: A user with this email already exists.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
  /scim/v2/Users/{id}:
    get:
      operationId: getScimUser
      summary: Read one identity (SCIM 2.0 core user)
      description: 'Point read of one identity by SCIM id. Unknown AND foreign-tenant ids

        both answer 404 without an existence leak.

        '
      security:
      - scimBearer: []
      parameters:
      - $ref: '#/components/parameters/ScimUserId'
      responses:
        '200':
          description: The identity.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '401':
          description: Missing/unknown/revoked scim_ bearer credential.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '404':
          description: Unknown or foreign id (no existence leak).
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
    put:
      operationId: replaceScimUser
      summary: Replace an identity (userName immutable)
      description: 'SCIM 2.0 full replace of the mutable attributes. userName is

        immutable in this deployment (it IS the login credential): a

        mismatching userName is 400, so a directory rename can never hijack

        an account. Full-replace semantics per RFC 7644 §3.5.1: an omitted

        `active` resets to the default true.

        '
      security:
      - scimBearer: []
      parameters:
      - $ref: '#/components/parameters/ScimUserId'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUserRequest'
      responses:
        '200':
          description: The replaced identity.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '400':
          description: Malformed body, invalid userName or userName mismatch (immutable).
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '401':
          description: Missing/unknown/revoked scim_ bearer credential.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '404':
          description: Unknown or foreign id.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
    patch:
      operationId: patchScimUser
      summary: Patch an identity (replace active — deprovisioning)
      description: 'SCIM 2.0 PATCH. Supports the standard deprovisioning operations:

        `{"op":"replace","path":"active","value":false}` and the pathless

        `{"op":"replace","value":{"active":false}}` (op case-insensitive,

        boolean values may be string-encoded for stock IdP connectors).

        Anything else is 400 and applied nothing. Disabling the user blocks

        password login platform-wide; re-enabling restores it.

        '
      security:
      - scimBearer: []
      parameters:
      - $ref: '#/components/parameters/ScimUserId'
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatchRequest'
      responses:
        '200':
          description: The patched identity.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
        '400':
          description: Unsupported or malformed patch operations (nothing applied).
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '401':
          description: Missing/unknown/revoked scim_ bearer credential.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
        '404':
          description: Unknown or foreign id.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimError'
components:
  parameters:

    ApiKeysID:
      name: id
      in: path
      required: true
      description: API key id (UUID, as returned by the mint operation).
      schema:
        type: string
        minLength: 1
      example: 3f6c1a5e-8e2b-4c1d-9a7b-2f0d5e6a1b2c
    AgentID:
      name: id
      in: path
      required: true
      description: Agent identifier (e.g. `agent-1`).
      schema:
        type: string
      example: agent-1
    RunID:
      name: id
      in: path
      required: true
      description: Run identifier (UUID v4 string).
      schema:
        type: string
      example: 3f6c2b62-2b57-4f8e-9e4e-2f4d3b6c9a10
    Wf3WorkflowRunID:
      name: id
      in: path
      required: true
      description: Workflow run identifier (UUID v4 string).
      schema:
        type: string
    VdfAgentID:
      name: id
      in: path
      required: true
      description: Agent identifier (UUID v4 string).
      schema:
        type: string
      example: 3f9d6c5e-8b21-4f0a-9c3d-7a1e5b2c4d6f
    VdfFromVersion:
      name: from
      in: query
      required: true
      description: Base version number of the diff (positive integer; may equal `to`).
      schema:
        type: integer
        minimum: 1
      example: 2
    VdfToVersion:
      name: to
      in: query
      required: true
      description: Target version number of the diff (positive integer; may equal `from`).
      schema:
        type: integer
        minimum: 1
      example: 3
    WfApprovalID:
      name: id
      in: path
      required: true
      description: Approval identifier (UUID v4 string).
      schema:
        type: string
    DeploymentID:
      name: id
      in: path
      required: true
      description: Deployment identifier (UUID v4 string).
      schema:
        type: string
      example: 9d2f2f8e-1c3b-4a5d-9e6f-2f4d3b6c9a10
    PolicyID:
      name: id
      in: path
      required: true
      description: Policy id (UUID string)
      schema:
        type: string
    WfRunID:
      name: id
      in: path
      required: true
      description: Agent run identifier (UUID v4 string).
      schema:
        type: string
    WfWorkflowRunID:
      name: id
      in: path
      required: true
      description: Workflow run identifier (UUID v4 string).
      schema:
        type: string
    WfWorkflowID:
      name: id
      in: path
      required: true
      description: Workflow identifier (UUID v4 string).
      schema:
        type: string
    CanaryDeploymentID:
      name: id
      in: path
      required: true
      description: Deployment identifier (UUID v4 string).
      schema:
        type: string
      example: 9d2f2f8e-1c3b-4a5d-9e6f-2f4d3b6c9a10
    BillInvoiceID:
      name: id
      in: path
      required: true
      description: Invoice identifier (UUID v4 string).
      schema:
        type: string
    SecName:
      name: name
      in: path
      required: true
      description: 'Secret name (unique per organization among live secrets). Must match

        `[A-Za-z0-9][A-Za-z0-9._-]{0,254}`.

        '
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$
      example: OPENAI_API_KEY
    ConId:
      name: id
      in: path
      required: true
      description: Connector identifier (unique per organization).
      schema:
        type: string
    SsoOrgSlug:
      name: org_slug
      in: path
      required: true
      description: URL slug of the organization (case-insensitive).
      schema:
        type: string
    ScimUserId:
      name: id
      in: path
      required: true
      description: SCIM resource id (the platform user id).
      schema:
        type: string
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: HS256-HMAC
      description: 'HMAC-SHA256 JWT-style token from `POST /auth/login` (24h expiry).

        Claims: user_id, organization_id, email, role, exp.

        '
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pre-provisioned API key (see main spec).
      scheme: bearer
      bearerFormat: HS256-HMAC
    Wf3BearerToken:
      type: http
      scheme: bearer
      bearerFormat: HS256-HMAC
      description: HMAC-SHA256 JWT-style token from POST /auth/login (see main spec).
    Wf3ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Pre-provisioned API key (see main spec).
    scimBearer:
      type: http
      scheme: bearer
      description: 'Dedicated SCIM credential minted by POST /scim/tokens

        (`Authorization: Bearer scim_...`). ONLY valid on /scim/v2/* —

        session tokens and API keys are rejected here, and scim_ credentials

        are rejected everywhere else.

        '
  responses:

    ApiKeyUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiKeyErrorEnvelope'
    ApiKeyForbidden:
      description: Authenticated but lacking the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiKeyErrorEnvelope'
    Unauthorized:
      description: Missing/invalid credentials (plain text body today; JSON model is the target).
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/LegacyTextError'
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but lacking the required permission or organization access.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/LegacyTextError'
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/LegacyTextError'
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UsgUnauthorized:
      description: Missing or invalid credentials.
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/UsgErrorEnvelope'
    UsgForbidden:
      description: Authenticated but lacking the `usage.read` permission.
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/UsgErrorEnvelope'
    Wf3Unauthorized:
      description: Missing/invalid credentials.
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/Wf3ErrorEnvelope'
    Wf3Forbidden:
      description: Authenticated but lacking the required permission.
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/Wf3ErrorEnvelope'
    Wf3NotFound:
      description: Workflow run not found (or owned by another tenant — cross-tenant access surfaces as 404, never 403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Wf3ErrorEnvelope'
    Wf3ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Wf3ErrorEnvelope'
    VdfUnauthorized:
