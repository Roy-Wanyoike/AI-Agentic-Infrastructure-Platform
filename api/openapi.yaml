          nullable: true
          description: 'Free-form knobs; the shipped invoice generator reads

            {"overage_run_rate_cents": N} (N > 0) to price runs beyond the

            included quota.

            '
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BillPlanList:
