      description: 'Traffic-changing operation (deployments.deploy, OWNER/ADMIN). Body

        fields are optional but at least one must be provided; omitted fields

        keep their current value. `canary_version` attaches/replaces the

        canary: it must be an EXISTING version of the SAME agent (any

