    QuotaPaymentRequired:
      description: 'The organization''s monthly run budget is exceeded and enforcement is

        enabled (AGENTOS_BILLING_ENFORCEMENT). NO run row was created and NO

        agent.run task was enqueued; the denial is audit-logged as

        run.quota_denied. Upgrade the plan, wait for the period reset, or

        disable enforcement.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuotaErrorEnvelope'
          example:
            error:
              code: quota_exceeded
              message: 'monthly run quota exceeded: included 10 runs, consumed 11 runs for the current billing period; upgrade
                the plan or wait for the period to reset'
    QuotaBillingUnavailable:
      description: 'Enforcement is enabled (AGENTOS_BILLING_ENFORCEMENT) but the billing

        service is not wired into the API process. Fail-closed on purpose:

        the misconfiguration must surface rather than silently bypass the

        quota (error.code billing_unavailable).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuotaErrorEnvelope'
    OrgUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrgErrorEnvelope'
    OrgForbidden:
      description: Authenticated but lacking the required permission for this operation.
