              type: string
              description: One of AGENT_NOT_FOUND, VERSION_NOT_FOUND, INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - VERSION_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    CanaryConfigRequest:
      type: object
      description: 'Canary configuration patch. At least one property is required; omitted

        properties keep their current value.

        '
      properties:
        canary_version:
          type: integer
          minimum: 1
          description: 'Canary target version. Must be an existing version of the SAME

            agent (any publication status) and differ from the deployment''s

            stable version.

            '
          examples:
          - 3
        canary_weight:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of traffic routed to the canary (0-100). Requires an attached canary.
          examples:
          - 50
      minProperties: 1
    CanaryDeploymentHealth:
      type: object
      description: Health payload (mirrors the base DeploymentHealth schema; superseded_by/error appear only on demoted/failed
        rows).
      properties:
        error_rate:
          type: number
          format: double
          examples:
          - 0.0
        last_check_at:
          type: string
          format: date-time
          nullable: true
          examples:
          - '2025-01-02T03:04:05Z'
        superseded_by:
          type: string
          description: ID of the deployment that replaced this (previously healthy) row.
        error:
          type: string
          description: Failure reason when status is failed.
    CanaryDeploymentView:
      type: object
      description: 'Deployment wire shape extended with the canary fields (issue #13).

        canary_version 0 means "no canary" — all traffic serves the stable

        `version`. While the row is the environment''s healthy deployment,

        canary_weight percent of the agent''s traffic deterministically

        resolves to canary_version.

        '
      properties:
        id:
          type: string
          examples:
          - 9d2f2f8e-1c3b-4a5d-9e6f-2f4d3b6c9a10
        agent_id:
          type: string
          examples:
          - agent-1
        version:
          type: integer
          description: The STABLE version (serves 100 - canary_weight percent of traffic).
          examples:
          - 2
        environment:
          type: string
          enum:
          - development
          - staging
          - production
        status:
          type: string
          enum:
          - requested
          - validated
          - deploying
          - healthy
          - failed
        health:
          $ref: '#/components/schemas/CanaryDeploymentHealth'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        canary_version:
          type: integer
          description: The CANARY version; 0 = no canary configured.
          examples:
          - 3
        canary_weight:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of traffic deterministically routed to the canary (0 when no canary).
          examples:
          - 50
      required:
      - id
      - agent_id
      - version
      - environment
      - status
      - health
      - created_at
      - updated_at
      - canary_version
      - canary_weight
    CanaryDeploymentResponse:
      type: object
      properties:
        deployment:
          $ref: '#/components/schemas/CanaryDeploymentView'
      required:
      - deployment
    CanaryErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of DEPLOYMENT_NOT_FOUND, INVALID_STATE, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN,
                INTERNAL_ERROR.
              examples:
              - INVALID_STATE
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    BillPlan:
