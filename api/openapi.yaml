        Creates a new versioned release-assurance policy. Validation
        failures (unknown suite kind, out-of-range thresholds, a
        security_adversarial requirement without fail_closed=true or
        without an explicit max_severity_allowed, unbounded exceptions)
        answer 422 VALIDATION_ERROR.
      x-required-permission: qualitygates.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityGatePolicyInput" }
      responses:
        "201":
          description: Created (version 1).
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/QualityGatePolicy" }
        "401": { $ref: "#/components/responses/QualityGatesUnauthorized" }
        "403": { $ref: "#/components/responses/QualityGatesForbidden" }
        "422": { $ref: "#/components/responses/QualityGatesValidation" }
        "500": { $ref: "#/components/responses/QualityGatesInternal" }
    get:
      operationId: listQualityGatePolicies
      summary: List the organization's quality-gate policies (latest versions)
      x-required-permission: qualitygates.read
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        "200":
          description: The latest version of every policy (name-sorted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/QualityGatePolicy" }
        "401": { $ref: "#/components/responses/QualityGatesUnauthorized" }
        "403": { $ref: "#/components/responses/QualityGatesForbidden" }
        "500": { $ref: "#/components/responses/QualityGatesInternal" }
  /quality-gates/policies/{id}:
    parameters:
    - $ref: "#/components/parameters/QualityGatesPolicyID"
    get:
      operationId: getQualityGatePolicy
      summary: Read one policy version
      description: >
        Returns the latest version by default; `?version=N` pins an exact
        immutable version. Unknown or foreign ids are 404.
      x-required-permission: qualitygates.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: version
        in: query
        required: false
        description: Pin an exact policy version (positive integer; default latest).
        schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The policy version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/QualityGatePolicy" }
        "401": { $ref: "#/components/responses/QualityGatesUnauthorized" }
        "404": { $ref: "#/components/responses/QualityGatesNotFound" }
        "422": { $ref: "#/components/responses/QualityGatesValidation" }
        "500": { $ref: "#/components/responses/QualityGatesInternal" }
    put:
      operationId: updateQualityGatePolicy
      summary: Append a new immutable version of the policy
      description: >
        Validates the input and appends version N+1 (history is retained;
        prior versions remain readable via `?version=`). Validation
        failures answer 422.
      x-required-permission: qualitygates.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityGatePolicyInput" }
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/QualityGatePolicy" }
        "401": { $ref: "#/components/responses/QualityGatesUnauthorized" }
        "403": { $ref: "#/components/responses/QualityGatesForbidden" }
        "404": { $ref: "#/components/responses/QualityGatesNotFound" }
        "422": { $ref: "#/components/responses/QualityGatesValidation" }
        "500": { $ref: "#/components/responses/QualityGatesInternal" }
    delete:
      operationId: deleteQualityGatePolicy
      summary: Delete every version of the policy
      x-required-permission: qualitygates.write
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        "200":
          description: Deleted (id echoed back).
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        "401": { $ref: "#/components/responses/QualityGatesUnauthorized" }
        "403": { $ref: "#/components/responses/QualityGatesForbidden" }
        "404": { $ref: "#/components/responses/QualityGatesNotFound" }
        "500": { $ref: "#/components/responses/QualityGatesInternal" }
  /quality-gates/evaluate:
    post:
      operationId: evaluateQualityGate
      summary: Evaluate a policy against explicit evidence refs
      description: >
        Resolves the tenant-scoped evidence records by ref, evaluates the
        policy deterministically and returns the Decision
        (recommendation + per-suite check results). The decision is a
        RECOMMENDATION: applying promote/rollback/abort to live traffic is
        the orchestrator's CanaryAdvisor wiring — evaluation never mutates
        canaries. Unknown/foreign refs are 404; inactive policies are 422
        POLICY_INACTIVE; tampered evidence is 422 EVIDENCE_TAMPERED.
      x-required-permission: qualitygates.read
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_id]
              properties:
                policy_id: { type: string, description: The policy to evaluate (latest version). }
                evidence_refs:
                  type: array
                  items: { type: string }
                  description: Evidence record ids (as returned by the assurance producers). Missing refs for a required suite leave that check blocked.
      responses:
        "200":
          description: The deterministic decision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision: { $ref: "#/components/schemas/QualityGateDecision" }
        "401": { $ref: "#/components/responses/QualityGatesUnauthorized" }
        "404": { $ref: "#/components/responses/QualityGatesNotFound" }
        "422": { $ref: "#/components/responses/QualityGatesValidation" }
        "500": { $ref: "#/components/responses/QualityGatesInternal" }
  /quality-gates/exceptions:
    post:
      operationId: approveQualityGateException
      summary: Approve a time-bounded exception on a policy
      description: >
        Appends a waiver to the policy as a NEW version and emits the
        qualitygates.exception_approved audit event. expires_at is
        REQUIRED and must be strictly in the future (exceptions are
        time-bounded only); suite must be a non-security kind ("" waives
        every non-security suite). approved_by is ALWAYS the authenticated
        actor — the request body cannot attribute a waiver to someone
        else.
      x-required-permission: qualitygates.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_id, reason, expires_at]
              properties:
                policy_id: { type: string }
                suite:
                  type: string
                  description: The waived suite kind ("" = every non-security suite). security_adversarial is structurally unwaivable.
                  enum: [evaluations, synthetic_journeys, canary_health]
                reason: { type: string, minLength: 1 }
                expires_at: { type: string, format: date-time, description: RFC3339; must be strictly in the future. }
      responses:
        "200":
          description: The new policy version carrying the exception.
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/QualityGatePolicy" }
        "401": { $ref: "#/components/responses/QualityGatesUnauthorized" }
        "403": { $ref: "#/components/responses/QualityGatesForbidden" }
        "404": { $ref: "#/components/responses/QualityGatesNotFound" }
        "422": { $ref: "#/components/responses/QualityGatesValidation" }
        "500": { $ref: "#/components/responses/QualityGatesInternal" }

# ---- wave-10 round-4 fragment: simulation.yaml (paths) ----
  /simulations:
    post:
      operationId: createSimulation
      summary: Validate, queue and run a simulation asynchronously (202 = accepted)
      description: |
        Write operation (simulation.write, OWNER/ADMIN/MEMBER). The body is
        a SimulationConfig: kind (registered environment), rounds [1,500],
        seed (determinism anchor), optional IANA location for the
        timezone-aware activity multipliers, 1..64 SimAgentPersona agents,
        and optional external ActivityEvents at specific rounds. Validation
        is synchronous and fails fast with 422 before any record exists.
        On success the record is queued and a detached goroutine executes
        the rounds (context detached from the request — completion never
        depends on the caller staying connected). Poll
        GET /simulations/{id} until status is completed or failed.
      x-required-permission: simulation.write (OWNER/ADMIN/MEMBER)
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationConfig'
      responses:
        '202':
          description: |
            Simulation accepted: the queued record (status "queued") is
            returned immediately; execution is in progress server-side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationCreateResponse'
        '401':
          $ref: '#/components/responses/SimulationUnauthorized'
        '403':
          $ref: '#/components/responses/SimulationForbidden'
        '422':
          description: Validation failure (unknown kind, bounds violated, bad timezone, duplicate agent ids...). No record is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationErrorEnvelope'
    get:
      operationId: listSimulations
      summary: List the caller's organization's simulations (newest first)
      description: |
        Read operation (simulation.read, all roles — transcripts and
        emergence metrics are observability surfaces). The listing is
        org-scoped from the auth claims and always renders a JSON array
        (empty registry -> [], never null).
      x-required-permission: simulation.read (all roles)
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: The org's simulation records, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationListResponse'
        '401':
          $ref: '#/components/responses/SimulationUnauthorized'
  /simulations/{id}:
    get:
      operationId: getSimulation
      summary: Fetch one simulation record (config, status, result)
      description: |
        Read operation (simulation.read, all roles). Unknown AND foreign-org
        ids are the same 404 (no existence leak across tenants). A completed
        record carries the full SimulationResult: per-round RoundRecord
        entries (ActionResult transcript, RoundMetrics, EnvState snapshot)
        and EmergentNote heuristics with their formulas restated in `detail`.
      x-required-permission: simulation.read (all roles)
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/SimulationID'
      responses:
        '200':
          description: The simulation record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationGetResponse'
        '401':
          $ref: '#/components/responses/SimulationUnauthorized'
        '404':
          description: Unknown or foreign-org id (indistinguishable by design).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationErrorEnvelope'

# ---- wave-10 round-4 fragment: configgen.yaml (paths) ----
  /config/generate:
    post:
      operationId: generateConfig
      summary: Translate a natural-language description into a configuration draft (never applied)
      description: |
        Takes {type, description, context?} and returns a DRAFT: an agent
        configuration (model, tools, policy, runtime knobs, system
        instructions) or a workflow DSL graph. Nothing is persisted and no
        resource is created — the draft is returned for review, and the
        caller creates the real objects through the normal endpoints
        afterwards. Generation runs in 5 steps; the response's `progress`
        array reports each completed step so UIs can render partial
        progress. The draft's `assumptions` array documents every
        non-obvious decision the generator made. Workflow drafts reference
        {{placeholder}} agent_id / tool_id / url values that reviewers must
        bind before creating the workflow.
      x-required-permission: configgen.use
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigGenGenerateRequest'
      responses:
        '200':
          description: |
            Draft generated. Exactly one of agent_draft / workflow_draft is
            populated, matching the request type; `valid` is always true for
            server-generated drafts (every draft is validated before it is
            returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigGenGenerateResponse'
        '400':
          description: Malformed or empty JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigGenErrorEnvelope'
        '401':
          $ref: '#/components/responses/ConfigGenUnauthorized'
        '403':
          $ref: '#/components/responses/ConfigGenForbidden'
        '422':
          description: |
            Validation error: blank description, missing type or unknown type
            (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigGenErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigGenErrorEnvelope'

