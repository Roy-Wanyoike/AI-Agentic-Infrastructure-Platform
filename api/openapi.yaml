        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - agent_id
              properties:
                agent_id:
                  type: string
      responses:
        '200':
          description: Run finished; status is `completed` (per-case failures land in the results).
          content:
            application/json:
              schema:
                type: object
                required:
                - eval_run_id
                - status
                properties:
                  eval_run_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - completed
                    - failed
        '400':
          description: Missing agent_id or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalErrorEnvelope'
        '404':
          description: Dataset or agent not found in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Evals runner not wired into the API server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalErrorEnvelope'
