  /residency/posture:
    get:
      operationId: getResidencyPosture
      summary: Residency posture of the caller's organization
      description: Compliance view — mode, pinning state and the last out-of-region evidence (flagged allow or strict deny).
      x-required-permission: users.manage
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        "200":
          description: The posture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidencyPosture" }
        "401": { $ref: "#/components/responses/ResidencyUnauthorized" }
        "403": { $ref: "#/components/responses/ResidencyForbidden" }
        "500": { $ref: "#/components/responses/ResidencyInternal" }
  /residency/check:
    post:
      operationId: checkResidency
      summary: Explicit data-flow residency check for one URL
      description: >
        Classifies the URL host against the documented region table and
        evaluates the org policy. Allowed verdicts are 200; strict denials
        are 403 with code "residency_violation" (fail-closed for
        unclassifiable endpoints, reason "unclassifiable_endpoint"). Both
        outcomes are audited (residency.check / residency.violation).
