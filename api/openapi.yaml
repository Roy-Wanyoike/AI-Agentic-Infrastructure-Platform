  /eval-datasets/{id}/run:
    post:
      operationId: runEvalDataset
      summary: Execute every case of a dataset against an agent (synchronous, bounded)
      description: |
        Runs each case through the agent runtime with a per-case context
        deadline (30s) and at most 50 cases. Returns the completed run id;
        fetch `GET /eval-runs/{id}` for results and summary. Cost is recorded
        as 0 until the runtime exposes cost (token usage only today).
      security:
      - bearerToken: []
      - apiKey: []
