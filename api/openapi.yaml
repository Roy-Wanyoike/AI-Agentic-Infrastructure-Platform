        canary runs next to the stable version) and differ from the stable

        version. `canary_weight` moves the 0-100 split point and requires an

        attached canary; out-of-range values are rejected, not clamped. Only

        the environment''s HEALTHY deployment accepts canary operations;

        `canary_version` on non-healthy rows is staged config that never

        serves traffic.

