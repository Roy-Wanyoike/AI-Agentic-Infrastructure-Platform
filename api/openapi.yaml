          type: string
          format: uuid
          description: Target webhook endpoint (must exist in the same organization).
        event_types:
          type: array
          items:
            type: string
          description: 'Pinned event types delivered to the webhook, e.g. "run.failed"

            (run failure), "approval.requested" (approval required),

            "deployment.failed" (canary/deployment failure + rollback).

            '
          minItems: 1
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC.
