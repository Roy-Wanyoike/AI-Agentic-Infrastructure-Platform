      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteScheduleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Schedule not found (or belongs to another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SCHEDULE_NOT_FOUND
                  message: schedule not found
      x-required-permission: schedules.write
  /schedules/{id}/pause:
    post:
      operationId: pauseSchedule
      summary: Pause a schedule (active -> paused)
      description: 'Requires `schedules.write`. Paused schedules never fire; `next_run_at`

        is preserved so resume continues the cadence (an overdue schedule

        fires once on the next worker poll).

        '
      tags:
      - Schedules
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Paused (returns the updated schedule).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '409':
