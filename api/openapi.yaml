  /usage/costs:
    get:
      operationId: getUsageCosts
      summary: Tenant usage-cost report aggregated from run costs
      description: 'Aggregates `runs.cost_cents` for the caller''s organization over the

        half-open [from, to) window. `from`/`to` accept RFC3339 timestamps or

        bare `YYYY-MM-DD` UTC dates; when omitted the window defaults to the

        30 days ending now (capped at 366 days). `group_by` selects the

        aggregation dimension: `day` (UTC day buckets), `agent` (runs grouped

        by the run''s agent_id) or `model` (grouped by the serving model,

        resolved from the agents catalog at query time).

        Costs are USD cents; runs without pricing data count as 0 and are

        still included in the `runs` counters.

        '
      security:
      - bearerToken: []
      - apiKey: []
      x-required-permission: usage.read
      tags:
      - Usage
      parameters:
      - name: from
        in: query
        required: false
        description: Window start (inclusive). RFC3339 or YYYY-MM-DD (UTC). Defaults to `to` minus 30 days.
        schema:
          type: string
          example: '2026-09-01T00:00:00Z'
      - name: to
        in: query
        required: false
        description: Window end (exclusive). RFC3339 or YYYY-MM-DD (UTC). Defaults to now.
        schema:
          type: string
          example: '2026-10-01T00:00:00Z'
      - name: group_by
        in: query
        required: false
        description: Aggregation dimension (default `day`).
        schema:
          type: string
          enum:
          - day
          - agent
          - model
          default: day
      responses:
        '200':
          description: Aggregated cost report for the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsgUsageCostsResponse'
        '400':
          description: 'Invalid query: unknown `group_by` (machine code

            `INVALID_GROUP_BY`) or an unparsable/inverted/too-wide window

            (machine code `INVALID_TIME_RANGE`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsgErrorEnvelope'
        '401':
          $ref: '#/components/responses/UsgUnauthorized'
        '403':
          $ref: '#/components/responses/UsgForbidden'
        '405':
          description: Method not allowed (only GET is served).
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Runs service not wired into the API server (machine code `USAGE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsgErrorEnvelope'
  /workflow-runs/{id}/nodes:
    get:
      operationId: listWorkflowRunNodes
      tags:
      - workflow-runs
      summary: Get the checkpointed node timeline of a workflow run
      description: 'Returns every node execution checkpoint of one workflow run, oldest

        first: one entry per (node, attempt) pair. Entries are the durable

        checkpoints written synchronously by the executor/worker, so the

        response reflects the exact state the recovery pass acts on.


        `status` uses the workflow status vocabulary (pending, running,

        waiting_approval, completed, failed, cancelled, timeout — `timeout` is

        assigned by the recovery watchdog). `error_code` is a machine code

        (NODE_ORPHANED, WORKFLOW_RUN_TIMEOUT, ...) or `null` while healthy.


        A run owned by another tenant surfaces as 404, never 403.

        '
      x-required-permission: workflows.read
      parameters:
      - $ref: '#/components/parameters/Wf3WorkflowRunID'
      responses:
        '200':
          description: The checkpointed node timeline (may be empty while the DAG expansion has not recorded any node yet).
          content:
            application/json:
