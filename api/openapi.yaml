                $ref: '#/components/schemas/MktSigSettingsEnvelope'
        '400':
          description: Missing allow_unsigned (boolean required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktSigError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktSigError'
        '403':
          description: Authenticated principal lacks agents.write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MktSigError'
  /mcp-servers:
    post:
      operationId: registerMCPServer
      summary: Register an external MCP server (health-checked)
      description: |
        Registers an org-scoped MCP server and immediately probes it: the
        registry performs the MCP initialize handshake and tools/list over
        streamable HTTP, caching the negotiated protocol version and the
        remote tool catalog. Unreachable endpoints are rejected with 422
        unless `force=true` (stores status "unreachable" so the operator can
        fix and re-test later). Audited (mcp.server_registered).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.write (OWNER/ADMIN)
      parameters:
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Register even when the health check fails (status "unreachable").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpRegServerInput'
      responses:
        '201':
          description: Server registered and reachable (tools cached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegServerEnvelope'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegError'
        '401':
          $ref: '#/components/responses/McpRegUnauthorized'
        '403':
          $ref: '#/components/responses/McpRegForbidden'
        '409':
          description: A server with this name already exists in the org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegError'
        '422':
          description: Unreachable endpoint (without force) or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegError'
    get:
      operationId: listMCPServers
      summary: List the caller org's registered MCP servers
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.read (all roles)
      responses:
        '200':
          description: Servers ordered by name (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegServerListEnvelope'
        '401':
          $ref: '#/components/responses/McpRegUnauthorized'
  /mcp-servers/{id}:
    get:
      operationId: getMCPServer
      summary: Get one registered MCP server
      description: Unknown and foreign-tenant ids are the same 404 (no existence leak).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.read (all roles)
      parameters:
        - $ref: '#/components/parameters/McpRegServerID'
      responses:
        '200':
          description: The server record (incl. cached tool catalog)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegServerEnvelope'
        '401':
          $ref: '#/components/responses/McpRegUnauthorized'
        '404':
          description: Unknown or foreign id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegError'
    put:
      operationId: updateMCPServer
      summary: Update an MCP server (re-checked)
      description: |
        Replaces the endpoint/secret configuration and re-runs the health
        check, refreshing the tool cache. Unreachable results are 422 unless
        `force=true` (status "unreachable"). Audited (mcp.server_updated).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.write (OWNER/ADMIN)
      parameters:
        - $ref: '#/components/parameters/McpRegServerID'
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpRegServerInput'
      responses:
        '200':
          description: Updated record (post re-check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegServerEnvelope'
        '401':
          $ref: '#/components/responses/McpRegUnauthorized'
        '403':
          $ref: '#/components/responses/McpRegForbidden'
        '404':
          description: Unknown or foreign id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegError'
        '422':
          description: Unreachable endpoint (without force) or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegError'
    delete:
      operationId: deleteMCPServer
      summary: Delete an MCP server
      description: |
        Removes the registration; its tools stop being exposed to the org's
        agents on the next runner build. Audited (mcp.server_deleted).
      security:
        - bearerToken: []
        - apiKey: []
      x-required-permission: agents.write (OWNER/ADMIN)
      parameters:
        - $ref: '#/components/parameters/McpRegServerID'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpRegDeletedEnvelope'
        '401':
          $ref: '#/components/responses/McpRegUnauthorized'
        '403':
          $ref: '#/components/responses/McpRegForbidden'
        '404':
          description: Unknown or foreign id
          content:
            application/json:
              schema:
