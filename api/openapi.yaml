      operationId: createBillingSubscription
      summary: Subscribe the caller's organization to a plan
      description: 'Owner-only write (organization.manage). Creates the organization''s

        subscription in TRIAL state with a 14-day window

        [now, now+14d). Fails with 409 while a live (trial/active/past_due)

        subscription exists — one live subscription per organization is a

        schema invariant; after a cancellation a fresh subscribe opens a NEW

        lifecycle row (canceled rows remain readable history). The tenant is

        the caller''s auth-claims organization; a client-supplied organization

        id is never trusted.

        '
      x-required-permission: organization.manage
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillSubscribeRequest'
      responses:
        '201':
          description: The created subscription (trial state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillSubscriptionResponse'
        '400':
          description: 'Malformed JSON body or missing plan_id

            (error.code INVALID_REQUEST / VALIDATION_ERROR).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillErrorEnvelope'
        '401':
          $ref: '#/components/responses/BillUnauthorized'
