          description: Caller-supplied free-form metadata carried through ingest.
          additionalProperties: true
        chunk_count:
          type: integer
          description: Number of chunks produced by the ingest pipeline.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnbDocumentsResponse:
