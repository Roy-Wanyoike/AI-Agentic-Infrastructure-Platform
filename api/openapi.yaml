      responses:
        '200':
          description: Runs envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunsResponse'
              example:
                runs:
                - ID: 3f6c2b62-2b57-4f8e-9e4e-2f4d3b6c9a10
                  OrganizationID: org-1
                  AgentID: agent-1
                  Input: What is 2+2?
                  Output: ''
                  Status: QUEUED
                  CreatedAt: '2025-01-01T12:00:00.123456789Z'
                  UpdatedAt: '2025-01-01T12:00:00.123456789Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createRun
      tags:
      - runs
      summary: Create and enqueue a run
      description: 'Creates a run and enqueues an `agent.run` task. Responds 201 with the

        run ID and `status: "queued"`; actual execution happens in the worker.


        Governance enforcement (issue #75): when AGENTOS_POLICY_ENFORCEMENT is

        enabled (default ON), matching policies of the caller''s organization

        are evaluated AFTER RBAC and BEFORE the quota gate and any run row is

        created. A deny decision answers 403 `policy_denied` with the decision

        reason and leaves no run behind (audit action `run.policy_denied`). An

        allow decision carrying `require_approval` parks the run in

        WAITING_APPROVAL, files an approval for the operators and answers 202

        INSTEAD of enqueueing execution (audit action `run.approval_required`);

        approving the linked approval resumes and re-enqueues the run. An

        allowed run records the verdict on its timeline (step_type `policy`,

        see GET /runs/{id}/steps). A failing policy source answers 503

        `policy_unavailable` (fail closed; audit action

        `run.policy_unavailable`). Organizations with no matching policy are

        unaffected (default allow).


        The optional `environment` request field scopes environment-conditional

        policies (default `production`) and is stamped onto the queue task so

        the worker''s tool-level checks evaluate the same scope. The optional

        `estimated_cost_cents` feeds the `max_cost_cents` budget-guard

        condition (a deny rule with the cap matches over-budget requests).

        '
      x-required-permission: runs.execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
            example:
              organization_id: org-1
              agent_id: agent-1
              input: What is 2+2?
      responses:
        '201':
          description: Run created and task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
              example:
                run_id: 3f6c2b62-2b57-4f8e-9e4e-2f4d3b6c9a10
                status: queued
        '400':
          description: Invalid body or missing agent_id.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LegacyTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/QuotaPaymentRequired'
        '403':
          $ref: '#/components/responses/PolEnfPolicyDenied'
        '503':
          $ref: '#/components/responses/PolEnfPolicyUnavailable'
        '202':
          $ref: '#/components/responses/PolEnfWaitingApproval'
        '405':
          description: Method not allowed (the endpoint is POST-only).
