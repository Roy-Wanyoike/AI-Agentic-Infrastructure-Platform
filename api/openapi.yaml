      type: object
      required: [agent_cards]
      properties:
        agent_cards:
          type: array
          items:
            $ref: '#/components/schemas/A2ACard'
    A2ADeletedEnvelope:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string
    A2ACanonicalCard:
      type: object
      description: >
        The canonical A2A Agent Card — the wire contract of the discovery
        surface (camelCase; platform internals excluded).
      required: [name, version, url, capabilities, skills]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        provider:
          type: object
          properties:
            organization:
              type: string
            url:
              type: string
        url:
          type: string
          description: The endpoint message envelopes are POSTed to.
        capabilities:
          type: object
          properties:
            streaming:
              type: boolean
            pushNotifications:
              type: boolean
            stateTransitionHistory:
              type: boolean
        skills:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              tags:
                type: array
                items:
                  type: string
        authentication:
          type: object
          description: Present when the card declares an auth scheme.
          properties:
            schemes:
              type: array
              items:
                type: string
        preferredTransport:
          type: string
          enum: [JSONRPC, GRPC, HTTP+JSON]
    A2AMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The inbound message text (routed to the card's agent as the run input; never logged).
    A2AMessageResult:
      type: object
      required: [status]
      properties:
        card_id:
          type: string
        agent_id:
          type: string
        run_id:
          type: string
        task_id:
          type: string
        status:
          type: string
          enum: [submitted]
    A2ADelegateRequest:
      type: object
      required: [message]
      description: Exactly one of card_id / card_url; card_id wins when both are present.
      properties:
        card_id:
          type: string
          description: A REGISTERED card of the caller's org (org-scoped 404 otherwise).
        card_url:
          type: string
          format: uri
          description: Fetch the card live from a well-known URL (GET, bounded by the delegation timeout).
        message:
          type: string
          description: The message text; POSTed as an A2A envelope {role, parts, kind} to the card endpoint. Never logged.
    A2ADelegateResult:
      type: object
      required: [status, http_status, latency_ms]
      properties:
        status:
          type: string
          enum: [submitted, failed]
          description: submitted on a 2xx remote answer, failed otherwise (the call completed; the delegation did not).
        http_status:
          type: integer
        latency_ms:
          type: integer
          format: int64
        card_id:
          type: string
          description: Empty for URL-resolved (unregistered) cards.
        endpoint:
          type: string
        verdict:
          type: string
          description: >
            Recorded gate verdict: "allowed_no_gate" (no gate wired — the
            documented default), "allowed", or the gate's own decision string.
    A2ADelegationDenied:
      type: object
      description: Policy-style refusal (HTTP 403) — the gate denied BEFORE any wire call.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [delegation_denied]
            message:
              type: string
        verdict:
          type: object
          properties:
            decision:
              type: string
              enum: [delegation_denied]
            reason:
              type: string
              description: Operator-facing policy explanation (never a payload).

