      - Evaluations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dataset with cases.
          content:
            application/json:
              schema:
                type: object
                required:
                - dataset
                properties:
                  dataset:
                    $ref: '#/components/schemas/EvalDataset'
