                '
            message:
              type: string
    SecCreateRequest:
      type: object
      description: Create payload. The plaintext value is consumed at seal time and never echoed, logged, or listed afterwards.
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$
          description: Secret name, unique per organization among live secrets.
          examples:
          - OPENAI_API_KEY
        value:
          type: string
          maxLength: 65536
          description: Plaintext secret value (sealed with AES-256-GCM before storage; max 64 KiB).
      required:
      - name
      - value
    SecMetadata:
      type: object
      description: 'Value-free metadata projection. This is the ONLY shape list endpoints

        return; the plaintext value is structurally absent (no `value`

        property exists on this schema).

        '
      properties:
        name:
          type: string
        key_version:
          type: integer
          description: Master-key version that encrypted the value (v1 envelope; bump on rotation).
          examples:
          - 1
        created_by:
          type: string
          description: User id of the original creator (preserved across value updates).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - name
      - key_version
      - created_by
      - created_at
      - updated_at
    SecRevealMetadata:
      type: object
      description: Metadata extended with the decrypted `value` — returned ONLY by the reveal operation, once per call.
      properties:
        name:
          type: string
        key_version:
          type: integer
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        value:
          type: string
          description: The plaintext secret value. Appears exactly here and exactly once.
      required:
      - name
      - key_version
      - created_by
      - created_at
      - updated_at
      - value
    SecResponse:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/SecMetadata'
      required:
      - secret
    SecListResponse:
      type: object
      properties:
        secrets:
          type: array
          description: Metadata-only views ordered by name ASC; empty when the organization has no live secrets.
          items:
            $ref: '#/components/schemas/SecMetadata'
      required:
      - secrets
    SecRevealResponse:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/SecRevealMetadata'
      required:
      - secret
    SecDeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Always true on success.
      required:
      - deleted
    SecErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of SECRET_NOT_FOUND, SECRET_ALREADY_EXISTS, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED,
                FORBIDDEN, INTERNAL_ERROR.
              examples:
              - SECRET_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    ToolErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of INTERNAL_ERROR (500); 401/403 use the shared auth responses.
              examples:
              - INTERNAL_ERROR
            message:
              type: string
    ToolInfo:
      type: object
      description: 'One read-only registry entry. description/input_schema are omitted

        for tools that publish no catalog metadata (they still execute).

        '
      required:
      - name
