# ---- wave-10 fragment: agents-portability.yaml (paths) ----
  /agents/{id}/export:
    get:
      operationId: exportAgent
      tags:
      - agents
      summary: Export one agent as a portable configuration-only bundle (issue #122)
      description: |
        Read operation (agents.read — every role, exactly the GET /agents/{id}
        grant). Returns the portable ExportBundle for one agent of the
        caller's tenant: schema_version "1", the configuration (name,
        description, instructions, model) and the tool-name list. Field order
        is deterministic; the bundle structurally CANNOT carry the agent id,
        organization id, lifecycle status, version ids, timestamps, API keys
        or secret values — only configuration and tool registry NAMES.
        Cross-organization and unknown agents answer 404 with no existence
        leak. Success writes an `agent.exported` audit entry (ids only).
      x-required-permission: agents.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/PortAgentID'
      responses:
        '200':
          description: The portable bundle (configuration only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExportBundle'
        '401':
          $ref: '#/components/responses/PortUnauthorized'
        '403':
          $ref: '#/components/responses/PortForbidden'
        '404':
          description: Unknown agent or agent of another organization (AGENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortErrorEnvelope'
  /agents/import:
    post:
      operationId: importAgent
      tags:
      - agents
      summary: Import a bundle as a NEW agent with fresh identity (issue #122)
      description: |
        Write operation (agents.write, exactly OWNER/ADMIN). Validates the
        bundle and creates a NEW agent in the CALLER's organization. The
        client is NEVER trusted for identity: the typed decode drops unknown
        payload keys (any id, organization_id, created_at or status smuggled
        into the bundle is ignored) and the server assigns a fresh agent id,
        the caller's organization, fresh created_at/updated_at, status DRAFT
        and a fresh initial v1 version.

        Validation (fail-closed, 422 VALIDATION_ERROR with the typed code in
        the message): schema_version must be "1"; name/instructions/model are
        required; instructions are capped at 65536 bytes (INSTRUCTIONS_TOO_LARGE);
        the model must be a KNOWN model id (resolved case-insensitively from
        the platform model catalog — vendor-prefixed ids match their bare
        suffix, UNKNOWN_MODEL); every tool name must exist in the platform
        tool catalog (UNKNOWN_TOOL). Rejected imports leave no agent behind
        and audit nothing. Success writes an `agent.imported` audit entry and
        returns the created agent in the same representation as
        GET /agents/{id} (status DRAFT — walk the issue #106 lifecycle
        documented in api/fragments/agents-lifecycle.yaml before it can
        accept runs).
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExportBundle'
            example:
              schema_version: '1'
              exported_at: '2026-01-01T00:00:00Z'
              agent:
                name: Support Agent
                description: front-line helper
                instructions: be helpful
                model: gpt-4o-mini
                tools: []
      responses:
        '201':
          description: Agent imported with fresh identity in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortAgent'
        '400':
          description: Malformed or missing JSON body (INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortErrorEnvelope'
        '401':
          $ref: '#/components/responses/PortUnauthorized'
        '403':
          $ref: '#/components/responses/PortForbidden'
        '422':
          description: |
            Validation error (VALIDATION_ERROR): unsupported schema_version,
            missing name/instructions/model, oversized instructions, unknown
            model or unknown tool. The message embeds the typed code
            (BUNDLE_SCHEMA_VERSION, NAME_REQUIRED, INSTRUCTIONS_REQUIRED,
            INSTRUCTIONS_TOO_LARGE, MODEL_REQUIRED, UNKNOWN_MODEL,
            UNKNOWN_TOOL). No agent is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortErrorEnvelope'
  /agents/{id}/clone:
    post:
      operationId: cloneAgent
      tags:
      - agents
      summary: Deep-copy one agent within the SAME organization (issue #122)
      description: |
        Write operation (agents.write, exactly OWNER/ADMIN). Deep-copies one
        agent of the caller's tenant: a new agent with a fresh id, the name
        suffixed "-copy", the copied description/instructions/model, fresh
        timestamps, status reset to DRAFT and a fresh initial v1 version. The
        request body is optional and ignored — there is deliberately no
        client-controlled target tenant or name. The source agent is never
        mutated (an ACTIVE source stays ACTIVE). Cross-organization clone
        attempts answer 404 with no existence leak (the source is resolved
        through the org-scoped lookup). Success writes an `agent.cloned`
        audit entry carrying the clone id and the source id.
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/PortAgentID'
      responses:
        '201':
          description: Clone created (DRAFT, "-copy" name suffix) in the caller's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortAgent'
        '401':
          $ref: '#/components/responses/PortUnauthorized'
        '403':
          $ref: '#/components/responses/PortForbidden'
        '404':
          description: Unknown source agent or agent of another organization (AGENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortErrorEnvelope'

# ---- wave-10 fragment: orchestration-exec.yaml (paths) ----
  /orchestration/delegate:
    post:
      operationId: delegateOrchestrationTask
      summary: Delegate a subtask from one agent to another (async)
      description: >
        Creates the delegation ledger record, files the approval when
        require_approval is set, creates the child run and returns the run ids
        immediately (202 pending). Without require_approval the child run
        executes in the background and the outcome is delivered to the
        delegator's inbox as a response message. Failures that occur before
        any child run exists are 422/409/500 with the failed delegation_id
        kept traceable in the ledger.
      x-required-permission: orchestration.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegateRequest" }
      responses:
        "202":
          description: >
            Accepted. status is "pending" (execution queued) or
            "awaiting_approval" (parked at the approval gate; approval_id set,
            never executed until approved).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegateAccepted" }
        "401": { $ref: "#/components/responses/OrchestrationUnauthorized" }
        "403": { $ref: "#/components/responses/OrchestrationForbidden" }
        "409":
          description: >
            APPROVAL_UNAVAILABLE — require_approval was set but the approval
            service is unwired (fail-closed; no child run created).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegationFailedError" }
        "422": { $ref: "#/components/responses/OrchestrationValidation" }
        "500":
          description: >
            DELEGATION_FAILED — a downstream seam (child run creation, inbox
            registration) failed; the failed record stays in the ledger and
            its id is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegationFailedError" }
  /orchestration/messages:
    post:
      operationId: sendOrchestrationMessage
      summary: Send one point-to-point agent-to-agent message
      description: >
        Delivers the message to the target agent's inbox in the caller's
        organization. Synchronous and non-blocking: an unknown target inbox is
        404, a saturated inbox is 409 INBOX_FULL (the caller may retry),
        success is 202 with the delivery confirmation.
      x-required-permission: orchestration.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageSendRequest" }
      responses:
        "202":
          description: Delivered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/OrchestrationUnauthorized" }
        "403": { $ref: "#/components/responses/OrchestrationForbidden" }
        "404": { $ref: "#/components/responses/OrchestrationNotFound" }
        "409":
          description: INBOX_FULL — the target inbox is saturated; nothing was delivered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestrationError" }
        "422": { $ref: "#/components/responses/OrchestrationValidation" }
  /orchestration/agents/{id}/messages:
    get:
      operationId: listOrchestrationAgentMessages
      summary: Read an agent's retained inbox (newest first)
      description: >
        Returns the agent's retained inbox for the caller's organization
        (newest first, optionally limited). The same agent id in another
        organization resolves to a different (possibly absent) inbox.
      x-required-permission: orchestration.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The agent id (org-scoped by the caller's claims).
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 0 }
        description: Maximum number of retained messages to return (0 / omitted = all).
      responses:
        "200":
          description: The retained inbox (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: { type: string }
                  count: { type: integer }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/AgentMessage" }
        "401": { $ref: "#/components/responses/OrchestrationUnauthorized" }
        "403": { $ref: "#/components/responses/OrchestrationForbidden" }
        "404": { $ref: "#/components/responses/OrchestrationNotFound" }
        "422": { $ref: "#/components/responses/OrchestrationValidation" }
  /orchestration/supervisor/run:
    post:
      operationId: runOrchestrationSupervisorTask
      summary: Route one task through the supervisor to a worker agent
      description: >
        Selects a worker (capability_match strategy: a task without
        required_capability routes in configuration order; with one, only
        capable workers are candidates) and delegates through the delegation
        protocol. Completed results are 200; approval-parked results are 202;
        routing exhaustion surfaces the typed supervisor errors. On
        ALL_WORKERS_FAILED the response carries the per-attempt trace
        (worker_agent_id, delegation_id, error) — every attempt stays in the
        delegation ledger.
      x-required-permission: orchestration.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupervisorRunRequest" }
      responses:
        "200":
          description: The delegated task completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorRunResult" }
        "202":
          description: The supervised delegation was parked at the approval gate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorRunResult" }
        "401": { $ref: "#/components/responses/OrchestrationUnauthorized" }
        "403": { $ref: "#/components/responses/OrchestrationForbidden" }
        "409":
          description: >
            NO_WORKERS (no worker routing table is configured for this
            process) or NO_CAPABLE_WORKER (no worker declares the task's
            required_capability).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrchestrationError" }
        "422": { $ref: "#/components/responses/OrchestrationValidation" }
        "502":
          description: ALL_WORKERS_FAILED — every candidate attempt failed; attempts carries the trace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorFailedError" }
  /orchestration/delegations:
    get:
      operationId: listOrchestrationDelegations
      summary: Read the organization's delegation ledger (chain trace)
      description: >
        Chronological delegation records for the caller's organization.
        Optional run_id filter matches records whose parent OR child run
        equals the id (the delegation chain visible from one run).
        Cross-tenant records never appear: the ledger is org-scoped.
      x-required-permission: orchestration.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: run_id
        in: query
        required: false
        schema: { type: string }
        description: Filter to delegations whose parent or child run is this run id.
      responses:
        "200":
          description: The delegation ledger (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegations:
                    type: array
                    items: { $ref: "#/components/schemas/DelegationRecord" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/OrchestrationUnauthorized" }
        "403": { $ref: "#/components/responses/OrchestrationForbidden" }

# ---- wave-10 fragment: workflow-control-flow.yaml (paths) ----
  /workflows/validate:
    post:
      operationId: validateWorkflowDSL
      summary: Validate an ad-hoc workflow DSL document (stateless, nothing persisted)
      description: |
        Pre-save validation (workflows.read, MEMBER+ incl. VIEWER — the
        operation mutates nothing). The body carries a workflow DSL document,
        either wrapped ({"dsl": {...}}) or bare ({"nodes": [...], "edges":
        [...]}). The server runs the full validation rule set: structural
        rules (non-empty graph, unique node ids, known node types, acyclic
        graph with the documented loop-back-edge exemption), per-type config
        requirements, issue #109 control-flow wiring rules (dangling
        condition/switch branch targets, dangling loop bodies / retry
        targets, duplicate ownership) and control-flow expression syntax
        (typed expression errors carry the node id + reason). On success the
        response is 200 {"valid": true}; otherwise 422 with the typed error
        list, using the same shape as POST /workflows/create.
      x-required-permission: workflows.read
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WfValidateRequest'
      responses:
        '200':
          description: The DSL document passes every validation rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WfValidateSuccess'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WfErrorEnvelope'
        '401':
          $ref: '#/components/responses/WfUnauthorized'
        '403':
          $ref: '#/components/responses/WfForbidden'
        '422':
          description: |
            Validation failed. The errors list carries one typed entry per
            rule violation (structural, config, control-flow wiring or
            expression syntax), each with code, message and — where
            applicable — the offending node_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WfValidateFailure'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WfErrorEnvelope'

# ---- wave-10 fragment: tools-catalog.yaml (paths) ----
  /tools:
    get:
      operationId: listRegisteredTools
      summary: List the runtime's registered tools (name, description, input schema)
      description: |
        Read-only catalog of the agent tool registry. The built-in set is
        calculator + http_request (issue #18) plus the six issue #111 tools
        (database_query, search, code_execute, webhook, json_transform,
        file_storage); anything else registered by the serving process is
        listed too. Tools without wired operator seams remain listed but
        fail closed at execution time (e.g. database_query without a
        connection provider returns an error; webhook with an empty
        allow-list denies every target). Tool registrations are runtime
        surface (not tenant data), so the response carries no organization
        fields; access is still authenticated and RBAC-gated.
      x-required-permission: agents.read
      security:
      - bearerToken: []
      - apiKey: []
      tags: [Tools]
      responses:
        '200':
          description: The registered tools, sorted by name; each entry carries the tool's input schema when it publishes one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'
        '401': { description: Missing or invalid credentials (see main spec auth responses). }
        '403': { description: Authenticated but not permitted (agents.read). }
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCatalogErrorEnvelope'

# ---- wave-10 fragment: embeddings.yaml (paths) ----
  /knowledge/search:
    post:
      operationId: searchKnowledge
      tags: [Knowledge]
      summary: Top-k chunk retrieval (keyword | semantic | hybrid)
      description: |
        Scores the caller's org-scoped knowledge chunks against the query and
        returns at most `k` hits (default 5, capped at 50) with citations.
        The retrieval strategy is selected by `mode`:
          * keyword — lexical token-overlap leg only (raw lexical scores).
          * semantic — pgvector cosine leg only over the HNSW-indexed
            embedding_vec column (raw cosine similarities); requires an
            embeddings provider, otherwise degrades to keyword.
          * hybrid (default) — both legs fused with the configured fusion
            algorithm and weights; chunks hit by both legs rank highest.
        When the vector leg is unavailable (pgvector not installed, provider
        offline, embedding/search failure, zero vector matches) semantic and
        hybrid degrade gracefully to the keyword leg — the response shape is
        identical either way. Results are deduplicated by chunk id and
        ordered deterministically (score desc, then chunk id, then ordinal).
      x-required-permission: agents.read
      x-contract-permission: knowledge:read
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbSearchRequest'
            example:
              query: How do budgets roll over at period end?
              k: 5
              mode: hybrid
              weights:
                keyword_weight: 0.5
                vector_weight: 0.5
                fusion: weights
      responses:
        '200':
          description: Top-k chunk hits; empty `results` when nothing matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbSearchResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbErrorEnvelope'
        '401':
          $ref: '#/components/responses/EmbUnauthorized'
        '403':
          $ref: '#/components/responses/EmbForbidden'
        '422':
          description: Validation failed (query required, unknown mode).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbErrorEnvelope'
        '500':
          description: Unexpected server failure (e.g. store unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbErrorEnvelope'

# ---- wave-10 fragment: tracing.yaml (paths) ----
  /runs/{id}/trace:
    get:
      operationId: getRunTrace
      summary: Get the W3C trace id of a run's distributed execution trace
      description: |
        Returns the trace id of the distributed trace that carries the run's
        execution spans, for lookup in the tracing backend. Requires the
        runs.read permission (any base role). Answers 404
        trace_not_available when the run is unknown, foreign-org, or no
        trace was recorded for it in this process (tracing disabled,
        registry eviction, cross-process start).
      x-required-permission: runs.read
      security:
        - bearerToken: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Run id (as returned by POST /runs).
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The run's trace id (the run exists in the caller's org and a trace was recorded for it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrRunTraceResponse'
              examples:
                happy:
                  summary: A run with a recorded execution trace
                  value:
                    run_id: 8b0e6f9a-2b0d-4f0e-8a58-6f9b2c3d4e5f
                    trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrErrorEnvelope'
        '403':
          description: Authenticated but lacking the runs.read permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrErrorEnvelope'
        '404':
          description: Unknown run, foreign-org run, or no trace recorded for it in this process (error.code trace_not_available — identical shape for all three, no existence leak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrErrorEnvelope'

# ---- wave-10 fragment: run-lifecycle.yaml (paths) ----
  /runs/{id}/pause:
    post:
      operationId: pauseRun
      tags: [run-control]
      summary: Pause a run (idempotent)
      description: |
        Transitions a pending/queued/running/waiting_approval run to
        `paused` (RUNNING first parks the in-flight executor at its current
        step boundary; partial results and checkpoints are preserved).
        Pausing an already-paused run is an idempotent no-op success;
        pausing a completed/failed/cancelled/timed-out run is a 409
        TransitionError. A resumed run continues from the latest durable
        checkpoint (issue #115 checkpointing).
      x-required-permission: runs.control
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
        - $ref: '#/components/parameters/RunLifecycleRunID'
      responses:
        '200':
          description: The updated run (status `paused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLifecycleRunResponse'
        '401': { $ref: '#/components/responses/RunLifecycleUnauthorized' }
        '403': { $ref: '#/components/responses/RunLifecycleForbidden' }
        '404': { $ref: '#/components/responses/RunLifecycleNotFound' }
        '409':
          description: Illegal transition (terminal or cancelling run) or a lost optimistic race.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RunLifecycleErrorEnvelope'
                  - $ref: '#/components/schemas/RunLifecycleTransitionError'
        '500': { $ref: '#/components/responses/RunLifecycleServerError' }
  /runs/{id}/resume:
    post:
      operationId: resumeRun
      tags: [run-control]
      summary: Resume a paused run (idempotent)
      description: |
        Transitions a paused run back to `queued` and re-enqueues the
        agent.run task — the queue is the only execution trigger — so the
        run continues from its latest checkpoint. Only `paused` runs can be
        resumed: resuming an already-queued/running run is an idempotent
        no-op success, while runs in any other state (including
        waiting_approval — the approval decision is the only gate out) are
        a 409 TransitionError.
      x-required-permission: runs.control
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
        - $ref: '#/components/parameters/RunLifecycleRunID'
      responses:
        '200':
          description: The updated run (status `queued`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLifecycleRunResponse'
        '401': { $ref: '#/components/responses/RunLifecycleUnauthorized' }
        '403': { $ref: '#/components/responses/RunLifecycleForbidden' }
        '404': { $ref: '#/components/responses/RunLifecycleNotFound' }
        '409':
          description: Illegal transition (not resumable) or a lost optimistic race.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RunLifecycleErrorEnvelope'
                  - $ref: '#/components/schemas/RunLifecycleTransitionError'
        '500': { $ref: '#/components/responses/RunLifecycleServerError' }
  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      tags: [run-control]
      summary: Cancel a run (idempotent, two-phase for in-flight runs)
      description: |
        Cancels a run. A run that is currently RUNNING first moves to
        `cancelling` — the graceful-unwind phase: the executor finishes the
        current step and records the partial results, then confirms
        `cancelled` — so the 200 response for an in-flight run reports
        status `cancelling`. Queued/pending runs cancel directly;
        re-cancelling a cancelled (or already-cancelling) run is an
        idempotent no-op success; cancelling a completed/failed/timed-out
        run is a 409 TransitionError.
      x-required-permission: runs.control
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
        - $ref: '#/components/parameters/RunLifecycleRunID'
      responses:
        '200':
          description: The updated run (status `cancelled`, or `cancelling` for an in-flight run awaiting its graceful unwind).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLifecycleRunResponse'
        '401': { $ref: '#/components/responses/RunLifecycleUnauthorized' }
        '403': { $ref: '#/components/responses/RunLifecycleForbidden' }
        '404': { $ref: '#/components/responses/RunLifecycleNotFound' }
        '409':
          description: Illegal transition (terminal run) or a lost optimistic race.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RunLifecycleErrorEnvelope'
                  - $ref: '#/components/schemas/RunLifecycleTransitionError'
        '500': { $ref: '#/components/responses/RunLifecycleServerError' }

# ---- wave-10 fragment: nats-core.yaml (paths) ----
  /messaging/dlq:
    get:
      operationId: listMessagingDeadLetters
      summary: List retained dead letters from agentos.dlq (OWNER/ADMIN/MEMBER/VIEWER)
      description: |
        Inspects the messaging plane's dead-letter subject (agentos.dlq),
        oldest-first, bounded by `limit` (clamped server-side; limit<=0 lists
        every retained entry). Each entry carries the original subject, the
        best-effort run/task identity extracted from run-dispatch payloads,
        the last handler error, the delivery count at dead-letter time and
        the original payload base64-encoded. Memory-effective mode
        (AGENTOS_MESSAGING unset or =memory) has no retained log: 409.
      x-required-permission: runs.read (OWNER/ADMIN/MEMBER/VIEWER)
      security:
        - bearerToken: []
        - apiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum entries returned (<=0 or absent = unbounded).
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 50
      responses:
        '200':
          description: The retained dead letters (oldest-first; empty array when the DLQ is drained).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NcDLQEntry'
              example:
                - sequence: 1
                  subject: agentos.runs.create
                  task_id: agent.run-2026-09-10T12-00-00-000000000Z
                  run_id: 8b0e6f9a-2b0d-4f0e-8a58-6f9b2c3d4e5f
                  organization_id: 6f1c9e52-1c76-4a2f-9a86-9f6d4d3e8a01
                  error: handler boom
                  attempts: 4
                  dead_lettered_at: '2026-09-10T12:04:00Z'
                  payload_base64: eyJ0YXNrX3R5cGUiOiJhZ2VudC5ydW4iLCJydW5faWQiOiI4YjBlNmY5YSJ9
        '409':
          description: Memory-effective messaging mode (no retained log; the messaging DLQ does not exist).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NcErrorEnvelope'
        '401':
          $ref: '#/components/responses/NcUnauthorized'
        '403':
          $ref: '#/components/responses/NcForbidden'
  /messaging/dlq/{seq}/requeue:
    post:
      operationId: requeueMessagingDeadLetter
      summary: Requeue one dead letter back onto its original subject (OWNER/ADMIN)
      description: |
        Republishes the dead letter's original payload (base64-decoded,
        verbatim) onto its original subject and consumes the DLQ entry
        (JetStream message delete). The republished message is a fresh
        delivery: consumers treat it like any new message, so the underlying
        fault must be fixed first. Unknown or already-requeued sequences
        answer 404 (an already-requeued entry no longer exists); requeue
        republishes before deleting, so a delete failure leaves the entry in
        place and a retry re-publishes (idempotence note: a duplicate
        republish is preferred over losing the dead letter). Memory-effective
        mode: 409. The operation writes a queue.task_requeued audit row on
        the queue-ops seam when the requeued subject is a run dispatch.
      x-required-permission: queue.manage (OWNER/ADMIN; MEMBER/VIEWER denied 403)
      security:
        - bearerToken: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/NcSeq'
      responses:
        '200':
          description: The consumed dead-letter entry (it is no longer retained).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NcDLQEntry'
        '404':
          description: Unknown sequence (or already requeued — the entry no longer exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NcErrorEnvelope'
        '409':
          description: Memory-effective messaging mode (no retained log).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NcErrorEnvelope'
        '401':
          $ref: '#/components/responses/NcUnauthorized'
        '403':
          $ref: '#/components/responses/NcForbidden'
  /messaging/replay:
    post:
      operationId: replayMessagingSubject
      summary: Replay a retained dispatch/coordination subject from a timestamp (OWNER/ADMIN)
      description: |
        Re-publishes every retained message of `subject` published at or
        after `from` (INCLUSIVE, oldest-first) back onto that same subject —
        for redriving a dispatch window after fixing a consumer fault or
        recovering from a lost consumer cursor. Only the messaging-plane
        subjects agentos.runs.create and agentos.workflow.node.completed are
        replayable: the DLQ itself is refused (400 — replaying it would loop
        dead letters back into the DLQ) and arbitrary subjects are refused so
        the admin surface can never inject traffic outside the plane. The
        response reports how many retained entries matched and were
        re-published. Memory-effective mode: 409.
      x-required-permission: queue.manage (OWNER/ADMIN; MEMBER/VIEWER denied 403)
      security:
        - bearerToken: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NcReplayRequest'
            example:
              subject: agentos.runs.create
              from: '2026-09-10T12:00:00Z'
      responses:
        '200':
          description: The replay report (replayed counts every re-published entry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NcReplayResult'
              example:
                subject: agentos.runs.create
                from: '2026-09-10T12:00:00Z'
                replayed: 2
        '400':
          description: The subject is not replayable (DLQ or outside the messaging plane).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NcErrorEnvelope'
        '409':
          description: Memory-effective messaging mode (no retained log).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NcErrorEnvelope'
        '401':
          $ref: '#/components/responses/NcUnauthorized'
        '403':
          $ref: '#/components/responses/NcForbidden'

# ---- wave-10 fragment: rate-limits.yaml (paths) ----
  /rate-limits:
    get:
      operationId: listRateLimits
      summary: List the caller's organization's stored rate-limit rows (org defaults + subject rows)
      description: |
        Read operation (limiter.read — every role; limits are configuration,
        not credentials). Returns every stored row of the caller's org
        ordered deterministically, each carrying an `org_default` flag so
        callers can tell the two resolution tiers apart without re-deriving
        them. A scope absent from the list is unlimited by omission.
      x-required-permission: limiter.read
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: The org's rows (possibly empty — every scope unlimited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitListResponse'
        '401':
          $ref: '#/components/responses/RateLimitsUnauthorized'
        '403':
          $ref: '#/components/responses/RateLimitsForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
  /rate-limits/{scope}:
    put:
      operationId: upsertRateLimitOrgDefault
      summary: Upsert the scope's ORG DEFAULT limit row (subject_id null)
      description: |
        Write operation (limiter.write, OWNER/ADMIN). Body carries the
        dimension values; omitted dimensions default to 0 (unlimited). The
        org scope rejects any subject id (422). An enabled row must set at
        least one positive dimension (422). Upsert is idempotent on
        (org, scope, subject) and takes effect on the NEXT check (the
        resolver cache is invalidated on write).
      x-required-permission: limiter.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/RateLimitsScope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitUpsertRequest'
      responses:
        '200':
          description: Row stored (read-back of the normalized, timestamped row).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitUpsertResponse'
        '400':
          description: Malformed JSON body (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '401':
          $ref: '#/components/responses/RateLimitsUnauthorized'
        '403':
          $ref: '#/components/responses/RateLimitsForbidden'
        '422':
          description: |
            Validation error: unknown scope, a subject id on the org scope,
            a negative dimension, or an all-zero enabled row (error.code
            VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
    delete:
      operationId: deleteRateLimitOrgDefault
      summary: Delete the scope's ORG DEFAULT limit row
      description: |
        Write operation (limiter.write, OWNER/ADMIN). Removes the org
        default so the scope resolves to unlimited (or to the surviving
        subject rows). Deleting an absent row answers 404 NOT_FOUND.
      x-required-permission: limiter.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/RateLimitsScope'
      responses:
        '200':
          description: Row deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitDeleteResponse'
        '401':
          $ref: '#/components/responses/RateLimitsUnauthorized'
        '403':
          $ref: '#/components/responses/RateLimitsForbidden'
        '404':
          description: No row for (org, scope, subject) (error.code NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '422':
          description: Unknown scope (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
  /rate-limits/{scope}/{subject_id}:
    put:
      operationId: upsertRateLimitSubject
      summary: Upsert a subject-specific limit row (per agent / tool / model)
      description: |
        Write operation (limiter.write, OWNER/ADMIN). Overrides the scope's
        org default for one subject (agent id, tool id or model name). An
        enabled=false row is the documented per-subject OPT-OUT: it
        suppresses the org default for that subject instead of re-throttling
        it. The org scope rejects subject rows (422).
      x-required-permission: limiter.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/RateLimitsScope'
      - $ref: '#/components/parameters/RateLimitsSubjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitUpsertRequest'
      responses:
        '200':
          description: Row stored (read-back of the normalized, timestamped row).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitUpsertResponse'
        '400':
          description: Malformed JSON body (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '401':
          $ref: '#/components/responses/RateLimitsUnauthorized'
        '403':
          $ref: '#/components/responses/RateLimitsForbidden'
        '422':
          $ref: '#/components/responses/RateLimitsValidation'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
    delete:
      operationId: deleteRateLimitSubject
      summary: Delete a subject-specific limit row
      description: |
        Write operation (limiter.write, OWNER/ADMIN). The subject falls back
        to the scope's org default (or unlimited when absent). Deleting an
        absent row answers 404 NOT_FOUND.
      x-required-permission: limiter.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/RateLimitsScope'
      - $ref: '#/components/parameters/RateLimitsSubjectID'
      responses:
        '200':
          description: Row deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitDeleteResponse'
        '401':
          $ref: '#/components/responses/RateLimitsUnauthorized'
        '403':
          $ref: '#/components/responses/RateLimitsForbidden'
        '404':
          description: No row for (org, scope, subject) (error.code NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '422':
          description: Unknown scope (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorEnvelope'

# ---- wave-10 fragment: batch.yaml (paths) ----
  /batch/runs:
    post:
      operationId: createBatchRuns
      summary: Run one agent over N inputs or N agents over one input (batch)
      description: >
        Body is either {agent_id, inputs[]} (one agent, one item per input;
        item ref is the input index) or {agent_ids[], input} (one item per
        agent, shared input). Every item creates a REAL run
        (CreateRunCtx) and enqueues the same "agent.run" task the single-run
        path uses, then blocks until the batch settles.
      x-required-permission: batch.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRunsRequest" }
      responses:
        "200":
          description: Every item succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchRunsResponse" }
        "207":
          description: >
            Multi-Status. Partial failure: at least one item failed or was
            cancelled; the body carries the same batch record plus the
            per-item error strings. run_ids contains ONLY the succeeded
            items' run ids, in submission order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchRunsResponse" }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "422": { $ref: "#/components/responses/BatchValidation" }
        "408":
          description: >
            BATCH_WAIT_INTERRUPTED — the wait was interrupted (client
            disconnect/timeout); the batch keeps running and the client can
            re-attach via GET /batch/{id} or GET /batch/{id}/events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchErrorEnvelope" }

  /batch/workflows/{id}/trigger:
    post:
      operationId: triggerBatchWorkflow
      summary: Trigger one workflow execution per input (batch)
      description: >
        The workflow target is resolved ONCE before any item runs (unknown
        workflow -> 404); empty inputs -> 422. Each item expands the
        workflow DAG for one input and reports its workflow_run_id.
      x-required-permission: batch.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: "#/components/parameters/BatchWorkflowID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchWorkflowTriggerRequest" }
      responses:
        "200":
          description: Every item succeeded (workflow_run_ids in submission order).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchWorkflowTriggerResponse" }
        "207":
          description: Partial failure — items carry per-item errors; workflow_run_ids lists succeeded executions only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchWorkflowTriggerResponse" }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "404":
          description: >
            NOT_FOUND — the workflow does not exist in the caller's
            organization (atomic pre-flight; nothing ran).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchErrorEnvelope" }
        "422": { $ref: "#/components/responses/BatchValidation" }

  /batch/agents/update:
    post:
      operationId: updateBatchAgents
      summary: Apply one validated patch to N agents (batch)
      description: >
        The patch is validated ONCE for the whole request (422 before any
        item) and applied per agent with per-item results. Unknown agents
        are failed items, never a batch abort.
      x-required-permission: batch.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchAgentUpdateRequest" }
      responses:
        "200":
          description: Every agent patched (updated_agent_ids in submission order).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchAgentUpdateResponse" }
        "207":
          description: Partial failure — unknown agents surface as failed items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchAgentUpdateResponse" }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "422": { $ref: "#/components/responses/BatchValidation" }

  /batch/agents/deploy:
    post:
      operationId: deployBatchAgents
      summary: Create one deployment per agent (batch)
      description: >
        Uses the exact single-deploy call (CreateDeploymentCtx) per item. An
        explicit version deploys every agent at that version; when omitted,
        each item resolves the agent's latest published version (an agent
        without one is a failed item). environment defaults to production.
      x-required-permission: batch.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchAgentDeployRequest" }
      responses:
        "200":
          description: Every deployment created (deployment_ids in submission order).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchAgentDeployResponse" }
        "207":
          description: Partial failure — agents without a published version surface as failed items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchAgentDeployResponse" }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "422": { $ref: "#/components/responses/BatchValidation" }

  /batch/runs/cancel:
    post:
      operationId: cancelBatchRuns
      summary: Cancel N runs (batch)
      description: >
        The single-run cancel semantics (idempotent for already-cancelled
        runs, invalid-transition for terminal ones) applied per item.
      x-required-permission: batch.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRunCancelRequest" }
      responses:
        "200":
          description: Every run cancelled (cancelled_run_ids in submission order).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchRunCancelResponse" }
        "207":
          description: Partial failure — terminal runs surface as failed items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchRunCancelResponse" }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "422": { $ref: "#/components/responses/BatchValidation" }

  /batch/secrets:
    post:
      operationId: createBatchSecrets
      summary: Create N encrypted secrets (batch)
      description: >
        One encrypted secret per item through the secrets service. Values
        exist ONLY in the request body — responses carry the name and the
        envelope key version, never the value.
      x-required-permission: batch.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchSecretsRequest" }
      responses:
        "200":
          description: Every secret created (`created` lists the secret names).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchSecretsResponse" }
        "207":
          description: Partial failure — duplicate/invalid names surface as failed items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchSecretsResponse" }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "422": { $ref: "#/components/responses/BatchValidation" }

  /batch/{id}:
    get:
      operationId: getBatch
      summary: Poll one batch record (per-item states, summary, timestamps)
      description: >
        The polling surface for a submitted batch. A batch from another
        organization reads as not-found (404), never 403.
      x-required-permission: batch.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: "#/components/parameters/BatchID"
      responses:
        "200":
          description: The batch record (any status).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchRecord" }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "404":
          description: NOT_FOUND — unknown id or a batch owned by another organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchErrorEnvelope" }

  /batch/{id}/events:
    get:
      operationId: streamBatchEvents
      summary: SSE progress stream for one batch
      description: >
        Additive "batch.updated" progress events on the existing stream seam
        (text/event-stream), keyed by the batch id: {batch_id, completed,
        total, item_states}. The org-scope check runs before the stream is
        opened.
      x-required-permission: batch.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: "#/components/parameters/BatchID"
      responses:
        "200":
          description: text/event-stream of batch.updated progress events.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "404":
          description: NOT_FOUND — unknown id or a batch owned by another organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchErrorEnvelope" }
        "503":
          description: STREAMING_UNAVAILABLE — the event stream service is not wired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchErrorEnvelope" }

  /batch/{id}/cancel:
    post:
      operationId: cancelBatch
      summary: Cancel a running batch (idempotent on terminal batches)
      description: >
        Cancels the batch: in-flight items' contexts fire and pending items
        never run. Idempotent on terminal batches. Audit-logged
        (batch.cancelled) best-effort.
      x-required-permission: batch.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: "#/components/parameters/BatchID"
      responses:
        "200":
          description: The (cancelled) batch record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchRecord" }
        "401": { $ref: "#/components/responses/BatchUnauthorized" }
        "403": { $ref: "#/components/responses/BatchForbidden" }
        "404":
          description: NOT_FOUND — unknown id or a batch owned by another organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchErrorEnvelope" }

