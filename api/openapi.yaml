                  type: status
                  name: status.changed
                  payload:
                    status: COMPLETED
                    output: The result of 2+2 is 4
                    ts: '2025-01-01T12:00:05Z'
                  created_at: '2025-01-01T12:00:05.987654321Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Run ID path segment missing or malformed.
          content:
            text/plain:
