        canceled_at:
          type: string
          format: date-time
          nullable: true
          description: Present once the subscription is canceled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BillSubscriptionResponse:
      type: object
      required:
      - subscription
      properties:
        subscription:
          $ref: '#/components/schemas/BillSubscription'
    BillQuotaStatus:
      type: object
      required:
      - subscription_id
      - status
      - included_runs
      - unlimited
      - consumed_runs
      - remaining_runs
      - exceeded
      - period_start
      - period_end
      properties:
        subscription_id:
          type: string
        status:
          type: string
          enum:
          - trial
          - active
          - past_due
          - canceled
          description: The subscription status the quota is reported against.
        included_runs:
          type: integer
          description: plan.included_quota (0 = unlimited).
        unlimited:
          type: boolean
        consumed_runs:
          type: integer
          description: Metered runs inside the current period window.
        remaining_runs:
          type: integer
          description: max(0, included_runs - consumed_runs); 0 when unlimited.
        exceeded:
          type: boolean
          description: True only when consumed_runs > included_runs.
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
    BillSubscriptionWithQuota:
      type: object
      required:
      - subscription
      - quota
      properties:
        subscription:
          $ref: '#/components/schemas/BillSubscription'
        quota:
          $ref: '#/components/schemas/BillQuotaStatus'
    BillSubscribeRequest:
      type: object
      required:
      - plan_id
      properties:
        plan_id:
          type: string
          description: The plan to subscribe to (must exist).
    BillCancelRequest:
      type: object
      properties:
        immediate:
          type: boolean
          default: false
          description: 'true cancels NOW; false (default) schedules the cancel for the end

            of the running period.

            '
    BillInvoiceLine:
      type: object
      required:
      - id
      - source
      - quantity
      - amount_cents
      properties:
        id:
          type: string
        source:
          type: string
          enum:
          - run
          - eval
          - overage
          description: 'run: model-bucketed usage priced from the cost aggregates; eval:

            evaluation metering (schema-supported seam); overage: derived line

            pricing runs beyond the included quota.

            '
        description:
          type: string
        quantity:
          type: integer
          description: Metered unit count of the line (runs).
        amount_cents:
          type: integer
          minimum: 0
        refs:
          type: object
          additionalProperties: true
          nullable: true
          description: 'Pricing provenance: {"model": "..."} for run lines;

            {"included_quota", "overage_run_rate_cents", "metered_runs"} for

            overage lines.

            '
        created_at:
          type: string
          format: date-time
    BillInvoice:
      type: object
      required:
      - id
      - subscription_id
      - period_start
      - period_end
      - subtotal_cents
      - currency
      - status
      properties:
        id:
          type: string
        subscription_id:
          type: string
        period_start:
          type: string
          format: date-time
          description: Half-open invoiced window [period_start, period_end).
        period_end:
          type: string
          format: date-time
        subtotal_cents:
          type: integer
          minimum: 0
          description: Exact sum of the line amounts.
        currency:
          type: string
          description: Copied from the plan at generation time.
        status:
          type: string
          enum:
          - open
          - paid
          - void
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BillInvoiceList:
      type: object
      required:
      - invoices
      properties:
        invoices:
          type: array
          description: Newest first; line details omitted.
          items:
            $ref: '#/components/schemas/BillInvoice'
    BillInvoiceResponse:
      type: object
      required:
      - invoice
      properties:
        invoice:
          allOf:
          - $ref: '#/components/schemas/BillInvoice'
          - type: object
            required:
            - lines
            properties:
              lines:
                type: array
                items:
                  $ref: '#/components/schemas/BillInvoiceLine'
    BillErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Machine code: INVALID_REQUEST / VALIDATION_ERROR (400),

                UNAUTHORIZED (401), PLAN_NOT_FOUND / NO_SUBSCRIPTION /

                INVOICE_NOT_FOUND (404), CONFLICT / INVALID_STATE (409),

                BILLING_UNAVAILABLE (503), INTERNAL_ERROR (500).

                '
            message:
              type: string
    SecCreateRequest:
      type: object
      description: Create payload. The plaintext value is consumed at seal time and never echoed, logged, or listed afterwards.
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$
          description: Secret name, unique per organization among live secrets.
          examples:
          - OPENAI_API_KEY
        value:
          type: string
          maxLength: 65536
          description: Plaintext secret value (sealed with AES-256-GCM before storage; max 64 KiB).
      required:
      - name
      - value
    SecMetadata:
      type: object
      description: 'Value-free metadata projection. This is the ONLY shape list endpoints

        return; the plaintext value is structurally absent (no `value`

        property exists on this schema).

        '
      properties:
        name:
          type: string
        key_version:
          type: integer
          description: Master-key version that encrypted the value (v1 envelope; bump on rotation).
          examples:
          - 1
        created_by:
          type: string
          description: User id of the original creator (preserved across value updates).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - name
      - key_version
      - created_by
      - created_at
      - updated_at
    SecRevealMetadata:
      type: object
      description: Metadata extended with the decrypted `value` — returned ONLY by the reveal operation, once per call.
      properties:
        name:
          type: string
        key_version:
          type: integer
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        value:
          type: string
          description: The plaintext secret value. Appears exactly here and exactly once.
      required:
      - name
      - key_version
      - created_by
      - created_at
      - updated_at
      - value
    SecResponse:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/SecMetadata'
      required:
      - secret
    SecListResponse:
      type: object
      properties:
        secrets:
          type: array
          description: Metadata-only views ordered by name ASC; empty when the organization has no live secrets.
          items:
            $ref: '#/components/schemas/SecMetadata'
      required:
      - secrets
    SecRevealResponse:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/SecRevealMetadata'
      required:
      - secret
    SecDeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Always true on success.
      required:
      - deleted
    SecErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of SECRET_NOT_FOUND, SECRET_ALREADY_EXISTS, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED,
                FORBIDDEN, INTERNAL_ERROR.
              examples:
              - SECRET_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    ToolErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of INTERNAL_ERROR (500); 401/403 use the shared auth responses.
              examples:
              - INTERNAL_ERROR
            message:
              type: string
    ToolInfo:
      type: object
      description: 'One read-only registry entry. description/input_schema are omitted

        for tools that publish no catalog metadata (they still execute).

        '
      required:
      - name
      properties:
        name:
          type: string
          description: Registry key the model uses in tool calls (e.g. "calculator").
        description:
          type: string
          description: Human-readable summary of what the tool does.
        input_schema:
          type: object
          description: JSON-Schema-style contract the tool arguments must satisfy.
          additionalProperties: true
    ToolListResponse:
      type: object
      required:
      - tools
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
    AuditErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of INVALID_REQUEST (bad limit), INVALID_CURSOR (malformed cursor), INTERNAL_ERROR.
              examples:
              - INVALID_CURSOR
            message:
              type: string
    AuditEvent:
      type: object
      description: One append-only audit entry (tenant stays server-side; organization_id is implied by the caller's claims).
      required:
      - id
      - actor
      - action
      - created_at
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
          description: Dotted event name (e.g. "agent.created", "run.failed").
        resource:
          type: string
          description: Resource reference the action applies to (e.g. "agents/a-1"); omitted when empty.
        metadata:
          type: object
          description: Free-form action context; omitted when empty.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AuditEventsResponse:
      type: object
      required:
      - events
      - next_cursor
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          description: 'Opaque continuation token for the next page; the empty string

            means the trail is exhausted.

            '
    MktPublishRequest:
      type: object
      required:
      - agent_id
      - name
      properties:
        agent_id:
          type: string
          description: Agent (in the caller's org) to snapshot into the listing.
        name:
          type: string
          description: Display name of the listing.
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        signature:
          type: string
          format: byte
          description: Base64 detached Ed25519 signature over the canonical manifest bytes (see GET /marketplace/listings/{slug}/provenance).
            Required together with signing_key_id for a signed publish; both omitted = legacy unsigned publish (install-time
            policy applies).
        signing_key_id:
          type: string
          description: A signing key registered via POST /marketplace/keys of the publisher org. Required together with signature
            for a signed publish.
    MktListing:
      type: object
      properties:
        id:
          type: string
        publisher_org_id:
          type: string
        publisher_user_id:
          type: string
        source_agent_id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - draft
          - published
          - unlisted
        download_count:
          type: integer
        version_snapshot:
          description: Snapshot of the agent configuration at publish time.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MktListingEnvelope:
      type: object
      required:
      - listing
      properties:
        listing:
          $ref: '#/components/schemas/MktListing'
    MktListingPage:
      type: object
      required:
      - listings
      properties:
        listings:
          type: array
          items:
            $ref: '#/components/schemas/MktListing'
        next_cursor:
          type: string
          description: Empty string when the page is the last one.
    MktInstallResponse:
      type: object
      required:
      - listing
      - agent
      properties:
        listing:
          $ref: '#/components/schemas/MktListing'
        agent:
          type: object
          properties:
            id:
              type: string
            organization_id:
              type: string
            name:
              type: string
            description:
              type: string
            instructions:
              type: string
            model:
              type: string
            status:
              type: string
            created_at:
              type: string
              format: date-time
    MktError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    ConConfig:
      type: object
      description: 'Non-secret request configuration. Contains header TEMPLATES and auth

        style parameters only — secret values are structurally absent (the

        sensitive material lives in the secrets store behind secret_ref).

        '
      properties:
        auth_style:
          type: string
          enum:
          - none
          - bearer
          - basic
          - api_key_header
          description: 'bearer injects "Authorization: Bearer <secret>"; basic injects

            "Authorization: Basic base64(<username>:<secret>)"; api_key_header

            injects "<api_key_header|X-API-Key>: <api_key_prefix><secret>".

            none injects nothing (secret_ref is not consumed).

            '
        headers:
          type: object
          additionalProperties:
            type: string
          description: Static header templates merged into every built request (per-request headers win over these; injected
            auth headers win over both). CR/LF is rejected.
        api_key_header:
          type: string
          description: Header name for the api_key_header style (defaults to X-API-Key).
        api_key_prefix:
          type: string
          description: Prefix prepended to the resolved secret for the api_key_header style.
        username:
          type: string
          description: Basic-auth username (the password comes from the secret referenced by secret_ref).
    ConCreateRequest:
      type: object
      description: Create payload. Never carries secret values — secret_ref is a NAME reference into the secrets store.
      properties:
        name:
          type: string
          maxLength: 255
          description: Connector name, unique per organization.
        type:
          type: string
          enum:
          - webhook
          - http
        base_url:
          type: string
          format: uri
          description: Absolute http(s) origin every request is built from (base path is preserved when joining paths).
        auth_style:
          type: string
          enum:
          - none
          - bearer
          - basic
          - api_key_header
        headers:
          type: object
          additionalProperties:
            type: string
        api_key_header:
          type: string
        api_key_prefix:
          type: string
        username:
          type: string
        secret_ref:
          type: string
          description: NAME of a secret in the secrets store; resolved only at request-build time.
        status:
          type: string
          enum:
          - active
          - disabled
          default: active
      required:
      - name
      - type
      - base_url
    ConConnector:
      type: object
      description: Value-free connector projection. There is no field that could carry a secret value — secret_ref is a name
        reference.
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - webhook
          - http
        base_url:
          type: string
        config:
          $ref: '#/components/schemas/ConConfig'
        secret_ref:
          type: string
          description: Secret NAME reference ("" when the connector needs no secret).
        status:
          type: string
          enum:
          - active
          - disabled
        last_check_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the last health-check probe (null when never probed).
        last_check_status:
          type: string
          enum:
          - ok
          - error
          - ''
          description: Outcome of the last probe ("" when never probed).
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - type
      - base_url
      - config
      - secret_ref
      - status
      - last_check_at
      - last_check_status
      - created_at
      - updated_at
    ConTestResult:
      type: object
      description: Outcome of one live health-check probe (secret values never included).
      properties:
        connector_id:
          type: string
        status:
          type: string
          enum:
          - ok
          - error
        status_code:
          type: integer
          description: Upstream HTTP status (0 when no response was received).
        latency_ms:
          type: integer
        error:
          type: string
          description: Probe failure detail (absent on success; names the secret NAME on resolution failures, never a value).
        checked_at:
          type: string
          format: date-time
      required:
      - connector_id
      - status
      - status_code
      - latency_ms
      - checked_at
    ConResponse:
      type: object
      properties:
        connector:
          $ref: '#/components/schemas/ConConnector'
      required:
      - connector
    ConListResponse:
      type: object
      properties:
        connectors:
          type: array
          description: Value-free projections ordered by name ASC; empty when the organization has no connectors.
          items:
            $ref: '#/components/schemas/ConConnector'
      required:
      - connectors
    ConTestResponse:
      type: object
      properties:
        test:
          $ref: '#/components/schemas/ConTestResult'
      required:
      - test
    ConDeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Always true on success.
      required:
      - deleted
    ConErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of CONNECTOR_NOT_FOUND, CONNECTOR_ALREADY_EXISTS, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED,
                FORBIDDEN, INTERNAL_ERROR.
              examples:
              - CONNECTOR_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    SsoError:
      type: object
      description: Shared structured error envelope.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable code (ORG_NOT_FOUND, SSO_NOT_CONFIGURED, SSO_STATE_INVALID, SSO_LOGIN_FAILED,
                ACCOUNT_DISABLED, SSO_EMAIL_FOREIGN_ORG, SSO_SUBJECT_MISMATCH, SSO_UPSTREAM_ERROR, ...).
            message:
              type: string
    SsoUnauthorized:
      description: Missing or invalid platform credentials (session/API key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SsoError'
    SsoLoginResponse:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
          description: The platform's existing HMAC session token (same format as POST /auth/login).
        user:
          type: object
          description: Credential-free view of the logged-in identity.
          required:
          - id
          - email
          - role
          - new
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              description: Platform role (JIT-provisioned users default to MEMBER unless the config overrides default_role).
            new:
              type: boolean
              description: True when this login freshly JIT-provisioned a passwordless identity.
    ScimTokenCreated:
      type: object
      required:
      - token
      - secret
      properties:
        token:
          type: object
          description: Credential metadata (the stored hash is deliberately NOT included).
          required:
          - id
          - organization_id
          - created_by
          - created_at
          properties:
            id:
              type: string
            organization_id:
              type: string
            created_by:
              type: string
            created_at:
              type: string
              format: date-time
        secret:
          type: string
          description: 'The plaintext `scim_<64 hex>` bearer credential, shown EXACTLY

            ONCE. Store it now; only its SHA-256 hash is persisted.

            '
    ScimUserEmail:
      type: object
      required:
      - value
      - primary
      properties:
        value:
          type: string
          format: email
        primary:
          type: boolean
    ScimResourceMeta:
      type: object
      required:
      - resourceType
      - created
      - lastModified
      - location
      properties:
        resourceType:
          type: string
        created:
          type: string
          description: SCIM dateTime (ISO-8601).
        lastModified:
          type: string
          description: SCIM dateTime (ISO-8601).
        location:
          type: string
          description: Canonical relative resource path (/scim/v2/Users/{id}).
    ScimUser:
      type: object
      description: 'RFC 7643 core user projection. Deliberate omissions (never invented

        here): name/displayName (no platform columns), password/credential

        material (SCIM users stay invite-pending), roles/groups (directory

        sync never mints privilege — SCIM users are pinned MEMBER).

        '
      required:
      - schemas
      - id
      - userName
      - active
      - meta
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
          - urn:ietf:params:scim:schemas:core:2.0:User
        id:
          type: string
        userName:
          type: string
          format: email
          description: The login email (lowercased, immutable).
        active:
          type: boolean
          description: 'Lifecycle flag. active=false blocks password login platform-wide.

            '
        emails:
          type: array
          items:
            $ref: '#/components/schemas/ScimUserEmail'
        meta:
          $ref: '#/components/schemas/ScimResourceMeta'
    ScimUserRequest:
      type: object
      description: 'Create (POST) / replace (PUT) body. Fields beyond userName/active are

        accepted and IGNORED (a permissive body keeps stock IdP connectors

        working without pretending the platform persists what it does not).

        '
      required:
      - userName
      properties:
        schemas:
          type: array
          items:
            type: string
        userName:
          type: string
          format: email
          description: The login email; validated, stored lowercased.
        active:
          type: boolean
          description: 'Defaults to true on create; on PUT an omitted active resets to

            true (RFC 7644 full-replace semantics).

            '
        password:
          type: string
          writeOnly: true
          description: Accepted and NEVER stored (users stay invite-pending).
        name:
          type: object
          properties:
            givenName:
              type: string
            familyName:
              type: string
        displayName:
          type: string
        externalId:
          type: string
        emails:
          type: array
          items:
            $ref: '#/components/schemas/ScimUserEmail'
    ScimPatchOperation:
      type: object
      required:
      - op
      properties:
        op:
          type: string
          description: replace (case-insensitive) is the only supported op.
        path:
          type: string
          description: active (or omitted for the pathless value-object form).
        value:
          description: 'Boolean (or string ''true''/''false'') for path form; object {''active'': bool} for the pathless form.'
    ScimPatchRequest:
      type: object
      description: RFC 7644 §3.5.2 patch envelope ("Operations" with a capital O).
      required:
      - Operations
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
          - urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ScimPatchOperation'
    ScimListResponse:
      type: object
      description: RFC 7644 §3.4.2 listing envelope; Resources is always an array (never null).
      required:
      - schemas
      - totalResults
      - startIndex
      - itemsPerPage
      - Resources
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
          - urn:ietf:params:scim:api:messages:2.0:ListResponse
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: '#/components/schemas/ScimUser'
    ScimError:
      type: object
      description: RFC 7644 §3.12 error envelope (application/scim+json).
      required:
      - schemas
      - status
      - detail
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
          - urn:ietf:params:scim:api:messages:2.0:Error
        status:
          type: string
          description: HTTP status as a string.
        detail:
          type: string
    OrgSummary:
      type: object
      description: The caller's tenant (claims-derived; never client-supplied).
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          description: Tenant lifecycle status (ACTIVE for every registered tenant).
          enum:
          - ACTIVE
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - status
      - created_at
      - updated_at
    OrgInfoResponse:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrgSummary'
        role:
          type: string
          description: The caller's platform role (from the authenticated identity).
          enum:
          - OWNER
          - ADMIN
          - MEMBER
          - VIEWER
      required:
      - organization
      - role
    OrgMember:
      type: object
      description: 'One membership row joined with the identity directory. `name` is a

        display fallback derived from the email local part (the identity

        model has no display-name column — same deliberate omission as the

        SCIM 2.0 resource); a membership row without a matching identity row

        projects empty email/name.

        '
      properties:
        id:
          type: string
          description: User id (path parameter of the PATCH/DELETE member operations).
        email:
          type: string
          description: Login email from the identity directory (empty when the identity row is missing).
        name:
          type: string
          description: Display fallback (email local part); never invented profile data.
        role:
          type: string
          description: Membership role for this tenant (same enum as the platform RBAC roles).
          enum:
          - OWNER
          - ADMIN
          - MEMBER
          - VIEWER
        joined_at:
          type: string
          format: date-time
          description: Membership row creation timestamp.
      required:
      - id
      - email
      - name
      - role
      - joined_at
    OrgMemberListResponse:
      type: object
      properties:
        members:
          type: array
          description: Members of the caller's tenant, oldest first.
          items:
            $ref: '#/components/schemas/OrgMember'
      required:
      - members
    OrgMemberAddRequest:
      type: object
      description: 'Invite payload. Only email + role are supplied; the tenant comes

        from the auth claims and the user must already exist on the

        platform (unknown emails are 404, never auto-registered).

        '
      properties:
        email:
          type: string
          minLength: 1
          description: Login email of an EXISTING platform user (case-insensitive).
          examples:
          - new.hire@acme.test
        role:
          type: string
          description: Membership role (case-insensitive, normalized by the server).
          enum:
          - OWNER
          - ADMIN
          - MEMBER
          - VIEWER
      required:
      - email
      - role
    OrgMemberRoleUpdateRequest:
      type: object
      properties:
        role:
          type: string
          description: New membership role (case-insensitive).
          enum:
          - OWNER
          - ADMIN
          - MEMBER
          - VIEWER
      required:
      - role
    OrgMemberMutationResponse:
      type: object
      description: Add/role-change responses echo the stored member row.
      properties:
        member:
          $ref: '#/components/schemas/OrgMember'
      required:
      - member
    OrgMemberRemoveResponse:
      type: object
      properties:
        removed:
          type: boolean
          description: Always true on success.
      required:
      - removed
    OrgErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of ORGANIZATION_NOT_FOUND, USER_NOT_FOUND, MEMBER_NOT_FOUND, ALREADY_MEMBER, LAST_OWNER, VALIDATION_ERROR,
                INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - LAST_OWNER
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    McpJSONRPCRequest:
      type: object
      description: 'One JSON-RPC 2.0 request object. `id` may be a string, number or

        null; a request WITHOUT `id` is a notification (204, no body).

        Batches (top-level arrays) are rejected with -32600.

        '
      properties:
        jsonrpc:
          type: string
          const: '2.0'
          description: Must be exactly "2.0".
        id:
          oneOf:
          - type: string
          - type: number
          - type: 'null'
          description: Request correlation id; absent for notifications.
        method:
          type: string
          enum:
          - initialize
          - tools/list
          - tools/call
          - ping
          description: MCP method name.
        params:
          oneOf:
          - $ref: '#/components/schemas/McpInitializeParams'
          - $ref: '#/components/schemas/McpCallToolParams'
          description: 'Method parameters (initialize and tools/call take params;

            tools/list and ping take none in stateless v1).

            '
      required:
      - jsonrpc
      - method
    McpInitializeParams:
      type: object
      description: initialize parameters. Unsupported protocol versions are answered with the server's latest ("2025-06-18").
      properties:
        protocolVersion:
          type: string
          description: Client's requested MCP spec revision.
          examples:
          - '2025-06-18'
        capabilities:
          type: object
          description: Client capabilities (ignored by this server in v1).
          additionalProperties: true
        clientInfo:
          type: object
          description: Client identification (informational).
          properties:
            name:
              type: string
            version:
              type: string
          additionalProperties: true
    McpCallToolParams:
      type: object
      description: tools/call parameters.
      properties:
        name:
          type: string
          minLength: 1
          description: Tool registry name (e.g. "calculator", "http_request").
        arguments:
          type: object
          additionalProperties: true
          description: 'Tool input object. JSON null behaves like an empty object;

            anything else that is not an object is -32602.

            '
      required:
      - name
    McpJSONRPCResponse:
      type: object
      description: 'One JSON-RPC 2.0 response object: exactly one of result / error.

        `id` echoes the request id, or null when the id was undetectable.

        '
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
          - type: string
          - type: number
          - type: 'null'
        result:
          oneOf:
          - $ref: '#/components/schemas/McpInitializeResult'
          - $ref: '#/components/schemas/McpToolsListResult'
          - $ref: '#/components/schemas/McpCallToolResult'
          - $ref: '#/components/schemas/McpPingResult'
          description: Present on success (shape depends on the method).
        error:
          $ref: '#/components/schemas/McpJSONRPCError'
    McpJSONRPCError:
      type: object
      description: JSON-RPC 2.0 error object.
      properties:
        code:
          type: integer
          description: '-32700 parse error | -32600 invalid request (incl. batches) |

            -32601 method not found | -32602 invalid params / unknown tool |

            -32603 internal | -32000 forbidden (server-defined, reserved

            implementation range).

            '
          examples:
          - -32601
        message:
          type: string
          examples:
          - method not found: resources/list
        data:
          description: Optional structured error detail (unused in v1).
      required:
      - code
      - message
    McpServerInfo:
      type: object
      description: MCP serverInfo advertised at initialize.
      properties:
        name:
          type: string
          const: agentos
        version:
          type: string
          description: Build module version (falls back to a release constant).
      required:
      - name
      - version
    McpToolsCapability:
      type: object
      description: tools feature advertisement. listChanged is false — the stateless v1 endpoint never pushes registry-change
        notifications.
      properties:
        listChanged:
          type: boolean
          const: false
      required:
      - listChanged
    McpServerCapabilities:
      type: object
      description: Capabilities advertised by this server.
      properties:
        tools:
          $ref: '#/components/schemas/McpToolsCapability'
      required:
      - tools
    McpInitializeResult:
      type: object
      description: initialize handshake payload.
      properties:
        protocolVersion:
          type: string
          description: 'The negotiated spec revision: the client''s version when the

            server supports it ("2025-06-18"), otherwise the server''s

            latest.

            '
          examples:
          - '2025-06-18'
        capabilities:
          $ref: '#/components/schemas/McpServerCapabilities'
        serverInfo:
          $ref: '#/components/schemas/McpServerInfo'
      required:
      - protocolVersion
      - capabilities
      - serverInfo
    McpToolDescriptor:
      type: object
      description: 'One tools/list entry. description and inputSchema are omitted for

        tools that publish no catalog metadata. The catalog is a

        process-wide runtime surface: it carries no organization fields and

        is identical for every tenant.

        '
      properties:
        name:
          type: string
          description: Registry name used by tools/call.
          examples:
          - calculator
        description:
          type: string
          description: Human-readable tool description (optional).
        inputSchema:
          type: object
          description: JSON-Schema-style input contract for arguments.
          additionalProperties: true
      required:
      - name
    McpToolsListResult:
      type: object
      description: tools/list payload. nextCursor is deliberately absent (no pagination in stateless v1).
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpToolDescriptor'
      required:
      - tools
    McpTextContent:
      type: object
      description: MCP text content block (the only content type in v1).
      properties:
        type:
          type: string
          const: text
        text:
          type: string
          description: 'Tool observation as text: the tool''s result map rendered as

            compact JSON, or "error: <reason>" for in-band execution

            failures.

            '
      required:
      - type
      - text
    McpCallToolResult:
      type: object
      description: 'tools/call payload. Tool EXECUTION failures are reported here with

        isError=true (MCP contract) — they are never JSON-RPC errors.

        Protocol failures (unknown tool, malformed params) are JSON-RPC

        -32602 instead. Every call (executed, denied or unknown tool) also

        writes an audit row with the "mcp" channel marker; arguments are

        never logged.

        '
      properties:
        content:
          type: array
          description: Exactly one text block in v1 (empty never occurs on success).
          items:
            $ref: '#/components/schemas/McpTextContent'
        isError:
          type: boolean
          description: True when the tool itself failed; the text carries the reason.
      required:
      - content
      - isError
    McpPingResult:
      type: object
      description: ping payload — the empty object, per the MCP spec.
      additionalProperties: false
    CnpPromotionPolicy:
      type: object
      description: 'The eval-gated promotion policy (standing rule of the deployment row;

        survives abort and canary re-attach — re-attaching a canary opens a

        fresh evaluation window under the same policy). Out-of-domain values

        are REJECTED, not clamped.

        '
      properties:
        min_pass_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Minimum case-weighted pass rate across the sampled eval runs required to promote; a sample below it
            rolls back.
          examples:
          - 0.8
        min_canary_runs:
          type: integer
          minimum: 0
          description: 'Evidence gate: minimum completed eval runs inside the canary window

            before ANY decision is made. 0 (or a negative value, rejected at

            validation) disables the policy entirely — the engine never decides

            on an empty sample.

            '
          examples:
          - 3
        max_p95_latency_ms:
          type: integer
          minimum: 0
          description: Maximum tolerated p95 case latency in ms; 0 disables the latency gate.
          examples:
          - 0
        max_cost_per_run_cents:
          type: integer
          minimum: 0
          description: Maximum tolerated average cost per eval run in cents; 0 disables the cost gate.
          examples:
          - 0
      required:
      - min_pass_rate
      - min_canary_runs
      - max_p95_latency_ms
      - max_cost_per_run_cents
    CnpCanaryConfigRequest:
      type: object
      description: 'Canary configuration patch (the issue-#13 body extended with the

        issue-#51 policy field). At least one property is required; omitted

        properties keep their current value.

        '
      properties:
        canary_version:
          type: integer
          minimum: 1
          description: 'Canary target version (issue #13 semantics unchanged). Must be an

            existing version of the SAME agent (any publication status) and

            differ from the deployment''s stable version. Attaching/replacing

            it opens a FRESH evaluation window and voids any prior decision.

            '
          examples:
          - 3
        canary_weight:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of traffic routed to the canary (0-100). Requires an attached canary. Moving the split does
            NOT affect the evaluation window.
          examples:
          - 50
        canary_policy:
          description: 'The eval-gated promotion policy (issue #51). Attach/replace with an

            object — this opens a fresh evaluation window and clears any prior

            decision; clear with `null`. Requires an attached canary (attach

            canary_version in the same body, before the policy is applied).

            '
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CnpPromotionPolicy'
      minProperties: 1
    CnpCanaryDecision:
      type: object
      description: 'The single immutable automatic decision recorded per canary window

        (never rewritten; manual promote/abort preempt the engine). Reason

        format: "<metric> <observed> <op> <threshold> → <action>".

        '
      properties:
        action:
          type: string
          enum:
          - promote
          - rollback
          description: promote = manual-promote semantics (canary becomes stable); rollback = manual-abort semantics (canary
            cleared, stable serves 100%).
        reason:
          type: string
          description: Deterministic decision reason, e.g. "pass_rate 0.62 < 0.80 → rollback" or "p95_latency_ms 300 > 100
            → rollback".
          examples:
          - pass_rate 0.62 < 0.80 → rollback
        decided_at:
          type: string
          format: date-time
        runs_counted:
          type: integer
          description: Completed eval runs inside the window the decision was made from (<= 100, newest first).
        pass_rate:
          type: number
          format: double
          description: Case-weighted pass rate of the sample.
        p95_latency_ms:
          type: integer
          description: Nearest-rank p95 over ALL sampled case latencies (ms).
        avg_cost_cents:
          type: number
          format: double
          description: Mean cost per sampled eval run (cents).
        policy:
          $ref: '#/components/schemas/CnpPromotionPolicy'
      required:
      - action
      - reason
      - decided_at
      - runs_counted
      - pass_rate
      - p95_latency_ms
      - avg_cost_cents
      - policy
    CnpSampleStats:
      type: object
      description: 'Fresh aggregates of the completed eval runs inside the canary window

        (surfaced only while the canary is active and a sample source is

        wired — the "why hasn''t it promoted yet" view).

        '
      properties:
        runs_counted:
          type: integer
        cases_counted:
          type: integer
        passed_cases:
          type: integer
        pass_rate:
          type: number
          format: double
        p95_latency_ms:
          type: integer
        avg_cost_cents:
          type: number
          format: double
      required:
      - runs_counted
      - cases_counted
      - passed_cases
      - pass_rate
      - p95_latency_ms
      - avg_cost_cents
    CnpCanaryStatus:
      type: object
      description: 'Read model of GET /agents/{agentId}/canary/status. policy /

        window_start / decision appear only when a promotion policy is

        configured (window_start is stamped at canary attach/replace);

        stats appears only while the canary is active with a sample source

        wired.

        '
      properties:
        agent_id:
          type: string
        environment:
          type: string
          enum:
          - development
          - staging
          - production
        deployment_id:
          type: string
          description: The healthy deployment row serving the split.
        stable_version:
          type: integer
          description: The version serving 100 - canary_weight percent of traffic.
        canary_version:
          type: integer
          description: The canary version; 0 = no canary attached.
        canary_weight:
          type: integer
          minimum: 0
          maximum: 100
        canary_active:
          type: boolean
          description: True while the canary config is attached (the engine may act).
        window_start:
          type: string
          format: date-time
          nullable: true
          description: Evaluation window anchor (canary attach/replace time); only samples created at/after it count.
        policy:
          allOf:
          - $ref: '#/components/schemas/CnpPromotionPolicy'
          nullable: true
        decision:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CnpCanaryDecision'
        stats:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CnpSampleStats'
      required:
      - agent_id
      - environment
      - deployment_id
      - stable_version
      - canary_version
      - canary_weight
      - canary_active
    CnpCanaryStatusResponse:
      type: object
      properties:
        canary_status:
          $ref: '#/components/schemas/CnpCanaryStatus'
      required:
      - canary_status
    CnpDeploymentResponse:
      type: object
      description: The updated deployment (base Deployment shape; the promotion state additionally surfaces on the status
        endpoint).
      properties:
        deployment:
          type: object
          description: Base Deployment view (see api/fragments/canary.yaml for the authoritative full shape); this fragment
            only documents the response envelope.
          additionalProperties: true
      required:
      - deployment
    CnpErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: 'One of DEPLOYMENT_NOT_FOUND (404), NOT_FOUND (404, status

                endpoint), INVALID_STATE (409), VALIDATION_ERROR (422 —

                includes out-of-domain canary_policy values), INVALID_REQUEST

                (400), UNAUTHORIZED (401), FORBIDDEN (403), INTERNAL_ERROR

                (500).

                '
              examples:
              - VALIDATION_ERROR
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    AglUpdateAgentRequest:
      type: object
      description: 'Merge-update payload for the agent''s draft fields. Only the four

        draft-updatable keys are accepted; every other key is rejected with

        400 IMMUTABLE_FIELDS (never silently dropped). system_prompt is an

        accepted alias of instructions. Leave a field absent to keep its

        current value.

        '
      properties:
        name:
          type: string
          minLength: 1
          description: Display name (non-blank when provided).
          examples:
          - Support Agent v2
        description:
          type: string
          description: Human-readable description (may be cleared with an empty string).
        instructions:
          type: string
          minLength: 1
          description: The agent's system prompt (non-blank when provided).
        system_prompt:
          type: string
          minLength: 1
          description: Alias of instructions (the version contract's canonical key); must agree with instructions when both
            are present.
        model:
          type: string
          minLength: 1
          description: Model identifier the agent runs on (non-blank when provided).
          examples:
          - gpt-4o-mini
      additionalProperties: false
    AglAgent:
      type: object
      description: 'Agent representation — identical to the base spec''s Agent schema and

        the GET /agents/{id} response (legacy PascalCase encoding of the

        internal agents.Agent struct, unchanged by this fragment).

        '
      properties:
        ID:
          type: string
        OrganizationID:
          type: string
        Name:
          type: string
        Description:
          type: string
        Instructions:
          type: string
        Model:
          type: string
        Status:
          type: string
          description: Agent lifecycle status (DRAFT on creation; mutated by the version lifecycle, not by PUT).
          examples:
          - DRAFT
        CurrentVersionID:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      required:
      - ID
      - OrganizationID
      - Name
      - Model
      - Status
      - CreatedAt
      - UpdatedAt
    AglDeleteAgentResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Always true on success.
        id:
          type: string
          description: The deleted agent's id.
      required:
      - deleted
      - id
    AglErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of AGENT_NOT_FOUND, IMMUTABLE_FIELDS, AGENT_HAS_RUNS, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED,
                FORBIDDEN, INTERNAL_ERROR.
              examples:
              - AGENT_HAS_RUNS
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    EvEvent:
      type: object
      required:
      - id
      - type
      - timestamp
      properties:
        id:
          type: string
          description: Event id (UUID; also the keyset tiebreaker).
        type:
          type: string
          description: Contract event type (run.started, run.completed, run.failed, run.cancelled, step.started, step.completed,
            agent.created, agent.updated, approval.requested, approval.decided, deployment.completed, deployment.failed, webhook.received).
        entity_type:
          type: string
          description: resource_type of the domain object the event is about (flattened Resource; omitted when absent).
        entity_id:
          type: string
          description: resource_id of the domain object (omitted when absent).
        project_id:
          type: string
        execution_id:
          type: string
        trace_id:
          type: string
        payload:
          type: object
          description: Free-form JSON payload published with the event (e.g. failure reason); omitted when absent.
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: Event creation time (RFC3339, UTC); the keyset ordering key.
    EvEventListResponse:
      type: object
      required:
      - events
      - next_cursor
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EvEvent'
        next_cursor:
          type: string
          description: Opaque keyset cursor for the next page; empty string when the stream is exhausted.
    EvErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - INVALID_CURSOR
              - UNAUTHORIZED
              - FORBIDDEN
              - INTERNAL_ERROR
              - EVENTS_UNAVAILABLE
            message:
              type: string
    SmMeters:
      type: object
      required:
      - runs_count
      - tool_calls_count
      properties:
        runs_count:
          type: integer
          format: int64
          minimum: 0
          description: 'Metered runs of the organization inside the window (the run-count

            side of the GET /usage/costs aggregation).

            '
        tool_calls_count:
          type: integer
          format: int64
          minimum: 0
          description: 'Executed tool steps (run_steps with step_type=''tool'') of the

            organization inside the window.

            '
      additionalProperties: false
      description: 'The meters contract is closed on purpose: sandbox_seconds is absent

        because the platform records no durable sandbox execution duration

        (never-invented-data rule). It will be added when a meter exists.

        '
    SmMetersResponse:
      type: object
      required:
      - from
      - to
      - meters
      properties:
        from:
          type: string
          format: date-time
          description: Effective half-open window start (inclusive).
        to:
          type: string
          format: date-time
          description: Effective half-open window end (exclusive).
        meters:
          $ref: '#/components/schemas/SmMeters'
    SmMarginPlan:
      type: object
      required:
      - id
      - name
      - price_cents
      - currency
      - included_quota
      - unlimited
      properties:
        id:
          type: string
        name:
          type: string
        price_cents:
          type: integer
          minimum: 0
          description: Recurring monthly catalog price in cents (the revenue side).
        currency:
          type: string
        included_quota:
          type: integer
          minimum: 0
          description: Included monthly run budget; 0 = unlimited (context only — never changes the margin math).
        unlimited:
          type: boolean
          description: True when included_quota is 0 (the unlimited sentinel).
    SmMarginReport:
      type: object
      required:
      - subscription_id
      - status
      - period_start
      - period_end
      - currency
      - price_cents
      - usage_cost_cents
      - margin_cents
      - plan
      properties:
        subscription_id:
          type: string
        status:
          type: string
          enum:
          - trial
          - active
          - past_due
          - canceled
          description: Status of the subscription row whose period is reported.
        period_start:
          type: string
          format: date-time
          description: Half-open window start [period_start, period_end) — the subscription's current period.
        period_end:
          type: string
          format: date-time
        currency:
          type: string
        price_cents:
          type: integer
          description: Revenue side (plan.price_cents).
        usage_cost_cents:
          type: number
          format: double
          description: Exact (unrounded) cost basis summed over the period from the usage ledger.
        margin_cents:
          type: integer
          description: price_cents − round(usage_cost_cents); may be NEGATIVE (honest loss, never clamped).
        margin_percent:
          type: number
          format: double
          description: '(1 − cost/price) × 100. OMITTED when price_cents is 0 — a

            percentage of zero revenue is undefined, never fabricated.

            '
        plan:
          $ref: '#/components/schemas/SmMarginPlan'
    SmMarginResponse:
      type: object
      required:
      - margin
      properties:
        margin:
          $ref: '#/components/schemas/SmMarginReport'
    SmErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable code (INVALID_TIME_RANGE, METER_SOURCE_UNAVAILABLE, NO_SUBSCRIPTION, PLAN_NOT_FOUND,
                …).
            message:
              type: string
    ScimTokenRevokeErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of SCIM_TOKEN_NOT_FOUND, SCIM_UNAVAILABLE, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - SCIM_TOKEN_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    AuthLifecycleRefreshResponse:
      type: object
      description: 'Fresh session token (rotated jti, full new 24h window). Same shape

        as the POST /auth/login response. The replaced token is already

        revoked server-side when this response is emitted.

        '
      properties:
        token:
          type: string
          minLength: 1
          description: The new HMAC session token. Store it; the old one is dead.
      required:
      - token
    AuthLifecycleErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: 'One of UNAUTHORIZED (missing/non-bearer credential),

                TOKEN_INVALID (not a validly signed token, expired, or

                unresolvable identity), TOKEN_REVOKED (deny-listed: logged

                out or rotated away — single-use replay is observable),

                ACCOUNT_DISABLED (SCIM deprovisioned or otherwise inactive

                identity).

                '
              examples:
              - TOKEN_REVOKED
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    QtTask:
      type: object
      description: 'Introspection record of one queue task. organization_id is never

        rendered — the tenant is implied by the caller''s claims (the payload

        may legitimately echo the caller''s own organization_id inside its

        keys).

        '
      required:
      - id
      - type
      - status
      - attempts
      - requeues
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Stable task identifier (preserved across requeues).
        type:
          type: string
          description: Task type, e.g. agent.run or a workflow node type.
        status:
          type: string
          enum:
          - queued
          - running
          - dead_letter
          - completed
          description: Current engine state. Dequeued-but-not-started tasks still report queued.
        attempts:
          type: integer
          format: int64
          description: Delivery attempts since the last (re)queue. Reset to 0 by a requeue.
        requeues:
          type: integer
          format: int64
          description: API-initiated requeue counter; survives the attempt reset and later transitions.
        last_error:
          type: string
          description: Last handler error; empty after a successful requeue.
        payload:
          type: object
          additionalProperties: true
          description: The task payload as enqueued (organization_id, run_id, input, ...).
        created_at:
          type: string
          format: date-time
          description: Original enqueue time (preserved across requeues).
        updated_at:
          type: string
          format: date-time
          description: Last transition time.
        requeued_at:
          type: string
          format: date-time
          description: Timestamp of the most recent API requeue; absent when never requeued.
    QtTaskListResponse:
      type: object
      required:
      - tasks
      - next_cursor
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/QtTask'
          description: One keyset page, newest enqueue first.
        next_cursor:
          type: string
          description: Opaque cursor for the next page; "" when the listing is exhausted.
    QtStatsResponse:
      type: object
      required:
      - stats
      - total
      properties:
        stats:
          type: object
          required:
          - queued
          - running
          - dead_letter
          - completed
          additionalProperties: false
          properties:
            queued:
              type: integer
              format: int64
            running:
              type: integer
              format: int64
            dead_letter:
              type: integer
              format: int64
            completed:
              type: integer
              format: int64
          description: Depth per engine state for the caller's organization.
        total:
          type: integer
          format: int64
          description: Total number of the organization's tracked tasks.
    QtErrorEnvelope:
      type: object
      description: Shared structured error envelope.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - NOT_FOUND
              - CONFLICT
              - INVALID_CURSOR
              - INVALID_REQUEST
              - UNAUTHORIZED
              - INTERNAL_ERROR
              - QUEUE_UNAVAILABLE
            message:
              type: string
    NsubSubscription:
      type: object
      description: 'One org-scoped routing rule: deliver the listed operational event

        types to an existing webhook endpoint of the same organization.

        Deliveries reuse the signed webhooks pipeline and appear in

        GET /webhooks/{id}/deliveries.

        '
      required:
      - id
      - webhook_id
      - event_types
