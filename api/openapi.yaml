      # ---- wave-9 fragment: gateway.yaml (schemas) ----
    GatewayErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                VALIDATION_ERROR | GATEWAY_KEY_NOT_FOUND |
                spend_limit_exceeded (HTTP 402) | model_not_allowed
                (HTTP 403) on guarded completions.
            message:
              type: string
    GatewayKeyCreateRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
        models:
          description: >
            Allow-list contract: absent or null = ALL models allowed;
            [] = NONE; else the exact model ids (case-insensitive; a
            "vendor/model" id also matches its bare suffix).
          oneOf:
            - type: "null"
            - type: array
              items:
                type: string
        monthly_limit_cents:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Monthly spend ceiling in USD cents; 0 = unlimited.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry; enforced at the authentication path.
    GatewayKeyUpdateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        models:
          description: >
            Absent = unchanged; null = allow-list DISABLED (ALL models);
            [] = ENABLED and empty (NONE); else the exact list.
          oneOf:
            - type: "null"
            - type: array
              items:
                type: string
        monthly_limit_cents:
          type: integer
          format: int64
          minimum: 0
          description: 0 = unlimited.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Absent = unchanged; null = clear the expiry.
    GatewayKey:
      type: object
      description: >
        Redacted key view. The persisted SHA-256 hash and the plaintext
        credential are structurally absent (no property exists for either).
      properties:
        id:
          type: string
        label:
          type: string
        prefix:
          type: string
          description: >
            12-char display prefix of the minted credential; authenticates
            nothing (the hash covers the FULL secret).
        models:
          description: >
            null = allow-list disabled (every model allowed); [] = enabled
            and empty (no model allowed); else the exact allow-list.
          oneOf:
            - type: "null"
            - type: array
              items:
                type: string
        monthly_limit_cents:
          type: integer
          format: int64
          description: 0 = unlimited.
        status:
          type: string
          enum: [active, revoked]
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GatewayKeyCreatedResponse:
      type: object
      description: >
        Mint response. `key` is metadata-only; `plaintext` is the vk_…
        credential, returned exactly here and exactly once — the server
        stores only the hash and can never return it again.
      required: [id, plaintext, key]
      properties:
        id:
          type: string
        plaintext:
          type: string
          pattern: '^vk_'
          description: The plaintext credential. Appears exactly here and exactly once.
        key:
          $ref: '#/components/schemas/GatewayKey'
    GatewaySpendView:
      type: object
      required: [used_cents, limit_cents, remaining_cents, month]
      properties:
        used_cents:
          type: number
          format: double
          description: Month-to-date recorded spend (USD cents, fractional).
        limit_cents:
          type: number
          format: double
          description: The key's monthly ceiling; 0 = unlimited.
        remaining_cents:
          type: number
          format: double
          nullable: true
          description: limit - used; null for unlimited keys.
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The UTC calendar month bucket of this view.
    GatewaySpendLimitErrorBody:
      type: object
      description: >
        HTTP 402 body shape for guarded-completion overspend denials
        (spend_limit_exceeded); rendered by the run-serving handlers via
        the shared mapper.
      properties:
        error:
          type: object
          required: [code, message, key_id, limit_cents, used_cents, projected_cents]
          properties:
            code:
              type: string
              enum: [spend_limit_exceeded]
            message:
              type: string
            key_id:
              type: string
            limit_cents:
              type: number
              format: double
            used_cents:
              type: number
              format: double
            projected_cents:
              type: number
              format: double
    GatewayModelNotAllowedErrorBody:
      type: object
      description: >
        HTTP 403 body shape for guarded-completion allow-list denials
        (model_not_allowed); rendered by the run-serving handlers via the
        shared mapper.
      properties:
        error:
          type: object
          required: [code, message, key_id, model]
          properties:
            code:
              type: string
              enum: [model_not_allowed]
            message:
              type: string
            key_id:
              type: string
            model:
              type: string

