# ---- wave-9 fragment: compliance.yaml (paths) ----
  /compliance/controls:
    get:
      operationId: listComplianceControls
      summary: Control catalog with framework mapping and live evidence for the caller's organization
      description: |
        Static control catalog (identity & access, tenant isolation &
        secrets, logging & audit, human oversight, risk & policy, lifecycle
        & change management, supply chain, residency) rendered with, per
        control, the satisfying platform primitives, framework tags
        (SOC2_TSC_*, ISO42001_A_*, EUAI_ACT_ART_*, NIST_AIRMF_*) and live
        evidence pointers measured at request time (e.g. the audit chain
        head hash + length from ChainHead, approval/policy/canary/MCP
        counts). Collectors that fail degrade that control to an explicit
        `static_pointer` evidence entry with note "live evidence
        unavailable" — the report never fails as a whole.
      x-required-permission: audit.read
      security:
        - bearerToken: []
        - apiKey: []
      responses:
        "200":
          description: Control-mapping report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComControlsReport" }
        "401": { $ref: "#/components/responses/ComUnauthorized" }
        "403": { $ref: "#/components/responses/ComForbidden" }
  /compliance/agents/{id}/technical-doc:
    get:
      operationId: getAgentTechnicalDoc
      summary: Per-agent technical documentation (EU AI Act Annex IV style) generated from platform data
      description: |
        Annex-IV-STYLE document assembled from the agent's own records:
        identity, version history, evaluation evidence (datasets, completed
        runs, case-weighted pass rate), deployment + canary promotion policy
        state, effective tool surface (from agent-scoped key allow-lists —
        "unrestricted" when no active key constrains it), agent-relevant
        policy bindings, and the tenant's audit posture (chain head + last
        30-day entry count). `format=md` renders deterministic Markdown with
        a stable section order; `format=json` (default) renders the
        structured document. Unknown or foreign agents answer 404 without an
        existence leak.
      x-required-permission: audit.read
      security:
        - bearerToken: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [json, md], default: json }
      responses:
        "200":
          description: |
            The technical document — structured JSON, or deterministic
            Markdown when format=md.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComTechDoc" }
            text/markdown:
              schema:
                type: string
                description: Deterministic Markdown (stable section order 1..7).
        "400": { $ref: "#/components/responses/ComBadRequest" }
        "401": { $ref: "#/components/responses/ComUnauthorized" }
        "403": { $ref: "#/components/responses/ComForbidden" }
        "404": { $ref: "#/components/responses/ComNotFound" }
  /compliance/evidence:
    get:
      operationId: exportComplianceEvidence
      summary: Deterministic JSONL compliance evidence bundle for a fixed window
      description: |
        One JSON object per line, fixed order: header
        ({type:"compliance_evidence", org, from, to}), audit chain anchor
        ({type:"audit_chain_head", head_hash, chain_length,
        entries_in_window, chain_version}), policy summary, human-oversight
        (approval) summary, access-lifecycle summary (api_keys, agent_keys),
        footer ({type:"evidence_end", generated_for_window:true}).
        BYTE-DETERMINISTIC for unchanged data + fixed window: there is no
        generation timestamp (the inclusive [from, to] window is the only
        time coordinate), so the file (or its sha256) can be parked in WORM
        storage. NEVER includes secret material, audit metadata bodies or
        message payloads — counts, hashes and bounds only.
      x-required-permission: audit.read
      security:
        - bearerToken: []
        - apiKey: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, description: "RFC3339 or YYYY-MM-DD (midnight UTC; inclusive)." }
        - name: to
          in: query
          required: true
          schema: { type: string, description: "RFC3339 or YYYY-MM-DD (end of day UTC for date-only; inclusive)." }
      responses:
        "200":
          description: NDJSON evidence bundle.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: JSONL lines in the fixed order documented above.
        "400": { $ref: "#/components/responses/ComBadRequest" }
        "401": { $ref: "#/components/responses/ComUnauthorized" }
        "403": { $ref: "#/components/responses/ComForbidden" }

# ---- wave-9 fragment: gateway.yaml (paths) ----
  /gateway/keys:
    post:
      operationId: createGatewayKey
      summary: Mint a virtual key (plaintext vk_… returned exactly once)
      description: |
        Write operation (users.manage, OWNER/ADMIN). Body carries label,
        optional models allow-list, optional monthly_limit_cents and
        optional expires_at. The server generates the secret (`vk_` + 32
        random bytes), persists only its SHA-256 hash, and returns the
        plaintext EXACTLY ONCE as the top-level `plaintext` sibling of the
        key metadata — this is the only response in the whole API that
        carries the credential. Minting is audit-logged
        (`gateway.key_created`, no key material in metadata).
      x-required-permission: users.manage
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayKeyCreateRequest'
      responses:
        '201':
          description: |
            Key minted. `id` and `plaintext` sit top-level (create
            contract); `key` is the redacted metadata view (never the
            plaintext or the hash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayKeyCreatedResponse'
        '400':
          description: |
            Validation error (error.code VALIDATION_ERROR): missing/blank
            label, negative limit, malformed models / expires_at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorEnvelope'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/GatewayForbidden'
    get:
      operationId: listGatewayKeys
      summary: List virtual keys of the caller's organization (no hashes, no secrets)
      x-required-permission: users.manage
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Key list (possibly empty; structurally secret-free).
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/GatewayKey'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/GatewayForbidden'
  /gateway/keys/{id}:
    get:
      operationId: getGatewayKey
      summary: Get one virtual key (redacted view)
      security:
      - bearerToken: []
      - apiKey: []
      x-required-permission: users.manage
      parameters:
        - $ref: '#/components/parameters/GatewayKeyId'
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    $ref: '#/components/schemas/GatewayKey'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/GatewayForbidden'
        '404':
          $ref: '#/components/responses/GatewayNotFound'
    patch:
      operationId: updateGatewayKey
      summary: Update label / allow-list / monthly limit / expiry
      description: |
        Partial update: omitted members are unchanged. `models` accepts the
        full nil-vs-empty contract (null = ALL models allowed, [] = NONE,
        else the exact list); `expires_at: null` clears the expiry.
        Unknown/foreign ids are 404 with no existence leak.
      x-required-permission: users.manage
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
        - $ref: '#/components/parameters/GatewayKeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayKeyUpdateRequest'
      responses:
        '200':
          description: Updated key (redacted view).
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    $ref: '#/components/schemas/GatewayKey'
        '400':
          description: Validation error (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorEnvelope'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/GatewayForbidden'
        '404':
          $ref: '#/components/responses/GatewayNotFound'
    delete:
      operationId: revokeGatewayKey
      summary: Revoke a virtual key (idempotent, terminal)
      description: |
        Flips the key to revoked; revocation is terminal and keeps the row
        for audit. Re-revoking an already-revoked key stays 204. A revoked
        key stops resolving at the authentication path (same 404 collapse
        as unknown/foreign credentials).
      x-required-permission: users.manage
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
        - $ref: '#/components/parameters/GatewayKeyId'
      responses:
        '204':
          description: Revoked (or already revoked).
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/GatewayForbidden'
        '404':
          $ref: '#/components/responses/GatewayNotFound'
  /gateway/keys/{id}/spend:
    get:
      operationId: getGatewayKeySpend
      summary: Month-to-date spend view for one virtual key
      description: |
        The (key, month UTC) ledger view the enforcement gate reads.
        `?month=YYYY-MM` selects a bucket (default: the current UTC month).
        `remaining_cents` is null for unlimited keys (limit sentinel 0).
        A ledger read failure is a 500 — the endpoint never reports a false
        zero. Unknown/foreign key ids are 404.
      x-required-permission: users.manage
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
        - $ref: '#/components/parameters/GatewayKeyId'
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            description: Ledger month bucket in UTC ("YYYY-MM").
      responses:
        '200':
          description: Spend view for the requested month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySpendView'
        '400':
          description: Malformed month parameter (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorEnvelope'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/GatewayForbidden'
        '404':
          $ref: '#/components/responses/GatewayNotFound'

