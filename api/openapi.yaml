        last_check_at:
          type: string
          format: date-time
          nullable: true
          examples:
          - '2025-01-02T03:04:05Z'
        superseded_by:
          type: string
          description: ID of the deployment that replaced this (previously healthy) row.
        error:
          type: string
          description: Failure reason when status is failed.
    Deployment:
      type: object
      description: One lifecycle row for (agent, version, environment).
      properties:
        id:
          type: string
          examples:
          - 9d2f2f8e-1c3b-4a5d-9e6f-2f4d3b6c9a10
        agent_id:
          type: string
          examples:
          - agent-1
        version:
          type: integer
          examples:
          - 2
        environment:
          type: string
          enum:
          - development
          - staging
          - production
        status:
          type: string
          enum:
          - requested
          - validated
          - deploying
          - healthy
          - failed
        health:
          $ref: '#/components/schemas/DeploymentHealth'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - agent_id
      - version
      - environment
      - status
      - health
      - created_at
      - updated_at
    DeploymentsResponse:
      type: object
      properties:
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
      required:
      - deployments
    DeploymentResponse:
      type: object
      properties:
        deployment:
          $ref: '#/components/schemas/Deployment'
      required:
      - deployment
    CreateDeploymentRequest:
      type: object
      properties:
        agent_id:
          type: string
          examples:
          - agent-1
        version:
          type: integer
          minimum: 1
          description: Must reference an existing PUBLISHED agent version.
          examples:
          - 2
        environment:
          type: string
          enum:
          - development
          - staging
          - production
      required:
      - agent_id
      - version
      - environment
    RollbackDeploymentResponse:
      type: object
      properties:
        deployment:
          $ref: '#/components/schemas/Deployment'
        rolled_back_to_version:
          type: integer
          description: The version the environment serves after the rollback.
          examples:
          - 2
      required:
      - deployment
      - rolled_back_to_version
    ErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of AGENT_NOT_FOUND, VERSION_NOT_FOUND, VERSION_ARCHIVED, DEPLOYMENT_NOT_FOUND, INVALID_STATE,
                NO_PREVIOUS_HEALTHY, VERSION_NOT_PUBLISHED, VALIDATION_ERROR, INVALID_REQUEST, INTERNAL_ERROR.
              examples:
              - VERSION_NOT_PUBLISHED
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    AgentConfigVersion:
      type: object
      description: One immutable config version (wave-2 contract shape).
      properties:
        version:
          type: integer
          description: Version number (agent creation seeds legacy v1).
          examples:
          - 2
        snapshot:
          description: The frozen agent configuration document (embedded JSON object).
          $ref: '#/components/schemas/AgentSnapshot'
        published_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC publication timestamp (null while draft).
          examples:
          - '2025-01-02T03:04:05Z'
        published_by:
          type: string
          description: User ID that published the version.
        status:
          type: string
          enum:
          - draft
          - published
          - archived
      required:
      - version
      - snapshot
      - published_at
      - published_by
      - status
    UsgErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_GROUP_BY
            message:
              type: string
    UsgCostBucket:
      type: object
      description: 'One aggregated row of the report. Exactly one of `bucket` /

        `agent_id` / `model` is populated depending on `group_by`; the other

        identity fields are omitted.

        '
      required:
      - cost_cents
      - runs
      properties:
        bucket:
          type: string
          description: UTC day (YYYY-MM-DD); present only for group_by=day.
          example: '2026-09-03'
        agent_id:
          type: string
          description: Present only for group_by=agent.
        model:
          type: string
          description: Present only for group_by=model (empty label for runs whose agent was deleted).
        cost_cents:
          type: number
          format: double
          description: Summed cost of the bucket in USD cents (0 = unpriced).
          example: 1.75
        runs:
          type: integer
          description: Number of runs in the bucket.
          example: 4
    UsgUsageCostsResponse:
      type: object
      required:
      - total_cost_cents
      - series
      properties:
        total_cost_cents:
          type: number
          format: double
          description: Sum of every bucket's cost_cents (USD cents).
          example: 1.75
        series:
          type: array
          items:
            $ref: '#/components/schemas/UsgCostBucket'
    Wf3ErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable code (WORKFLOW_RUN_NOT_FOUND, WORKFLOWS_UNAVAILABLE, INTERNAL_ERROR, UNAUTHORIZED).
              examples:
              - WORKFLOW_RUN_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    Wf3NodeTimelineStatus:
      type: string
      description: 'Node-run status. pending/running/waiting_approval are non-terminal

        (waiting_approval is a human gate); completed/failed/cancelled/timeout

        are terminal. A failed attempt with error_code NODE_ORPHANED is a

        recovery artifact that is re-executed on a fresh attempt.

        '
      enum:
      - pending
      - running
      - waiting_approval
      - completed
      - failed
      - cancelled
      - timeout
    Wf3WorkflowRunNode:
      type: object
      description: One checkpointed node execution attempt (workflow_run_id + node_id + attempt is the idempotency key; a
        replayed task never re-executes an already-terminal attempt).
      properties:
        id:
          type: string
          description: Checkpoint row identifier (workflow_node_runs.id).
        node_id:
          type: string
          description: DAG node id from the workflow DSL.
        status:
          $ref: '#/components/schemas/Wf3NodeTimelineStatus'
        attempt:
          type: integer
          description: 1-based execution attempt (0 for legacy pre-migration placeholder rows that were never claimed).
          minimum: 0
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: First claim instant of the attempt (null before the first claim).
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Terminal transition instant (null while non-terminal).
        error_code:
          type:
          - string
          - 'null'
          description: Machine-readable failure code (NODE_ORPHANED, WORKFLOW_RUN_TIMEOUT, ...) or null while healthy.
      required:
      - id
      - node_id
      - status
      - attempt
      - started_at
      - finished_at
      - error_code
    Wf3NodeTimelineResponse:
      type: object
      properties:
        nodes:
          type: array
          description: Checkpointed node attempts, oldest first.
          items:
            $ref: '#/components/schemas/Wf3WorkflowRunNode'
      required:
      - nodes
    KnbErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of DOCUMENT_NOT_FOUND, VALIDATION_ERROR, INVALID_REQUEST, INTERNAL_ERROR.
              examples:
              - VALIDATION_ERROR
            message:
              type: string
    KnbDocument:
      type: object
      description: One ingested knowledge document (tenant-scoped).
      required:
      - id
      - title
      - chunk_count
      - created_at
      - updated_at
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
          description: Where the content came from (URL, wiki page, upload name).
        metadata:
          type: object
          description: Caller-supplied free-form metadata carried through ingest.
          additionalProperties: true
        chunk_count:
          type: integer
          description: Number of chunks produced by the ingest pipeline.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnbDocumentsResponse:
      type: object
      required:
      - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KnbDocument'
    KnbCreateDocumentRequest:
      type: object
      required:
      - title
      - content
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
          description: Full document text; chunked (~800 chars, 15% overlap) server-side.
        source:
          type: string
        metadata:
          type: object
          additionalProperties: true
    KnbCreateDocumentResponse:
      type: object
      required:
      - document
      properties:
        document:
          $ref: '#/components/schemas/KnbDocument'
        warning:
          type: string
          description: Present when the embeddings backend failed; chunks were stored unembedded (search falls back to lexical
            scoring).
    KnbSearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
        k:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: Maximum number of chunk hits to return.
    KnbSearchResult:
      type: object
      description: One retrieval hit — the contract-pinned fields plus additive title/chunk id.
      required:
      - document_id
      - chunk_ordinal
      - content
      - score
      - citation
      properties:
        document_id:
          type: string
        document_title:
          type: string
        chunk_id:
          type: string
        chunk_ordinal:
          type: integer
          description: Zero-based position of the chunk inside its document.
        content:
          type: string
        score:
          type: number
          format: double
          description: Cosine similarity (or lexical fallback score) in [0,1].
          examples:
          - 0.83
        citation:
          type: string
          description: Human-readable citation, e.g. "Billing FAQ (confluence/billing), chunk 3".
    KnbSearchResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/KnbSearchResult'
    MemErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of VALIDATION_ERROR, INVALID_REQUEST, INTERNAL_ERROR.
              examples:
              - VALIDATION_ERROR
            message:
              type: string
    MemSnippetInput:
      type: object
      required:
      - content
      properties:
        scope:
          type: string
          enum:
          - short_term
          - long_term
          default: long_term
        content:
          type: string
          minLength: 1
        importance:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.5
        expires_at:
          type: string
          format: date-time
          description: RFC3339; past timestamps make short-term snippets invisible immediately.
        embedding:
          type: array
          items:
            type: number
            format: double
          description: Optional client-computed vector; otherwise embedded server-side.
    MemSnippet:
      type: object
      description: One stored memory snippet (embedding stays server-side).
      required:
      - id
      - agent_id
      - scope
      - content
      - importance
      - created_at
      - updated_at
      properties:
        id:
          type: string
        agent_id:
          type: string
          description: Empty for org-level shared memory.
        scope:
          type: string
          enum:
          - short_term
          - long_term
        content:
          type: string
        importance:
          type: number
          format: double
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemSnippetsResponse:
      type: object
      required:
      - snippets
      properties:
        snippets:
          type: array
          items:
            $ref: '#/components/schemas/MemSnippet'
    MemPutMemoryRequest:
      type: object
      description: Replaces the snippet set of the (organization, agent_id) scope.
      required:
      - snippets
      properties:
        agent_id:
          type: string
          description: Empty replaces the org-level shared memory.
        snippets:
          type: array
          items:
            $ref: '#/components/schemas/MemSnippetInput'
    VdfDiffValue:
      description: 'Raw JSON value of a snapshot field (string, number, boolean, array or

        object). Null when the field is absent from that side''s snapshot.

        '
      type:
      - string
      - number
      - boolean
      - array
      - object
      - 'null'
    VdfVersionDiffField:
      type: object
      description: One comparable field's from/to pair.
      properties:
        field:
          type: string
          description: Canonical field name (model, system_prompt, temperature, params, tools, description) or an extra snapshot
            key.
          examples:
          - model
        from:
          $ref: '#/components/schemas/VdfDiffValue'
        to:
          $ref: '#/components/schemas/VdfDiffValue'
        changed:
          type: boolean
          description: True when the from/to values differ.
      required:
      - field
      - from
      - to
      - changed
    VdfVersionDiffResponse:
      type: object
      description: Wave-3 contract shape {"agent_id","from","to","fields":[…]} (snake_case).
      properties:
        agent_id:
          type: string
          description: The agent the diffed versions belong to.
          examples:
          - 3f9d6c5e-8b21-4f0a-9c3d-7a1e5b2c4d6f
        from:
          type: integer
          description: Echoes the from query parameter.
          examples:
          - 2
        to:
          type: integer
          description: Echoes the to query parameter.
          examples:
          - 3
        fields:
          type: array
          description: Comparable fields in stable order, extra snapshot keys appended sorted.
          items:
            $ref: '#/components/schemas/VdfVersionDiffField'
      required:
      - agent_id
      - from
      - to
      - fields
    VdfErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of AGENT_NOT_FOUND, VERSION_NOT_FOUND, INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - VERSION_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    CanaryConfigRequest:
      type: object
      description: 'Canary configuration patch. At least one property is required; omitted

        properties keep their current value.

        '
      properties:
        canary_version:
          type: integer
          minimum: 1
          description: 'Canary target version. Must be an existing version of the SAME

            agent (any publication status) and differ from the deployment''s

            stable version.

            '
          examples:
          - 3
        canary_weight:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of traffic routed to the canary (0-100). Requires an attached canary.
          examples:
          - 50
      minProperties: 1
    CanaryDeploymentHealth:
      type: object
      description: Health payload (mirrors the base DeploymentHealth schema; superseded_by/error appear only on demoted/failed
        rows).
      properties:
        error_rate:
          type: number
          format: double
          examples:
          - 0.0
        last_check_at:
          type: string
          format: date-time
          nullable: true
          examples:
          - '2025-01-02T03:04:05Z'
        superseded_by:
          type: string
          description: ID of the deployment that replaced this (previously healthy) row.
        error:
          type: string
          description: Failure reason when status is failed.
    CanaryDeploymentView:
      type: object
      description: 'Deployment wire shape extended with the canary fields (issue #13).

        canary_version 0 means "no canary" — all traffic serves the stable

        `version`. While the row is the environment''s healthy deployment,

        canary_weight percent of the agent''s traffic deterministically

        resolves to canary_version.

        '
      properties:
        id:
          type: string
          examples:
          - 9d2f2f8e-1c3b-4a5d-9e6f-2f4d3b6c9a10
        agent_id:
          type: string
          examples:
          - agent-1
        version:
          type: integer
          description: The STABLE version (serves 100 - canary_weight percent of traffic).
          examples:
          - 2
        environment:
          type: string
          enum:
          - development
          - staging
          - production
        status:
          type: string
          enum:
          - requested
          - validated
          - deploying
          - healthy
          - failed
        health:
          $ref: '#/components/schemas/CanaryDeploymentHealth'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        canary_version:
          type: integer
          description: The CANARY version; 0 = no canary configured.
          examples:
          - 3
        canary_weight:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of traffic deterministically routed to the canary (0 when no canary).
          examples:
          - 50
      required:
      - id
      - agent_id
      - version
      - environment
      - status
      - health
      - created_at
      - updated_at
      - canary_version
      - canary_weight
    CanaryDeploymentResponse:
      type: object
      properties:
        deployment:
          $ref: '#/components/schemas/CanaryDeploymentView'
      required:
      - deployment
    CanaryErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of DEPLOYMENT_NOT_FOUND, INVALID_STATE, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN,
                INTERNAL_ERROR.
              examples:
              - INVALID_STATE
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    BillPlan:
