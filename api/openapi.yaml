          description: Updated deployment (canary fields + promotion state included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CnpDeploymentResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CnpErrorEnvelope'
        '401':
          $ref: '#/components/responses/CnpUnauthorized'
        '403':
          $ref: '#/components/responses/CnpForbidden'
        '404':
          description: Deployment not found within the caller's organization (error.code DEPLOYMENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CnpErrorEnvelope'
        '409':
          description: 'State conflict: canary_policy-only body without an attached canary,

            weight moved without a canary, or the row is not the environment''s

