          description: Lowercase ISO-4217-like 3-letter code (default "usd").
        included_quota:
          type: integer
          minimum: 0
          description: 'Included monthly run budget. 0 means UNLIMITED (never exceeded,

            never overaged).

            '
        metadata:
          type: object
