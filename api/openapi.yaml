      - citation
      properties:
        document_id:
          type: string
        document_title:
          type: string
        chunk_id:
          type: string
        chunk_ordinal:
          type: integer
          description: Zero-based position of the chunk inside its document.
        content:
          type: string
        score:
          type: number
          format: double
          description: Cosine similarity (or lexical fallback score) in [0,1].
          examples:
          - 0.83
        citation:
          type: string
          description: Human-readable citation, e.g. "Billing FAQ (confluence/billing), chunk 3".
    KnbSearchResponse:
      type: object
