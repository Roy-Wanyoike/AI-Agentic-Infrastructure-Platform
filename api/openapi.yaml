      description: 'Read (runs.execute, MEMBER+). Returns the full invoice document

        including its lines. Tenant-scoped: an invoice of another

        organization is indistinguishable from an unknown id (404

        INVOICE_NOT_FOUND). Line sources: run (model-bucketed usage priced

        from the cost aggregates), eval (evaluation metering seam) and

