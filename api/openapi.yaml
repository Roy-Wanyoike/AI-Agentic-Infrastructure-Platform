    ErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of AGENT_NOT_FOUND, VERSION_NOT_FOUND, VERSION_ARCHIVED, DEPLOYMENT_NOT_FOUND, INVALID_STATE,
                NO_PREVIOUS_HEALTHY, VERSION_NOT_PUBLISHED, VALIDATION_ERROR, INVALID_REQUEST, INTERNAL_ERROR.
              examples:
              - VERSION_NOT_PUBLISHED
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    AgentConfigVersion:
      type: object
      description: One immutable config version (wave-2 contract shape).
      properties:
        version:
          type: integer
          description: Version number (agent creation seeds legacy v1).
          examples:
          - 2
        snapshot:
          description: The frozen agent configuration document (embedded JSON object).
          $ref: '#/components/schemas/AgentSnapshot'
        published_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 UTC publication timestamp (null while draft).
          examples:
          - '2025-01-02T03:04:05Z'
        published_by:
          type: string
          description: User ID that published the version.
        status:
          type: string
          enum:
          - draft
          - published
          - archived
      required:
      - version
      - snapshot
      - published_at
      - published_by
      - status
    UsgErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_GROUP_BY
            message:
              type: string
    UsgCostBucket:
      type: object
      description: 'One aggregated row of the report. Exactly one of `bucket` /

        `agent_id` / `model` is populated depending on `group_by`; the other

        identity fields are omitted.

        '
      required:
      - cost_cents
      - runs
      properties:
        bucket:
          type: string
          description: UTC day (YYYY-MM-DD); present only for group_by=day.
          example: '2026-09-03'
        agent_id:
          type: string
          description: Present only for group_by=agent.
        model:
          type: string
          description: Present only for group_by=model (empty label for runs whose agent was deleted).
        cost_cents:
          type: number
          format: double
          description: Summed cost of the bucket in USD cents (0 = unpriced).
          example: 1.75
        runs:
          type: integer
          description: Number of runs in the bucket.
          example: 4
    UsgUsageCostsResponse:
      type: object
      required:
      - total_cost_cents
      - series
      properties:
        total_cost_cents:
          type: number
          format: double
          description: Sum of every bucket's cost_cents (USD cents).
          example: 1.75
        series:
          type: array
          items:
            $ref: '#/components/schemas/UsgCostBucket'
    Wf3ErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable code (WORKFLOW_RUN_NOT_FOUND, WORKFLOWS_UNAVAILABLE, INTERNAL_ERROR, UNAUTHORIZED).
              examples:
              - WORKFLOW_RUN_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    Wf3NodeTimelineStatus:
      type: string
      description: 'Node-run status. pending/running/waiting_approval are non-terminal

        (waiting_approval is a human gate); completed/failed/cancelled/timeout

        are terminal. A failed attempt with error_code NODE_ORPHANED is a

        recovery artifact that is re-executed on a fresh attempt.

        '
      enum:
      - pending
      - running
      - waiting_approval
      - completed
      - failed
      - cancelled
      - timeout
    Wf3WorkflowRunNode:
      type: object
      description: One checkpointed node execution attempt (workflow_run_id + node_id + attempt is the idempotency key; a
        replayed task never re-executes an already-terminal attempt).
      properties:
        id:
          type: string
          description: Checkpoint row identifier (workflow_node_runs.id).
        node_id:
          type: string
          description: DAG node id from the workflow DSL.
        status:
          $ref: '#/components/schemas/Wf3NodeTimelineStatus'
        attempt:
          type: integer
          description: 1-based execution attempt (0 for legacy pre-migration placeholder rows that were never claimed).
          minimum: 0
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: First claim instant of the attempt (null before the first claim).
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Terminal transition instant (null while non-terminal).
        error_code:
          type:
          - string
          - 'null'
          description: Machine-readable failure code (NODE_ORPHANED, WORKFLOW_RUN_TIMEOUT, ...) or null while healthy.
      required:
      - id
      - node_id
      - status
      - attempt
      - started_at
      - finished_at
      - error_code
    Wf3NodeTimelineResponse:
      type: object
      properties:
        nodes:
          type: array
          description: Checkpointed node attempts, oldest first.
          items:
            $ref: '#/components/schemas/Wf3WorkflowRunNode'
      required:
      - nodes
    KnbErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: One of DOCUMENT_NOT_FOUND, VALIDATION_ERROR, INVALID_REQUEST, INTERNAL_ERROR.
              examples:
              - VALIDATION_ERROR
