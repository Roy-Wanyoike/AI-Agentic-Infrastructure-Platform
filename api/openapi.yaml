        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillErrorEnvelope'
        '401':
          $ref: '#/components/responses/BillUnauthorized'
        '403':
          $ref: '#/components/responses/BillForbidden'
        '404':
          description: No live subscription (error.code NO_SUBSCRIPTION).
          content:
            application/json:
