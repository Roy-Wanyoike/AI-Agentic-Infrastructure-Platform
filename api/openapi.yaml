            $ref: '#/components/schemas/CnpErrorEnvelope'
    CnpForbidden:
      description: Authenticated but lacking the required permission (writes are deployments.deploy — OWNER/ADMIN; the status
        read is runs.read — all roles).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CnpErrorEnvelope'
    AglUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AglErrorEnvelope'
    AglForbidden:
