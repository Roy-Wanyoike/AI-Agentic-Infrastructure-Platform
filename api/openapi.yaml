          - true
    NsubError:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - VALIDATION_ERROR
              - WEBHOOK_NOT_FOUND
              - SUBSCRIPTION_NOT_FOUND
              - METHOD_NOT_ALLOWED
              - INTERNAL
              description: One of the notifications error codes.
            message:
              type: string
              description: 'Human-readable detail; for unknown event types the message

