      summary: Read the eval-gated canary promotion state for one agent
      description: 'Additive read-only endpoint (issue #51; runs.read — all roles). Serves

        the operator''s view for one agent+environment: the current traffic

        split, the promotion policy in effect (a standing rule that survives

        abort and re-attach), the last automatic decision with its reason and

        sample stats, and — while the canary is ACTIVE — fresh statistics of

        the completed eval runs inside the window (runs counted, case-weighted

        pass rate, nearest-rank p95 latency, average cost per run). With no

        sample source wired (or no active canary) `stats` is omitted; with no

        configured policy `policy`/`window_start`/`decision` are omitted. The

        tenant comes from the auth claims; foreign agents surface as 404 (no

        existence leak).

