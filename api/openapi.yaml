  /runs/{id}/events:
    get:
      operationId: streamRunEvents
      tags:
      - runs
      summary: Stream run events (SSE) or fetch history (JSON)
      description: "Dual-protocol endpoint:\n* `Accept: text/event-stream` → a live SSE stream. After the headers,\n  buffered\
        \ history events are replayed first, then live events follow.\n  Each frame is `data: <RunEvent JSON>\\n\\n` (no `event:`\
        \ field is\n  sent; clients should key off the `name` field inside the JSON,\n  e.g. `status.changed`). Comment keep-alive\
        \ pings (`: ping`) may be\n  interleaved. The stream ends when the client disconnects.\n* Any other `Accept` → JSON\
        \ history envelope\n  `{\"run_id\": \"...\", \"events\": [RunEvent, ...]}`.\n"
      x-required-permission: runs.read
      x-event-names:
      - status.changed
      parameters:
      - $ref: '#/components/parameters/RunID'
      - name: Accept
        in: header
        required: false
        description: Set to `text/event-stream` to switch to the SSE protocol.
        schema:
          type: string
          enum:
          - text/event-stream
      responses:
        '200':
          description: 'SSE stream (text/event-stream) or JSON history depending on the

            Accept header.

            '
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE byte stream; each frame is "data: <RunEvent JSON>" followed by a blank line.'
                example: 'data: {"run_id":"3f6c2b62-...","type":"status","name":"status.changed","payload":{"status":"RUNNING","ts":"2025-01-01T12:00:01Z"},"created_at":"2025-01-01T12:00:01.123456789Z"}


                  data: {"run_id":"3f6c2b62-...","type":"status","name":"status.changed","payload":{"status":"COMPLETED","output":"The
                  result of 2+2 is 4","ts":"2025-01-01T12:00:05Z"},"created_at":"2025-01-01T12:00:05.987654321Z"}

                  '
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventsResponse'
              example:
                run_id: 3f6c2b62-2b57-4f8e-9e4e-2f4d3b6c9a10
                events:
                - run_id: 3f6c2b62-2b57-4f8e-9e4e-2f4d3b6c9a10
                  type: status
                  name: status.changed
                  payload:
                    status: COMPLETED
                    output: The result of 2+2 is 4
                    ts: '2025-01-01T12:00:05Z'
                  created_at: '2025-01-01T12:00:05.987654321Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Run ID path segment missing or malformed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LegacyTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: publishRunEvent
      tags:
      - runs
      summary: Publish an external event to a run's stream
      description: 'Ingestion endpoint used by workers to report execution events. Accepts

        `{"type","name","payload"}` and fans the event out to SSE subscribers

        plus history. Returns 204 No Content. Note: today this route is

        registered under the `runs.read` permission gate; API keys

        authenticate with the OWNER role so worker callbacks succeed.

