openapi: 3.1.0
info:
  title: AgentOS API
  version: 0.1.0
  summary: Multi-tenant AI-agent infrastructure platform API
  description: "AgentOS is a multi-tenant AI-agent infrastructure platform. This contract\ncovers the versioned REST API (/api/v1),\
    \ the worker pull endpoint, the\nServer-Sent Events (SSE) execution-event stream, and platform health /\nmetrics endpoints.\n\
    \n## Authentication\nTwo schemes are accepted on every protected endpoint (see\n`securitySchemes`):\n1. `bearerToken`\
    \ — `Authorization: Bearer <token>` where `<token>` is the\n   HMAC-SHA256 JWT-style token returned by `POST /auth/login`\n\
    \   (registration creates the first OWNER user; log in to get a token).\n2. `apiKey` — `X-API-Key: ak_...` header. API\
    \ keys are created server-side\n   (dev key created at startup) and authenticate as the key's OWNER role.\nBrowser `EventSource`\
    \ clients that cannot set headers may pass\n`?api_key=<key>` as a query parameter (legacy compatibility).\n\n## RBAC\n\
    Permissions: `agents.read`, `agents.write`, `runs.read`, `runs.execute`,\n`users.manage`, `organization.manage`. Roles:\
    \ `OWNER` (all), `ADMIN`\n(all but organization.manage), `MEMBER` (agents.read, runs.read,\nruns.execute), `VIEWER` (agents.read,\
    \ runs.read). Each operation declares\nits required permission via `x-required-permission`.\n\n## Multi-tenancy\nRequests\
    \ are scoped to an organization derived from the auth token. For\nagent/run creation the body may carry `organization_id`;\
    \ when omitted the\nauthenticated principal's organization is used. Access to another\norganization's resources returns\
    \ 403.\n\n## Error model\nTarget structured error (Content-Type application/json):\n`{\"error\":{\"code\":\"not_found\"\
    ,\"message\":\"agent not found\",\"request_id\":\"...\"}}`.\nDuring migration, some handlers still emit `http.Error`-style\n\
    `text/plain` bodies; the structured model is authoritative for new code.\n\n## Pagination\nList endpoints (`GET /agents`,\
    \ `GET /runs`) are **unpaginated** today;\nthey return the full result set. This is a documented limitation and will\n\
    change in a future minor version (see `x-unpaginated`).\n"
  contact:
    name: AgentOS Platform Team
servers:
- url: /api/v1
  description: Canonical versioned base path.
- url: /
  description: 'Legacy root where all /v1/* routes are served identically

    (e.g. /v1/agents). Deprecated alias kept for backward compatibility

    (cmd/worker and existing clients still use it).

    '
tags:
- name: auth
  description: Registration and token issuance.
- name: agents
  description: Agent registry (multi-tenant).
- name: runs
  description: Agent executions and their event streams.
- name: queue
  description: Worker task pull (dev pull model).
- name: platform
  description: Health, readiness and metrics.
security:
- bearerToken: []
- apiKey: []
paths:
  /:
    get:
      operationId: getServiceInfo
      tags:
      - platform
      summary: Service identity banner (catch-all route)
      description: 'Catch-all route returning the service identity. Reachable at the

        server root (outside the versioned base path). No authentication.

        '
      security: []
      x-required-permission: null
      responses:
        '200':
          description: Service banner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    const: agentos-api
                  status:
                    type: string
                    const: running
                required:
                - service
                - status
              example:
                service: agentos-api
                status: running
  /agents:
    get:
      operationId: listAgents
      tags:
      - agents
      summary: List agents in the caller's organization
      description: 'Returns a JSON **array** (not an envelope) of agents belonging to the

        requested organization. `organization_id` query parameter defaults to

        the authenticated principal''s organization; cross-organization access

        is forbidden. Unpaginated today.

        '
      x-required-permission: agents.read
      x-unpaginated: true
      parameters:
      - name: organization_id
        in: query
        required: false
        description: Organization to list; defaults to the caller's organization.
        schema:
          type: string
        example: org-1
      responses:
        '200':
          description: Array of agents (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
              example:
              - ID: agent-1
                OrganizationID: org-1
                Name: Support Agent
                Description: Demo customer support agent
                Instructions: Answer simple questions
                Model: gpt-4o-mini
                Status: DRAFT
                CurrentVersionID: version-agent-1-1
                CreatedAt: '2025-01-01T12:00:00.123456789Z'
                UpdatedAt: '2025-01-01T12:00:00.123456789Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agents/create:
    post:
      operationId: createAgent
      tags:
      - agents
      summary: Create an agent
      description: 'Creates an agent in `DRAFT` status and an initial AgentVersion

        (version 1) which becomes `CurrentVersionID`. Required fields:

        `name`, `instructions`, `model` (service-side validation);

        `organization_id` defaults to the caller''s organization.

        '
      x-required-permission: agents.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            example:
              organization_id: org-1
              name: Support Agent
              description: Demo customer support agent
              instructions: Answer simple questions
              model: gpt-4o-mini
      responses:
        '201':
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                ID: agent-1
                OrganizationID: org-1
                Name: Support Agent
                Description: Demo customer support agent
                Instructions: Answer simple questions
                Model: gpt-4o-mini
                Status: DRAFT
                CurrentVersionID: version-agent-1-1
                CreatedAt: '2025-01-01T12:00:00.123456789Z'
                UpdatedAt: '2025-01-01T12:00:00.123456789Z'
        '400':
          description: Invalid body or validation failure (name/instructions/model required).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LegacyTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agents/{id}:
    get:
      operationId: getAgent
      tags:
      - agents
      summary: Get an agent by ID
      x-required-permission: agents.read
      parameters:
      - $ref: '#/components/parameters/AgentID'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateAgent
      tags:
      - agents
      summary: Update an agent's draft fields (merge; immutable fields rejected explicitly)
      description: 'Write operation (agents.write, exactly OWNER/ADMIN). Merges the

        provided DRAFT fields onto the live agent row: name, description,

        instructions (the system prompt) and model. The version contract''s

        canonical `system_prompt` key is accepted as an alias of

        `instructions`; supplying both with conflicting values is a 400.

        Only provided fields change (merge semantics); provided

        name/instructions/model must be non-blank strings.


        IMMUTABILITY: any other request key — e.g. tools, config,

        temperature, params, status, version, id, organization_id,

        created_at, updated_at — is governed by the immutable published

        version snapshots (or identity bookkeeping) and is REJECTED with 400

        IMMUTABLE_FIELDS listing the offending keys. Fields are never

        silently dropped; publish/rollback mutate those values through the

        version lifecycle, not through this endpoint.


        The tenant comes from the auth claims; cross-organization agents

        surface as 404 (no existence leak). Success writes an `agent.updated`

        audit entry (metadata carries the changed field names) and returns

        the updated agent in the same representation as GET /agents/{id}

        (the legacy PascalCase Agent encoding).

        '
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AglAgentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AglUpdateAgentRequest'
            example:
              name: Support Agent v2
              description: Handles billing questions
              system_prompt: You are a precise support agent. Cite docs.
              model: gpt-4o-mini
      responses:
        '200':
          description: Agent updated; the response is the updated agent (same shape as GET /agents/{id}).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglAgent'
        '400':
          description: 'Malformed JSON body (INVALID_REQUEST), conflicting

            instructions/system_prompt values (INVALID_REQUEST), or the body

            contains immutable/unsupported fields outside the draft update

            surface (IMMUTABLE_FIELDS — the message enumerates every

            rejected key).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglErrorEnvelope'
        '401':
          $ref: '#/components/responses/AglUnauthorized'
        '403':
          $ref: '#/components/responses/AglForbidden'
        '404':
          description: Unknown agent or agent of another organization (AGENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglErrorEnvelope'
        '422':
          description: 'Validation error (VALIDATION_ERROR): blank name/instructions/model

            when provided, non-string values, or no updatable field present.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglErrorEnvelope'
    delete:
      operationId: deleteAgent
      tags:
      - agents
      summary: Delete an agent (hard delete, guarded by run references)
      description: 'Write operation (agents.write, exactly OWNER/ADMIN). Performs a HARD

        delete of the agent row within the caller''s tenant — there is no

        soft-delete: a successful delete removes the agents row and

        subsequent GETs 404. Agent config versions, deployments (including

        canary rows), schedules and memory snippets are removed by their

        ON DELETE CASCADE foreign keys.


        REFERENCE GUARD: runs.agent_id (migration 001, fk_runs_agent) has no

        ON DELETE action, so the durable store itself refuses the delete

        while runs still reference the agent. The endpoint checks first and

        answers 409 AGENT_HAS_RUNS (message carries the run count) instead

        of surfacing a raw foreign-key 500; the agent remains untouched and

        no audit entry is written for a guarded delete. Delete the runs (or

        reassign them) before deleting the agent.


        The tenant comes from the auth claims; cross-organization or unknown

        agents surface as 404 (no existence leak, zero writes). Success

        writes an `agent.deleted` audit entry.

        '
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AglAgentID'
      responses:
        '200':
          description: Agent deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglDeleteAgentResponse'
        '401':
          $ref: '#/components/responses/AglUnauthorized'
        '403':
          $ref: '#/components/responses/AglForbidden'
        '404':
          description: Unknown agent or agent of another organization (AGENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglErrorEnvelope'
        '409':
          description: 'The agent still has runs referencing it (AGENT_HAS_RUNS); the

            delete was refused and the agent is unchanged. This mirrors the

            durable runs FK (no ON DELETE action).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AglErrorEnvelope'
  /agents/{id}/rollback:
    post:
      operationId: rollbackAgent
      summary: Re-point the agent to a target version and restore its snapshot config
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackAgentRequest'
      responses:
        '200':
          description: Target version is now the agent's current version (live config restored).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentVersionResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: target_version missing or not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /agents/{id}/versions:
    get:
      operationId: listAgentVersions
      summary: List an agent's immutable config versions (ascending)
      x-required-permission: agents.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      responses:
        '200':
          description: Config versions of the agent, ascending by version number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /agents/{id}/versions/create:
    post:
      operationId: createAgentVersion
      summary: Snapshot the agent's current configuration into a new draft version
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      responses:
        '201':
          description: Draft version created (numbered after the highest existing version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionNumberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /agents/{id}/versions/{version}/publish:
    post:
      operationId: publishAgentVersion
      summary: Mark a draft version immutable (published) and re-point the agent to it
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      - name: version
        in: path
        required: true
        description: Version number to publish.
        schema:
          type: integer
          minimum: 1
        example: 3
      responses:
        '200':
          description: Version published (idempotent re-publish returns the same version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionNumberResponse'
        '400':
          description: Version path segment is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version is archived (revive it via rollback instead).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /approvals:
    get:
      operationId: listApprovals
      tags:
      - approvals
      summary: List the tenant's approvals
      x-required-permission: approvals.read
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by status (pending|approved|rejected|cancelled).
        schema:
          $ref: '#/components/schemas/ApprovalStatus'
      responses:
        '200':
          description: Approvals (unpaginated today).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '401':
          $ref: '#/components/responses/WfUnauthorized'
        '500':
          $ref: '#/components/responses/WfServerError'
  /approvals/{id}:
    get:
      operationId: getApproval
      tags:
      - approvals
      summary: Get one approval
      x-required-permission: approvals.read
      parameters:
      - $ref: '#/components/parameters/WfApprovalID'
      responses:
        '200':
          description: The approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
                required:
                - approval
        '401':
          $ref: '#/components/responses/WfUnauthorized'
        '404':
          $ref: '#/components/responses/WfNotFound'
        '500':
          $ref: '#/components/responses/WfServerError'
  /approvals/{id}/decide:
    post:
      operationId: decideApproval
      tags:
      - approvals
      summary: Approve or reject an approval
      description: 'Sets the approver from the authenticated principal and decided_at to

        now. When the decision is `approved` and a run is linked, the paused

        run is resumed (status back to `pending`). Deciding twice returns 409.

        '
      x-required-permission: approvals.decide
      parameters:
      - $ref: '#/components/parameters/WfApprovalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideApprovalRequest'
            example:
              decision: approved
              reason: Verified the deployment plan
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
                required:
                - approval
        '400':
          $ref: '#/components/responses/WfBadRequest'
        '401':
          $ref: '#/components/responses/WfUnauthorized'
        '403':
          $ref: '#/components/responses/WfForbidden'
        '404':
          $ref: '#/components/responses/WfNotFound'
        '409':
          description: The approval has already been decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WfErrorEnvelope'
        '422':
          description: decision must be `approved` or `rejected`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WfErrorEnvelope'
        '500':
          $ref: '#/components/responses/WfServerError'
  /auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Exchange credentials for a bearer token
      description: 'Returns an HMAC-SHA256 JWT-style token (24h expiry) carrying claims

        `user_id`, `organization_id`, `email`, `role`, `exp`. Use it as

        `Authorization: Bearer <token>` afterwards. No authentication required.

        '
      security: []
      x-required-permission: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: owner@acme.dev
              password: s3cret-password
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoi...
        '401':
          description: Invalid credentials (plain text body today).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LegacyTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      operationId: register
      tags:
      - auth
      summary: Register an organization and its first OWNER user
      description: 'Creates a new organization (ID pattern `org-<n>`) and a user with the

        default role `OWNER`. No authentication required. The response

        intentionally includes the stored user record as implemented today —

        including `PasswordHash` (bcrypt digest). This is a known contract

        wart tracked for removal; clients must treat it as opaque.

        '
      security: []
      x-required-permission: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              organization: Acme AI
              email: owner@acme.dev
              password: s3cret-password
      responses:
        '201':
          description: Organization and user created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                organization:
                  ID: org-1
                  Name: Acme AI
                user:
                  ID: user-1
                  Organization: org-1
                  Email: owner@acme.dev
                  PasswordHash: $2a$10$...
                  Role: OWNER
                  CreatedAt: '2025-01-01T12:00:00.123456789Z'
        '400':
          description: 'Missing field, invalid JSON body, or email already registered.

            Body is plain text today (http.Error); structured error is the

            target model.

            '
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LegacyTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the presented session token server-side (idempotent)
      description: 'Invalidates the presented HMAC session token immediately and

        server-side. The token''s revocation reference lands on the deny

        list with a TTL equal to the token''s remaining lifetime, so the

        entry self-expires when the token would have expired anyway; every

        subsequent request with the same token fails (401, "token has been

        revoked") on any protected endpoint. Idempotent: logging out an

        already-revoked or already-expired token answers 204 again. The

        credential is the presented bearer token only — no body, and API

        keys are not accepted (machine credentials are revoked through

        DELETE /api-keys/{id}). A successful logout is audit-logged

        (auth.logout) with the token reference, never token material.

        Tokens minted before issue #76 (no jti claim) are revoked under the

        SHA-256 of their full token string and are equally killable.

        '
      security:
      - bearerToken: []
      responses:
        '204':
          description: 'Token revoked (or already revoked/expired — idempotent). No

            response body. The token is dead on every protected endpoint

            from this moment.

            '
        '401':
          description: 'Missing or malformed Authorization header (error.code

            UNAUTHORIZED), or the presented credential is not a validly

            signed session token at all (error.code TOKEN_INVALID). Logout

            of a merely expired or already-revoked token is NOT this case —

            it answers 204.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLifecycleErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLifecycleErrorEnvelope'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a valid session token for a fresh one (single-use rotation)
      description: 'Rotates the presented session token: the old token is revoked

        server-side and a fresh token (rotated jti, full new 24h window,

        sliding session) is returned. Single-use by construction — the old

        token is revoked BEFORE the new one is minted, so replaying it (for

        another refresh or any protected endpoint) answers 401

        TOKEN_REVOKED; a rotation can never leave two live tokens. The

        fresh claims are re-derived from the user''s CURRENT stored identity

        row, so SCIM deprovisioning (active=false) and role changes apply

        exactly as they do at password login: a deprovisioned user is

        refused with 401 ACCOUNT_DISABLED (and no rotation happens — the

        old token''s validity is untouched by a failed refresh), and an

        identity that can no longer be resolved is refused with 401

        TOKEN_INVALID. A deny-list backend outage also fails closed (401).

        Successful rotations are audit-logged (auth.refresh) with the old

        and new token references, never token material.

        '
      security:
      - bearerToken: []
      responses:
        '200':
          description: 'Rotation complete. The old token is already dead server-side;

            the response carries the only live credential.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLifecycleRefreshResponse'
        '401':
          description: 'The presented token is invalid, malformed, expired, revoked

            (error.code TOKEN_INVALID or TOKEN_REVOKED — a revoked token is

            reported distinctly so single-use replay is observable), or the

            account has been deprovisioned (error.code ACCOUNT_DISABLED).

            UNAUTHORIZED is used when the Authorization header is missing

            or not a bearer token.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLifecycleErrorEnvelope'
        '500':
          description: Unexpected server failure (details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLifecycleErrorEnvelope'
