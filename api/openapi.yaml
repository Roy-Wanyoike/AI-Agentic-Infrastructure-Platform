  /queue/tasks:
    get:
      operationId: listQueueTasks
      summary: List the org's task-queue records (keyset-paginated, newest first)
      description: 'Returns one page of the caller''s organization''s task records, newest

        enqueue first, with an opaque next_cursor for keyset continuation.

        Use `limit` to size the page (clamped server-side to [1, 200];

        default 50) and pass `cursor` back unchanged to fetch the next page.

        `status` filters to exactly one engine state (queued | running |

        dead_letter | completed); an unknown value answers 400. Unscoped

        legacy tasks (predating org stamping) never match a scoped listing.

        '
      x-required-permission: runs.read (OWNER/ADMIN/MEMBER/VIEWER)
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - dead_letter
          - completed
        description: Exact engine-state filter. Omit to list every status.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Page size (clamped server-side; values <= 0 are a 400).
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque keyset cursor from the previous response's next_cursor. Malformed cursors answer 400 INVALID_CURSOR.
      responses:
        '200':
          description: One keyset page of task records (newest enqueue first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QtTaskListResponse'
              examples:
                firstPage:
                  summary: Latest page (next_cursor empty when exhausted)
                  value:
                    tasks:
                    - id: agent.run-2026-09-10T12-00-00-000000000Z
                      type: agent.run
                      status: dead_letter
                      attempts: 4
                      requeues: 0
                      last_error: agent timeout
                      payload:
                        organization_id: 6f1c9e52-1c76-4a2f-9a86-9f6d4d3e8a01
                        run_id: 8b0e6f9a-2b0d-4f0e-8a58-6f9b2c3d4e5f
                      created_at: '2026-09-10T12:00:00Z'
                      updated_at: '2026-09-10T12:04:00Z'
                    next_cursor: ''
        '400':
          description: Malformed cursor or invalid status/limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QtErrorEnvelope'
        '401':
          description: Missing or invalid credentials.
  /queue/tasks/{id}:
    get:
      operationId: getQueueTask
      summary: Inspect one task (attempts, last error, timestamps)
      description: 'Returns the caller''s organization''s record for one task, including

        the attempt counter, the requeues counter, the last handler error and

        the created/updated/requeued timestamps. Unknown AND foreign-

        organization ids answer the same 404 (no existence leak).

        '
      x-required-permission: runs.read (OWNER/ADMIN/MEMBER/VIEWER)
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/QtTaskId'
      responses:
        '200':
          description: The task record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QtTask'
        '404':
          description: Unknown or foreign-organization task id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QtErrorEnvelope'
        '401':
          description: Missing or invalid credentials.
  /queue/tasks/{id}/requeue:
    post:
      operationId: requeueQueueTask
      summary: Requeue a dead-lettered task (OWNER/ADMIN)
      description: 'Revives a dead_letter task: attempts reset to 0, last_error cleared,

        the requeues counter incremented, requeued_at stamped and created_at

        preserved; the task is appended back to the work list so workers pick

        it up. Attempt bookkeeping restarts from zero (a fresh retry budget),

        while the requeues counter keeps the operator-visible history.

        Requeueing a task in any other state (queued, running, completed) is

        409 CONFLICT — transient failures already requeue themselves inside

        the engine, so only the terminal dead_letter state is operator-

        requeueable. Unknown and foreign-organization ids are the same 404.

        Every successful requeue writes a queue.task_requeued audit row;

        refused operations write nothing. The operation is serialized per

        backend, so concurrent requeues yield exactly one work-list entry and

        one 409.

        '
      x-required-permission: queue.manage (OWNER/ADMIN; MEMBER/VIEWER denied 403)
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/QtTaskId'
      responses:
        '200':
          description: The requeued task record (status queued, attempts 0).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QtTask'
              example:
                id: agent.run-2026-09-10T12-00-00-000000000Z
                type: agent.run
                status: queued
                attempts: 0
                requeues: 1
                payload:
                  organization_id: 6f1c9e52-1c76-4a2f-9a86-9f6d4d3e8a01
                  run_id: 8b0e6f9a-2b0d-4f0e-8a58-6f9b2c3d4e5f
                created_at: '2026-09-10T12:00:00Z'
                updated_at: '2026-09-10T12:10:00Z'
                requeued_at: '2026-09-10T12:10:00Z'
        '404':
          description: Unknown or foreign-organization task id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QtErrorEnvelope'
        '409':
          description: The task is not in the requeueable dead_letter state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QtErrorEnvelope'
        '401':
          description: Missing or invalid credentials.
        '403':
          description: Caller lacks queue.manage (MEMBER/VIEWER). Body is the middleware's plain-text "forbidden".
