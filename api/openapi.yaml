          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolErrorEnvelope'
  /events:
    get:
      operationId: listEvents
      summary: List the org's domain event stream (activity feed)
      description: 'Returns one page of the caller''s organization''s events, newest first,

        with an opaque next_cursor for keyset continuation. Use `limit` to

        size the page (clamped server-side to [1, 200]; default 50) and pass

        `cursor` back unchanged to fetch the next page. Filters narrow the

        stream to one event `type` and/or one entity (`entity_type` +

        `entity_id`) and/or everything after `since` (RFC3339, inclusive).

        Requires MEMBER+ (runs.execute): VIEWER roles are denied 403.

        '
      x-required-permission: runs.execute (MEMBER+ — OWNER/ADMIN/MEMBER; VIEWER denied)
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Page size (clamped server-side; values <= 0 are a 400).
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque keyset cursor from the previous response's next_cursor. Malformed cursors answer 400 INVALID_CURSOR.
      - name: type
        in: query
        schema:
          type: string
        description: Exact contract event type, e.g. run.failed, agent.created. Unknown types answer 400 INVALID_REQUEST (the
          vocabulary is pinned).
      - name: entity_type
        in: query
        schema:
          type: string
        description: Exact resource_type match (the domain object the event is about, e.g. "run", "agent", "webhook").
      - name: entity_id
        in: query
        schema:
          type: string
        description: Exact resource_id match.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: RFC3339 inclusive lower bound on the event timestamp.
      responses:
        '200':
          description: One keyset page of events (newest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvEventListResponse'
              examples:
                firstPage:
                  summary: Latest page (next_cursor empty when exhausted)
                  value:
                    events:
                    - id: 6f1c9e52-1c76-4a2f-9a86-9f6d4d3e8a01
                      type: run.failed
                      entity_type: run
                      entity_id: 8b0e6f9a-2b0d-4f0e-8a58-6f9b2c3d4e5f
                      payload:
                        reason: quota_exceeded
                      timestamp: 2025-06-01 12:03:00+00:00
                    - id: 0d3a7c44-9f10-4b6e-9db2-2f8c5a1b7e02
                      type: agent.created
                      entity_type: agent
                      entity_id: a1b2c3d4-0000-4000-8000-000000000000
                      timestamp: 2025-06-01 12:01:00+00:00
                    next_cursor: ''
        '400':
          description: Invalid query parameter (error.code INVALID_REQUEST for a non-positive/non-integer limit, unknown event
            type or malformed since; INVALID_CURSOR for a malformed/stale cursor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvErrorEnvelope'
        '401':
          $ref: '#/components/responses/EvUnauthorized'
        '403':
          $ref: '#/components/responses/EvForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvErrorEnvelope'
        '503':
          description: Event retention is not wired in this deployment (error.code EVENTS_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvErrorEnvelope'
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: List the caller organization's audit trail (newest first, keyset-paginated)
      description: 'The append-only audit trail of the caller''s organization, newest

        first. The tenant is taken from the auth claims only — client-supplied

        organization ids are never trusted. Pagination is keyset-based on

        (created_at, id): pass the returned next_cursor back as the cursor

        query parameter; appends between pages can neither duplicate nor skip

        rows. next_cursor is the empty string when the trail is exhausted.

        '
      x-required-permission: audit.read
      security:
      - bearerToken: []
      - apiKey: []
      tags:
      - Audit
      parameters:
      - name: limit
        in: query
        required: false
        description: 'Page size (1-200; defaults to 50). Values above 200 are clamped

          server-side instead of erroring.

          '
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        required: false
        description: Opaque continuation token from a previous page's next_cursor.
        schema:
          type: string
      responses:
        '200':
          description: One page of the tenant's audit trail (empty array when nothing is recorded yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventsResponse'
        '400':
          description: Invalid query (non-integer/zero limit, or malformed cursor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected server failure (e.g. store unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditErrorEnvelope'
