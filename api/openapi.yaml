        application/json:
          schema:
            $ref: '#/components/schemas/VdfErrorEnvelope'
    VdfForbidden:
      description: Authenticated but lacking the agents.read permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VdfErrorEnvelope'
    WfUnauthorized:
      description: Missing/invalid credentials.
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/WfErrorEnvelope'
    WfForbidden:
