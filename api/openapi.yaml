  /usage/meters:
    get:
      operationId: listUsageMeters
      summary: Aggregated usage meters for the caller's organization
      description: 'Read (runs.execute, MEMBER+). Aggregates the caller''s organization''s

        metered activity over the half-open [from, to) window:

        runs_count (metered runs — the same runs.cost_cents aggregation that

        powers GET /usage/costs; only the counts are taken) and

        tool_calls_count (executed tool steps, step_type=''tool'').

        sandbox_seconds is intentionally absent: no durable sandbox-duration

        record exists today, and data is never invented.

        When STRIPE_API_KEY is configured, a successful read additionally

        triggers an async, idempotent sync of these meters to Stripe''s

        /v1/usage_records (see the fragment description); without the env key

        nothing leaves the process.

        '
      x-required-permission: runs.execute
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: from
        in: query
        required: false
        description: Window start (RFC3339 timestamp or YYYY-MM-DD date). Defaults to `to` minus 30 days.
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: Window end, exclusive (RFC3339 timestamp or YYYY-MM-DD date). Defaults to now.
        schema:
          type: string
      responses:
        '200':
          description: The aggregated meters with the effective window echo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmMetersResponse'
        '400':
          description: 'Unparsable or inverted window, or a window exceeding 366 days

            (error.code INVALID_TIME_RANGE).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmErrorEnvelope'
        '401':
          $ref: '#/components/responses/SmUnauthorized'
        '403':
          $ref: '#/components/responses/SmForbidden'
        '405':
          description: Method not allowed (the endpoint is GET-only).
        '500':
          $ref: '#/components/responses/SmInternal'
        '503':
          description: 'The meter source is not wired in this deployment

            (error.code METER_SOURCE_UNAVAILABLE).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmErrorEnvelope'
  /billing/margin:
    get:
      operationId: getBillingMargin
      summary: Cost basis vs plan price for the current subscription period
      description: 'Owner-only read (organization.manage). Computes the margin of the

        org''s CURRENT subscription period: margin_cents = plan.price_cents −

        round(Σ usage cost over [period_start, period_end)), with the cost

        basis taken from the same ledger that prices invoice run lines

        (runs.cost_cents aggregates — it always reconciles with

        GET /usage/costs and the invoice of the same window). margin_percent

        = (1 − cost/price) × 100 and is OMITTED when price_cents is 0.

        Overage pricing is not folded into revenue; unlimited plans

        (included_quota 0) compute identically; a cost above the price yields

        a negative (unclamped) margin; zero usage yields the full price

        (100%). For a canceled subscription the latest row''s last period is

        reported.

        '
      x-required-permission: organization.manage
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: The margin report for the current subscription period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmMarginResponse'
        '401':
          $ref: '#/components/responses/SmUnauthorized'
        '403':
          $ref: '#/components/responses/SmForbidden'
        '404':
          description: 'The organization never subscribed (error.code NO_SUBSCRIPTION) or

            the subscription''s plan no longer resolves (error.code

            PLAN_NOT_FOUND — margin cannot exist without a price).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmErrorEnvelope'
        '405':
          description: Method not allowed (the endpoint is GET-only).
        '500':
          $ref: '#/components/responses/SmInternal'
  /billing/plans:
    get:
      operationId: listBillingPlans
      summary: List the global plan catalog
      description: 'Read (runs.execute, MEMBER+). Returns every billable plan. Plans are

        global (non-tenant) catalog rows: price_cents is the monthly catalog

        price, included_quota is the included monthly run budget (0 =

        unlimited — never exceeded, never overaged) and metadata may carry

        pricing knobs such as {"overage_run_rate_cents": N}.

