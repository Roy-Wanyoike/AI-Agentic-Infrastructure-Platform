      - unlimited
      - consumed_runs
      - remaining_runs
      - exceeded
      - period_start
      - period_end
      properties:
        subscription_id:
          type: string
        status:
          type: string
          enum:
          - trial
          - active
          - past_due
          - canceled
          description: The subscription status the quota is reported against.
        included_runs:
          type: integer
          description: plan.included_quota (0 = unlimited).
        unlimited:
