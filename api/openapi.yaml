openapi: 3.1.0
info:
  title: AgentOS API
  version: 0.1.0
  summary: Multi-tenant AI-agent infrastructure platform API
  description: |
    AgentOS is a multi-tenant AI-agent infrastructure platform. This contract
    covers the versioned REST API (/api/v1), the worker pull endpoint, the
    Server-Sent Events (SSE) execution-event stream, and platform health /
    metrics endpoints.

    ## Authentication
    Two schemes are accepted on every protected endpoint (see
    `securitySchemes`):
    1. `bearerToken` — `Authorization: Bearer <token>` where `<token>` is the
       HMAC-SHA256 JWT-style token returned by `POST /auth/login`
       (registration creates the first OWNER user; log in to get a token).
    2. `apiKey` — `X-API-Key: ak_...` header. API keys are created server-side
       (dev key created at startup) and authenticate as the key's OWNER role.
    Browser `EventSource` clients that cannot set headers may pass
    `?api_key=<key>` as a query parameter (legacy compatibility).

    ## RBAC
    Permissions: `agents.read`, `agents.write`, `runs.read`, `runs.execute`,
    `users.manage`, `organization.manage`. Roles: `OWNER` (all), `ADMIN`
    (all but organization.manage), `MEMBER` (agents.read, runs.read,
    runs.execute), `VIEWER` (agents.read, runs.read). Each operation declares
    its required permission via `x-required-permission`.

    ## Multi-tenancy
    Requests are scoped to an organization derived from the auth token. For
    agent/run creation the body may carry `organization_id`; when omitted the
    authenticated principal's organization is used. Access to another
    organization's resources returns 403.

    ## Error model
    Target structured error (Content-Type application/json):
    `{"error":{"code":"not_found","message":"agent not found","request_id":"..."}}`.
    During migration, some handlers still emit `http.Error`-style
    `text/plain` bodies; the structured model is authoritative for new code.

    ## Pagination
    List endpoints (`GET /agents`, `GET /runs`) are **unpaginated** today;
    they return the full result set. This is a documented limitation and will
    change in a future minor version (see `x-unpaginated`).
  contact:
    name: AgentOS Platform Team
servers:
- url: /api/v1
  description: Canonical versioned base path.
- url: /
  description: |
    Legacy root where all /v1/* routes are served identically
    (e.g. /v1/agents). Deprecated alias kept for backward compatibility
    (cmd/worker and existing clients still use it).
tags:
- name: auth
  description: Registration and token issuance.
- name: agents
  description: Agent registry (multi-tenant).
- name: runs
  description: Agent executions and their event streams.
- name: queue
  description: Worker task pull (dev pull model).
- name: platform
  description: Health, readiness and metrics.
security:
- bearerToken: []
- apiKey: []
paths:
  /:
    get:
      operationId: getServiceInfo
      tags:
      - platform
      summary: Service identity banner (catch-all route)
      description: |
        Catch-all route returning the service identity. Reachable at the
        server root (outside the versioned base path). No authentication.
      security: []
      x-required-permission: null
      responses:
        '200':
          description: Service banner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    const: agentos-api
                  status:
                    type: string
                    const: running
                required:
                - service
                - status
              example:
                service: agentos-api
                status: running
  /agents:
    get:
      operationId: listAgents
      tags:
      - agents
      summary: List agents in the caller's organization
      description: |
        Returns a JSON **array** (not an envelope) of agents belonging to the
        requested organization. `organization_id` query parameter defaults to
        the authenticated principal's organization; cross-organization access
        is forbidden. Unpaginated today.
      x-required-permission: agents.read
      x-unpaginated: true
      parameters:
      - name: organization_id
        in: query
        required: false
        description: Organization to list; defaults to the caller's organization.
        schema:
          type: string
        example: org-1
      responses:
        '200':
          description: Array of agents (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
              example:
              - ID: agent-1
                OrganizationID: org-1
                Name: Support Agent
                Description: Demo customer support agent
                Instructions: Answer simple questions
                Model: gpt-4o-mini
                Status: DRAFT
                CurrentVersionID: version-agent-1-1
                CreatedAt: '2025-01-01T12:00:00.123456789Z'
                UpdatedAt: '2025-01-01T12:00:00.123456789Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agents/create:
    post:
      operationId: createAgent
      tags:
      - agents
      summary: Create an agent
      description: |
        Creates an agent in `DRAFT` status and an initial AgentVersion
        (version 1) which becomes `CurrentVersionID`. Required fields:
        `name`, `instructions`, `model` (service-side validation);
        `organization_id` defaults to the caller's organization.
      x-required-permission: agents.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            example:
              organization_id: org-1
              name: Support Agent
              description: Demo customer support agent
              instructions: Answer simple questions
              model: gpt-4o-mini
      responses:
        '201':
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              example:
                ID: agent-1
                OrganizationID: org-1
                Name: Support Agent
                Description: Demo customer support agent
                Instructions: Answer simple questions
                Model: gpt-4o-mini
                Status: DRAFT
                CurrentVersionID: version-agent-1-1
                CreatedAt: '2025-01-01T12:00:00.123456789Z'
                UpdatedAt: '2025-01-01T12:00:00.123456789Z'
        '400':
          description: Invalid body or validation failure (name/instructions/model required).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LegacyTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agents/{id}:
    get:
      operationId: getAgent
      tags:
      - agents
      summary: Get an agent by ID
      x-required-permission: agents.read
      parameters:
      - $ref: '#/components/parameters/AgentID'
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAgent
      tags:
      - agents
      summary: Update an agent (NOT IMPLEMENTED — returns the agent unchanged)
      description: |
        **Reality check (documented, not aspirational):** the shared detail
        handler (cmd/api/agents.go agentDetailHandler) has no method switch;
        PATCH behaves exactly like GET and does not mutate anything.
        `agents.write` is NOT currently enforced on this route (it is
        registered under `agents.read`). Updating happens server-side via
        version creation, not yet via the API.
      x-required-permission: agents.read
      x-note: not-implemented; returns current agent representation
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/AgentID'
      responses:
        '200':
          description: Current agent representation (unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAgent
      tags:
      - agents
      summary: Delete an agent (NOT IMPLEMENTED — returns the agent unchanged)
      description: |
        **Reality check (documented, not aspirational):** DELETE behaves
        exactly like GET; no data is deleted and `agents.write` is not
        enforced on this route today.
      x-required-permission: agents.read
      x-note: not-implemented; returns current agent representation
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/AgentID'
      responses:
        '200':
          description: Current agent representation (unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{id}/rollback:
    post:
      operationId: rollbackAgent
      summary: Re-point the agent to a target version and restore its snapshot config
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackAgentRequest'
      responses:
        '200':
          description: Target version is now the agent's current version (live config restored).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentVersionResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: target_version missing or not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /agents/{id}/versions:
    get:
      operationId: listAgentVersions
      summary: List an agent's immutable config versions (ascending)
      x-required-permission: agents.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      responses:
        '200':
          description: Config versions of the agent, ascending by version number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /agents/{id}/versions/create:
    post:
      operationId: createAgentVersion
      summary: Snapshot the agent's current configuration into a new draft version
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      responses:
        '201':
          description: Draft version created (numbered after the highest existing version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionNumberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /agents/{id}/versions/{version}/publish:
    post:
      operationId: publishAgentVersion
      summary: Mark a draft version immutable (published) and re-point the agent to it
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/AgentID'
      - name: version
        in: path
        required: true
        description: Version number to publish.
        schema:
          type: integer
          minimum: 1
        example: 3
      responses:
        '200':
          description: Version published (idempotent re-publish returns the same version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionNumberResponse'
        '400':
          description: Version path segment is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version is archived (revive it via rollback instead).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /approvals:
    get:
      operationId: listApprovals
      tags:
      - approvals
      summary: List the tenant's approvals
      x-required-permission: approvals.read
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by status (pending|approved|rejected|cancelled).
        schema:
          $ref: '#/components/schemas/ApprovalStatus'
      responses:
        '200':
          description: Approvals (unpaginated today).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '401':
          $ref: '#/components/responses/WfUnauthorized'
        '500':
          $ref: '#/components/responses/WfServerError'
  /approvals/{id}:
    get:
      operationId: getApproval
      tags:
      - approvals
      summary: Get one approval
      x-required-permission: approvals.read
      parameters:
      - $ref: '#/components/parameters/WfApprovalID'
      responses:
        '200':
          description: The approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
                required:
                - approval
        '401':
          $ref: '#/components/responses/WfUnauthorized'
        '404':
          $ref: '#/components/responses/WfNotFound'
        '500':
          $ref: '#/components/responses/WfServerError'
  /approvals/{id}/decide:
    post:
      operationId: decideApproval
      tags:
      - approvals
      summary: Approve or reject an approval
      description: |
        Sets the approver from the authenticated principal and decided_at to
        now. When the decision is `approved` and a run is linked, the paused
        run is resumed (status back to `pending`). Deciding twice returns 409.
      x-required-permission: approvals.decide
      parameters:
      - $ref: '#/components/parameters/WfApprovalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideApprovalRequest'
            example:
              decision: approved
              reason: Verified the deployment plan
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
                required:
                - approval
        '400':
          $ref: '#/components/responses/WfBadRequest'
        '401':
          $ref: '#/components/responses/WfUnauthorized'
        '403':
          $ref: '#/components/responses/WfForbidden'
        '404':
          $ref: '#/components/responses/WfNotFound'
        '409':
          description: The approval has already been decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WfErrorEnvelope'
        '422':
          description: decision must be `approved` or `rejected`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WfErrorEnvelope'
        '500':
          $ref: '#/components/responses/WfServerError'
  /auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Exchange credentials for a bearer token
      description: |
        Returns an HMAC-SHA256 JWT-style token (24h expiry) carrying claims
        `user_id`, `organization_id`, `email`, `role`, `exp`. Use it as
        `Authorization: Bearer <token>` afterwards. No authentication required.
      security: []
      x-required-permission: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: owner@acme.dev
              password: s3cret-password
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoi...
        '401':
          description: Invalid credentials (plain text body today).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LegacyTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      operationId: register
      tags:
      - auth
      summary: Register an organization and its first OWNER user
      description: |
        Creates a new organization (ID pattern `org-<n>`) and a user with the
        default role `OWNER`. No authentication required. The response
        intentionally includes the stored user record as implemented today —
        including `PasswordHash` (bcrypt digest). This is a known contract
        wart tracked for removal; clients must treat it as opaque.
      security: []
      x-required-permission: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              organization: Acme AI
              email: owner@acme.dev
              password: s3cret-password
      responses:
        '201':
          description: Organization and user created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                organization:
                  ID: org-1
                  Name: Acme AI
                user:
                  ID: user-1
                  Organization: org-1
                  Email: owner@acme.dev
                  PasswordHash: $2a$10$...
                  Role: OWNER
                  CreatedAt: '2025-01-01T12:00:00.123456789Z'
        '400':
          description: |
            Missing field, invalid JSON body, or email already registered.
            Body is plain text today (http.Error); structured error is the
            target model.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LegacyTextError'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /deployments:
    get:
      operationId: listDeployments
      summary: List deployments, optionally filtered by agent
      x-required-permission: deployments.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - name: agent_id
        in: query
        required: false
        description: Restrict the listing to one agent.
        schema:
          type: string
        example: agent-1
      responses:
        '200':
          description: Deployments of the tenant (newest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /deployments/create:
    post:
      operationId: createDeployment
      summary: Create a deployment (status requested) of a published agent version
      x-required-permission: deployments.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '201':
          description: Deployment created in status `requested`; advance it with promote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Validation failed (VALIDATION_ERROR for bad environment/fields;
            VERSION_NOT_PUBLISHED when the target version does not exist or is
            not published).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /deployments/{id}:
    get:
      operationId: getDeployment
      summary: Fetch one deployment
      x-required-permission: deployments.read
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/DeploymentID'
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /deployments/{id}/promote:
    post:
      operationId: promoteDeployment
      summary: Advance the lifecycle one step (requested -> validated -> deploying -> healthy)
      x-required-permission: deployments.deploy
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/DeploymentID'
      responses:
        '200':
          description: Deployment advanced one step (a worker replaces explicit promote later).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Terminal status (healthy/failed) cannot advance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /deployments/{id}/rollback:
    post:
      operationId: rollbackDeployment
      summary: Re-point the environment to the previous healthy deployment's version
      x-required-permission: deployments.deploy
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/DeploymentID'
      responses:
        '200':
          description: Environment re-pointed; response carries the new healthy deployment and the version
            it serves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackDeploymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No previous healthy deployment exists for this agent+environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /eval-datasets:
    get:
      operationId: listEvalDatasets
      summary: List evaluation datasets (tenant-scoped)
      security:
      - bearerToken: []
      - apiKey: []
      tags:
      - Evaluations
      responses:
        '200':
          description: Datasets of the caller's organization, newest first.
          content:
            application/json:
              schema:
                type: object
                required:
                - datasets
                properties:
                  datasets:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvalDatasetSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /eval-datasets/create:
    post:
      operationId: createEvalDataset
      summary: Create an evaluation dataset with its cases
      description: |
        Validates every case before persisting: supported scorers are
        `exact`, `contains`, `regex`, `latency_under_ms`, `cost_under_cents`;
        `regex` requires `params.pattern` (compilable), `latency_under_ms`
        requires `params.threshold_ms > 0`, `cost_under_cents` requires
        `params.threshold_cents > 0`; case ids must be unique (auto-generated
        when omitted); at most 50 cases per dataset.
      security:
      - bearerToken: []
      - apiKey: []
      tags:
      - Evaluations
