            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
  /organization/members:
    get:
      operationId: listOrganizationMembers
      summary: List the members of the caller's organization (id, email, name, role, joined_at)
      description: 'Read operation (runs.execute, MEMBER+ — viewers are excluded, same

        convention as the api-keys list). Returns the membership rows of the

        caller''s tenant joined with the identity directory, ordered oldest

        member first. `name` is a display fallback derived from the email

        local part — the platform identity model has no display-name column

        (the SCIM 2.0 resource omits the attribute for the same reason), so

        no profile data is invented. `joined_at` is the membership row''s

        creation timestamp. A membership row without a matching identity row

        projects empty email/name rather than being silently dropped.

        '
      x-required-permission: runs.execute
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Member list (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberListResponse'
        '401':
          $ref: '#/components/responses/OrgUnauthorized'
        '403':
          $ref: '#/components/responses/OrgForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
    post:
      operationId: addOrganizationMember
      summary: Add an existing platform user (by email) to the caller's organization
      description: 'Write operation (users.manage, OWNER/ADMIN). Resolves the user by

        email through the identity directory — only EXISTING users can be

        invited (unknown emails are 404 USER_NOT_FOUND; the API never

        creates accounts or sends invitations). The membership is created in

        the CALLER''s tenant with the requested role (case-insensitive,

        normalized). Duplicates are 409 ALREADY_MEMBER. Roles use the

        OWNER/ADMIN/MEMBER/VIEWER enum; anything else is 422

        VALIDATION_ERROR. Adding a user as OWNER creates an additional

        owner (the last-owner guard then protects the pair). A removed

        member can be re-invited: re-adding reactivates their login through

        the same org-guarded store path SCIM uses for re-enabling. The

        tenant comes from the auth claims; the operation is audit-logged

        (organization.member_added).

        '
      x-required-permission: users.manage
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgMemberAddRequest'
      responses:
        '201':
          description: Membership created; the member projection echoes the stored row (normalized role, real joined_at).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberMutationResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '401':
          $ref: '#/components/responses/OrgUnauthorized'
        '403':
          $ref: '#/components/responses/OrgForbidden'
        '404':
          description: 'Unknown email (error.code USER_NOT_FOUND) or the organization

            directory does not know the caller''s tenant (error.code

            ORGANIZATION_NOT_FOUND).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '409':
          description: The user already has a membership row in the caller's tenant (error.code ALREADY_MEMBER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '422':
          description: Blank email or role outside the OWNER/ADMIN/MEMBER/VIEWER enum (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
  /organization/members/{userId}:
    patch:
      operationId: updateOrganizationMemberRole
      summary: Change a member's role (OWNER only; the last OWNER cannot be demoted)
      description: 'Write operation (organization.manage — exactly OWNER, the same

        matrix as POST /scim/tokens: role changes are owner-level, which is

        why ADMINs — who can add and remove members — cannot change roles).

        The membership row is updated org-guarded: unknown and

        foreign-organization user ids are 404 MEMBER_NOT_FOUND with no

        existence leak. Demoting the last OWNER membership row of the tenant

        is rejected with 409 LAST_OWNER before anything is written.

        Re-asserting OWNER stays allowed. The operation is audit-logged

        (organization.member_role_updated, from_role/to_role metadata).

        '
      x-required-permission: organization.manage
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/OrgMemberUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgMemberRoleUpdateRequest'
      responses:
        '200':
          description: Role changed; the member projection echoes the stored row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberMutationResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '401':
          $ref: '#/components/responses/OrgUnauthorized'
        '403':
          description: Authenticated but not an OWNER (error.code FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '404':
          description: Unknown or foreign-organization user id (error.code MEMBER_NOT_FOUND — no existence leak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '409':
          description: The target is the last OWNER membership row of the tenant (error.code LAST_OWNER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '422':
          description: Role outside the OWNER/ADMIN/MEMBER/VIEWER enum (error.code VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
    delete:
      operationId: removeOrganizationMember
      summary: Remove a member (OWNER/ADMIN; the last OWNER cannot be removed; deactivates the member's login)
      description: 'Write operation (users.manage, OWNER/ADMIN). Removes the membership

        row org-guarded (unknown/foreign ids are 404 MEMBER_NOT_FOUND) and

        deactivates the member''s login through the SAME org-guarded store

        path the SCIM 2.0 service uses on deprovisioning — the member''s next

        password login fails with auth.ErrAccountDisabled until they are

        re-invited. Removing the last OWNER membership row is rejected with

        409 LAST_OWNER. For a cross-org invitee the org guard refuses the

        account deactivation (their login belongs to their home tenant) and

        only the membership row is removed. The operation is audit-logged

        (organization.member_removed, role-at-removal metadata).

        '
      x-required-permission: users.manage
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/OrgMemberUserId'
      responses:
        '200':
          description: Membership removed and login deactivated (see description).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberRemoveResponse'
        '401':
          $ref: '#/components/responses/OrgUnauthorized'
        '403':
          $ref: '#/components/responses/OrgForbidden'
        '404':
          description: Unknown or foreign-organization user id (error.code MEMBER_NOT_FOUND — no existence leak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '409':
          description: The target is the last OWNER membership row of the tenant (error.code LAST_OWNER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgErrorEnvelope'
  /mcp:
    post:
      operationId: invokeMcpEndpoint
      summary: MCP JSON-RPC 2.0 endpoint (initialize / tools/list / tools/call / ping)
      description: 'Single stateless JSON-RPC 2.0 endpoint. Exactly one request object

        per HTTP request; batches are rejected with -32600. Notifications

        (requests without an id) answer 204 No Content with no body.


        Method-level authorization is applied inside the endpoint:

        initialize and ping need only authentication, while tools/list and

        tools/call additionally require the runs.execute permission

        (OWNER/ADMIN/MEMBER). Viewers receive the in-band JSON-RPC error

        -32000 (HTTP 200) instead of an HTTP 403, so MCP clients surface a

        protocol-level error.


        tools/call executes through the existing internal/tools execution

        path — the same registry the agent runtime uses, so tool-side

        validation (e.g. the calculator''s expression grammar, the

        http_request tool''s SSRF protection) applies natively. Results are

        mapped to MCP content blocks: [{"type":"text","text":"<json or

        error>"}].

        '
      x-required-permission: runs.execute
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpJSONRPCRequest'
            examples:
              initialize:
                summary: Protocol handshake
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: '2025-06-18'
                    capabilities: {}
                    clientInfo:
                      name: claude
                      version: '1.0'
              toolsList:
                summary: List the tenant-visible tools
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/list
              toolsCall:
                summary: Execute the calculator tool
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: calculator
                    arguments:
                      expression: 6*7
              ping:
                summary: Liveness probe
                value:
                  jsonrpc: '2.0'
                  id: 4
                  method: ping
      responses:
        '200':
          description: 'JSON-RPC response (success result, or an in-band error: -32601

            method not found, -32602 invalid params / unknown tool, -32603

            internal, -32000 forbidden for the tool surface).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpJSONRPCResponse'
        '204':
          description: 'Notification accepted (request without id): no response body by

            the JSON-RPC spec.

            '
        '400':
          description: 'Transport-level JSON-RPC rejection: -32700 parse error or

            -32600 invalid request (including batch bodies). The body is

            still a JSON-RPC error envelope with id null.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpJSONRPCResponse'
        '401':
          description: 'Missing or invalid credentials. The platform auth middleware

            answers a plain-text 401 (no JSON-RPC envelope), consistent

            with every other authenticated route.

            '
        '413':
          description: 'Request body exceeds the 1 MiB cap; body is a JSON-RPC error

            envelope (-32600) with id null.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpJSONRPCResponse'
  /secrets:
    post:
      operationId: createSecret
      summary: Create one org-scoped secret (value sealed server-side)
      description: 'Write operation (agents.write, OWNER/ADMIN). Body carries the secret

        `name` and plaintext `value`; the value is sealed with AES-256-GCM

        under the current master-key version before storage and is never

        echoed back, logged, or persisted in plaintext. Names must match

        `[A-Za-z0-9][A-Za-z0-9._-]{0,254}` (URL-path safe, env-var friendly);

        values are capped at 64 KiB. Duplicate (org, name) among live secrets

        is a 409. The tenant is derived from the auth claims — any

        client-supplied organization id is ignored.

        '
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecCreateRequest'
      responses:
        '201':
          description: Secret created (metadata only — the value is never echoed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecResponse'
        '400':
          description: Malformed JSON body (error.code INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '409':
          description: A live secret with the same name already exists in the caller's organization (error.code SECRET_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '422':
          description: 'Validation error: missing org/name/value, invalid name charset, or

            value above the 64 KiB limit (error.code VALIDATION_ERROR).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure (also covers key-material failures; details are never surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
    get:
      operationId: listSecrets
      summary: List secret metadata for the caller's organization (never values)
      description: 'Read operation (runs.execute, MEMBER+ — viewers are excluded because

        even secret NAMES are sensitive). Returns metadata only: name, the

        key_version that encrypted each value, created_by and timestamps. The

        response schema has no value field and the server never includes the

        plaintext in list responses. Results are ordered by name ASC.

        '
      x-required-permission: runs.execute
      security:
      - bearerToken: []
      - apiKey: []
      responses:
        '200':
          description: Metadata list (possibly empty; values are structurally absent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecListResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
  /secrets/{name}:
    delete:
      operationId: deleteSecret
      summary: Soft-delete one secret (tombstone; name becomes reusable)
      description: 'Write operation (agents.write, OWNER/ADMIN). Sets the deleted_at

        tombstone; every subsequent read/resolve behaves as 404 and the name

        can be recreated fresh. Foreign or unknown names surface as 404

        (no existence leak across tenants). Deletion is audit-logged.

        '
      x-required-permission: agents.write
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/SecName'
      responses:
        '200':
          description: Secret tombstoned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecDeleteResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          $ref: '#/components/responses/SecForbidden'
        '404':
          description: Secret not found within the caller's organization (error.code SECRET_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
  /secrets/{name}/reveal:
    post:
      operationId: revealSecret
      summary: Return the plaintext value once (OWNER only, audit-logged)
      description: 'OWNER-only operation (organization.manage). Decrypts the sealed value

        and returns it exactly once inside the secret object; this is the only

        response in the whole API that carries a plaintext secret. Every call

        writes a `secret.revealed` audit entry (the value itself is never part

        of the audit metadata). Foreign/unknown/tombstoned names are 404.

        '
      x-required-permission: organization.manage
      security:
      - bearerToken: []
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/SecName'
      responses:
        '200':
          description: The decrypted value (single-use response; never cached or logged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecRevealResponse'
        '401':
          $ref: '#/components/responses/SecUnauthorized'
        '403':
          description: Authenticated but not an OWNER (organization.manage is OWNER-only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '404':
          description: Secret not found within the caller's organization (error.code SECRET_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
        '500':
          description: Unexpected server failure (e.g. decryption failed under the configured master key; details are never
            surfaced).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecErrorEnvelope'
  /tools:
    get:
      operationId: listRegisteredTools
      summary: List the runtime's registered tools (name, description, input schema)
      description: 'Read-only catalog of the agent tool registry: the built-in tools plus

        anything else registered by the serving process. Tool registrations

