        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillErrorEnvelope'
    BillInternal:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillErrorEnvelope'
    SecUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecErrorEnvelope'
    SecForbidden:
      description: Authenticated but lacking the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecErrorEnvelope'
    MktUnauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MktError'
    MktForbidden:
      description: Authenticated but not permitted for this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MktError'
    MktNotFound:
      description: Listing not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MktError'
    ConUnauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConErrorEnvelope'
    ConForbidden:
      description: Authenticated but lacking the required permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConErrorEnvelope'
  schemas:

    ApiKeyCreateRequest:
      type: object
      description: Mint payload. Only the display name is supplied; the secret itself is generated server-side.
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable key name (e.g. "ci-deploy", "worker-poll").
          examples:
          - ci-deploy
      required:
      - name
    ApiKeyMetadata:
      type: object
      description: |
        Credential-free metadata projection. This is the ONLY shape list
        endpoints return; the plaintext value and the persisted SHA-256 hash
        are structurally absent (no `value` and no `hash` property exists on
        this schema).
      properties:
        id:
          type: string
          description: Key id used for revocation.
        name:
          type: string
        prefix:
          type: string
          description: |
            Display prefix ("ak_" + the first 8 secret characters) for
            identification in dashboards; authenticates nothing by itself.
          examples:
          - ak_1a2b3c4d
        created_by:
          type: string
          description: User id of the minting principal.
        created_at:
          type: string
          format: date-time
        revoked:
          type: boolean
          description: True once the key has been revoked (revoked keys never authenticate again).
      required:
      - id
      - name
      - prefix
      - created_by
      - created_at
      - revoked
    ApiKeyCreatedResponse:
      type: object
      description: |
        Mint response. `api_key` is metadata-only; `value` is the plaintext
        credential and appears EXACTLY HERE and EXACTLY ONCE — the service
        stores only the hash and can never return the value again.
      properties:
        api_key:
          $ref: '#/components/schemas/ApiKeyMetadata'
        value:
          type: string
          pattern: '^ak_[0-9a-f]{64}$'
          description: The plaintext API key. Appears exactly here and exactly once.
      required:
      - api_key
      - value
    ApiKeyListResponse:
      type: object
      properties:
        api_keys:
          type: array
          description: Metadata-only views ordered newest first; empty when the organization has no keys.
          items:
            $ref: '#/components/schemas/ApiKeyMetadata'
      required:
      - api_keys
    ApiKeyRevokeResponse:
      type: object
      properties:
        revoked:
          type: boolean
          description: Always true on success (including idempotent re-revocation).
      required:
      - revoked
    ApiKeyErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of API_KEY_NOT_FOUND, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - API_KEY_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    LegacyTextError:
      type: string
      description: Legacy plain-text error body emitted via http.Error during migration.
      example: agent not found
    Error:
      type: object
      description: Structured error model (internal/httpx.ErrorModel).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable stable error code (e.g. unauthorized, forbidden, not_found, bad_request, internal_error).
              examples:
              - not_found
            message:
              type: string
              description: Human-readable message.
              examples:
              - agent not found
            request_id:
              type: string
              description: Correlation ID echoed from the X-Request-ID header (or generated per request).
              examples:
              - 1b8f0c47e51d2a3c4d5e6f708192a3b4
          required:
          - code
          - message
          - request_id
      required:
      - error
    Organization:
      type: object
      description: Tenant organization (auth.Organization; no json tags — PascalCase keys).
      properties:
        ID:
          type: string
          examples:
          - org-1
        Name:
          type: string
          examples:
          - Acme AI
      required:
      - ID
      - Name
    User:
      type: object
      description: 'User record (auth.User; no json tags — PascalCase keys). NOTE: the

        register response currently includes PasswordHash (bcrypt digest);

        treat as opaque and do not log it.

        '
      properties:
        ID:
          type: string
          examples:
          - user-1
        Organization:
          type: string
          description: Organization ID the user belongs to.
          examples:
          - org-1
        Email:
          type: string
          format: email
          examples:
          - owner@acme.dev
        PasswordHash:
          type: string
          description: bcrypt digest (exposed today by register; scheduled for removal).
          examples:
          - $2a$10$...
        Role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - MEMBER
          - VIEWER
        CreatedAt:
          type: string
          format: date-time
      required:
      - ID
      - Organization
      - Email
      - Role
      - CreatedAt
    RegisterRequest:
      type: object
      properties:
        organization:
          type: string
          description: New organization name.
          examples:
          - Acme AI
        email:
          type: string
          format: email
          examples:
          - owner@acme.dev
        password:
          type: string
          format: password
          writeOnly: true
          examples:
          - s3cret-password
      required:
      - organization
      - email
      - password
    RegisterResponse:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        user:
          $ref: '#/components/schemas/User'
      required:
      - organization
      - user
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          examples:
          - owner@acme.dev
        password:
          type: string
          format: password
          writeOnly: true
          examples:
          - s3cret-password
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: HMAC-SHA256 JWT-style bearer token (24h expiry).
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoi...
      required:
      - token
    Agent:
      type: object
      description: 'Agent record (agents.Agent; no json tags — PascalCase keys as

        serialized by encoding/json today).

        '
      properties:
        ID:
          type: string
          examples:
          - agent-1
        OrganizationID:
          type: string
          examples:
          - org-1
        Name:
          type: string
          examples:
          - Support Agent
        Description:
          type: string
          examples:
          - Demo customer support agent
        Instructions:
          type: string
          examples:
          - Answer simple questions
        Model:
          type: string
          examples:
          - gpt-4o-mini
        Status:
          type: string
          description: Lifecycle status; new agents start as DRAFT.
          enum:
          - DRAFT
          - ACTIVE
          - DISABLED
        CurrentVersionID:
          type: string
          examples:
          - version-agent-1-1
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      required:
      - ID
      - OrganizationID
      - Name
      - Instructions
      - Model
      - Status
      - CreatedAt
      - UpdatedAt
    AgentVersion:
      type: object
      description: 'Immutable agent configuration version (agents.AgentVersion). Not yet

        exposed via a dedicated HTTP route; part of the domain contract for

        upcoming version endpoints.

        '
      properties:
        ID:
          type: string
          examples:
          - version-agent-1-1
        AgentID:
          type: string
          examples:
          - agent-1
        Version:
          type: integer
          description: Monotonically increasing version number starting at 1.
          examples:
          - 1
        Instructions:
          type: string
        Model:
          type: string
        CreatedAt:
          type: string
          format: date-time
      required:
      - ID
      - AgentID
      - Version
      - Instructions
      - Model
      - CreatedAt
    CreateAgentRequest:
      type: object
      properties:
        organization_id:
          type: string
          description: Optional; defaults to the authenticated principal's organization.
          examples:
          - org-1
        name:
          type: string
          examples:
          - Support Agent
        description:
          type: string
          examples:
          - Demo customer support agent
        instructions:
          type: string
          examples:
          - Answer simple questions
        model:
          type: string
          examples:
          - gpt-4o-mini
      required:
      - name
      - instructions
      - model
    Run:
      type: object
      description: 'Agent execution record (runs.Run; no json tags — PascalCase keys).

        Status transitions: QUEUED → RUNNING → COMPLETED | FAILED.

        '
      properties:
        ID:
          type: string
          description: UUID v4.
          examples:
          - 3f6c2b62-2b57-4f8e-9e4e-2f4d3b6c9a10
        OrganizationID:
          type: string
          examples:
          - org-1
        AgentID:
          type: string
          examples:
          - agent-1
        Input:
          type: string
          examples:
          - What is 2+2?
        Output:
          type: string
          description: Final output once the run completes (empty until then).
          examples:
          - The result of 2+2 is 4
        Status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      required:
      - ID
      - OrganizationID
      - AgentID
      - Status
      - CreatedAt
      - UpdatedAt
    RunStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - COMPLETED
      - FAILED
      description: Run lifecycle states (runs.RunStatus).
    CreateRunRequest:
      type: object
      properties:
        organization_id:
          type: string
          description: Optional; defaults to the authenticated principal's organization.
          examples:
          - org-1
        agent_id:
          type: string
          examples:
          - agent-1
        input:
          type: string
          description: Prompt/task input handed to the agent.
          examples:
          - What is 2+2?
      required:
      - agent_id
      - input
    CreateRunResponse:
      type: object
      properties:
        run_id:
          type: string
          description: 'Created run ID (fallback: queue task ID if the runs service is unavailable).'
          examples:
          - 3f6c2b62-2b57-4f8e-9e4e-2f4d3b6c9a10
        status:
          type: string
          const: queued
      required:
      - run_id
      - status
    ListRunsResponse:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
      required:
      - runs
    RunEvent:
      type: object
      description: 'Execution event as delivered over SSE (`data:` frame payload) and in

        the JSON history envelope (snake_case keys — built in the handler).

        '
      properties:
        run_id:
          type: string
        type:
          type: string
          description: Event category (today always `status`).
          examples:
          - status
        name:
          type: string
          description: Event name; the key clients should switch on.
          examples:
          - status.changed
        payload:
          type: object
          description: 'Event-specific data. For `status.changed`:

            `{status: QUEUED|RUNNING|COMPLETED|FAILED, output?, ts?}` where

            `output` appears on COMPLETED and `ts` is an RFC3339 worker timestamp.

            '
        created_at:
          type: string
          format: date-time
          description: RFC3339Nano UTC timestamp of event creation.
      required:
      - run_id
      - type
      - name
      - payload
      - created_at
    RunEventsResponse:
      type: object
      description: JSON history envelope returned when Accept is not text/event-stream.
      properties:
        run_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
      required:
      - run_id
      - events
    PublishEventRequest:
      type: object
      properties:
        type:
          type: string
          examples:
          - status
        name:
          type: string
          examples:
          - status.changed
        payload:
          type: object
          additionalProperties: true
      required:
      - type
      - name
      - payload
    Task:
      type: object
      description: 'Queue task delivered to workers (queue.Task; no json tags — PascalCase

        keys). Status values: queued, running, completed, dead_letter.

        '
      properties:
        ID:
          type: string
          examples:
          - agent.run-2025-01-01T12:00:00.123456789Z
        Type:
          type: string
          examples:
          - agent.run
        Payload:
          type: object
          additionalProperties: true
          description: 'For `agent.run`: {organization_id, agent_id, input, run_id};

            the worker augments it with result and status on completion.

            '
        Status:
          type: string
          enum:
          - queued
          - running
          - completed
          - dead_letter
        Attempts:
          type: integer
          description: Attempt count; tasks move to dead_letter after 4 failed attempts.
          examples:
          - 0
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        LastError:
          type: string
          description: Last processing error message (empty when none).
      required:
      - ID
      - Type
      - Payload
      - Status
      - Attempts
      - CreatedAt
      - UpdatedAt
      - LastError
    MetricsResponse:
      type: object
      description: 'Metrics snapshot (metricsHandler). `counts` maps metric keys to

        counters; `latency` maps metric keys to the latest observed duration

        in seconds; `queue_length` is the current in-memory queue depth.

        '
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Counter snapshot keyed by metric name/label key.
        latency:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Latest observed duration (seconds) keyed by metric name/label key.
        queue_length:
          type: integer
          examples:
          - 3
      required:
      - counts
      - latency
      - queue_length
    RunStep:
      type: object
      description: 'One recorded execution step of a run''s timeline (runs.Step; no json

        tags — PascalCase keys). StepType is `model` or `tool`; Status is

        `succeeded`, `failed` or `PENDING`.

        '
      properties:
        ID:
          type: string
        RunID:
          type: string
        StepType:
          type: string
          enum:
          - model
          - tool
          - PENDING
        Status:
          type: string
          enum:
          - succeeded
          - failed
          - PENDING
        InputMeta:
          type: object
          additionalProperties: true
          description: e.g. {input, name, index}
        OutputMeta:
          type: object
          additionalProperties: true
          description: e.g. {output}
        Error:
          type: string
        TokenUsage:
          type: object
          additionalProperties: true
          description: e.g. {prompt_tokens, completion_tokens, total_tokens}
        Cost:
          type: number
          format: double
        StartedAt:
          type: string
          format: date-time
        CompletedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
    RunStepsResponse:
      type: object
      properties:
        run_id:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RunStep'
    EvalErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
    EvalParams:
      type: object
      properties:
        pattern:
          type: string
          description: Regular expression for the regex scorer.
        threshold_ms:
          type: number
          format: double
          description: Inclusive latency ceiling (ms) for latency_under_ms.
        threshold_cents:
          type: number
          format: double
          description: Inclusive cost ceiling (cents) for cost_under_cents.
    EvalCase:
      type: object
      required:
      - scorer
      properties:
        id:
          type: string
          description: Caller-supplied case id (auto-generated UUID when omitted); unique per dataset.
          example: c1
        input:
          type: string
        expected:
          type: string
          description: Expected output (exact/contains) — regex and threshold scorers use params.
        scorer:
          type: string
          enum:
          - exact
          - contains
          - regex
          - latency_under_ms
          - cost_under_cents
        params:
          $ref: '#/components/schemas/EvalParams'
    EvalDatasetSummary:
      type: object
      required:
      - id
      - name
      - case_count
      - created_at
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        case_count:
          type: integer
        created_at:
          type: string
          format: date-time
    EvalDataset:
      allOf:
      - $ref: '#/components/schemas/EvalDatasetSummary'
      - type: object
        properties:
          cases:
            type: array
            items:
              $ref: '#/components/schemas/EvalCase'
    EvalResult:
      type: object
      required:
      - case_id
      - output
      - passed
      - score
      - latency_ms
      - cost_cents
      - error
      properties:
        case_id:
          type: string
        output:
          type: string
        passed:
          type: boolean
        score:
          type: number
          format: double
          example: 1.0
        latency_ms:
          type: number
          format: double
        cost_cents:
          type: number
          format: double
          description: 0 until the runtime exposes cost.
        error:
          type: string
          description: Empty when the case executed and scored cleanly.
    EvalSummary:
      type: object
      required:
      - pass_rate
      - avg_latency_ms
      - total_cost_cents
      - by_scorer
      properties:
        pass_rate:
          type: number
          format: double
          example: 0.83
        avg_latency_ms:
          type: number
          format: double
          example: 420
        total_cost_cents:
          type: number
          format: double
          example: 37
        by_scorer:
          type: object
          additionalProperties:
            type: object
            required:
            - passed
            - failed
            properties:
              passed:
                type: integer
              failed:
                type: integer
    EvalRunResponse:
      type: object
      required:
      - id
      - dataset_id
      - agent_id
      - status
      - results
      - summary
      properties:
        id:
          type: string
        dataset_id:
          type: string
        agent_id:
          type: string
        status:
          type: string
          enum:
          - running
          - completed
          - failed
        results:
          type: array
          items:
            $ref: '#/components/schemas/EvalResult'
        summary:
          $ref: '#/components/schemas/EvalSummary'
    EvalCaseComparison:
      type: object
      required:
      - case_id
      - baseline_passed
      - candidate_passed
      properties:
        case_id:
          type: string
        baseline_passed:
          type: boolean
        candidate_passed:
          type: boolean
    EvalComparison:
      type: object
      required:
      - baseline
      - candidate
      - regressions
      - improvements
      properties:
        baseline:
          $ref: '#/components/schemas/EvalSummary'
        candidate:
          $ref: '#/components/schemas/EvalSummary'
        regressions:
          type: array
          items:
            $ref: '#/components/schemas/EvalCaseComparison'
        improvements:
          type: array
          items:
            $ref: '#/components/schemas/EvalCaseComparison'
    PolicyConditions:
      type: object
      description: 'Applicability predicates for a policy. An absent condition does not

        restrict the policy. See POST /policies/evaluate for the semantics.

        '
      properties:
        tool_allowlist:
          type: array
          description: Restricts the policy to the listed tool ids/names.
          items:
            type: string
        max_cost_cents:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: 'When set, the policy applies to requests whose estimated cost

            exceeds this cap (budget-guard condition).

            '
        environments:
          type: array
          description: Restricts the policy to the listed environments.
          items:
            type: string
            enum:
            - development
            - staging
            - production
        require_approval:
          type: boolean
          description: 'Not a match predicate; when the winning policy carries it the

            decision reason notes that approval is required.

            '
    Policy:
      type: object
      required:
      - name
      - effect
      - resource_type
      - actions
      - conditions
      - priority
      - enabled
      - created_at
      - updated_at
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        effect:
          type: string
          enum:
          - allow
          - deny
        resource_type:
          type: string
          enum:
          - tool
          - agent
          - workflow
          - deployment
          - '*'
        actions:
          type: array
          description: 'Actions this policy governs, e.g. ["runs.execute","tools.call"].

            An empty list matches every action.

            '
          items:
            type: string
        conditions:
          $ref: '#/components/schemas/PolicyConditions'
        priority:
          type: integer
          description: Higher wins; ties resolve deny-over-allow.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC3339 UTC.
    PolicyResponse:
      type: object
      required:
      - policy
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
    PolicyListResponse:
      type: object
      required:
      - policies
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
    PolicyEvaluateRequest:
      type: object
      required:
      - action
      - resource
      - context
      properties:
        subject:
          type: object
          description: Informational caller identity.
          properties:
            user_id:
              type: string
            role:
              type: string
            api_key_id:
              type: string
        action:
          type: string
          description: The governed action, e.g. tools.call or runs.execute.
        resource:
          type: object
          properties:
            type:
              type: string
              enum:
              - tool
              - agent
              - workflow
              - deployment
              - '*'
            id:
              type: string
            tenant_id:
              type: string
              description: Informational; the actual scope comes from auth.
        context:
          type: object
          properties:
            estimated_cost_cents:
              type: integer
              description: Estimated cost used by the max_cost_cents condition.
            environment:
              type: string
              description: Target environment used by the environments condition.
            tool:
              type: string
              description: Overrides resource.id for tool_allowlist matching.
    PolicyEvaluateResponse:
      type: object
      required:
      - decision
      - matched_policy_id
      - reason
      properties:
        decision:
          type: string
          enum:
          - allow
          - deny
        matched_policy_id:
          type: string
          description: Empty when no policy matched (default allow).
        reason:
          type: string
    Webhook:
      type: object
      required:
      - id
      - url
      - events
      - status
      - secret_set
      - created_at
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Absolute http(s) delivery URL.
        events:
          type: array
          items:
            type: string
          description: 'Subscribed event types (e.g. "run.failed"). An empty array means

            ALL event types.

            '
        status:
          type: string
          enum:
          - active
          - disabled
        secret_set:
          type: boolean
          description: True when the record carries a signing-secret hash.
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC.
    WebhookList:
      type: object
      required:
      - webhooks
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
    CreateWebhookRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Absolute http(s) URL that will receive deliveries.
        events:
          type: array
          items:
            type: string
          description: Event types to subscribe to; empty/omitted = all.
    CreateWebhookResponse:
      type: object
      required:
      - webhook
      - secret
      properties:
        webhook:
          $ref: '#/components/schemas/Webhook'
        secret:
          type: string
          description: 'The HMAC signing secret — returned EXACTLY ONCE in this response.

            Store it safely; only its SHA-256 hash is persisted server-side.

            '
    WebhookDelivery:
      type: object
      required:
      - id
      - event_type
      - status
      - attempts
      - last_status_code
      - latency_ms
      - error
      - created_at
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          description: Event type that triggered the delivery (e.g. "run.failed").
        status:
          type: string
          enum:
          - delivered
          - failed
          - retrying
          description: Outcome of the LATEST attempt.
        attempts:
          type: integer
          description: Attempt count so far (max 3 under the default policy).
        last_status_code:
          type: integer
          description: HTTP status of the latest attempt (0 = no response).
        latency_ms:
          type: integer
          format: int64
          description: Duration of the latest attempt in milliseconds.
        error:
          type: string
          description: Latest attempt error (transport error or empty on success).
        created_at:
          type: string
          format: date-time
          description: RFC3339 UTC; set on the first attempt.
    WebhookDeliveryList:
      type: object
      required:
      - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
    WebhookDeleteResponse:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
          enum:
          - true
    WebhookError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - VALIDATION_ERROR
              - WEBHOOK_NOT_FOUND
              - METHOD_NOT_ALLOWED
              - INTERNAL
            message:
              type: string
    WfErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable code (VALIDATION_ERROR, WORKFLOW_NOT_FOUND, WORKFLOW_RUN_NOT_FOUND, APPROVAL_NOT_FOUND,
                RUN_NOT_FOUND, INVALID_DECISION, ALREADY_DECIDED, INVALID_STATE, ENGINE_NOT_WIRED, INVALID_REQUEST, INTERNAL_ERROR,
                UNAUTHORIZED).
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    WorkflowStatus:
      type: string
      enum:
      - draft
      - published
      - archived
    DSLNodeType:
      type: string
      description: Node type; agent/tool require config, approval gates, the rest are structural.
      enum:
      - agent
      - tool
      - condition
      - parallel
      - approval
      - delay
      - webhook
      - end
    DSLEdgeCondition:
      type: string
      enum:
      - on_success
      - on_failure
      - always
    DSLNode:
      type: object
      properties:
        id:
          type: string
          description: Unique node id within the workflow.
        type:
