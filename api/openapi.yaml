  /eval-datasets/create:
    post:
      operationId: createEvalDataset
      summary: Create an evaluation dataset with its cases
      description: 'Validates every case before persisting: supported scorers are

        `exact`, `contains`, `regex`, `latency_under_ms`, `cost_under_cents`;

        `regex` requires `params.pattern` (compilable), `latency_under_ms`

        requires `params.threshold_ms > 0`, `cost_under_cents` requires

        `params.threshold_cents > 0`; case ids must be unique (auto-generated

        when omitted); at most 50 cases per dataset.

        '
      security:
      - bearerToken: []
      - apiKey: []
      tags:
      - Evaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
                cases:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/EvalCase'
      responses:
        '201':
          description: Created dataset (echoes the ordered case list).
          content:
            application/json:
              schema:
                type: object
                required:
                - dataset
                properties:
                  dataset:
                    $ref: '#/components/schemas/EvalDataset'
        '400':
          description: Validation error (unknown scorer, bad params, duplicate case ids, >50 cases).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /eval-datasets/{id}:
    get:
      operationId: getEvalDataset
      summary: Get one evaluation dataset including its cases
      security:
      - bearerToken: []
      - apiKey: []
