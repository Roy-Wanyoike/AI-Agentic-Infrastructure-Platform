      # ---- wave-10 fragment: agents-portability.yaml (schemas) ----
    AgentExportAgent:
      type: object
      description: |
        The portable agent projection: configuration only. There is
        deliberately NO property for the agent id, organization, status,
        version ids, timestamps or any credential — export can never leak
        them and import always reassigns them server-side. The tools list
        carries tool registry NAMES (catalog references), never tool
        credentials or connection material.
      properties:
        name:
          type: string
          minLength: 1
          description: Agent display name (non-blank).
          examples:
          - Support Agent
        description:
          type: string
          description: Human-readable description.
        instructions:
          type: string
          minLength: 1
          maxLength: 65536
          description: The agent's system prompt (non-blank, capped at 65536 bytes).
        model:
          type: string
          minLength: 1
          description: Model identifier; must be a known platform model id on import (resolved case-insensitively, vendor-prefixed ids match their bare suffix).
          examples:
          - gpt-4o-mini
        tools:
          type: array
          description: Tool registry NAMES only (catalog references). Every name must exist in the platform tool catalog on import.
          items:
            type: string
          examples:
          - - calculator
            - http_request
      required:
      - name
      - description
      - instructions
      - model
      - tools
    AgentExportBundle:
      type: object
      description: |
        The versioned export/import envelope (schema_version "1"). Field
        order is deterministic. Identity, lifecycle state and credentials are
        structurally absent — import reassigns ids/organization/created_at
        and resets status to DRAFT regardless of anything the payload claims.
      properties:
        schema_version:
          type: string
          const: '1'
          description: Bundle schema version; only "1" is written and accepted.
          examples:
          - '1'
        exported_at:
          type: string
          format: date-time
          description: RFC3339 UTC export timestamp, informational; import ignores it.
        agent:
          $ref: '#/components/schemas/AgentExportAgent'
      required:
      - schema_version
      - agent
    PortAgent:
      type: object
      description: |
        The created/imported/cloned agent representation — identical to the
        base spec's Agent schema and the GET /agents/{id} response (legacy
        PascalCase encoding of the internal agents.Agent struct). Status is
        always DRAFT for import/clone results.
      properties:
        ID:
          type: string
          description: Fresh server-assigned agent id (client ids are never trusted).
        OrganizationID:
          type: string
          description: The CALLER's organization (client organization claims are never trusted).
        Name:
          type: string
        Description:
          type: string
        Instructions:
          type: string
        Model:
          type: string
        Status:
          type: string
          description: Lifecycle state (issue #106 state machine); always DRAFT for import/clone results.
          examples:
          - DRAFT
        CurrentVersionID:
          type: string
          description: Fresh initial v1 version id.
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      required:
      - ID
      - OrganizationID
      - Name
      - Model
      - Status
      - CreatedAt
      - UpdatedAt
    PortErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of AGENT_NOT_FOUND, VALIDATION_ERROR, INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - AGENT_NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error

      # ---- wave-10 fragment: runtime-history.yaml (schemas) ----
    RuntimeConfigDocument:
      type: object
      description: |
        Per-agent runtime configuration document (issue #107). Unknown fields
        are rejected by the runtime's parser (strict validation of the two
        sections below); unset fields keep the safe defaults. The document
        contains no secrets and no prompt content — tuning knobs only.
      properties:
        conversation_history:
          $ref: '#/components/schemas/RuntimeConversationHistoryConfig'
        token_budget:
          $ref: '#/components/schemas/RuntimeTokenBudgetConfig'
    RuntimeConversationHistoryConfig:
      type: object
      description: |
        Bounds the prompt built for each model call (the FULL conversation is
        always retained on the run record). Estimation uses the documented
        ~4-characters-per-token heuristic (chars/4, rounded up); it budgets
        prompts only — billing and enforcement always use the
        provider-reported usage.
      properties:
        strategy:
          type: string
          enum:
          - sliding_window
          - summarize_older
          - drop_oldest
          default: sliding_window
          description: |
            sliding_window (default): leading system messages are preserved
            verbatim and the remaining budget is spent on the most recent
            turns. summarize_older: the recent window is kept and every
            dropped older turn is compressed into one synthetic summary
            message placed after the system block (mechanical digest by
            default; a model-backed summarizer may be injected and its
            failures degrade to the mechanical summary). drop_oldest: pure
            newest-first fit with NO system-preservation nuance — an inline
            system message is dropped like any other turn (the runtime passes
            its system prompt separately, so this only matters for histories
            that carry system messages inline).
        max_tokens:
          type: integer
          default: 8000
          description: |
            Prompt token budget. 0 applies the default (8000); a NEGATIVE
            value disables history management entirely (the full history is
            sent — for agents that manage context themselves). Guaranteed
            invariants for every strategy: the newest message is always kept
            even when it alone exceeds the whole budget (truncation never
            makes a run contextless), the stored history is never mutated and
            the resulting view is deterministic.
      required:
      - strategy
      - max_tokens
    RuntimeTokenBudgetConfig:
      type: object
      description: |
        Per-run cumulative token enforcement across ALL steps of one run
        (provider-reported usage, accounted post-response: a single call can
        overshoot before the stop lands). All limits default to 0 = unlimited
        (the safe default: no budget configured means no tracking and
        byte-identical legacy behavior).
      properties:
        max_total_tokens:
          type: integer
          minimum: 0
          default: 0
          description: Cumulative total-token cap for one run (0 = unlimited).
        max_prompt_tokens:
          type: integer
          minimum: 0
          default: 0
          description: Cumulative prompt-token cap for one run (0 = unlimited).
        max_completion_tokens:
          type: integer
          minimum: 0
          default: 0
          description: Cumulative completion-token cap for one run (0 = unlimited).
        alert_threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.8
          description: |
            Fractional crossing (of any configured limit) that records the
            ONE-TIME warn annotation step on the run timeline. 0 applies the
            default (0.8); values above 1 are rejected by the parser.
      required:
      - max_total_tokens
      - max_prompt_tokens
      - max_completion_tokens
      - alert_threshold
    RuntimeBudgetSnapshot:
      type: object
      description: |
        Point-in-time budget state carried as JSON on the "budget" annotation
        steps of the run timeline (phase warn = one-time threshold warning,
        phase exceeded = the hard stop). Persisted with the run trace so
        budget decisions are auditable.
      properties:
        phase:
          type: string
          enum:
          - ok
          - warn
          - exceeded
        prompt_tokens:
          type: integer
          description: Cumulative prompt tokens at the moment of the record.
        completion_tokens:
          type: integer
          description: Cumulative completion tokens at the moment of the record.
        total_tokens:
          type: integer
          description: Cumulative total tokens at the moment of the record.
        max_total_tokens:
          type: integer
        max_prompt_tokens:
          type: integer
        max_completion_tokens:
          type: integer
        alert_threshold:
          type: number
          format: double
        limit:
          type: string
          enum:
          - total
          - prompt
          - completion
          description: The dimension that tripped; empty on warn snapshots that crossed no threshold.
      required:
      - phase
      - prompt_tokens
      - completion_tokens
      - total_tokens

      # ---- wave-10 fragment: orchestration-exec.yaml (schemas) ----
    OrchestrationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    DelegationFailedError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, APPROVAL_UNAVAILABLE, DELEGATION_FAILED]
            message: { type: string }
        delegation_id:
          type: string
          description: The failed record's id (it stays in the ledger for traceability).
    DelegateRequest:
      type: object
      required: [from_agent_id, to_agent_id, task]
      properties:
        from_agent_id:
          type: string
          description: The delegator agent (its inbox receives the response message).
        to_agent_id:
          type: string
          description: The delegated-to agent (executes the subtask).
        task:
          type: string
          description: The subtask text (becomes the child run input).
        parent_run_id:
          type: string
          description: The delegating run ("" at the top of a chain).
        require_approval:
          type: boolean
          description: Park the delegation at the approval gate instead of executing.
        depth:
          type: integer
          description: Delegation depth of the CALLING chain (0 for top-level; the server enforces the configured limit).
    DelegateAccepted:
      type: object
      required: [delegation_id, child_run_id, status, depth]
      properties:
        delegation_id: { type: string }
        child_run_id: { type: string }
        status:
          type: string
          enum: [pending, awaiting_approval]
        depth: { type: integer }
        approval_id:
          type: string
          description: Present only when the delegation was parked at the approval gate.
    MessageSendRequest:
      type: object
      required: [from_agent_id, to_agent_id]
      properties:
        from_agent_id: { type: string }
        to_agent_id: { type: string }
        message_type:
          type: string
          enum: [request, response, delegate, broadcast]
          description: Defaults to the bus's validation rules; an unknown type is 422.
        run_id:
          type: string
          description: Optional run linkage carried on the message.
        payload:
          description: Arbitrary JSON delivered verbatim to the target inbox.
    AgentMessage:
      type: object
      properties:
        org_id: { type: string }
        from_agent_id: { type: string }
        to_agent_id:
          type: string
          description: The target agent ("*" for broadcast deliveries).
        run_id: { type: string }
        message_type:
          type: string
          enum: [request, response, delegate, broadcast]
        payload: {}
        timestamp: { type: string, format: date-time }
        message_id: { type: string }
    SupervisorRunRequest:
      type: object
      required: [task]
      properties:
        task:
          type: string
          description: The task text (becomes the delegated input).
        task_ref:
          type: string
          description: Caller-side task reference (echoed in the result and traces).
        from_agent_id:
          type: string
          description: Response routing target ("" = supervisor-initiated, no comm routing).
        parent_run_id: { type: string }
        required_capability:
          type: string
          description: Restrict candidates to workers declaring this capability (typed 409 NO_CAPABLE_WORKER when none does).
    SupervisorRunResult:
      type: object
      required: [task, status, worker_agent_id, delegation_id, child_run_id, tokens, attempts]
      properties:
        task_ref: { type: string }
        task: { type: string }
        status:
          type: string
          enum: [completed, awaiting_approval, failed]
        worker_agent_id: { type: string }
        delegation_id: { type: string }
        child_run_id: { type: string }
        output: { type: string }
        tokens: { $ref: "#/components/schemas/OrchestrationUsage" }
        attempts:
          type: array
          description: The FAILED attempts that preceded the successful one (empty on first-try success).
          items: { $ref: "#/components/schemas/WorkerAttempt" }
    WorkerAttempt:
      type: object
      properties:
        worker_agent_id: { type: string }
        delegation_id: { type: string }
        error: { type: string }
    SupervisorFailedError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [ALL_WORKERS_FAILED]
            message: { type: string }
        task_ref: { type: string }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/WorkerAttempt" }
    OrchestrationUsage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
    DelegationRecord:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        from_agent_id:
          type: string
          description: The delegator ("" = supervisor-initiated; no response routing).
        to_agent_id: { type: string }
        task: { type: string }
        parent_run_id: { type: string }
        child_run_id: { type: string }
        depth: { type: integer }
        status:
          type: string
          enum: [pending, awaiting_approval, completed, failed]
        approval_id: { type: string }
        result: { type: string }
        error: { type: string }
        tokens: { $ref: "#/components/schemas/OrchestrationUsage" }
        response_delivered: { type: boolean }
        created_at: { type: string, format: date-time }
        completed_at:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    SupervisorConfig:
      type: object
      description: >
        Supervisor routing configuration for THIS process (deployment
        configuration, not an HTTP-managed resource this round): the worker
        routing table and caps the executor was constructed with. Exposed
        here so the ALL_WORKERS_FAILED / NO_WORKERS semantics are readable.
      properties:
        workers:
          type: array
          items:
            type: object
            properties:
              agent_id: { type: string }
              capabilities:
                type: array
                items: { type: string }
        strategy:
          type: string
          enum: [round_robin, least_loaded, capability_match]
          description: The executor runs capability_match (configuration order when no required_capability is sent).
        max_concurrent: { type: integer }
        max_retries: { type: integer }

      # ---- wave-10 fragment: workflow-control-flow.yaml (schemas) ----
    WfValidateRequest:
      type: object
      description: |
        Validation payload. Exactly one of `dsl` (canonical wrapped form) or
        a bare DSL object (nodes/edges at the top level) must be present.
      properties:
        dsl:
          $ref: '#/components/schemas/WfDSL'
    WfDSL:
      type: object
      description: |
        Workflow definition graph. Nodes carry the per-type config documents
        (see WfConditionNode…WfWaitNode); edges are activation edges with
        on_success | on_failure | always conditions. Edges into a loop node
        are loop-back edges (the documented cycle exemption).
      properties:
        nodes:
          type: array
          minItems: 1
          description: Graph nodes; at least one is required.
          items:
            $ref: '#/components/schemas/WfNode'
        edges:
          type: array
          description: Activation edges between nodes.
          items:
            $ref: '#/components/schemas/WfEdge'
      required:
      - nodes
    WfNode:
      type: object
      description: |
        One DSL node. `type` selects the config document: agent/tool (work),
        approval, condition (if/else), switch, loop, retry, wait_until,
        delay, webhook, parallel, end. Control-flow types are described by
        the dedicated schemas (WfConditionNode, WfSwitchNode, WfLoopNode,
        WfRetryNode, WfWaitNode, WfParallelNode).
      properties:
        id:
          type: string
          minLength: 1
          description: Unique node id (referenced by edges, branches, bodies, retry targets and expressions).
        type:
          type: string
          enum:
          - agent
          - tool
          - condition
          - switch
          - loop
          - retry
          - wait_until
          - approval
          - delay
          - webhook
          - parallel
          - end
          description: Node type; the loop/retry executor restricts which types may be owned (loop bodies / retry targets).
        name:
          type: string
          description: Optional display name.
        config:
          type: object
          description: |
            Per-type configuration document. Required keys per type: agent ->
            agent_id, tool -> tool_id, condition -> expression, switch ->
            expression (+ cases/default), loop -> expression (+ body), retry
            -> target, wait_until -> expression, delay -> seconds, webhook
            -> url.
      required:
      - id
      - type
    WfEdge:
      type: object
      description: One activation edge. condition is on_success | on_failure | always; an edge INTO a loop node is a loop-back edge.
      properties:
        from:
          type: string
          description: Source node id.
        to:
          type: string
          description: Target node id.
        condition:
          type: string
          enum: [on_success, on_failure, always]
          description: Activation condition (empty behaves as on_success).
      required:
      - from
      - to
    WfConditionNode:
      type: object
      description: |
        If/else node (DSL type "condition"). The safe expression is evaluated
        once when the node activates; the truthy result routes to
        config.branches.true, the falsy result to config.branches.false.
        Every node that becomes unreachable through the routing decision is
        recorded with node-run status "skipped" (skip_reason in its
        metadata), never executed. Without config.branches the node keeps
        the legacy pass-through gate semantics.
      properties:
        id:
          type: string
        type:
          type: string
          const: condition
        config:
          type: object
          properties:
            expression:
              $ref: '#/components/schemas/WfExpression'
            branches:
              type: object
              description: Routing targets. At least one side must be set; both targets must reference existing node ids.
              properties:
                'true':
                  type: string
                  description: Node id routed to when the expression evaluates truthy.
                'false':
                  type: string
                  description: Node id routed to when the expression evaluates falsy.
          required:
          - expression
      required:
      - id
      - type
    WfSwitchNode:
      type: object
      description: |
        Multi-way branch (DSL type "switch"). The expression result is
        canonicalized (strings verbatim, numbers via their shortest float
        representation, booleans true/false, null) and matched against
        config.cases keys in sorted order; the first match routes, otherwise
        config.default routes. Untaken cases are skipped dynamically.
      properties:
        id:
          type: string
        type:
          type: string
          const: switch
        config:
          type: object
          properties:
            expression:
              $ref: '#/components/schemas/WfExpression'
            cases:
              type: object
              description: Match value -> target node id. Case values are canonicalized strings (e.g. "3" matches numeric 3).
              additionalProperties:
                type: string
                description: Target node id (must reference an existing node).
            default:
              type: string
              description: Target node id routed to when no case matches (must reference an existing node).
          required:
          - expression
      required:
      - id
      - type
    WfLoopNode:
      type: object
      description: |
        Iteration node (DSL type "loop"). The expression must evaluate to an
        array; the body subgraph executes once per item with $.item /
        $.loop.index bound and {{item}} substituted into body node inputs.
        Iteration is capped by config.max_iterations (default 100, hard cap
        10000; excess items are truncated and reported as "truncated": true).
        Per-iteration checkpoints (index, item, status, outputs) are kept in
        the loop node-run metadata.
      properties:
        id:
          type: string
        type:
          type: string
          const: loop
        config:
          type: object
          properties:
            expression:
              $ref: '#/components/schemas/WfExpression'
            max_iterations:
              type: integer
              minimum: 1
              maximum: 10000
              default: 100
              description: Iteration cap (default 100; values above the 10000 hard cap clamp down).
            body:
              type: array
              items:
                type: string
              description: Node ids executed per item (agent, tool, delay, webhook or end nodes only; each body node has exactly one owner).
          required:
          - expression
          - body
      required:
      - id
      - type
    WfRetryNode:
      type: object
      description: |
        Retry wrapper (DSL type "retry"). Re-executes config.target on
        failure up to config.attempts total attempts (default 3, hard cap
        100) with geometric backoff (base_delay_ms * multiplier, capped by
        max_delay_ms). Failed attempts are checkpointed as failed node-run
        rows carrying retry_attempt metadata; the final summary (attempts
        used, per-attempt errors) lands in the target and retry node-run
        metadata.
      properties:
        id:
          type: string
        type:
          type: string
          const: retry
        config:
          type: object
          properties:
            target:
              type: string
              description: Node id retried by this node (agent/tool/delay/webhook/end only; exactly one owner).
            attempts:
              type: integer
              minimum: 1
              maximum: 100
              default: 3
              description: Total attempts (not retries).
            backoff:
              type: object
              description: Geometric backoff policy.
              properties:
                base_delay_ms:
                  type: number
                  exclusiveMinimum: 0
                  default: 100
                multiplier:
                  type: number
                  minimum: 1
                  default: 2
                max_delay_ms:
                  type: number
                  exclusiveMinimum: 0
                  default: 30000
          required:
          - target
      required:
      - id
      - type
    WfWaitNode:
      type: object
      description: |
        Poll gate (DSL type "wait_until"). Polls the expression every
        poll_interval_ms (default 1000ms, floor 10ms) until it evaluates
        truthy or timeout_seconds (default 60) expires; on timeout the node
        fails with error_code WAIT_UNTIL_TIMEOUT and the workflow run fails.
        The poll counter is exposed to the expression as $.context.polls.
      properties:
        id:
          type: string
        type:
          type: string
          const: wait_until
        config:
          type: object
          properties:
            expression:
              $ref: '#/components/schemas/WfExpression'
            timeout_seconds:
              type: number
              exclusiveMinimum: 0
              default: 60
            poll_interval_ms:
              type: number
              exclusiveMinimum: 0
              default: 1000
          required:
          - expression
      required:
      - id
      - type
    WfParallelNode:
      type: object
      description: |
        True concurrent fan-out (DSL type "parallel"). The direct edge
        successors of the node that are executable work nodes (agent/tool/
        delay/webhook/end), have no other active predecessors and no
        interdependencies form the branch wave; every branch runs in its own
        goroutine under the composed concurrency limits (see
        WfParallelLimits) and results combine per config.strategy (see
        WfAggregationStrategy). config.fail_fast selects the failure mode:
        fail_fast (default) cancels the remaining branches on the decision
        event; collect_all lets every branch run to completion before
        aggregating. Aggregate failure fails the workflow run. Per-branch
        duration/wait/utilization, the completion order, the in-flight
        high-water mark and the resolved limits are recorded in the node-run
        metadata ("parallel" key) and in each branch node-run's metadata.
      properties:
        id:
          type: string
        type:
          type: string
          const: parallel
        config:
          type: object
          properties:
            strategy:
              $ref: '#/components/schemas/WfAggregationStrategy'
            max_concurrency:
              type: integer
              minimum: 1
              description: Per-workflow concurrency override; the effective cap is the minimum of this, the AGENTOS_MAX_WORKFLOW_PARALLELISM global (default 8) and the org quota (default unlimited).
            fail_fast:
              type: boolean
              default: true
              description: 'false selects the collect_all failure mode (every branch runs to completion before aggregation).'
            branch_timeout_seconds:
              type: number
              exclusiveMinimum: 0
              description: Per-branch wall-time cap; the timed-out branch is cancelled (status timeout) without affecting the other branches' clocks. Unset means unbounded.
      required:
      - id
      - type
    WfAggregationStrategy:
      type: string
      enum:
      - all
      - any
      - race
      - majority
      description: |
        How parallel branch results combine (issue #110).

        all — every branch must succeed; any failure (fail_fast) or any
        terminal failure (collect_all) fails the aggregate. Output: object
        mapping branch id -> successful output.

        any — first successful completion wins and the remaining branches
        are cancelled; fails only when every branch fails.

        race — first completion wins regardless of status and the remaining
        branches are cancelled; a failing first completion fails the
        aggregate.

        majority — plurality vote over the successful outputs: the most
        frequently occurring serialized output wins; equal counts are broken
        by the lexicographically smallest serialized output (documented tie
        rule). Failures do not vote; the aggregate fails only when no branch
        succeeded.
      default: all
    WfParallelLimits:
      type: object
      description: |
        Composed parallelism caps for one parallel wave (issue #110). The
        effective cap is the minimum of the components that are set; at
        least the global ceiling is always set, so the effective value is
        >= 1. In-flight branches never exceed the effective cap (enforced by
        a counting semaphore; the high-water mark is reported as
        max_in_flight).
      properties:
        global:
          type: integer
          minimum: 1
          default: 8
          description: Deployment-wide ceiling from AGENTOS_MAX_WORKFLOW_PARALLELISM (default 8; unset/invalid/non-positive values fall back to the default).
        per_workflow:
          type: integer
          minimum: 0
          default: 0
          description: The parallel node's config.max_concurrency override; 0 means unset.
        org_quota:
          type: integer
          minimum: 0
          default: 0
          description: Per-organization quota resolved through the OrgParallelQuota hook; 0 means unlimited (the default hook).
        effective:
          type: integer
          minimum: 1
          description: Resolved cap actually enforced for the wave (min of the set components).
    WfExpression:
      type: string
      description: |
        Safe workflow expression (stdlib-only engine, no function calls, no
        reflection, no I/O). Roots: $.nodes.<id>.output.<path> (previous node
        outputs; the literal "output" segment after the node id is the
        canonical marker), $.input (workflow input string), $.item /
        $.loop.index (loop frame), $.context.<key> (executor-provided
        values). Operators: == != < <= > >= and/or/not (!), + - * /,
        parentheses; numbers are float64, + concatenates strings when both
        operands are strings, and/or short-circuit. Unknown identifiers,
        unknown roots and function calls are rejected at save time with
        invalid_expression errors; hard caps: 4096 bytes, parse depth 64.
      maxLength: 4096
      examples:
      - '$.nodes.classify.output.category == ''urgent'' and $.nodes.classify.output.score > 0.8'
    WfWorkflowValidationError:
      type: object
      description: One typed validation failure. node_id is present when the violation is attributable to a single node.
      properties:
        code:
          type: string
          description: |
            Stable machine identifier. Known values include: empty_graph,
            missing_node_id, duplicate_node_id, unknown_node_type,
            missing_config, missing_node_ref, invalid_edge_condition,
            cycle_detected, dangling_branch_target, dangling_loop_body,
            dangling_retry_target, duplicate_loop_body, loop_body_invalid_node,
            invalid_retry_target, invalid_expression.
          examples:
          - dangling_branch_target
        message:
          type: string
          description: Human-readable reason (expression errors carry the node id + parser reason).
        node_id:
          type: string
          description: Offending node id when attributable.
      required:
      - code
      - message
    WfValidateSuccess:
      type: object
      properties:
        valid:
          type: boolean
          const: true
      required:
      - valid
    WfValidateFailure:
      type: object
      description: 422 body; the same shape POST /workflows/create returns for invalid DSL.
      properties:
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WfWorkflowValidationError'
      required:
      - errors
    WfErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - INVALID_REQUEST
            message:
              type: string
          required:
          - code
          - message
      required:
      - error

      # ---- wave-10 fragment: tools-catalog.yaml (schemas) ----
    ToolInfo:
      type: object
      description: |
        One read-only registry entry. description/input_schema are omitted
        for tools that publish no catalog metadata (they still execute).
      required: [name]
      properties:
        name:
          type: string
          description: Registry key the model uses in tool calls (e.g. "database_query").
        description:
          type: string
          description: Human-readable summary of what the tool does and its security posture.
        input_schema:
          type: object
          description: JSON-Schema-style contract the tool arguments must satisfy (see the per-tool schemas below).
          additionalProperties: true
    ToolListResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
    ToolCatalogErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: One of INTERNAL_ERROR (500); 401/403 use the shared auth responses.
              examples:
              - INTERNAL_ERROR
            message: { type: string }
    ToolCommonArgs:
      type: object
      description: Arguments every expanded-catalog tool accepts in addition to its own.
      properties:
        estimated_cost_cents:
          type: integer
          description: Optional estimated cost surfaced to the policy engine (max_cost_cents condition, internal/policies).
        timeout_ms:
          type: integer
          description: Optional per-call deadline in milliseconds; each tool clamps it to its own hard ceiling.
    DatabaseQueryInput:
      type: object
      description: database_query — ONE parameterized statement per call against an org-scoped connector database. Read-only by default (SELECT/WITH/EXPLAIN/SHOW); values travel exclusively through prepared-statement binding (never interpolated); multi-statement text is rejected.
      required: [connection, sql]
      properties:
        connection:
          type: string
          description: Org-scoped connector name holding the database DSN (resolved server-side through the connectors service + secret_ref; never a raw DSN).
        sql:
          type: string
          description: Exactly one statement with $1-style placeholders (max 64 KiB). Read-only mode allows SELECT/WITH/EXPLAIN/SHOW as the first keyword.
        params:
          type: object
          additionalProperties: true
          description: Bound arguments — an array binds positionally ($1..$n); an object binds in sorted key order. Values never touch the SQL text.
        row_limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum returned rows; extra rows set truncated=true.
        readonly:
          type: boolean
          default: true
          description: Defaults to true; false unlocks single DML statements only on connections provisioned for writes.
        timeout_ms:
          type: integer
          default: 10000
          description: Query deadline in milliseconds (capped at 60000).
        estimated_cost_cents:
          type: integer
          description: Optional estimated cost surfaced to the policy engine.
    DatabaseQueryOutput:
      type: object
      required: [columns, rows, row_count, truncated]
      properties:
        columns:
          type: array
          items: { type: string }
          description: Result column names (duplicates are suffixed _2, _3, ... deterministically).
        rows:
          type: array
          description: Row objects keyed by column name; driver values are JSON-normalized (NULL -> null, timestamps -> RFC3339Nano strings).
          items:
            type: object
            additionalProperties: true
        row_count:
          type: integer
          description: Number of returned rows (<= row_limit).
        truncated:
          type: boolean
          description: true when more rows existed than row_limit allowed.
    SearchInput:
      type: object
      description: search — three modes. web queries the operator-configured endpoint (AGENTOS_SEARCH_API_URL/AGENTOS_SEARCH_API_KEY); knowledge queries the organization's knowledge base; hybrid runs both, merges, de-duplicates (URL, falling back to the knowledge chunk id) and re-ranks by score deterministically.
      required: [query]
      properties:
        query:
          type: string
          maxLength: 1024
          description: Search query.
        mode:
          type: string
          enum: [web, knowledge, hybrid]
          description: Backend selection; defaults to web when an endpoint is configured, else knowledge. A failing hybrid side degrades with a warning; both failing is an error.
        k:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: Maximum results.
        timeout_ms:
          type: integer
          default: 10000
          description: Web-mode deadline in milliseconds (capped at 60000).
        estimated_cost_cents:
          type: integer
          description: Optional estimated cost surfaced to the policy engine.
    SearchResult:
      type: object
      description: Normalized result shape every mode returns.
      required: [title, snippet, score, source]
      properties:
        title: { type: string }
        url: { type: string, description: Present for web results. }
        snippet: { type: string }
        score: { type: number }
        source:
          type: string
          enum: [web, knowledge]
        id:
          type: string
          description: Knowledge chunk id (knowledge results only).
        document_id:
          type: string
          description: Knowledge document id (knowledge results only).
        chunk_ordinal:
          type: integer
          description: Knowledge chunk ordinal (knowledge results only).
        citation:
          type: string
          description: Knowledge citation string (knowledge results only).
    SearchOutput:
      type: object
      required: [mode, query, results, count, warnings]
      properties:
        mode: { type: string, enum: [web, knowledge, hybrid] }
        query: { type: string }
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        count: { type: integer }
        warnings:
          type: array
          items: { type: string }
          description: Hybrid-mode degradation notices (e.g. one backend failing).
    CodeExecInput:
      type: object
      description: code_execute — runs a snippet in a FRESH child process of its own process group. Network is disabled BEST-EFFORT via a scrubbed environment (no portable user-space socket block; AGENTOS_TOOL_SANDBOX=exec or a network namespace is required for a hard kill switch). Output capped, deadline-driven process-group kill, snippet temp files removed on every path.
      required: [language, code]
      properties:
        language:
          type: string
          enum: [python, javascript, go]
        code:
          type: string
          maxLength: 131072
          description: Snippet source (max 128 KiB). For go, a complete package main file.
        timeout_ms:
          type: integer
          default: 15000
          description: Execution deadline in milliseconds (capped at 60000).
        estimated_cost_cents:
          type: integer
          description: Optional estimated cost surfaced to the policy engine.
    CodeExecOutput:
      type: object
      required: [language, stdout, stderr, exit_code, truncated, duration_ms]
      properties:
        language: { type: string }
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer }
        truncated:
          type: boolean
          description: true when stdout/stderr were cut at the output cap.
        duration_ms: { type: integer }
    WebhookInput:
      type: object
      description: |
        webhook — delivers to an OPERATOR-ALLOW-LISTED URL (default deny;
        scheme/host/port must match and the path must be the entry path or a
        descendant). Signed with HMAC-SHA256 over "{timestamp}.{body}" via the
        secrets seam — headers "X-AgentOS-Signature" carries "sha256=<hex>"
        and "X-AgentOS-Timestamp" the unix seconds; receivers must enforce a
        5-minute replay window before verifying. SSRF protection resolves the
        host and refuses loopback/private/link-local (169.254.169.254
        included), CGNAT and multicast destinations, re-checked at dial level.
      required: [url]
      properties:
        url:
          type: string
          description: Absolute http(s) URL on the configured allow-list.
        method:
          type: string
          enum: [GET, POST]
          default: POST
        body:
          type: string
          description: POST body (signed together with the timestamp).
        headers:
          type: object
          additionalProperties: { type: string }
          description: Optional extra request headers.
        fire_and_forget:
          type: boolean
          description: true returns {delivered,status,signed} without the receiver's body.
        timeout_ms:
          type: integer
          default: 10000
          description: Delivery deadline in milliseconds (capped at 60000).
        estimated_cost_cents:
          type: integer
          description: Optional estimated cost surfaced to the policy engine.
    WebhookOutput:
      type: object
      required: [delivered, status, signed]
      properties:
        delivered:
          type: boolean
          description: true when the receiver answered 2xx (request-response mode).
        status:
          type: integer
          description: Receiver HTTP status code.
        body:
          type: string
          description: Receiver response body, truncated at 32 KiB (absent in fire-and-forget mode).
        signed:
          type: boolean
          description: true when the delivery carried an HMAC signature.
    JSONTransformInput:
      type: object
      description: json_transform — minimal jq-like reshaping; pure and deterministic (identical input always yields byte-identical output; no I/O). Ops apply in order, each replacing the current document with its result.
      required: [data, ops]
      properties:
        data:
          description: Input JSON value (max 1 MiB encoded).
        ops:
          type: array
          maxItems: 16
          description: |
            pick{path} — select the value at a dot/bracket path ("a.b[0]", 'items["weird.key"]'; a leading "$" is optional).
            filter{path?,field?,cmp,value?} — keep array elements matching a field-op-value predicate (cmp in ==,!=,<,<=,>,>=,contains,exists; ordering comparisons on mismatched/non-comparable types exclude the element, jq-like).
            map{path?,template} — map array elements through an object template whose string values starting with "$" are path sub-expressions into the element ("$" = the element; missing sub-paths resolve to null).
            template{body} — build objects from "{{path}}" placeholders (a string that is exactly one placeholder splices the typed value; missing paths are an error).
          items:
            type: object
            additionalProperties: true
        estimated_cost_cents:
          type: integer
          description: Optional estimated cost surfaced to the policy engine.
    JSONTransformOutput:
      type: object
      required: [result, ops_applied]
      properties:
        result:
          description: The transformed JSON value (max 1 MiB encoded; larger results are refused, never truncated).
        ops_applied:
          type: integer
    FileStorageInput:
      type: object
      description: file_storage — org-scoped upload/download/list/delete over the StorageBackend seam (built-in InMemoryStorageBackend is per-process and non-durable; a connector-backed HTTP impl and S3 support are documented follow-up work, NOT provided). Paths are sanitized by REJECTION (no absolute paths, no ".."/"." segments, no backslashes or control characters, max 512 bytes); objects are capped at 10 MiB; the organization comes from the run scope, never from tool input.
      required: [operation]
      properties:
        operation:
          type: string
          enum: [upload, download, list, delete]
        path:
          type: string
          maxLength: 512
          description: Relative object path (upload/download/delete; no leading '/', no '..' segments).
        content:
          type: string
          description: upload only — object content (max 10 MiB).
        content_type:
          type: string
          default: application/octet-stream
          description: upload only — MIME type.
        prefix:
          type: string
          description: list only — optional path prefix filter.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: list only — maximum entries.
        estimated_cost_cents:
          type: integer
          description: Optional estimated cost surfaced to the policy engine.
    FileStorageObject:
      type: object
      description: One metadata listing entry (content is never returned by list).
      required: [path, size, content_type]
      properties:
        path: { type: string }
        size: { type: integer }
        content_type: { type: string }
    FileStorageOutput:
      type: object
      description: Shape depends on the operation — upload returns {operation,path,size,content_type}; download adds {content}; list returns {operation,prefix,objects,count}; delete returns {operation,path,deleted}.
      required: [operation]
      properties:
        operation: { type: string, enum: [upload, download, list, delete] }
        path: { type: string }
        size: { type: integer }
        content_type: { type: string }
        content:
          type: string
          description: download only — the object's bytes as a string (text-oriented; keep uploads UTF-8 for faithful round-trips).
        prefix: { type: string }
        objects:
          type: array
          items:
            $ref: '#/components/schemas/FileStorageObject'
        count: { type: integer }
        deleted: { type: boolean }

      # ---- wave-10 fragment: model-router.yaml (schemas) ----
    RoutingPolicy:
      type: string
      description: |
        How the router orders its candidates for each request. All orderings
        are deterministic functions of the request and candidate set:
        cost_optimize ranks by estimated per-request cost (registry input/output
        prices over estimated prompt tokens and the requested output budget);
        latency_optimize by the registry latency estimate; task_complexity
        classifies the request (prompt size, reasoning indicators, attached
        tools, output budget) into Simple/Standard/Complex/Expert and prefers
        the closest capability tier; round_robin rotates across the candidates;
        weighted uses a seeded hash of the request content with the configured
        candidate weights (weighted-random-key scheme — same request, same
        model).
      enum:
      - cost_optimize
      - latency_optimize
      - task_complexity
      - round_robin
      - weighted
    ModelCapabilities:
      type: object
      description: |
        One model's routing capabilities as resolved from the capability
        registry (built-in table + tenant overrides via AGENTOS_MODELS_JSON
        or the registry API). Figures are approximations for routing and
        ranking, not billing data.
      properties:
        model:
          type: string
          description: Canonical model id (matched case-insensitively; a "vendor/model" id also matches by bare suffix).
        context_tokens:
          type: integer
          format: int64
          description: Model context window in tokens (input+output); 0 means unknown (no context-fit filtering).
        tool_support:
          type: boolean
          description: Whether the model can execute tool/function calls.
        vision_support:
          type: boolean
          description: Whether the model accepts image input.
        quality_tier:
          type: string
          description: Coarse capability band matched against the classified request complexity.
          enum:
          - basic
          - standard
          - premium
          - frontier
        latency_estimate_ms:
          type: integer
          format: int64
          description: Rough median end-to-end latency for a typical ~1k-token completion (routing heuristic, not an SLA).
        input_cost_per_1k:
          type: number
          format: double
          description: List price in USD per 1k input tokens.
        output_cost_per_1k:
          type: number
          format: double
          description: List price in USD per 1k output tokens.
      required:
      - model
    RouterDecision:
      type: object
      description: |
        Observability projection of one routing choice. Surfaced on run/step
        metadata (routing_policy / routing_model / routing_provider /
        routing_complexity / routing_fallback) and available for diagnostics;
        decisions are computed without calling providers.
      properties:
        policy:
          $ref: '#/components/schemas/RoutingPolicy'
        complexity:
          type: string
          description: Deterministic classification of the request (task_complexity policy input).
          enum:
          - simple
          - standard
          - complex
          - expert
        selected_model:
          type: string
          description: Model id chosen to serve the request (empty when no candidate qualified).
        provider_name:
          type: string
          description: Name of the provider instance serving the request.
        reason:
          type: string
          description: Human-readable explanation of why the first candidate was picked.
        candidate_order:
          type: array
          description: Model ids in attempt order (after policy ordering and capability filtering).
          items:
            type: string
        skipped:
          type: array
          description: Candidates excluded from (or jumped over during) routing, with reasons (capability_mismatch, vision_unsupported, tools_unsupported, context_overflow, not_configured, circuit_open).
          items:
            type: object
            properties:
              model:
                type: string
              provider:
                type: string
              reason:
                type: string
            required:
            - model
            - reason
      required:
      - policy
      - complexity

      # ---- wave-10 fragment: embeddings.yaml (schemas) ----
    EmbSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          description: Natural-language query; scored against every org-scoped chunk.
        k:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: Maximum number of chunk hits to return.
        mode:
          type: string
          enum: [keyword, semantic, hybrid]
          default: hybrid
          description: |
            Retrieval strategy. keyword: lexical leg only. semantic: pgvector
            cosine leg only. hybrid: both legs fused (default). semantic and
            hybrid degrade to keyword-only when the vector leg is unavailable
            (pgvector-OPTIONAL migration, offline embeddings provider) — the
            degradation is deliberate and the response shape never changes.
        weights:
          $ref: '#/components/schemas/EmbFusionWeights'
    EmbFusionWeights:
      type: object
      description: |
        Fusion tuning for mode=hybrid. Omitted fields keep the server-side
        defaults (env: AGENTOS_HYBRID_KEYWORD_WEIGHT,
        AGENTOS_HYBRID_VECTOR_WEIGHT, AGENTOS_HYBRID_FUSION — 0.5/0.5 and the
        weighted min-max fusion). Weights are clamped to [0,1]; both-zero
        inputs fall back to the defaults so the fused score can never
        collapse to a constant. Ignored for mode=keyword/semantic.
      properties:
        keyword_weight:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.5
          description: Weight of the min-max-normalized keyword-leg score.
        vector_weight:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.5
          description: Weight of the min-max-normalized vector-leg score.
        fusion:
          type: string
          enum: [weights, rrf]
          default: weights
          description: |
            Score-combination algorithm. weights: weighted sum of the
            min-max-normalized per-leg scores. rrf: reciprocal rank fusion
            (constant 60) — kwW/(60+kwRank) + vecW/(60+vecRank); scale-free
            and robust to per-leg score distributions.
    EmbSearchResult:
      type: object
      description: One retrieval hit — the contract-pinned fields plus additive title/chunk id.
      required: [document_id, chunk_ordinal, content, score, citation]
      properties:
        document_id: { type: string }
        document_title: { type: string }
        chunk_id:
          type: string
          description: Deduplication key of the hybrid fusion (unique per hit).
        chunk_ordinal:
          type: integer
          description: Zero-based position of the chunk inside its document.
        content: { type: string }
        score:
          type: number
          format: double
          description: |
            Relevance in [0,1]; semantics by mode — raw lexical token-overlap
            score (keyword / degraded semantic+hybrid), raw cosine similarity
            (semantic), or the fused score (hybrid: weighted normalized sum
            or RRF contribution; RRF scores are small positive rationals, not
            similarities).
          examples:
          - 0.83
        citation:
          type: string
          description: Human-readable citation, e.g. "Billing FAQ (confluence/billing), chunk 3".
    EmbSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmbSearchResult'
    EmbErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: One of VALIDATION_ERROR, INVALID_REQUEST, INTERNAL_ERROR.
              examples:
              - VALIDATION_ERROR
            message: { type: string }

      # ---- wave-10 fragment: tracing.yaml (schemas) ----
    TrRunTraceResponse:
      type: object
      required: [run_id, trace_id]
      properties:
        run_id:
          type: string
          description: The run id (echo of the path parameter).
        trace_id:
          type: string
          description: W3C trace id (32 hex chars) of the run's distributed execution trace.
    TrErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [trace_not_available, internal_error]
            message:
              type: string

      # ---- wave-10 fragment: run-lifecycle.yaml (schemas) ----
    RunLifecycleState:
      type: string
      description: |
        One node of the run lifecycle state machine (issue #115). Canonical
        persisted values are lowercase; legacy UPPERCASE worker spellings
        normalize onto the same states.
      enum:
      - pending
      - queued
      - running
      - paused
      - waiting_approval
      - cancelling
      - completed
      - failed
      - cancelled
      - timeout
    RunLifecycleTransitionError:
      type: object
      description: |
        Typed rejection of an illegal state move (HTTP 409, code
        INVALID_STATE): the machine names BOTH endpoints of the refused
        move and the targets that would have been legal from `from`.
        Terminal runs allow no transitions at all.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [INVALID_STATE]
            message:
              type: string
              description: >
                Human-readable refusal including the allowed targets, e.g.
                invalid run status transition "completed to paused"
                (allowed: none — completed is terminal).
            from:
              $ref: '#/components/schemas/RunLifecycleState'
            to:
              $ref: '#/components/schemas/RunLifecycleState'
            allowed:
              type: array
              description: Legal target states from `from` (empty when `from` is terminal).
              items:
                $ref: '#/components/schemas/RunLifecycleState'
      required: [error]
    RunLifecycleRun:
      type: object
      description: The controlled run (same shape as the base spec's Run; lifecycle fields highlighted).
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
        agent_id:
          type: string
        status:
          $ref: '#/components/schemas/RunLifecycleState'
        input:
          type: string
        output:
          type: string
          description: Final output, or the recovery/transition annotation for recovered or gracefully-unwound runs.
        cost_cents:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, organization_id, agent_id, status, created_at, updated_at]
    RunLifecycleRunResponse:
      type: object
      description: The updated run after the control op landed.
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
        agent_id:
          type: string
        status:
          $ref: '#/components/schemas/RunLifecycleState'
        input:
          type: string
        output:
          type: string
        cost_cents:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, organization_id, agent_id, status, created_at, updated_at]
    RunLifecycleErrorEnvelope:
      type: object
      description: Structured error envelope (house pattern) for the non-transition failures (404 unknown/foreign run, 409 lost optimistic race STATUS_CONFLICT, 500).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [RUN_NOT_FOUND, STATUS_CONFLICT, RUNS_SERVICE_UNAVAILABLE, INTERNAL_ERROR]
            message:
              type: string
          required: [code, message]
      required: [error]

      # ---- wave-10 fragment: nats-core.yaml (schemas) ----
    NcMessagingMode:
      type: string
      description: |
        The task-dispatch plane selected by AGENTOS_MESSAGING. memory (the
        default) keeps the platform queue as the only dispatch path with zero
        infrastructure; nats dispatches run tasks as JetStream envelopes and
        fails fast when the broker is unreachable; hybrid is nats with a
        memory safety net (broker failures fall back to the memory queue, so
        a run is never lost). The wire value is the lowercase enum member.
      enum:
        - memory
        - nats
        - hybrid
      default: memory
    NcRunEnvelope:
      type: object
      description: |
        The wire shape published to agentos.runs.create when a run task is
        dispatched through the messaging plane. The top-level identity fields
        make routing, DLQ inspection and correlation possible without
        decoding the payload; payload carries the exact keys the existing
        execution path consumes (agent_id, input, workflow_run_id, node_id,
        environment, ...).
      required: [task_id, task_type, created_at]
      properties:
        task_id:
          type: string
          description: Logical task identity ("<task_type>-<rfc3339nano>", the Queue.Enqueue format).
        task_type:
          type: string
          description: The queue task type (e.g. agent.run).
        run_id:
          type: string
          description: The agent/tool run the task executes (empty when the caller has none yet).
        organization_id:
          type: string
          description: Tenant scope, mirrored into the task's organization stamp.
        trace_id:
          type: string
          description: Distributed-trace correlation id when the caller has one.
        payload:
          type: object
          additionalProperties: true
          description: The original enqueue payload, republished verbatim.
        created_at:
          type: string
          format: date-time
    NcNodeCompletedEnvelope:
      type: object
      description: |
        The wire shape fanned out onto agentos.workflow.node.completed after
        one workflow node reaches a terminal state. Consumers decide what
        "completed" triggers; the framework guarantees at-least-once delivery
        of the fact. Memory mode has no fan-out plane (single-process
        deployments coordinate through the DAG executor directly).
      required: [organization_id, workflow_run_id, node_id, status, completed_at]
      properties:
        organization_id:
          type: string
        workflow_run_id:
          type: string
        node_id:
          type: string
        run_id:
          type: string
          description: The node's agent/tool run when it has one.
        status:
          type: string
          description: Terminal node status (completed | failed).
        output:
          type: string
        error:
          type: string
          description: Error code for failed nodes (e.g. NODE_FAILED).
        completed_at:
          type: string
          format: date-time
    NcDLQEntry:
      type: object
      description: |
        The inspected view of one retained dead letter. payload_base64 is the
        original message bytes base64-encoded (bytes, not raw JSON, so even a
        malformed payload dead-letters losslessly and requeue republishes it
        verbatim). run_id/organization_id/task_id are best-effort identity
        extractions from run-dispatch payloads.
      required: [sequence, subject, error, attempts, dead_lettered_at]
      properties:
        sequence:
          type: integer
          format: int64
          description: The 1-based position in the agentos.dlq retained log (the requeue key).
        subject:
          type: string
          description: The original subject the message was published to.
        task_id:
          type: string
        run_id:
          type: string
        organization_id:
          type: string
        error:
          type: string
          description: The last handler error (or the recovered panic value).
        attempts:
          type: integer
          format: int64
          description: The delivery count at dead-letter time (the retry cap is 4 by default, mirroring the engine's rule).
        dead_lettered_at:
          type: string
          format: date-time
        payload_base64:
          type: string
          contentEncoding: base64
          description: The original message bytes, base64-encoded.
    NcReplayRequest:
      type: object
      required: [subject, from]
      properties:
        subject:
          type: string
          description: The subject to replay. Only agentos.runs.create and agentos.workflow.node.completed are accepted (the DLQ and foreign subjects are refused).
          enum:
            - agentos.runs.create
            - agentos.workflow.node.completed
        from:
          type: string
          format: date-time
          description: Inclusive replay origin — retained entries with timestamp >= from are re-published, oldest-first.
      example:
        subject: agentos.runs.create
        from: '2026-09-10T12:00:00Z'
    NcReplayResult:
      type: object
      required: [subject, from, replayed]
      properties:
        subject:
          type: string
        from:
          type: string
          format: date-time
        replayed:
          type: integer
          format: int64
          description: How many retained entries matched the window and were re-published verbatim onto the subject.
    NcErrorEnvelope:
      type: object
      description: Structured error model (mirrors the base spec).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_replayable
            message:
              type: string

      # ---- wave-10 fragment: rate-limits.yaml (schemas) ----
    RateLimit:
      type: object
      description: |
        One stored limit row (the internal limiter.Config projection).
        subject_id null marks the scope's ORG DEFAULT. Zero means unlimited
        for a dimension; RPD is enforced over a ROLLING 24h window and TPM
        over a one-minute window with one-call-granularity token accounting.
      properties:
        scope:
          type: string
          enum:
          - org
          - agent
          - tool
          - model
        subject_id:
          type: [string, 'null']
          description: Agent id / tool id / model name; null = the org default.
        rpm:
          type: integer
          minimum: 0
          description: Requests per one-minute sliding window (0 = unlimited).
        rpd:
          type: integer
          minimum: 0
          description: Requests per ROLLING 24h sliding window (0 = unlimited).
        tpm:
          type: integer
          minimum: 0
          description: Tokens per one-minute sliding window, model scope (0 = unlimited).
        enabled:
          type: boolean
          description: |
            False disables the row; a disabled SUBJECT row suppresses the org
            default for that subject (the per-subject opt-out).
        org_default:
          type: boolean
          description: Convenience mirror of subject_id == null on list responses.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - scope
      - subject_id
      - rpm
      - rpd
      - tpm
      - enabled
    RateLimitUpsertRequest:
      type: object
      description: |
        Upsert payload. Omitted dimensions default to 0 (unlimited); an
        enabled row must set at least one positive dimension (stage with
        enabled=false instead).
      properties:
        rpm:
          type: integer
          minimum: 0
        rpd:
          type: integer
          minimum: 0
        tpm:
          type: integer
          minimum: 0
        enabled:
          type: boolean
          default: true
    RateLimitListResponse:
      type: object
      properties:
        limits:
          type: array
          description: All stored rows of the caller's org (org defaults and subject rows).
          items:
            $ref: '#/components/schemas/RateLimit'
      required:
      - limits
    RateLimitUpsertResponse:
      type: object
      properties:
        limit:
          $ref: '#/components/schemas/RateLimit'
      required:
      - limit
    RateLimitDeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Always true on success.
        scope:
          type: string
        subject_id:
          type: string
          description: The deleted row's subject ("" for an org default).
      required:
      - deleted
      - scope
      - subject_id
    RateLimitErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of VALIDATION_ERROR, NOT_FOUND, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - VALIDATION_ERROR
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    RateLimitedError:
      type: object
      description: |
        The 429 envelope of the run-creation gate (POST /runs): the house
        error shape plus the two issue-#124 additions (scope, retry_after).
        Sent with a Retry-After header (seconds, ceil, >= 1) equal to
        error.retry_after.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Always rate_limited for a granular denial.
              examples:
              - rate_limited
            message:
              type: string
              description: Human-readable denial (names the scope, window and observed usage).
            scope:
              type: string
              enum:
              - org
              - agent
              - tool
              - model
              description: The scope whose window denied.
            retry_after:
              type: integer
              minimum: 1
              description: Seconds until the first denying window frees up (mirrors Retry-After).
          required:
          - code
          - message
          - scope
          - retry_after
      required:
      - error

      # ---- wave-10 fragment: batch.yaml (schemas) ----
    BatchErrorEnvelope:
      type: object
      description: Structured error model shared with the base spec.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable code (VALIDATION_ERROR, NOT_FOUND, UNAUTHORIZED, ...).
            message:
              type: string
          required: [code, message]
      required: [error]

    BatchItem:
      type: object
      description: One batch item's outcome. Result metadata (run_id, deployment_id, name, ...) is flattened onto the item; a failed item carries the error string.
      properties:
        ref:
          type: string
          description: Caller-facing reference — the agent id, the input index or the secret name.
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        error:
          type: string
          description: The failure reason (present exactly when status is failed).
        run_id:
          type: string
          description: runs items — the created run id.
        task_id:
          type: string
          description: runs items — the enqueued "agent.run" task id.
        workflow_run_id:
          type: string
          description: workflow items — the created workflow run id.
        agent_id:
          type: string
          description: agent-update items — the patched agent id.
        deployment_id:
          type: string
          description: agent-deploy items — the created deployment id.
        version:
          type: integer
          description: agent-deploy items — the deployed version.
        environment:
          type: string
          description: agent-deploy items — the deployment environment.
        name:
          type: string
          description: secret items — the secret name (never the value).
        key_version:
          type: integer
          description: secret items — the envelope key version.
      required: [ref, status]

    BatchSummary:
      type: object
      description: Rollup of the item states.
      properties:
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
      required: [total, succeeded, failed, cancelled]

    BatchRecord:
      type: object
      description: Full batch job record (GET /batch/{id} and POST /batch/{id}/cancel).
      properties:
        batch_id:
          type: string
        organization_id:
          type: string
        type:
          type: string
          enum: [runs, workflows, agent_update, agent_deploy, run_cancel, secrets]
        status:
          type: string
          description: running while any item is unsettled; completed or cancelled when terminal.
        max_concurrency:
          type: integer
          description: The effective pool size (clamped to the hard cap 32).
        summary: { $ref: "#/components/schemas/BatchSummary" }
        total:
          type: integer
        completed:
          type: integer
          description: Items in a terminal state.
        items:
          type: array
          items: { $ref: "#/components/schemas/BatchItem" }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
      required: [batch_id, organization_id, type, status, summary, total, completed, items, created_at, updated_at]

    BatchRunsRequest:
      type: object
      description: Either {agent_id, inputs[]} or {agent_ids[], input} — never both selectors.
      properties:
        agent_id:
          type: string
          description: One agent to run over every entry of inputs.
        agent_ids:
          type: array
          items: { type: string }
          description: N agents run over the shared input.
        input:
          type: string
          description: Shared input for the agent_ids form.
        inputs:
          type: array
          items: { type: string }
          description: One input per item for the single-agent form.
        max_concurrency:
          type: integer
          description: Pool size hint (default 4, clamped to the hard cap 32).
    BatchRunsResponse:
      allOf:
      - $ref: "#/components/schemas/BatchSubmission"
      - type: object
        properties:
          run_ids:
            type: array
            items: { type: string }
            description: The succeeded items' run ids in submission order.
        required: [run_ids]

    BatchWorkflowTriggerRequest:
      type: object
      properties:
        inputs:
          type: array
          items: { type: string }
          description: One workflow execution per entry.
        max_concurrency:
          type: integer
      required: [inputs]
    BatchWorkflowTriggerResponse:
      allOf:
      - $ref: "#/components/schemas/BatchSubmission"
      - type: object
        properties:
          workflow_id:
            type: string
          workflow_run_ids:
            type: array
            items: { type: string }
        required: [workflow_id, workflow_run_ids]

    BatchAgentPatch:
      type: object
      description: At least one field must be set; name/instructions/model must be non-blank when present.
      properties:
        name: { type: string }
        description: { type: string }
        instructions: { type: string }
        model: { type: string }
    BatchAgentUpdateRequest:
      type: object
      properties:
        agent_ids:
          type: array
          items: { type: string }
        patch: { $ref: "#/components/schemas/BatchAgentPatch" }
        max_concurrency:
          type: integer
      required: [agent_ids, patch]
    BatchAgentUpdateResponse:
      allOf:
      - $ref: "#/components/schemas/BatchSubmission"
      - type: object
        properties:
          updated_agent_ids:
            type: array
            items: { type: string }
        required: [updated_agent_ids]

    BatchAgentDeployRequest:
      type: object
      properties:
        agent_ids:
          type: array
          items: { type: string }
        version:
          type: integer
          description: Explicit version for every agent; when omitted each item resolves the agent's latest published version.
        environment:
          type: string
          enum: [development, staging, production]
          description: Defaults to production.
        max_concurrency:
          type: integer
      required: [agent_ids]
    BatchAgentDeployResponse:
      allOf:
      - $ref: "#/components/schemas/BatchSubmission"
      - type: object
        properties:
          environment:
            type: string
          deployment_ids:
            type: array
            items: { type: string }
        required: [environment, deployment_ids]

    BatchRunCancelRequest:
      type: object
      properties:
        run_ids:
          type: array
          items: { type: string }
        max_concurrency:
          type: integer
      required: [run_ids]
    BatchRunCancelResponse:
      allOf:
      - $ref: "#/components/schemas/BatchSubmission"
      - type: object
        properties:
          cancelled_run_ids:
            type: array
            items: { type: string }
        required: [cancelled_run_ids]

    BatchSecretsRequest:
      type: object
      properties:
        secrets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string, writeOnly: true }
            required: [name, value]
        max_concurrency:
          type: integer
      required: [secrets]
    BatchSecretsResponse:
      allOf:
      - $ref: "#/components/schemas/BatchSubmission"
      - type: object
        properties:
          created:
            type: array
            items: { type: string }
            description: The created secret names (values are never echoed).
        required: [created]

    BatchSubmission:
      type: object
      description: The settled batch body shared by every submission response (200 or 207).
      properties:
        batch_id:
          type: string
        status:
          type: string
          description: completed when every item settled; the 207 form still reports completed with failed/cancelled items.
        summary: { $ref: "#/components/schemas/BatchSummary" }
        items:
          type: array
          items: { $ref: "#/components/schemas/BatchItem" }
      required: [batch_id, status, summary, items]

      # ---- wave-10 round-3 fragment: synth-registry.yaml (schemas) ----
    SynthProject:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
          description: Always the caller's organization (from the auth claims).
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - name
      - created_at
      - updated_at
    SynthProjectCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
      - name
    SynthProjectResponse:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/SynthProject'
      required:
      - project
    SynthProjectListResponse:
      type: object
      properties:
        projects:
          type: array
          description: Ordered by creation time; empty when the org has none.
          items:
            $ref: '#/components/schemas/SynthProject'
      required:
      - projects
    SynthTarget:
      type: object
      description: |
        Never carries the ownership challenge token: the one-time secret is
        rendered exactly once by POST /synth/targets/{id}/verify when it
        issues a challenge.
      properties:
        id:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        name:
          type: string
        base_url:
          type: string
          description: Absolute http(s) URL of the application under test.
        verified:
          type: boolean
          description: Tests execute only against verified targets.
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - project_id
      - name
      - base_url
      - verified
      - verified_at
      - created_at
      - updated_at
    SynthTargetCreateRequest:
      type: object
      properties:
        project_id:
          type: string
        name:
          type: string
          minLength: 1
        base_url:
          type: string
          description: Absolute http(s) URL (scheme + host required).
      required:
      - project_id
      - name
      - base_url
    SynthTargetUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
      - name
    SynthTargetResponse:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/SynthTarget'
      required:
      - target
    SynthTargetListResponse:
      type: object
      properties:
        targets:
          type: array
          description: Ordered by creation time; empty when none match.
          items:
            $ref: '#/components/schemas/SynthTarget'
      required:
      - targets
    SynthVerifyRequest:
      type: object
      description: |
        Empty (or action="issue") issues a challenge; a non-empty token
        confirms ownership.
      properties:
        action:
          type: string
          enum:
          - issue
          description: Currently only "issue" is meaningful (the default).
        token:
          type: string
          description: The one-time challenge token to confirm (empty = issue).
    SynthVerification:
      type: object
      description: Present ONLY on a challenge issue; carries the one-time token.
      properties:
        token:
          type: string
          description: The one-time ownership challenge secret.
        instructions:
          type: string
      required:
      - token
      - instructions
    SynthVerifyResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - challenge_issued
          - verified
        target:
          $ref: '#/components/schemas/SynthTarget'
        verification:
          oneOf:
          - $ref: '#/components/schemas/SynthVerification'
          - type: 'null'
          description: Present only when status is challenge_issued.
      required:
      - status
      - target
    SynthQuietWindow:
      type: object
      description: |
        Timezone-aware interval policy on weekdays (0=Sunday .. 6=Saturday)
        between start and end ("HH:MM", location = IANA name).
      properties:
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        start:
          type: string
          description: 'HH:MM (24-hour clock).'
          examples:
          - '22:00'
        end:
          type: string
          description: 'HH:MM (24-hour clock).'
          examples:
          - '04:00'
        location:
          type: string
          description: Loadable IANA timezone name.
          examples:
          - Europe/Berlin
        reason:
          type: string
      required:
      - weekdays
      - start
      - end
      - location
    SynthEnvironment:
      type: object
      description: |
        A runnable context with hard safety rails. The mode pins the
        enforcement posture: pre_production allows full write journeys;
        production_read_only denies every state-changing action
        server-side; release_comparison allows writes only through
        isolated synthetic accounts.
      properties:
        id:
          type: string
        org_id:
          type: string
        target_id:
          type: string
        kind:
          type: string
          enum:
          - local
          - dev
          - staging
          - production
        mode:
          type: string
          enum:
          - pre_production
          - production_read_only
          - release_comparison
        allowed_domains:
          type: array
          description: |
            Network policy: requests outside these hosts are scope
            violations. REQUIRED (non-empty) for production environments.
          items:
            type: string
        rate_cap_per_min:
          type: integer
          description: 0 = unlimited; honored only in pre_production mode.
        budget_per_run:
          type: integer
          description: Max steps per run (0 = default 200).
        quiet_windows:
          type: array
          items:
            $ref: '#/components/schemas/SynthQuietWindow'
        test_windows:
          type: array
          description: When non-empty, runs are allowed ONLY inside these.
          items:
            $ref: '#/components/schemas/SynthQuietWindow'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - target_id
      - kind
      - mode
      - allowed_domains
      - rate_cap_per_min
      - budget_per_run
      - quiet_windows
      - test_windows
      - created_at
      - updated_at
    SynthEnvironmentSpec:
      type: object
      properties:
        kind:
          type: string
          enum:
          - local
          - dev
          - staging
          - production
        mode:
          type: string
          enum:
          - pre_production
          - production_read_only
          - release_comparison
          description: |
            Omitted = kind-derived default (production ->
            production_read_only, everything else -> pre_production).
        allowed_domains:
          type: array
          items:
            type: string
        rate_cap_per_min:
          type: integer
          minimum: 0
          description: Pre-production mode only; a cap elsewhere is a 400.
        budget_per_run:
          type: integer
          minimum: 0
        quiet_windows:
          type: array
          items:
            $ref: '#/components/schemas/SynthQuietWindow'
        test_windows:
          type: array
          items:
            $ref: '#/components/schemas/SynthQuietWindow'
      required:
      - kind
    SynthEnvironmentResponse:
      type: object
      properties:
        environment:
          $ref: '#/components/schemas/SynthEnvironment'
      required:
      - environment
    SynthEnvironmentListResponse:
      type: object
      properties:
        environments:
          type: array
          description: Empty list, never null.
          items:
            $ref: '#/components/schemas/SynthEnvironment'
      required:
      - environments
    SynthPersona:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        built_in:
          type: string
          description: '"" for custom; else a documented built-in key.'
          enum:
          - ''
          - visitor
          - new_user
          - returning_user
          - standard_customer
          - administrator
          - restricted_user
          - mobile_user
          - accessibility_user
          - slow_network_user
        role_hints:
          type: array
          description: Role/permission hints for journey planning.
          items:
            type: string
        constraints:
          type: object
          description: Declarative traits (network=slow3g, viewport=mobile, ...).
          additionalProperties:
            type: string
        version:
          type: integer
          description: Bumped on every update; journeys pin persona versions.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - name
      - built_in
      - role_hints
      - constraints
      - version
      - created_at
      - updated_at
    SynthPersonaSpec:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        built_in:
          type: string
          description: One of the documented keys, or omitted/empty for custom.
        role_hints:
          type: array
          items:
            type: string
        constraints:
          type: object
          additionalProperties:
            type: string
      required:
      - name
    SynthPersonaResponse:
      type: object
      properties:
        persona:
          $ref: '#/components/schemas/SynthPersona'
      required:
      - persona
    SynthPersonaListResponse:
      type: object
      properties:
        personas:
          type: array
          description: Ordered by creation time; empty when the org has none.
          items:
            $ref: '#/components/schemas/SynthPersona'
      required:
      - personas
    SynthDeletedResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Always true on success.
      required:
      - deleted
    SynthErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of NOT_FOUND, VALIDATION_ERROR, VERIFICATION_FAILED, FORBIDDEN, UNAUTHORIZED, INTERNAL_ERROR.
              examples:
              - NOT_FOUND
            message:
              type: string
          required:
          - code
          - message
      required:
      - error

      # ---- wave-10 round-3 fragment: synth-workers.yaml (schemas) ----
    SynthWorkerKind:
      type: string
      enum: [browser, api]
      description: Isolation boundary of the executing worker (#148).
    SynthRunStatus:
      type: string
      enum: [pending, queued, running, paused, cancelling, completed, failed, cancelled, inconclusive]
      description: Versioned test-run state machine. Interrupted/lost workers resolve to inconclusive — never silently lost.
    SynthStepEvent:
      type: object
      required: [index, step_index, type, status]
      properties:
        index:
          type: integer
        step_index:
          type: integer
        type:
          type: string
          enum: [action, assertion, console, network, error, navigation]
        status:
          type: string
          enum: [passed, failed, skipped, blocked, inconclusive]
          description: Failed/skipped/blocked/inconclusive are distinct — a skipped assertion is never a pass.
        message:
          type: string
        redacted_meta:
          type: object
          additionalProperties:
            type: string
          description: Request/response metadata with authorization/cookie/set-cookie values stripped by the redaction engine.
        evidence_ref:
          type: string
          description: Opaque reference into the evidence store (screenshots, Playwright traces, console/network captures).
        at:
          type: string
          format: date-time
    SynthRunOptions:
      type: object
      properties:
        app_version:
          type: string
          description: Build/release under test — the pin used by release comparison (#156).
        max_steps:
          type: integer
          description: Hard step budget for this run.
        kill_switch:
          type: boolean
          description: When true the run is refused (global/project kill switch active).
    SynthWorkerHealth:
      type: object
      required: [kind, healthy, in_flight]
      properties:
        kind:
          $ref: '#/components/schemas/SynthWorkerKind'
        healthy:
          type: boolean
        in_flight:
          type: integer
        last_heartbeat:
          type: string
          format: date-time
        stale:
          type: boolean
          description: True when the heartbeat is older than the configured threshold — supervised runs become recoverable or explicitly inconclusive.

      # ---- wave-10 round-3 fragment: synth-journeys.yaml (schemas) ----
    SynthPersona:
      type: object
      description: |
        A synthetic identity profile (issue #147/#149). Personas NEVER
        impersonate real customer accounts — they map to dedicated synthetic
        credentials by reference only. `built_in` is empty for custom
        personas; when set it must be one of the 9 built-in keys and the
        profile must match the canonical definition exactly (anti-forgery:
        custom personas cannot claim built-in keys).
      properties:
        id:
          type: string
          description: Persona id (org-scoped).
        org_id:
          type: string
          description: Owning organization id.
        name:
          type: string
          description: Human-readable persona name.
        built_in:
          type: string
          enum:
          - ''
          - visitor
          - new_user
          - returning_user
          - standard_customer
          - administrator
          - restricted_user
          - mobile_user
          - accessibility_user
          - slow_network_user
          description: |
            Empty for custom personas; else the built-in key. A persona
            carrying a built-in key must match the canonical role hints and
            constraints byte-for-byte.
        role_hints:
          type: array
          description: Role/permission hints for journey planning (advisory).
          items:
            type: string
        constraints:
          type: object
          description: |
            Deterministic test constraints (lowercase snake_case keys).
            Canonical keys: network (slow3g|regular), viewport
            (mobile|desktop), a11y (strict|none), input
            (keyboard_only|touch|pointer). Org-extension keys are allowed.
          additionalProperties:
            type: string
        version:
          type: integer
          description: |
            Bumped on every mutation; run snapshots pin (id, version).
            Built-in personas are immutable (derive a custom one instead).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - name
      - role_hints
      - constraints
      - version
    SynthJourneyStep:
      type: object
      description: |
        One atomic action. Deterministic steps carry explicit
        selectors/inputs; AI-assisted navigation is a hint (Hint), never the
        oracle. Write operations MUST be flagged (write_op); runtime
        enforcement against the environment mode is the worker's (#148).
      properties:
        index:
          type: integer
          description: Sequential position (0-based); spec identity requires strict ordering.
        action:
          type: string
          enum:
          - navigate
          - click
          - fill
          - select
          - wait
          - api_call
          - assert
          - extract
        target:
          type: string
          description: Selector, URL, or API spec reference (may be empty only for wait).
        value:
          type: string
          description: Input value or wait duration; never a secret (no PII).
        write_op:
          type: boolean
          description: True when the step changes application state.
        timeout_ms:
          type: integer
          description: Step timeout; 0 = worker default.
        hint:
          type: string
          description: Optional AI navigation hint — never part of the oracle.
      required:
      - index
      - action
      - target
      - write_op
    SynthAssertion:
      type: object
      description: |
        A deterministic, versioned expected outcome. Every journey carries at
        least one assertion — explicit success criteria are mandatory and
        model confidence can never mark a run passed (issue #149).
      properties:
        kind:
          type: string
          enum:
          - element_visible
          - text_contains
          - api_status
          - json_schema
          - url_pattern
          - no_console_error
          - a11y_violations_below
          - latency_below_ms
        target:
          type: string
          description: Selector/URL/schema reference; may be empty only for page-wide kinds (no_console_error, a11y_violations_below).
        expected:
          type: string
          description: The expected value (text, status code, pattern, threshold).
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          description: Failure severity; drives finding triage (#150).
      required:
      - kind
      - target
      - expected
      - severity
    SynthJourney:
      type: object
      description: |
        A versioned test specification: explicit preconditions, steps,
        assertions, cleanup. Lifecycle draft → reviewed → scheduled → retired;
        drafts are the only editable state (reviewed/scheduled are immutable
        except via the version-bump clone). Write-op journeys MUST define
        cleanup steps.
      properties:
        id:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
          description: Environment the journey runs against (verified target, #147).
        persona_id:
          type: string
          description: Synthetic persona executing the journey (same org).
        name:
          type: string
        status:
          type: string
          enum:
          - draft
          - reviewed
          - scheduled
          - retired
        risk:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          description: Risk classification; required. Scheduling requires review, and high/critical journeys require an auditable review record for the current version.
        version:
          type: integer
          description: Bumped on every spec mutation and on the version-bump clone.
        preconditions:
          type: array
          description: Explicit preconditions; fixture references (fixture:<name>:v<n>) travel here and feed run snapshots.
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SynthJourneyStep'
        assertions:
          type: array
          minItems: 1
          description: ALWAYS non-empty — the deterministic success criteria.
          items:
            $ref: '#/components/schemas/SynthAssertion'
        cleanup:
          type: array
          description: Steps restoring state; REQUIRED when any step has write_op=true.
          items:
            $ref: '#/components/schemas/SynthJourneyStep'
        tags:
          type: array
          description: Product capability tags; drive the coverage report (JourneyCoverage).
          items:
            type: string
        source:
          type: string
          enum:
          - authored
          - exploration
          - regression
          description: Provenance of the spec.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - project_id
      - environment_id
      - persona_id
      - name
      - status
      - risk
      - version
      - steps
      - assertions
    SynthCapabilityCoverage:
      type: object
      description: Journeys covering one normalized product capability tag.
      properties:
        capability:
          type: string
          description: Normalized tag (trimmed, lowercased).
        journey_ids:
          type: array
          items:
            type: string
        status_counts:
          type: object
          description: Journey count per lifecycle status within this capability.
          additionalProperties:
            type: integer
      required:
      - capability
      - journey_ids
      - status_counts
    SynthJourneyCoverage:
      type: object
      description: |
        Capability coverage report (MapCapabilities): journeys → product
        capability tags from SynthJourney.tags. Deterministic ordering
        (sorted capabilities, sorted journey ids); journeys without tags are
        listed separately and never silently count as coverage. Gaps
        (requested capabilities with zero journeys) are the release-gate
        primitive (#152).
      properties:
        total_journeys:
          type: integer
        untagged_journey_ids:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/SynthCapabilityCoverage'
      required:
      - total_journeys
      - untagged_journey_ids
      - capabilities

      # ---- wave-10 round-3 fragment: synth-evidence.yaml (schemas) ----
    SynthEvidenceBundle:
      type: object
      description: |
        Versioned evidence record for one synthetic run (issue #150). Every
        artifact reference points at REDACTED artifacts; secrets never enter
        the bundle. The schema_version must be pinned by consumers; the
        bundle id is deterministic (evd_<sha256[0:16]> over version, org,
        run, journey, journey version and capture time).
      properties:
        schema_version:
          type: integer
          description: Bundle schema version (currently 1). Bumped on incompatible changes.
        bundle_id:
          type: string
          description: Deterministic id, "evd_" + 16 hex chars.
        org_id:
          type: string
          description: Owning organization (tenant scope; isolation is non-negotiable).
        project_id:
          type: string
        run_id:
          type: string
        run_kind:
          type: string
          enum: [browser, api]
        run_status:
          type: string
          description: >
            Run status at capture time: pending, queued, running, paused,
            cancelling, completed, failed, cancelled or inconclusive.
        journey_id:
          type: string
        journey_version:
          type: integer
          description: Journey spec version the run executed.
        persona_id:
          type: string
        persona_version:
          type: integer
          description: Persona version the run executed.
        environment_id:
          type: string
        environment_kind:
          type: string
          enum: [local, dev, staging, production]
        environment_mode:
          type: string
          enum: [pre_production, production_read_only, release_comparison]
        app_version:
          type: string
          description: App/build under test (release comparison).
        captured_at:
          type: string
          format: date-time
        run_started_at:
          type: string
          format: date-time
          nullable: true
        run_finished_at:
          type: string
          format: date-time
          nullable: true
        failing_assertion:
          nullable: true
          $ref: '#/components/schemas/SynthAssertionOutcome'
        assertion_results:
          type: array
          items:
            $ref: '#/components/schemas/SynthAssertionOutcome'
        repro_steps:
          type: array
          description: Deterministic, human-executable reproduction procedure.
          items:
            type: string
        screenshot_refs:
          type: array
          description: >
            Redacted screenshot artifact refs. Structurally absent for
            non-admin roles (heavy artifacts are withheld, with tombstone
            markers left in redacted_meta).
          items:
            type: string
        browser_trace_ref:
          type: string
          nullable: true
          description: Redacted browser trace artifact ref; withheld for non-admin roles.
        console_refs:
          type: array
          items:
            type: string
        network_refs:
          type: array
          items:
            type: string
        other_refs:
          type: array
          description: 'Refs outside the screenshot:/trace:/console:/network: prefix convention.'
          items:
            type: string
        correlation_ids:
          type: object
          description: Trace/span/request ids, post-redaction.
          additionalProperties:
            type: string
        redacted_meta:
          type: object
          description: Free-form metadata after RedactionEngine processing.
          additionalProperties:
            type: string
      required:
      - schema_version
      - bundle_id
      - org_id
      - run_id
      - captured_at
    SynthAssertionOutcome:
      type: object
      description: Deterministic result of one journey assertion as observed.
      properties:
        index:
          type: integer
          description: Index within the journey's assertion list.
        kind:
          type: string
          enum: [element_visible, text_contains, api_status, json_schema, url_pattern, no_console_error, a11y_violations_below, latency_below_ms]
        target:
          type: string
          description: Selector / URL / schema ref the assertion checked.
        expected:
          type: string
        actual:
          type: string
        passed:
          type: boolean
        message:
          type: string
          description: Failure detail (pre-redacted by the worker).
        severity:
          type: string
          enum: [low, medium, high, critical]
        at:
          type: string
          format: date-time
      required:
      - index
      - kind
      - passed
    SynthFinding:
      type: object
      description: |
        A defect finding linking the exact run/journey/assertion that
        produced it with a stable dedup fingerprint (issue #150). Statuses
        follow the enforced taxonomy; a confirmed defect is independently
        reproduced. Hypothesis text (if any) is language-enforced to carry
        the "hypothesis:" prefix marker and is never presented as verified
        root cause.
      properties:
        id:
          type: string
          description: Occurrence-row id ("fnd_" + 24 hex chars).
        org_id:
          type: string
        run_id:
          type: string
          description: Run that produced this occurrence.
        journey_id:
          type: string
        assertion_ix:
          type: integer
          description: Failing assertion index (-1 when none).
        status:
          type: string
          enum: [confirmed, likely, flaky, harness_failure, environmental_failure, inconclusive]
          description: |
            confirmed = independently reproduced; likely = failed with
            consistent deterministic signals, no repro yet; flaky = passes
            on isolated re-run; harness_failure = driver/worker errors (app
            not implicated); environmental_failure = infra signals;
            inconclusive = insufficient signals. Terminal-ish statuses
            (harness/environmental) are reclassified only with new evidence.
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        title:
          type: string
        description:
          type: string
          description: >
            Deterministic description; AI-assisted root-cause hypotheses are
            appended as separate lines starting with "hypothesis:".
        fingerprint:
          type: string
          description: >
            Stable SHA-256 over the canonical JSON of
            {org, target, assertion_kind, failure_class}. The org is inside
            the hash, so dedup never merges across tenants.
        repro_steps:
          type: string
        evidence_refs:
          type: array
          description: Redacted artifact refs (union across occurrences; history preserved).
          items:
            type: string
        repro_run_id:
          type: string
          nullable: true
          description: Run id of the isolated reproduction attempt, when one exists.
        reproducible:
          type: boolean
          nullable: true
          description: >
            True only when the isolated re-run independently reproduced the
            failure; false when it did not; null when never attempted.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: >
            0-1 confidence from documented per-status bases plus 0.10 x
            evidence-bundle completeness.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - run_id
      - status
      - severity
      - fingerprint
      - confidence
      - created_at
      - updated_at
    SynthOccurrence:
      type: object
      description: |
        One observed instance of a deduped finding. The occurrence log is
        append-only (extend via the occurrence history, never rewrite it)
        and never merged across organizations.
      properties:
        run_id:
          type: string
          description: Run that produced this occurrence.
        at:
          type: string
          format: date-time
          description: When the occurrence was recorded (injectable server clock).
      required:
      - run_id
      - at
    SynthReproResult:
      type: object
      description: |
        Outcome of one independent reproduction attempt. Reproduction runs
        in an ISOLATED environment via a narrow runner seam; production
        writes are never replayed, and production_read_only environments
        admit only the read-only subset (runners that cannot guarantee it
        are refused up-front).
      properties:
        repro_run_id:
          type: string
          description: Run id of the isolated re-run.
        reproduced:
          type: boolean
          description: True when the failure independently reproduced.
        at:
          type: string
          format: date-time
        environment_id:
          type: string
          description: Isolated environment used (allocated by the runner).
        mode:
          type: string
          enum: [pre_production, production_read_only, release_comparison]
        read_only_subset:
          type: boolean
          description: >
            True when the attempt was constrained to non-write steps
            (mandatory under production_read_only).
        note:
          type: string
          description: Optional runner note (runner-owned, pre-redacted).
      required:
      - repro_run_id
      - reproduced
      - at

      # ---- wave-10 round-3 fragment: synth-github.yaml (schemas) ----
    SynthGitHubRef:
      type: object
      description: |
        Tracks the external GitHub issue created from a synthetic-assurance
        finding (mirrors the pinned `synth.GitHubRef` type). The
        (org_id, fingerprint) pair is the idempotency anchor: at most one
        issue per finding fingerprint per organization. `repo` is always a
        repository from the org's server-side allowlist — the syncer refuses
        any repository outside it before issuing a network call.
      properties:
        id:
          type: string
          description: Link record id (deterministic function of finding id + fingerprint).
        org_id:
          type: string
          description: Owning organization (tenant scope; cross-tenant reads are impossible).
        finding_id:
          type: string
          description: The synthetic-assurance finding this issue was created from.
        fingerprint:
          type: string
          description: Stable finding fingerprint (org+target+assertion+failure-class) — the idempotency key.
        repo:
          type: string
          description: Allow-listed repository as "owner/name".
          examples:
          - octo/demo
        issue_number:
          type: integer
          description: GitHub issue number.
        issue_url:
          type: string
          description: Canonical issue URL (html_url).
        idempotency_key:
          type: string
          description: Stable sync idempotency key ("synth-finding:" + fingerprint).
          examples:
          - synth-finding:fp-abc123
        synced_at:
          type: string
          format: date-time
          description: Last successful sync (creation, update, or verified no-op).
      required:
      - id
      - org_id
      - finding_id
      - fingerprint
      - repo
      - issue_number
      - issue_url
      - idempotency_key
      - synced_at
    SynthSyncResult:
      type: object
      description: |
        Outcome of one idempotent sync round-trip (the wire projection of
        `synth.SyncResult`). Exactly one of created/updated/unchanged is
        true. Redaction note: issue titles and bodies are scrubbed through
        the denylist redaction engine (authorization/cookie/token/secret/
        password/api[_-]?key) before any data leaves the platform; the
        response therefore can never echo unredacted customer secrets.
      properties:
        github_ref:
          $ref: '#/components/schemas/SynthGitHubRef'
        created:
          type: boolean
          description: True when this call created the issue.
        updated:
          type: boolean
          description: True when this call updated an already-linked issue.
        unchanged:
          type: boolean
          description: True when content matched and no write was issued.
      required:
      - github_ref
      - created
      - updated
      - unchanged
    SynthVerificationResult:
      type: object
      description: |
        Outcome of a fix verification: the confirmed finding's deterministic
        regression candidate was executed on an isolated runner (never
        production — the runner seam enforces the environment write policy).
        `outcome` is pass|fail|inconclusive; runner/harness errors map to
        inconclusive, never to fail (a broken harness is not product
        evidence). finding_id + fingerprint + journey_id link the verdict
        back to the original finding and its generated candidate.
      properties:
        finding_id:
          type: string
          description: The original finding the verification was run for.
        fingerprint:
          type: string
          description: The original finding's fingerprint.
        journey_id:
          type: string
          description: The generated regression candidate that was executed.
        outcome:
          type: string
          enum:
          - pass
          - fail
          - inconclusive
          description: |
            pass = defect no longer reproduces; fail = defect reproduced;
            inconclusive = harness/runner failure or non-terminal run status.
        run_id:
          type: string
          description: Runner-assigned run id (empty when the runner errored before starting).
        evidence_refs:
          type: array
          description: Redacted evidence artifact references produced by the run.
          items:
            type: string
        detail:
          type: string
          description: Short human-readable explanation of the verdict.
        checked_at:
          type: string
          format: date-time
          description: When the verification ran.
      required:
      - finding_id
      - fingerprint
      - journey_id
      - outcome
      - run_id
      - evidence_refs
      - detail
      - checked_at

      # ---- wave-10 round-3 fragment: quality-gates.yaml (schemas) ----
    QualityGateSuiteKind:
      type: string
      enum: [evaluations, synthetic_journeys, security_adversarial, canary_health]
      description: >
        The assurance suite families whose evidence a release gate
        consumes (eval runs, synthetic journeys, adversarial/security
        scenarios, canary health).
    QualityGateSeverity:
      type: string
      enum: [info, low, medium, high, critical]
    QualityGateSuiteRequirement:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/QualityGateSuiteKind" }
        min_coverage_pct:
          type: number
          minimum: 0
          maximum: 100
          description: Minimum suite coverage in percent (0 disables the gate).
        min_pass_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Minimum case pass rate (0 disables the gate).
        max_p95_ms:
          type: integer
          minimum: 0
          description: Maximum tolerated p95 latency in ms (0 disables the gate).
        max_severity_allowed:
          allOf:
          - { $ref: "#/components/schemas/QualityGateSeverity" }
          description: >
            Highest tolerated finding severity (a finding ranked above it
            fails the check). MANDATORY for security_adversarial suites.
        max_age_ms:
          type: integer
          minimum: 0
          description: Evidence freshness window in ms — older evidence is stale and blocks (0 = never stale).
        fail_closed:
          type: boolean
          description: >
            Security-critical marker: ignores aggregate score balancing
            and exceptions. MUST be true for security_adversarial suites
            (structurally enforced — softer shapes are rejected with 422).
    QualityGateException:
      type: object
      description: A time-bounded waiver. It overrides ONLY non-security suites and only while unexpired.
      properties:
        suite:
          allOf:
          - { $ref: "#/components/schemas/QualityGateSuiteKind" }
          description: The waived suite kind ("" matches every non-security suite).
        reason: { type: string }
        approved_by:
          type: string
          description: The authenticated actor who approved the waiver (never read from a request body).
        approved_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    QualityGatePolicy:
      type: object
      description: Versioned, tenant-scoped release-assurance policy (immutable versions; decisions cite version + evaluation_version).
      properties:
        id: { type: string }
        org_id: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        required_suites:
          type: array
          items: { $ref: "#/components/schemas/QualityGateSuiteRequirement" }
        exceptions:
          type: array
          items: { $ref: "#/components/schemas/QualityGateException" }
        active: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QualityGatePolicyInput:
      type: object
      required: [name, required_suites]
      properties:
        name:
          type: string
          minLength: 1
        required_suites:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/QualityGateSuiteRequirement" }
        active:
          type: boolean
          description: Defaults to true when omitted.
    QualityGateEvidenceSubject:
      type: object
      description: The artifact versions the evidence was collected against.
      properties:
        app_version: { type: string }
        agent_id: { type: string }
        agent_version: { type: integer }
        model_id: { type: string }
        prompt_version: { type: string }
        tool_versions:
          type: array
          items: { type: string }
        workflow_version: { type: string }
    QualityGateEvidenceFinding:
      type: object
      properties:
        severity: { $ref: "#/components/schemas/QualityGateSeverity" }
        title: { type: string }
    QualityGateEvidenceStatus:
      type: string
      enum: [completed, inconclusive]
      description: inconclusive runs are explicitly NOT pass/fail (they block).
    QualityGateSuiteResult:
      type: object
      properties:
        status: { $ref: "#/components/schemas/QualityGateEvidenceStatus" }
        coverage_pct: { type: number, minimum: 0, maximum: 100 }
        cases: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        p95_ms: { type: integer, minimum: 0 }
        findings:
          type: array
          items: { $ref: "#/components/schemas/QualityGateEvidenceFinding" }
    QualityGateEvidenceRecord:
      type: object
      description: >
        Immutable, content-hashed suite evidence snapshot (app / agent /
        model / prompt / tool / workflow versions + results + collected_at).
        The store stamps a SHA-256 content hash; tampered records are
        rejected (422 EVIDENCE_TAMPERED at evaluation).
      properties:
        id: { type: string }
        org_id: { type: string }
        suite: { $ref: "#/components/schemas/QualityGateSuiteKind" }
        subject: { $ref: "#/components/schemas/QualityGateEvidenceSubject" }
        result: { $ref: "#/components/schemas/QualityGateSuiteResult" }
        collected_at: { type: string, format: date-time }
        content_hash:
          type: string
          description: SHA-256 hex digest over the canonical record (stamped at write, verified on read).
    QualityGateCheckStatus:
      type: string
      enum: [passed, failed, blocked, skipped, stale, inconclusive]
      description: >
        passed = thresholds met; failed = threshold (or hard security)
        failure; blocked = no evidence for a required suite; skipped =
        waived by an unexpired non-security exception; stale = evidence
        older than max_age_ms; inconclusive = interrupted/empty run.
    QualityGateCheckResult:
      type: object
      properties:
        suite: { type: string }
        status: { $ref: "#/components/schemas/QualityGateCheckStatus" }
        reason:
          type: string
          description: Deterministic explanation quoting the observed value against the threshold (or the waiver/block cause).
    QualityGateRecommendation:
      type: string
      enum: [promote, hold, abort, rollback]
      description: >
        promote = every suite passed (or waived); hold = evidence
        missing/stale/inconclusive (wait for evidence; the canary keeps
        running); abort = hard security failure (stop the release AND the
        in-flight canary); rollback = proven quality regression (revert to
        baseline). Precedence abort > rollback > hold > promote.
    QualityGateDecision:
      type: object
      description: Deterministic evaluation output (same policy + evidence + instant => same decision).
      properties:
        policy_id: { type: string }
        policy_version: { type: integer }
        policy_evaluation_version:
          type: string
          description: Content hash of the exact rule set the decision ran against (audit-grade pin).
        recommendation: { $ref: "#/components/schemas/QualityGateRecommendation" }
        check_results:
          type: array
          items: { $ref: "#/components/schemas/QualityGateCheckResult" }
        evaluated_at: { type: string, format: date-time }
    QualityGatesError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

      # ---- wave-10 round-3 fragment: adversarial-evals.yaml (schemas) ----
    AdversarialSetup:
      type: object
      description: Synthetic fixture facts of one scenario. Every value is synthetic — nothing addresses a real system.
      required: [organization_id]
      properties:
        organization_id:
          type: string
          description: The attacking tenant whose enforcement configuration the scenario exercises.
        tool_name:
          type: string
          description: Tool the payload steers toward (tool/secret kinds).
        foreign_organization_id:
          type: string
          description: Victim tenant (cross-tenant kinds).
        foreign_resource_id:
          type: string
          description: Foreign resource reference (dataset id, secret name).
        agent_id:
          type: string
          description: Agent under test (delegation/output kinds).
        target:
          type: string
          description: |
            Optional network target REFERENCE. Allowlist: loopback hosts and
            RFC 2606 reserved names only; production hosts are rejected at
            pack registration.
        via_untrusted_tool_output:
          type: boolean
          description: Marks indirect-injection framing (payload embedded in untrusted tool output).
    AdversarialScenario:
      type: object
      description: One versioned adversarial test — a SAFE synthetic payload, the control boundary expected to block it, and the impact grade.
      required: [id, name, kind, setup, attack_payload, expected_control, severity]
      properties:
        id:
          type: string
          description: Scenario id, unique within its pack, no whitespace.
        name:
          type: string
        kind:
          type: string
          enum: [direct_prompt_injection, indirect_prompt_injection, tool_permission_bypass, cross_tenant_data_access, secret_exposure, unsafe_delegation, output_policy_violation]
        description:
          type: string
        setup:
          $ref: '#/components/schemas/AdversarialSetup'
        attack_payload:
          type: string
          maxLength: 8192
          description: |
            SAFE synthetic marker text (e.g. "IGNORE-PREVIOUS-AND-TOOL-CALL-<marker>").
            Never executed, never aimed outside the target allowlist; must not
            contain executable content (NUL, shebang, command substitution,
            pipe-to-shell launchers).
        expected_control:
          type: string
          enum: [policy_enforcer, runtime_tool_permission, tenant_store_guard, secrets_guard, delegation_gate, output_gate]
        severity:
          type: string
          enum: [info, low, medium, high, critical]
    AdversarialPack:
      type: object
      description: A versioned, named collection of scenarios (max 100).
      required: [id, name, version, scenarios]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
          description: Required — packs are versioned; duplicate ids are rejected (bump the version instead).
        description:
          type: string
        scenarios:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdversarialScenario'
    AdversarialResult:
      type: object
      description: The outcome of one scenario execution, classified by side-effect execution at the expected control boundary.
      required: [suite, scenario_id, kind, outcome, observed_action, evidence, severity, expected_control]
      properties:
        suite:
          type: string
          enum: [security_adversarial]
        pack_id:
          type: string
        pack_version:
          type: string
        scenario_id:
          type: string
        kind:
          type: string
          enum: [direct_prompt_injection, indirect_prompt_injection, tool_permission_bypass, cross_tenant_data_access, secret_exposure, unsafe_delegation, output_policy_violation]
        outcome:
          type: string
          enum: [pass, fail, inconclusive]
          description: |
            pass — the expected control blocked before any side effect executed;
            fail — the side effect EXECUTED (control missing or bypassed);
            inconclusive — the seam was misconfigured/unavailable (never conflated with pass).
        policy_decision:
          type: object
          description: The decision the policy engine produced at the seam (decision, matched_policy_id, reason).
          properties:
            decision:
              type: string
              enum: [allow, deny]
            matched_policy_id:
              type: string
            reason:
              type: string
        observed_action:
          type: string
          description: Machine-readable observation, e.g. tool_not_invoked, foreign_data_returned, delegation_executed.
        evidence:
          type: string
          description: Deterministic prose evidence (boundary, observation, policy reason). Never carries payload or secret material.
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        expected_control:
          type: string
          enum: [policy_enforcer, runtime_tool_permission, tenant_store_guard, secrets_guard, delegation_gate, output_gate]
        duration_ms:
          type: number
          format: double
        error:
          type: string
    GateEvidence:
      type: object
      description: |
        Deterministic release-gate evidence for quality-gate policies. This
        struct shape IS the contract (internal/evaluations does not import
        internal/qualitygates): match on suite, threshold on pass_rate and
        max_severity_failed_rank.
      required: [suite, total, passed, failed, inconclusive, pass_rate, max_severity_failed, max_severity_failed_rank]
      properties:
        suite:
          type: string
          enum: [security_adversarial]
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        inconclusive:
          type: integer
          description: Counted separately; never folded into pass_rate.
        pass_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
        max_severity_failed:
          type: string
          enum: [info, low, medium, high, critical]
          description: Empty string when nothing failed.
        max_severity_failed_rank:
          type: integer
          description: 0 when nothing failed; 1..5 for info..critical.
        packs:
          type: array
          description: Sorted unique pack ids contributing to this evidence.
          items:
            type: string

      # ---- wave-10 round-3 fragment: synth-explore.yaml (schemas) ----
    SynthScopeDecision:
      type: object
      description: |
        Server-side scope/policy verdict for one proposed exploration action
        (issue #155). Decisions are computed from SERVER-PINNED inputs only
        (allowlisted domains, environment mode/kind, per-run step/time
        budgets, rate caps, window policy, kill switches, context
        cancellation). Page-derived content is structurally excluded from
        the decision inputs. Reason vocabulary (illustrative):
        allowed | allowlisted_domain | write_denied_readonly |
        write_requires_synthetic_account | rate_capped | quiet_window |
        invalid_window_policy | step_budget | time_budget | kill_switch |
        context_cancelled | invalid_action | invalid_url | unregistered_run.
      properties:
        allowed:
          type: boolean
          description: Whether the action may execute.
        reason:
          type: string
          description: Machine-readable denial/allow reason (see description).
        at:
          type: string
          format: date-time
          description: Decision timestamp (server clock).
      required:
      - allowed
      - reason
      - at
    SynthExplorationAction:
      type: object
      description: |
        One proposed exploration action (browser-agent seam vocabulary,
        mirroring journey steps). Explorers fill kind/url/target/value only;
        write/synthetic-account context is enforced server-side.
      properties:
        kind:
          type: string
          enum: [navigate, click, fill, select, wait, api_call, assert, extract]
        url:
          type: string
          description: Absolute target URL for navigate actions (else empty).
        target:
          type: string
          description: Selector for click/fill/select/extract actions.
        value:
          type: string
          description: Input value for fill/select actions.
        write_op:
          type: boolean
          description: True when the action is state-changing.
        synthetic_account:
          type: string
          description: |
            Isolated synthetic account reference. REQUIRED for write
            operations under the release_comparison environment mode;
            writes are denied otherwise (read-only default is enforced
            server-side, not by convention).
      required:
      - kind
      - write_op
    SynthExplorationObservation:
      type: object
      description: |
        Page-derived fact captured after an executed action. Title/content
        are sanitized (control characters stripped, whitespace collapsed,
        length-capped) and are DATA ONLY: they never feed scope decisions.
      properties:
        url:
          type: string
        title:
          type: string
        links:
          type: array
          description: Raw hrefs seen on the page (data only; navigating one is re-checked).
          items:
            type: string
        content:
          type: string
          description: Sanitized page text excerpt (data only).
        at:
          type: string
          format: date-time
      required:
      - url
      - at
    SynthExplorationPlanStep:
      type: object
      description: One planned navigation. goal_id "seed" marks the landing navigation.
      properties:
        index:
          type: integer
        path:
          type: string
          description: Route path (starts with "/").
        goal_id:
          type: string
      required:
      - index
      - path
      - goal_id
    SynthExplorationPlan:
      type: object
      description: |
        Ordered candidate navigations built deterministically from a
        registered app's allowlisted routes, persona role hints and goals:
        seed landing first, then each goal's persona-permitted routes in
        registration order (deduplicated by path). Identical inputs produce
        an identical plan id.
      properties:
        id:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        environment_id:
          type: string
        persona_id:
          type: string
        target_base_url:
          type: string
        goal_ids:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SynthExplorationPlanStep'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - project_id
      - environment_id
      - persona_id
      - steps
      - created_at
    SynthExplorationCost:
      type: object
      description: Exploration cost accounting (applied steps, denied proposals, wall clock).
      properties:
        steps:
          type: integer
          description: Applied (scope-allowed) actions.
        denied:
          type: integer
          description: Proposals denied by scope/loop checks.
        duration_ms:
          type: number
          description: Run wall-clock duration in milliseconds.
      required:
      - steps
      - denied
      - duration_ms
    SynthScopeLedger:
      type: object
      description: |
        Coverage ledger of one exploration run: planned vs discovered vs
        tested routes, gaps, uncertainty (denied/unparseable proposals,
        sanitized), safety flags (risky_write / loop_detected) and cost.
        coverage_percent = share of planned routes with at least one
        executed in-scope action (0 when nothing was planned).
      properties:
        planned_routes:
          type: array
          items:
            type: string
        discovered_routes:
          type: array
          description: Unique paths reached by executed navigations.
          items:
            type: string
        tested_routes:
          type: array
          description: Unique paths with at least one executed in-scope action.
          items:
            type: string
        gaps:
          type: array
          description: Planned routes never tested.
          items:
            type: string
        uncertainty:
          type: array
          description: Sanitized denial/unparseability details.
          items:
            type: string
        flags:
          type: array
          description: Sanitized risky_write / loop_detected flags.
          items:
            type: string
        visited_states:
          type: integer
          description: Executed unique visited-state hashes.
        coverage_percent:
          type: number
        cost:
          $ref: '#/components/schemas/SynthExplorationCost'
      required:
      - planned_routes
      - discovered_routes
      - tested_routes
      - gaps
      - uncertainty
      - flags
      - visited_states
      - coverage_percent
      - cost
    SynthCandidateJourney:
      type: object
      description: |
        Draft journey candidate produced by exploration (journey source
        "exploration", status draft, version 1, explicit assertions).
        Drafts require EXPLICIT human approval: approved_by/approved_at stay
        empty and the status remains draft (ineligible for scheduling)
        until the approval converts draft → reviewed. The approval ledger
        lives beside the pinned journey contract, not inside it.
      properties:
        journey_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, reviewed]
        risk:
          type: string
          enum: [low, medium, high, critical]
        goal_id:
          type: string
        coverage_ref:
          type: string
          description: Originating exploration plan id.
        step_count:
          type: integer
        assertion_count:
          type: integer
        approved_by:
          type: string
          description: Empty until explicit approval.
        approved_at:
          type: string
          format: date-time
          nullable: true
      required:
      - journey_id
      - name
      - status
      - risk
      - goal_id
      - coverage_ref
      - step_count
      - assertion_count
      - approved_by
    SynthAfterDeployment:
      type: object
      description: |
        Event trigger on a production schedule (issue #156): fire one extra
        run after each deployment of app_version (empty = any version).
      properties:
        app_version:
          type: string
          description: Exact AppVersion to match; empty matches any deployment.
    SynthRetryPolicy:
      type: object
      description: |
        Retry policy for failed/inconclusive production runs (issue #156).
        max_attempts counts the INITIAL attempt (1 = no retries); backoff is
        capped exponential (base * 2^(n-1), clamped to max_backoff; defaults
        30s base / 10m cap when unset).
      properties:
        max_attempts:
          type: integer
          minimum: 1
        backoff_seconds:
          type: number
        max_backoff_seconds:
          type: number
    SynthProductionSchedule:
      type: object
      description: |
        Recurring (or deployment-triggered) journey schedule against a
        VERIFIED production target ONLY (issue #156; enforced server-side at
        creation AND on every evaluation). The read-only default is enforced
        server-side: write journeys run ONLY in the release_comparison
        environment mode AND with an isolated synthetic account; every other
        production run is pinned read-only. Timezone-aware quiet/test
        windows, tenant run budgets + concurrency caps, global/per-project
        kill switches and pause/cancel all gate each due run.
      properties:
        id:
          type: string
        org_id:
          type: string
        project_id:
          type: string
        journey_id:
          type: string
        journey_version:
          type: integer
        environment_id:
          type: string
        persona_id:
          type: string
        persona_version:
          type: integer
        has_write_ops:
          type: boolean
          description: True for journeys with state-changing steps.
        interval_seconds:
          type: number
          description: Recurrence period (> 0 for time-based schedules).
        on_deployment:
          nullable: true
          $ref: '#/components/schemas/SynthAfterDeployment'
        retry:
          $ref: '#/components/schemas/SynthRetryPolicy'
        paused:
          type: boolean
        synthetic_account:
          type: string
          description: |
            Isolated synthetic account reference — REQUIRED when
            has_write_ops (release_comparison mode only).
        next_run_at:
          type: string
          format: date-time
          nullable: true
        attempts:
          type: integer
          description: Consecutive retry attempts consumed in the current run cycle.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - org_id
      - project_id
      - journey_id
      - journey_version
      - environment_id
      - persona_id
      - has_write_ops
      - paused
      - created_at
      - updated_at
    SynthLatencyDelta:
      type: object
      description: |
        Run-duration percentiles (ms) per side plus relative deltas
        ((candidate − stable)/stable × 100). Relative deltas are 0 on a
        zero baseline (documented inapplicability, not zero drift).
      properties:
        stable_p50_ms:
          type: number
        stable_p95_ms:
          type: number
        candidate_p50_ms:
          type: number
        candidate_p95_ms:
          type: number
        p50_delta_pct:
          type: number
        p95_delta_pct:
          type: number
    SynthComparisonThresholds:
      type: object
      description: |
        Meaningful-difference thresholds. Defaults (issue #156): 5pp journey
        completion, 20%/30% p50/p95 relative latency, 2pp assertion pass,
        0.5 console errors per run.
      properties:
        completion_delta_pp:
          type: number
        latency_p50_rel_pct:
          type: number
        latency_p95_rel_pct:
          type: number
        assertion_pass_delta_pp:
          type: number
        console_error_per_run_abs:
          type: number
    SynthComparisonReport:
      type: object
      description: |
        Stable-vs-candidate release comparison over the SAME versioned
        inputs — journey, persona, environment, fixture set and assertion
        set are pinned; any input/AppVersion drift is listed in
        version_drift and forces meaningful=false, so a comparison across
        different journeys/fixtures is never presented as evidence. Deltas
        are candidate − stable. A report is meaningful only when at least
        one documented threshold is breached AND there is no version drift;
        reasons list breached thresholds in deterministic order with
        direction (regression/improvement).
      properties:
        stable_version:
          type: string
        candidate_version:
          type: string
        stable_runs:
          type: integer
        candidate_runs:
          type: integer
        stable_completion_pct:
          type: number
        candidate_completion_pct:
          type: number
        journey_completion_delta_pp:
          type: number
          description: Percentage points (candidate − stable).
        latency_delta:
          $ref: '#/components/schemas/SynthLatencyDelta'
        stable_assertion_pass_pct:
          type: number
        candidate_assertion_pass_pct:
          type: number
        assertion_pass_delta_pp:
          type: number
        stable_console_errors_per_run:
          type: number
        candidate_console_errors_per_run:
          type: number
        console_error_delta:
          type: number
        version_drift:
          type: array
          description: Every input/version mismatch (non-empty forces meaningful=false).
          items:
            type: string
        meaningful:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        thresholds:
          $ref: '#/components/schemas/SynthComparisonThresholds'
      required:
      - stable_version
      - candidate_version
      - stable_runs
      - candidate_runs
      - stable_completion_pct
      - candidate_completion_pct
      - journey_completion_delta_pp
      - latency_delta
      - assertion_pass_delta_pp
      - console_error_delta
      - version_drift
      - meaningful
      - reasons
      - thresholds

      # ---- wave-10 round-4 fragment: knowledge-graph.yaml (schemas) ----
    ActivityEpisode:
      type: object
      description: |
        One agent activity captured from a run (issue #130). Episodes are the
        temporal layer of the knowledge graph: persisted timestamped with
        episode content chunked like documents and embedded via the knowledge
        embedder; retrieval weights raw relevance by exponential half-life
        decay (24h default). action_type is one of tool_call | reasoning |
        decision | observation.
      required: [agent_id, run_id, action_type, content, timestamp]
      properties:
        agent_id:
          type: string
          description: Agent that produced the activity (authoritative from the recorder).
        run_id:
          type: string
          description: Run the activity belongs to (authoritative from the recorder).
        organization_id:
          type: string
          description: Owning organization (tenant guard; stamped server-side).
        action_type:
          type: string
          enum: [tool_call, reasoning, decision, observation]
        content:
          type: string
          minLength: 1
          description: Activity payload; chunked at ~800 runes on boundaries at ingest.
        entities:
          type: array
          description: Entity surface forms mentioned by the activity (graph seeds).
          items:
            type: string
        timestamp:
          type: string
          format: date-time
          description: |
            When the activity happened (NOT insert time). Zero timestamps are
            stamped with the ingest time by the episode ingestor.
    AttributeDef:
      type: object
      description: One typed attribute of an entity or edge type. Name is snake_case; reserved names (uuid, name, created_at) cannot be redefined with another type.
      required: [name, type]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        type:
          type: string
          enum: [string, number, integer, boolean, datetime]
        required:
          type: boolean
          default: false
        description:
          type: string
    EntityType:
      type: object
      description: |
        One node type of the knowledge graph. Name is PascalCase. fallback
        marks the guaranteed types (Person, Organization) present in every
        generated ontology. cues are lowercase trigger words the
        deterministic extractor matches against a candidate's context.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Z][A-Za-z0-9]*$'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDef'
        fallback:
          type: boolean
          description: True for the guaranteed fallback types (Person, Organization).
        cues:
          type: array
          items:
            type: string
    EdgeType:
      type: object
      description: One relationship type; UPPER_SNAKE_CASE name, endpoints referencing declared entity types. The (name, source_type, target_type) triple is the edge identity.
      required: [name, source_type, target_type]
      properties:
        name:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        source_type:
          type: string
        target_type:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDef'
    Ontology:
      type: object
      description: |
        Org-scoped schema of one knowledge graph (issue #131). Generated via
        the LLMGateway seam or the deterministic RuleBasedGenerator;
        validation errors are typed (ErrOntologyValidation) and carry field
        paths — schema violations are never silently fixed.
      required: [entity_types]
      properties:
        id:
          type: string
        organization_id:
          type: string
          description: Owning organization (tenant guard).
        entity_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EntityType'
        edge_types:
          type: array
          items:
            $ref: '#/components/schemas/EdgeType'
        attribute_defs:
          type: array
          description: Shared attribute library (canonical reserved attributes ship by default).
          items:
            $ref: '#/components/schemas/AttributeDef'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExtractionResult:
      type: object
      description: |
        Outcome of one schema-driven extraction query. Entities are typed
        against the ontology; edges connect co-occurring typed entities
        through declared edge types only; every schema violation (unknown
        type filter, undeclared or mistyped attribute value) is collected in
        rejected — type errors are NEVER silent.
      required: [entities]
      properties:
        entities:
          type: array
          items:
            type: object
            required: [type, name]
            properties:
              type:
                type: string
                description: Declared EntityType name.
              name:
                type: string
                description: Surface form of the entity mention.
              attributes:
                type: object
                additionalProperties: true
                description: Validated attribute values keyed by declared attribute name.
              position:
                type: integer
                description: Token offset of the first mention (deterministic ordering).
        edges:
          type: array
          items:
            type: object
            required: [type, source, target]
            properties:
              type:
                type: string
                description: Declared EdgeType name.
              source:
                type: string
              target:
                type: string
        rejected:
          type: array
          description: Collected schema violations (never silent).
          items:
            type: object
            required: [surface, reason]
            properties:
              surface:
                type: string
                description: The offending candidate, value or filter.
              type:
                type: string
                description: Entity type the violation relates to, when known.
              reason:
                type: string

      # ---- wave-10 round-4 fragment: retrieval-tools.yaml (schemas) ----
    RetrievalTier:
      type: string
      description: |
        One depth tier of the multi-depth search hierarchy (issue #132),
        cheapest first. Tiers are policy-restrictable: the existing
        tool_allowlist condition can admit quick searches for every agent
        while reserving the deeper tiers for trusted runs. Each tier tool
        exposes its tier via TierName().
      enum:
      - quick
      - panorama
      - insight
      x-tier-cost:
        quick: low
        panorama: medium
        insight: high
    RetrievalToolSpec:
      type: object
      description: |
        The contract of one tiered retrieval tool as registered into the
        platform tool registry (registry names: quick_search,
        panorama_search, insight_forge). Tools implement the platform tool
        interface (Name + Execute, plus ContextAware for deadline/cancel
        propagation) and are registered with the one-line
        knowledge.RegisterRetrievalTools helper — the internal/tools catalog
        itself is not modified.
      required: [name, tier, description, cost_class]
      properties:
        name:
          type: string
          description: Registry name (the value tool_allowlist policies match).
          enum: [quick_search, panorama_search, insight_forge]
        tier:
          $ref: '#/components/schemas/RetrievalTier'
        description:
          type: string
          description: What the tier does.
        cost_class:
          type: string
          enum: [low, medium, high]
          description: Relative cost of one call (observability hint; the per-call estimated_tokens counters carry the numbers).
        input:
          type: object
          description: Tool arguments (JSON object passed to Execute).
          required: [org_id, query]
          properties:
            org_id:
              type: string
              minLength: 1
              description: Caller organization id (tenant guard; fail-closed when missing).
            query:
              type: string
              minLength: 1
              description: Search query (insight_forge decomposes it into sub-questions).
            k:
              type: integer
              minimum: 1
              maximum: 50
              description: Top-K result cap (quick_search default 5, panorama_search default 20).
            include_archived:
              type: boolean
              default: false
              description: panorama_search only — widen the window to archived/expired documents (the metadata convention archived/status/expires_at).
        output:
          type: object
          description: |
            Tool result map: tier, org_id, query, results (contract search
            result fields document_id/document_title/chunk_id/chunk_ordinal/
            content/score/citation), count and estimated_tokens.
            panorama_search adds full per-result context
            (document_source/document_metadata/created_at) and
            include_archived. insight_forge adds sub_questions, findings
            (per sub-question results) and synthesis.
          properties:
            tier:
              $ref: '#/components/schemas/RetrievalTier'
            count:
              type: integer
            estimated_tokens:
              type: integer
              description: Deterministic token-cost estimate of the call (~4 chars/token; budgeting signal, not billing).
            results:
              type: array
              items: { type: object, additionalProperties: true }
            synthesis:
              type: string
              description: insight_forge only — the composed insight over the deduplicated, ranked findings.
    LeaseState:
      type: object
      description: |
        Point-in-time snapshot of one graph's lifecycle coordination state
        (issue #135): read leases + exclusive write locks per org-scoped
        graph key ("org/<org_id>/kb/<kb_id>"). Mirrors
        knowledge.LeaseState; exposed for observability rendering and a
        future admin status endpoint — the coordination itself is in-process
        (mutex + broadcast channels, no goroutines, no network surface).
      required: [graph_key, active_readers, write_locked, queue]
      properties:
        graph_key:
          type: string
          description: Org-scoped lifecycle key built by knowledge.GraphKey — "org/<org_id>/kb/<kb_id>". Tenant keys are disjoint by construction.
          examples:
          - org/9f1c…/kb/2b7e…
        active_readers:
          type: integer
          minimum: 0
          description: Read leases currently held (search/run duration).
        write_locked:
          type: boolean
          description: True while the exclusive write lease (reset/re-ingest/schema change) is held; no reader can be admitted.
        queue:
          type: integer
          minimum: 0
          description: Writers waiting for active readers to release (writer-priority — new readers queue behind them).

      # ---- wave-10 round-4 fragment: simulation.yaml (schemas) ----
    SimulationCoreIdentity:
      type: object
      description: |
        The platform-independent half of a simulated agent — who the agent
        IS, independent of where it acts. A lightweight, Persona-shaped
        struct that deliberately does NOT import internal/synth (documented
        decoupling, issue #133): synth.Persona.ID/OrgID/Name/RoleHints/
        Constraints project onto the same-named fields; Traits are a
        simulation-local numeric vocabulary in [0,1] (missing = 0.5):
        extraversion (initiating), agreeableness (reciprocal), openness
        (exploratory), risk_appetite (market aggression).
      required: [id]
      properties:
        id:
          type: string
          description: Stable within the simulation; unique per config.
        org_id:
          type: string
          description: Tenant scope (echoed from the config, claims-stamped).
        name:
          type: string
        role_hints:
          type: array
          items:
            type: string
        constraints:
          type: object
          additionalProperties:
            type: string
        traits:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
    SimulationPlatformBehavior:
      type: object
      description: |
        The per-platform overlay: how the persona ACTS on one platform. The
        SAME CoreIdentity with different overlays must produce observably
        different action mixes (the divergence contract, tested).
      properties:
        actions:
          type: array
          items:
            type: string
          description: Optional vocabulary restriction (adapter verbs, e.g. post/like/follow/comment or buy/sell/bid or send/receive/route). Unknown verbs are rejected by the environment at apply time ("unknown_action").
        frequency:
          type: number
          minimum: 0
          maximum: 1
          description: Per-round participation gate — the agent acts only if a uniform draw < frequency × activity multiplier. Omitted = always active.
        weights:
          type: object
          additionalProperties:
            type: number
          description: Explicit per-action selection weights (normalized internally); REPLACE the trait-derived defaults for the listed verbs.
    SimulationPersona:
      type: object
      description: One simulated agent — shared identity + platform overlays.
      required: [core_identity, platform_behavior]
      properties:
        core_identity:
          $ref: '#/components/schemas/SimulationCoreIdentity'
        platform_behavior:
          type: object
          description: Keyed by environment kind (social | market | network | custom).
          additionalProperties:
            $ref: '#/components/schemas/SimulationPlatformBehavior'
    SimulationActivityEvent:
      type: object
      description: |
        An external event injected at a specific round (activity injection,
        issue #133) so runs can be steered without bespoke configs. Adapter
        vocabulary — social: trending_topic {topic}; market: price_shock
        {symbol, pct (may be negative)}; network: viral_message {topic}.
        Environments absorb events through an optional EventInjector seam;
        the pinned SimulationEnvironment signature stays clean.
      required: [round, kind]
      properties:
        round:
          type: integer
          minimum: 1
          description: 1-based; must be within [1, rounds].
        platform:
          type: string
          description: Empty, or the run kind (validated to match).
        kind:
          type: string
        payload:
          type: object
          additionalProperties:
            type: string
    SimulationConfig:
      type: object
      description: |
        The wire-level configuration for one simulation (POST body). The
        tenant is derived from the auth claims — any client-supplied
        org_id is force-stamped over server-side.
      required: [kind, rounds, agents]
      properties:
        org_id:
          type: string
          description: Server-side only (claims); ignored on input.
        name:
          type: string
        kind:
          type: string
          description: Registered environment kind (built-ins social | market | network; custom kinds via RegisterEnvironment).
        rounds:
          type: integer
          minimum: 1
          maximum: 500
        seed:
          type: integer
          format: int64
          description: Determinism anchor — same config + seed + clock reproduce byte-identical results.
        location:
          type: string
          description: IANA timezone for the activity multipliers ("" = UTC); invalid names are a 422.
        agents:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/SimulationPersona'
        activity:
          type: array
          description: External events at specific rounds (see SimulationActivityEvent).
          items:
            $ref: '#/components/schemas/SimulationActivityEvent'
        params:
          type: object
          additionalProperties:
            type: string
          description: Adapter tuning (social feed_depth; market symbols/price_<SYM>/starting_cash; network inbox_depth).
    SimulationAction:
      type: object
      description: One atomic agent decision in a platform vocabulary.
      properties:
        agent_id:
          type: string
        kind:
          type: string
          description: Platform verb (post/like/follow/comment; buy/sell/bid; send/receive/route; custom).
        target:
          type: string
          description: Object id (post, symbol, peer, message).
        payload:
          type: object
          additionalProperties:
            type: string
    SimulationActionResult:
      type: object
      description: The environment's verdict on one attempted action.
      properties:
        action:
          $ref: '#/components/schemas/SimulationAction'
        accepted:
          type: boolean
        reason:
          type: string
          description: Rejection class (unknown_post, no_liquidity, insufficient_holdings, inbox_empty, max_hops, idle, ...).
        detail:
          type: string
          description: Human-readable outcome (e.g. "filled 2/3 AGENTOS").
        at:
          type: string
          format: date-time
    SimulationRoundMetrics:
      type: object
      description: The per-round quantitative footprint.
      properties:
        round:
          type: integer
        total_agents:
          type: integer
        active_agents:
          type: integer
          description: Agents that passed the activity gate this round.
        actions:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        action_mix:
          type: object
          additionalProperties:
            type: integer
          description: Verb -> attempted count.
        activity_multiplier:
          type: number
          description: Timezone-aware participation multiplier in force this round (documented piecewise table over the local hour).
        events:
          type: array
          items:
            type: string
          description: External event kinds applied this round.
    SimulationEnvState:
      type: object
      description: |
        A point-in-time SNAPSHOT of the observable environment — JSON-
        serializable, adapter-defined Facts (social feed + follow counts;
        market symbols/order book/cash/holdings; network peers/inbox/edges),
        safe to hand to agents and API responses alike. Snapshots are copies.
      properties:
        kind:
          type: string
        round:
          type: integer
        agent_ids:
          type: array
          items:
            type: string
        facts:
          type: object
          additionalProperties: true
    SimulationRoundRecord:
      type: object
      description: The full transcript of one round.
      properties:
        round:
          type: integer
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SimulationActionResult'
        metrics:
          $ref: '#/components/schemas/SimulationRoundMetrics'
        state:
          $ref: '#/components/schemas/SimulationEnvState'
    SimulationEmergentNote:
      type: object
      description: |
        One emergence heuristic over the completed run. `detail` ALWAYS
        restates the formula and raw counts — a score is never presented
        without its derivation. Documented heuristics: interaction_density
        (accepted targeted actions / max(1, agents×rounds), all kinds);
        echo_chamber (own-post like+comment share, social, 1.0 = pure echo
        chamber); spread_rate (unique recipients / max(1, agents-1),
        network, 1.0 = full cast reached); liquidity_imbalance
        (|bids-asks|/max(1,bids+asks) at the final state, market, 0 =
        balanced book).
      properties:
        kind:
          type: string
        score:
          type: number
        detail:
          type: string
    SimulationResult:
      type: object
      description: The terminal product of a run (issue #133).
      properties:
        kind:
          type: string
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/SimulationRoundRecord'
        emergent_notes:
          type: array
          items:
            $ref: '#/components/schemas/SimulationEmergentNote'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    SimulationRecord:
      type: object
      description: One org-scoped simulation record (the HTTP resource).
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        config:
          $ref: '#/components/schemas/SimulationConfig'
        result:
          $ref: '#/components/schemas/SimulationResult'
        error:
          type: string
          description: Terminal failure message (failed status only).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SimulationCreateResponse:
      type: object
      required: [simulation]
      properties:
        simulation:
          $ref: '#/components/schemas/SimulationRecord'
    SimulationGetResponse:
      type: object
      required: [simulation]
      properties:
        simulation:
          $ref: '#/components/schemas/SimulationRecord'
    SimulationListResponse:
      type: object
      required: [simulations, count]
      properties:
        simulations:
          type: array
          items:
            $ref: '#/components/schemas/SimulationRecord'
        count:
          type: integer
    SimulationErrorEnvelope:
      type: object
      description: Structured error model {"error":{"code","message"}}.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string

      # ---- wave-10 round-4 fragment: configgen.yaml (schemas) ----
    ConfigGenGenerateRequest:
      type: object
      description: |
        Draft request. `type` selects the generator; `description` is the
        natural-language intent; `context` is optional free-form caller
        context (team conventions, existing resource names) that is echoed
        into the draft's assumptions — the server never interprets it.
      properties:
        type:
          type: string
          enum:
          - agent
          - workflow
          description: Which configuration to draft.
        description:
          type: string
          minLength: 1
          description: Natural-language description of the desired agent or workflow.
          examples:
          - An agent that triages our support inbox: categorize tickets and draft replies
        context:
          type: object
          additionalProperties: true
          description: Optional free-form caller context, echoed into draft assumptions.
      required:
      - type
      - description
    ConfigGenGenerateResponse:
      type: object
      description: Draft envelope. Exactly one draft field is populated.
      properties:
        type:
          type: string
          enum:
          - agent
          - workflow
        agent_draft:
          $ref: '#/components/schemas/AgentConfigDraft'
        workflow_draft:
          $ref: '#/components/schemas/WorkflowDSLDraft'
        progress:
          type: array
          description: Completed generation steps in order (1..total).
          items:
            $ref: '#/components/schemas/GenerationProgress'
        valid:
          type: boolean
          description: Whether the returned draft passed validation (always true for generated drafts).
        issues:
          type: array
          description: Validation issues (empty for generated drafts).
          items:
            type: string
      required:
      - type
      - progress
      - valid
    GenerationProgress:
      type: object
      description: One completed generation step (step-by-step progress for UIs).
      properties:
        step:
          type: integer
          minimum: 1
          maximum: 5
          description: 1-based step number (1 structure, 2 tools, 3 policy, 4 runtime, 5 validate).
        total:
          type: integer
          minimum: 5
          maximum: 5
          description: Total steps (always 5).
      required:
      - step
      - total
    AgentConfigDraft:
      type: object
      description: |
        Reviewable agent configuration draft. Nothing here is persisted:
        the caller creates the agent via POST /agents/create
        (name/instructions/model) and adopts the tool/policy/runtime pieces
        it wants. The `assumptions` array documents every non-obvious
        decision.
      properties:
        name:
          type: string
          description: Short agent name derived from the description.
        description:
          type: string
          description: The caller's intent, restated.
        model:
          type: string
          description: Provider model id (e.g. gpt-4o-mini).
          examples:
          - gpt-4o-mini
        system_instructions:
          type: string
          description: Generated system prompt.
        tools:
          type: array
          description: Proposed catalog tool bindings (possibly empty — an agent needs no tools).
          items:
            $ref: '#/components/schemas/ConfigGenToolBinding'
        policy:
          $ref: '#/components/schemas/ConfigGenPolicyDraft'
        runtime:
          $ref: '#/components/schemas/ConfigGenRuntimeDraft'
        intent:
          type: string
          description: Heuristic intent classification (support_inbox, research, ops, data, automation); empty when generic.
        assumptions:
          type: array
          description: Every non-obvious generation decision, for review.
          items:
            type: string
      required:
      - name
      - model
      - system_instructions
      - policy
      - runtime
    ConfigGenToolBinding:
      type: object
      description: One catalog tool proposal with the reason it was selected.
      properties:
        tool:
          type: string
          description: Tool catalog name (GET /tools registry key).
          examples:
          - json_transform
        reason:
          type: string
          description: Why the tool was proposed.
      required:
      - tool
    ConfigGenPolicyDraft:
      type: object
      description: |
        Proposed tool policy. Generated drafts are always effect=allow with
        an explicit tool_allowlist (default-deny elsewhere) — generated
        configs never widen permissions beyond what the description asked
        for.
      properties:
        effect:
          type: string
          enum:
          - allow
          description: Policy effect (always allow for generated drafts).
        tool_allowlist:
          type: array
          description: Exact tool names allowed (sorted, mirrors the selected tools).
          items:
            type: string
        rationale:
          type: string
          description: One-line posture explanation.
      required:
      - effect
    ConfigGenRuntimeDraft:
      type: object
      description: |
        Generated runtime parameters: the ReAct step budget plus the
        runtime_config document (conversation_history + token_budget, issue
        #107) the runtime already parses.
      properties:
        max_steps:
          type: integer
          minimum: 1
          description: ReAct loop step budget (simple 5, default 10, complex 20).
        conversation_history:
          type: object
          description: runtime_config.conversation_history document.
          properties:
            strategy:
              type: string
              enum:
              - sliding_window
              - summarize_older
              - drop_oldest
            max_tokens:
              type: integer
              description: History window size in tokens (0 = runtime default 8000).
        token_budget:
          type: object
          description: runtime_config.token_budget document.
          properties:
            max_total_tokens:
              type: integer
              description: Cumulative total-token cap (0 = unlimited).
            max_prompt_tokens:
              type: integer
              description: Cumulative prompt-token cap (0 = unlimited).
            max_completion_tokens:
              type: integer
              description: Cumulative completion-token cap (0 = unlimited).
            alert_threshold:
              type: number
              description: Fractional usage crossing that records the one-time warning (within (0, 1]).
      required:
      - max_steps
    WorkflowDSLDraft:
      type: object
      description: |
        Reviewable workflow definition draft. The embedded DSL uses ONLY the
        existing workflow node vocabulary and passes the same validation as
        POST /workflows. Bind values marked {{placeholder}} before creating
        the workflow.
      properties:
        name:
          type: string
          description: Short workflow name derived from the description.
        description:
          type: string
          description: The caller's intent, restated.
        dsl:
          type: object
          description: |
            The node graph ({nodes, edges}) in the exact shape POST
            /workflows accepts. Generated chains follow the documented
            trigger → research → approval → send shape with forward-only
            on_success edges.
        assumptions:
          type: array
          description: Generation decisions recorded for review.
          items:
            type: string
      required:
      - name
      - dsl
    ConfigGenErrorEnvelope:
      type: object
      description: Structured error envelope {"error":{"code","message"}}.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of INVALID_REQUEST, VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR.
              examples:
              - VALIDATION_ERROR
            message:
              type: string
          required:
          - code
          - message
      required:
      - error

  requestBodies: {}
  headers: {}
