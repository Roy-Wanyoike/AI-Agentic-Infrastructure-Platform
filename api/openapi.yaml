    RunControlResponse:
      type: object
      description: 'The updated runs.Run (legacy PascalCase serialization, no json tags):

        ID, OrganizationID, AgentID, Input, Output, Status, CreatedAt,

        UpdatedAt. Status uses the new lowercase vocabulary.

        '
      properties:
        ID:
          type: string
        OrganizationID:
          type: string
        AgentID:
          type: string
        Input:
          type: string
        Output:
          type: string
        Status:
          type: string
          enum:
          - pending
          - running
          - paused
          - waiting_approval
          - completed
          - failed
          - cancelled
          - timeout
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
      required:
      - ID
      - Status
    Schedule:
      type: object
      description: One tenant-scoped trigger definition.
      required:
      - id
      - agent_id
      - kind
      - status
      - timezone
      - created_at
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          description: Agent that runs on every firing.
        input:
          type: string
          description: Input payload passed to the created run.
        kind:
          type: string
          enum:
          - once
          - recurring
          - cron
        run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Absolute fire time (kind=once only; RFC3339 UTC).
        interval_seconds:
          type: integer
          description: Recurrence interval (kind=recurring, >= 60; 0 otherwise).
        cron_expr:
          type: string
          description: 5-field cron expression (kind=cron; empty otherwise).
        timezone:
          type: string
          description: IANA timezone the cron expression is evaluated in (default UTC).
        status:
          type: string
          enum:
          - active
          - paused
          - completed
          description: completed is the terminal state of a fired once schedule.
        next_run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Next pending fire instant (null when none pending).
        last_run_id:
          type: string
          description: Run created by the most recent firing (empty before first fire).
        last_fired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Catch-up bookkeeping instant of the last claimed firing.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScheduleCreateRequest:
      type: object
      required:
      - agent_id
      - kind
      properties:
        agent_id:
          type: string
        input:
          type: string
          default: ''
        kind:
          type: string
          enum:
          - once
          - recurring
          - cron
        run_at:
          type: string
          format: date-time
          description: Required for kind=once (RFC3339).
        interval_seconds:
          type: integer
          minimum: 60
          description: Required for kind=recurring.
        cron_expr:
          type: string
          description: Required for kind=cron (5 fields).
        timezone:
          type: string
          description: IANA name; required for kind=cron, defaults to UTC.
    ListSchedulesResponse:
      type: object
      required:
      - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
    ScheduleResponse:
      type: object
      required:
      - schedule
      properties:
        schedule:
          $ref: '#/components/schemas/Schedule'
    DeleteScheduleResponse:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
    AgentSnapshot:
