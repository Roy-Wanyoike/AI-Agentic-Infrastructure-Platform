# AgentOS dashboard nginx config.
#
# NOTE FOR VALIDATION TOOLING: this is nginx configuration, NOT YAML — the
# offline validation step (python yaml.safe_load) cannot parse it, so this
# file is reviewed by hand (brace balance, directive names) instead.
#
# Baked into the web image by Dockerfile.web as
# /etc/nginx/conf.d/default.conf. Assumptions:
#   - the API service is reachable at http://api:8080 on the compose network
#   - the SPA build was produced with VITE_API_URL=/api and
#     VITE_API_PREFIX=v1, so the browser calls its own origin under /api/v1
#
# Endpoints:
#   /               SPA shell + client-side router fallback (try_files)
#   /assets/*       hashed Vite bundles, immutable cache
#   /api/v1/*       proxied to the API (canonical prefix used by the dashboard;
#                   also carries the SSE stream GET /api/v1/runs/{id}/events)
#   /v1/*           proxied to the API (legacy prefix)
#   /healthz,/readyz proxied for external probes and upstream checks

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Immutable cache for content-hashed Vite bundles.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the SPA shell (hashed asset names handle cache-busting).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Canonical API prefix (dashboard default: VITE_API_URL=/api,
    # VITE_API_PREFIX=v1 -> browser requests /api/v1/... on this origin).
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (run timelines): no buffering, no idle timeouts.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Legacy /v1 prefix (SDK / agentosctl / older clients).
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Unversioned health endpoints, handy for external uptime probes.
    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback: unknown paths render index.html so client-side routing
    # (e.g. /agents, /runs/<id>) survives a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
