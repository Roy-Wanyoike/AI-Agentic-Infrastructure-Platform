apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.componentName" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.componentSelectorLabels" (list . "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentos.componentSelectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.componentName" (list . "web") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.componentSelectorLabels" (list . "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentos.componentSelectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
