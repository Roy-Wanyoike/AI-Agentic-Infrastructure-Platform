{{- if .Values.secrets.create -}}
# PLACEHOLDER VALUES ONLY. For real deployments prefer secrets.create=false +
# secrets.existingSecret backed by sealed-secrets or external-secrets
# (see deploy/README.md "Secret management").
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentos.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  secretsMasterKey: {{ .Values.secrets.secretsMasterKey | quote }}
  apiKey: {{ .Values.secrets.apiKey | quote }}
  openaiApiKey: {{ .Values.secrets.openaiApiKey | quote }}
  fallbackApiKey: {{ .Values.secrets.fallbackApiKey | quote }}
  postgresPassword: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
