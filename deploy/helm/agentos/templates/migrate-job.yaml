{{- if .Values.migrations.enabled -}}
# Helm hook Job: runs /app/migrate --up (baked into the API image) before
# install/upgrade. Idempotent (schema_migrations ledger). Runs before the
# deployment rollout each upgrade, so new pods always see a current schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentos.componentName" (list . "migrate") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.componentSelectorLabels" (list . "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "agentos.componentSelectorLabels" (list . "migrate") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agentos.serviceAccountName" (list . "api") }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ include "agentos.image" (list $ .Values.api.image.repository) }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["/app/migrate", "--up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.secretName" . }}
                  key: databaseUrl
            - name: MIGRATIONS_DIR
              value: /app/migrations
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
