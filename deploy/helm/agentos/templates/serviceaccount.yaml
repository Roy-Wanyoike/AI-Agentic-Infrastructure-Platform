{{- if .Values.serviceAccount.create -}}
{{- range $component := list "api" "worker" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentos.serviceAccountName" (list $ $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agentos.componentSelectorLabels" (list $ $component) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
