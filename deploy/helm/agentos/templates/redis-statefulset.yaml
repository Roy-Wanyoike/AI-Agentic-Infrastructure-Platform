{{- if .Values.redis.deploy }}
{{- /* REFERENCE Redis StatefulSet -- DEV / SMALL-STAGE ONLY (single node).
     PRODUCTION: ElastiCache/Memorystore via deploy/terraform/modules/redis,
     set redis.deploy=false + redis.externalAddr. AOF persistence ON because
     with AGENTOS_QUEUE=redis the task queue lives in a Redis list. */ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentos.componentName" (list . "redis") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.componentSelectorLabels" (list . "redis") | nindent 4 }}
spec:
  serviceName: {{ include "agentos.componentName" (list . "redis") }}-hs
  replicas: 1 # REFERENCE ONLY
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentos.componentName" (list . "redis") }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "agentos.componentSelectorLabels" (list . "redis") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
        {{- with .Values.redis.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.componentName" (list . "redis") }}-hs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.componentSelectorLabels" (list . "redis") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "agentos.componentName" (list . "redis") }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.componentName" (list . "redis") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.componentSelectorLabels" (list . "redis") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "agentos.componentName" (list . "redis") }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
