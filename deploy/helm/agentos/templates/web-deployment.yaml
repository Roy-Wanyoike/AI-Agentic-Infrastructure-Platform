apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.componentName" (list . "web") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentos.componentSelectorLabels" (list . "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "agentos.componentSelectorLabels" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentos.componentSelectorLabels" (list . "web") | nindent 8 }}
      annotations:
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentos.serviceAccountName" (list . "web") }}
      {{- /* nginx:alpine's master process runs as root (official image default),
           so runAsNonRoot is deliberately NOT set here -- setting it would
           CrashLoop the pod. For a fully non-root variant switch the image to
           nginxinc/nginx-unprivileged (listens on 8080) and adjust
           web.port + readOnlyRootFilesystem mounts. Everything else stays
           hardened (seccomp, no privilege escalation, RO rootfs, caps dropped). */ -}}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ include "agentos.image" (list $ .Values.web.image.repository) }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
