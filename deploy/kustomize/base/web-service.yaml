# Dashboard Service (issue #117): ClusterIP behind the Ingress (ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: agentos-web
  namespace: agentos
  labels:
    app.kubernetes.io/part-of: agentos
    app.kubernetes.io/name: agentos-web
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentos-web
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
