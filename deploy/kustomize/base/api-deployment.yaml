# API Deployment (issue #117).
#
# Image: built by Dockerfile.api -- distroless/static-debian12:nonroot
# (uid 65532), runs cmd/api on :8080. Migrations are baked in at /app/migrations
# (run once via migrate-job.yaml before first start / on upgrade).
#
# Probes use the REAL endpoints registered in cmd/api/main.go (routes()):
#   /healthz  -> liveness  (mux.HandleFunc("/healthz", healthHandler))
#   /readyz   -> readiness (mux.HandleFunc("/readyz", ...))
# Both are unversioned (outside /api/v1). No other health endpoints exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos-api
  namespace: agentos
  labels:
    app.kubernetes.io/part-of: agentos
    app.kubernetes.io/name: agentos-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  # Zero-downtime rollouts: surge one pod, never drop below the replica count.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agentos
        app.kubernetes.io/name: agentos-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: agentos-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot uid (Dockerfile.api)
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Placeholder registry path; document overrides in deploy/README.md.
          image: ghcr.io/roy-wanyoike/agentos-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agentos-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: JWT_SECRET
            - name: AGENTOS_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: AGENTOS_SECRETS_MASTER_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: AGENTOS_FALLBACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentos-secrets
                  key: AGENTOS_FALLBACK_API_KEY
                  optional: true
          # REAL health endpoints from cmd/api/main.go: /healthz + /readyz.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24 # up to ~2min for boot + DB pool warmup
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # distroless: stateless, safe to enforce
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
