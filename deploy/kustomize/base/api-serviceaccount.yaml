# API ServiceAccount (issue #117). No cloud permissions needed by default;
# when using AWS IRSA (deploy/terraform/modules/aws/irsa) annotate it with
# eks.amazonaws.com/role-arn to allow ECR pulls / secret reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentos-api
  namespace: agentos
  labels:
    app.kubernetes.io/part-of: agentos
automountServiceAccountToken: false
