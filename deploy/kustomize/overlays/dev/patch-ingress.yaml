apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentos
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls: [] # dev: no TLS (local ingress / port-forward)
  rules:
    - host: agentos-dev.example.com # CHANGE ME
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentos-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentos-web
                port:
                  number: 80
