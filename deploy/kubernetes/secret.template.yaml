# SECRET TEMPLATE (issue #117) -- placeholders only, DO NOT commit real values.
#
# This file documents the required secret surface. Real deployments must NOT
# `kubectl apply -f` this file with values filled in and committed to git.
# Use one of:
#   * sealed-secrets  : kubeseal < this file, commit only the SealedSecret
#   * external-secrets: an ExternalSecret pulling from Vault/AWS SM/GCP SM
#     (see deploy/terraform modules for the backing stores)
#   * your platform's secret injection mechanism
#
# Keys consumed by AgentOS (verified against docker-compose.prod.yml and
# cmd/api, cmd/worker source):
#   DATABASE_URL               postgres DSN, api + worker (internal/database)
#   JWT_SECRET                 API refuses to boot in production without it
#                              (issue #55; openssl rand -base64 48)
#   AGENTOS_SECRETS_MASTER_KEY AES-256-GCM master key for the encrypted
#                              secrets service (issue #25; REQUIRED in Postgres
#                              mode, openssl rand -base64 32)
#   AGENTOS_API_KEY            worker -> API status callback auth (X-API-Key)
#   OPENAI_API_KEY             model provider; unset/empty = offline mode
#   AGENTOS_FALLBACK_API_KEY   optional failover provider key
#   POSTGRES_PASSWORD          used by the reference postgres StatefulSet
#                              (keep in sync with DATABASE_URL; when you switch
#                              to managed Postgres this key becomes unused)
apiVersion: v1
kind: Secret
metadata:
  name: agentos-secrets
  namespace: agentos
  labels:
    app.kubernetes.io/part-of: agentos
type: Opaque
stringData:
  # postgres://<user>:<password>@<host>:<port>/<db>?sslmode=require
  # In-cluster reference stack: host is the postgres StatefulSet service.
  # NOTE: CHANGEME must equal POSTGRES_PASSWORD below.
  DATABASE_URL: "postgres://agentos:CHANGEME@agentos-postgres:5432/agentos?sslmode=require"
  POSTGRES_PASSWORD: "CHANGEME"
  JWT_SECRET: "CHANGEME-openssl-rand-base64-48"
  AGENTOS_SECRETS_MASTER_KEY: "CHANGEME-openssl-rand-base64-32"
  AGENTOS_API_KEY: "CHANGEME-mint-an-api-key-in-the-dashboard"
  OPENAI_API_KEY: ""
  AGENTOS_FALLBACK_API_KEY: ""
