# API Service (issue #117): in-cluster ClusterIP; fronted by the Ingress
# (ingress.yaml) and called by the worker via AGENTOS_API (configmap.yaml).
apiVersion: v1
kind: Service
metadata:
  name: agentos-api
  namespace: agentos
  labels:
    app.kubernetes.io/part-of: agentos
    app.kubernetes.io/name: agentos-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentos-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
