# NetworkPolicy (issue #117): explicit ingress allows into the data tier.
# Only api pods, worker pods, and the migrate Job may reach Postgres/Redis/NATS,
# and only on their service ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentos-postgres-allow
  namespace: agentos
  labels:
    app.kubernetes.io/part-of: agentos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentos-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [agentos-api, agentos-worker, agentos-migrate]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentos-redis-allow
  namespace: agentos
  labels:
    app.kubernetes.io/part-of: agentos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentos-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [agentos-api, agentos-worker, agentos-migrate]
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentos-nats-allow
  namespace: agentos
  labels:
    app.kubernetes.io/part-of: agentos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentos-nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [agentos-api, agentos-worker]
      ports:
        - protocol: TCP
          port: 4222
